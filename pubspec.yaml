name: gongdi_app
description: 工地验收 App (Flutter) - 南方科技大学附属医院（校本部）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  flutter_mingcute: ^2.9.72
  image_picker: ^1.1.2
  image: ^4.2.0
  speech_to_text: ^7.0.0 # 设备端离线/在线语音识别（含中文），无需后端/Key
  app_settings: ^9.0.0
  http: ^1.6.0
  flutter_secure_storage: ^9.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: ^3.0.3
  pdf: ^3.13.0
  archive: ^4.0.9
  printing: ^5.15.0
  share_plus: ^12.0.2
  flutter_svg: ^2.0.10
  geolocator: ^13.0.1 # 巡场 GPS 轨迹采集（track 字段已有，补齐真实定位）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/drawings/
    - assets/photos/
    - assets/avatars/
    - assets/icons/
    - assets/walls/
    - assets/fonts/
    - assets/axis_data/
    # 周报现场照片：由 _tools/pptx_report_extract.py 从设计院周报 PPTX 抽取
    - assets/site_photos/
  fonts:
    - family: MingCute
      fonts:
        - asset: assets/fonts/mingcute.ttf
    # 全局中文 UI 字体：小米 MiSans（免费商用，官方 TTF 子集，见 tools/build_ui_font.py）。
    # 四档字重 400/500/600/700 与设计系统 w400~w700 一一对应，内置后 Web/iOS/安卓
    # 用同一套字形与渲染，跨端字重观感统一（此前 w600 无对应文件、会回退到 Bold，偏重）。
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Demibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 700
    # 注：assets/fonts/NotoSansSC-Regular.ttf 仍保留——PDF 报告嵌入
    # （lib/features/defects/report_pdf.dart）与 CAD 服务端（server/cad_local.py）
    # 依赖它做中文渲染，与 UI 字体互不影响。
