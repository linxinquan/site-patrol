name: gongdi_app
description: 工地验收 App (Flutter) - 南方科技大学附属医院（校本部）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  lucide_icons_flutter: ^3.1.15
  image_picker: ^1.1.2
  image: ^4.2.0
  http: ^1.6.0
  flutter_secure_storage: ^9.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/drawings/
    - assets/photos/
    - assets/avatars/
