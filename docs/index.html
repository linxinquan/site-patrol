}\n    }\n  }\n\n  @override\n  void dispose() {\n    _svc.stopSession();\n    _nameCtl.dispose();\n    _drawingCtl.dispose();\n    super.dispose();\n  }\n\n  Future\u003cvoid\u003e _onViewCreated(int id) async {\n    _supported = await _svc.isSupported();\n    if (!mounted) return;\n    if (!_supported) {\n      await showDialog\u003cvoid\u003e(\n        context: context,\n        builder: (ctx) =\u003e AlertDialog(\n          title: const Text('需要 LiDAR 设备'),\n          content: const Text('AR量尺需 iPhone 12 Pro 及以上机型，请改用照片量尺。'),\n          actions: [\n            TextButton(\n              onPressed: () =\u003e Navigator.of(ctx).pop(),\n              child: const Text('知道了'),\n            ),\n          ],\n        ),\n      );\n      return;\n    }\n    await _svc.startSession();\n  }\n\n  Future\u003cvoid\u003e _addToSession() async {\n    final drawingMm = double.tryParse(_drawingCtl.text);\n    if (_lastMm == null || drawingMm == null || drawingMm \u003c= 0) {\n      AppSnack.show(context, '请先完成AR测量并填写图纸尺寸', kind: AppSnackKind.danger);\n      return;\n    }\n    var s = await MeasureStore.load(widget.args.projectKey, widget.args.drawingKey);\n    s ??= MeasureSession(\n      id: '${widget.args.projectKey}_${widget.args.drawingKey}_ar',\n      projectKey: widget.args.projectKey,\n      drawingKey: widget.args.drawingKey,\n      floor: widget.args.floor,\n    );\n    final item = MeasureItem(\n      name: _nameCtl.text.trim().isEmpty ? 'AR实测' : _nameCtl.text.trim(),\n      drawingMm: drawingMm,\n      photoMm: _lastMm!,\n      source: 'ar_lidar',\n    );\n    await MeasureStore.save(s.copyWith(items: [...s.items, item]));\n    if (mounted) {\n      AppSnack.show(context, '已加入校对清单');\n      Navigator.of(context).pop();\n    }\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    // 非 iOS：直接提示（Android/Web 无此能力）\n    if (kIsWeb || !Platform.isIOS) {\n      return Scaffold(\n        appBar: AppBar(title: const Text('AR量尺')),\n        body: const Center(child: Text('AR量尺仅支持 iPhone Pro 机型（iOS）')),\n      );\n    }\n    return Scaffold(\n      appBar: AppBar(title: const Text('AR量尺（LiDAR）')),\n      body: Column(\n        children: [\n          Expanded(\n            child: Stack(\n              children: [\n                UiKitView(\n                  viewType: _viewType,\n                  onPlatformViewCreated: _onViewCreated,\n                  creationParams: null,\n                  creationParamsCodec: const StandardMessageCodec(),\n                ),\n                if (_lastMm != null)\n                  Positioned(\n                    top: AppTokens.space4,\n                    left: 0,\n                    right: 0,\n                    child: Center(\n                      child: Card(\n                        color: Colors.black.withValues(alpha: 0.65),\n                        child: Padding(\n                          padding: const EdgeInsets.symmetric(\n                              horizontal: 16, vertical: 10),\n                          child: Text(\n                            '实测 ${_lastMm!.toStringAsFixed(1)} mm',\n                            style: const TextStyle(\n                                color: Colors.white,\n                                fontSize: 20,\n                                fontWeight: FontWeight.w700),\n                          ),\n                        ),\n                      ),\n                    ),\n                  ),\n              ],\n            ),\n          ),\n          // 控制条\n          Padding(\n            padding: const EdgeInsets.all(AppTokens.space3),\n            child: Column(\n              children: [\n                Row(\n                  children: [\n                    Expanded(child: _btn('点A', () =\u003e _svc.setMode(1))),\n                    const SizedBox(width: AppTokens.space2),\n                    Expanded(child: _btn('点B', () =\u003e _svc.setMode(2))),\n                    const SizedBox(width: AppTokens.space2),\n                    Expanded(child: _btn('清除', () async {\n                      await _svc.clear();\n                      setState(() =\u003e _lastMm = null);\n                    })),\n                  ],\n                ),\n                const SizedBox(height: AppTokens.space2),\n                Row(\n                  children: [\n                    Expanded(\n                      child: TextField(\n                        controller: _nameCtl,\n                        decoration: const InputDecoration(\n                            labelText: '量尺项名称', isDense: true,\n                            border: OutlineInputBorder()),\n                      ),\n                    ),\n                    const SizedBox(width: AppTokens.space2),\n                    Expanded(\n                      child: TextField(\n                        controller: _drawingCtl,\n                        keyboardType:\n                            const TextInputType.numberWithOptions(decimal: true),\n                        decoration: const InputDecoration(\n                            labelText: '图纸尺寸(mm)', isDense: true,\n                            border: OutlineInputBorder()),\n                      ),\n                    ),\n                    const SizedBox(width: AppTokens.space2),\n                    ElevatedButton.icon(\n                      onPressed: _addToSession,\n                      icon: const Icon(Icons.add),\n                      label: const Text('加入校对'),\n                    ),\n                  ],\n                ),\n              ],\n            ),\n          ),\n        ],\n      ),\n    );\n  }\n\n  Widget _btn(String label, VoidCallback onTap) =\u003e ElevatedButton(\n        onPressed: _supported ? onTap : null,\n        child: Text(label),\n      );\n}\n```\n\n\u003e 注意：页面里 \"点A/点B\" 按钮只是设置原生采集模式；**实际的屏幕点击由原生 ARSCNView 的手势处理**，Flutter 侧不做点击采集。\n\n### 3.5 路由与入口\n\n1. `lib/app.dart`：参照现有 MeasurePage 路由（约 124~127 行）加 `ArMeasurePage` 路由\n2. `lib/features/measure/measure_page.dart` 照片面板（约 439~455 行按钮行）：加一个 `OutlinedButton.icon('AR量尺（iPhone Pro）')` → `Navigator` 推入 ArMeasurePage（传同一个 `widget.args`）；`kIsWeb`/Android 时隐藏或置灰\n\n---\n\n## 4. 构建与运行\n\n**Mac 上**：\n```bash\ncd ios \u0026\u0026 pod install \u0026\u0026 cd ..\nflutter run -d \u003ciPhonePro的udid\u003e   # 真机调试\n```\n- Xcode 15+；首次需在 Xcode 里选择 Signing Team（免费个人账号即可）\n- 真机运行前在 iPhone 上信任开发者证书（设置→通用→VPN与设备管理）\n\n**Windows 现状**：本机只能跑 `flutter analyze` 检查 Dart 侧；iOS 编译必须上 Mac。\n- 备选：Codemagic（免费额度 500 分钟/月）配置 macOS 构建；无 Mac 时先把 Swift 代码过一遍语法（可用在线 Swift 编译器粗验），拿到 Mac 后再真机联调。\n\n---\n\n## 5. 联调测试计划（拿到 iPhone Pro 后逐项执行）\n\n| # | 测试项 | 方法 | 通过标准 |\n|---|---|---|---|\n| 1 | 设备校验 | 进页面 | 非 Pro 机型弹\"需要LiDAR\"提示；Pro 机型正常进相机 |\n| 2 | 1m 精度 | 墙面贴卷尺，点 0→100cm | 实测 1000±20mm |\n| 3 | 3m 精度 | 地面/墙面 3m 两点 | 实测 3000±50mm |\n| 4 | 纯白墙点选 | 无纹理白墙点两点 | 能命中（LiDAR 特性，普通 ARKit 会失败） |\n| 5 | 玻璃/镜面 | 点玻璃 | 允许失败并出现 onError 提示（记录，不判错） |\n| 6 | 汇入会话 | 测量→加入校对 | measure_page 清单出现 `AR实测` 项，source=ar_lidar，判定/保存/重进恢复正常 |\n| 7 | 旧数据兼容 | 打开旧会话 | 旧 items（无 source）正常显示，默认 photo |\n| 8 | 抖动观察 | 手持静止观察距离值 | 数值稳定（若抖动大，后续加多帧平均） |\n\n## 6. 常见坑排查表\n\n| 现象 | 原因 | 处理 |\n|---|---|---|\n| UiKitView 黑屏 | 会话未启动/相机权限被拒 | 检查 Info.plist 文案与系统权限；确认 onPlatformViewCreated 里调了 startSession |\n| 白屏/Flutter 报 \"platform view not found\" | 工厂未注册 | 检查 AppDelegate 的 registrar(forPlugin:) 注册与 viewType 字符串一致（`ar_measure_view`） |\n| 点击无反应 | 未先点\"点A/点B\"设置模式 | 流程：点A按钮 → 点屏幕 → 点B按钮 → 点屏幕 |\n| onError 频繁 | 距离太近(\u003c20cm)/太远(\u003e5m)/暗光/玻璃 | 提示文案引导；5m 内、明亮环境测量 |\n| 模拟器一运行就崩 | ARKit 不支持模拟器 | 必须真机 |\n| 发热掉帧 | LiDAR 持续开 | 会话按需启停；演示控制在10分钟内 |\n\n## 7. 验收标准\n\n- [ ] 1m/3m 精度达标（≤2cm / ≤5cm）\n- [ ] 纯白墙可测\n- [ ] 结果入会话、判定、持久化全链路 OK\n- [ ] 非 Pro 机型有降级提示\n- [ ] `flutter analyze` 无新增 error\n- [ ] 录 90 秒演示视频\n\n## 8. 演示脚本\n\n\u003e \"这是 iPhone Pro 的激光雷达：手机对着墙，点一下、再点一下——梁高 1 米 8，误差 2 厘米内。以后现场核尺寸，不用带尺子，举起手机就行。\"\n"},{"id":"docs/archive/AR_LIDAR_MEASURE.md","path":"docs/archive/AR_LIDAR_MEASURE.md","url":"ZG9jcy9hcmNoaXZlL0FSX0xJREFSX01FQVNVUkUubWQ=","base":"AR_LIDAR_MEASURE.md","title":"AR量尺（LiDAR + ARKit sceneDepth）— 实现文档（交付 CodeBuddy）","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-08-25","mtime":"2026-08-25","size":8679,"chars":6586,"lines":186,"nhead":12,"lead":"目标：在 site-patrol（Flutter）中实现 iPhone Pro 高精度 AR 量尺：相机取景 → 点两点 → 显示实测距离(mm)，结果汇入现有量尺会话。 精度定位：±1~2cm（5m内，LiDAR），快速核对/科技感演示，不替代验收测量。 平台：仅 iOS（iPhone 12 Pro 及更新 Pro ","text":"# AR量尺（LiDAR + ARKit sceneDepth）— 实现文档（交付 CodeBuddy）\n\n\u003e 目标：在 site-patrol（Flutter）中实现 **iPhone Pro 高精度 AR 量尺**：相机取景 → 点两点 → 显示实测距离(mm)，结果汇入现有量尺会话。\n\u003e 精度定位：±1~2cm（5m内，LiDAR），**快速核对/科技感演示**，不替代验收测量。\n\u003e 平台：仅 iOS（iPhone 12 Pro 及更新 Pro 机型）；非 Pro 机型显示提示并引导用照片量尺。\n\n---\n\n## 1. 技术原理\n\n1. ARKit 会话开启 **sceneDepth**（`ARWorldTrackingConfiguration.frameSemantics = [.sceneDepth, .smoothedSceneDepth]`）→ LiDAR 为画面生成逐像素深度图（Apple 官方测距仪同款方案，[WWDC20](https://developer.apple.com/jp/videos/play/wwdc2020/10611/?time=418#2)）\n2. 用户点屏幕 → **raycast**（`raycastQuery(from:allowing:.estimatedPlane, alignment:.any)`）→ 命中真实物体的 3D 世界坐标（[Apple 论坛：LiDAR 真实距离](https://developer.apple.com/forums/thread/709872#1)）\n3. 两个世界坐标的欧氏距离 = 实测尺寸(mm)\n4. 增强：点击处用深度图做 **k×k 邻域中位数采样 + 置信度过滤 + 多帧平均**，抑制抖动\n\n## 2. 架构\n\n```\n[Flutter: ArMeasurePage]\n   │ MethodChannel('ar_measure')\n   ▼\n[Native iOS 插件 ArMeasurePlugin.swift]（新增，约 300 行）\n   ├─ startSession(): ARWorldTrackingConfiguration + sceneDepth\n   ├─ tapAt(x, y): raycast + 深度采样 → 返回 {x,y,z, depth, confidence}\n   ├─ measureBetween(a, b): 3D 距离 mm\n   └─ stopSession()\n   ▼\n[复用现有] MeasureSession / MeasureItem(source:'ar_lidar') / MeasureStore / 判定逻辑\n```\n\n## 3. 新增/修改文件清单\n\n### 新增 A：iOS 原生插件（关键，先写这个）\n\n**文件：`ios/Classes/ArMeasurePlugin.swift`**（Flutter 插件工程模式）\n\n核心代码骨架：\n\n```swift\nimport ARKit\nimport Flutter\nimport UIKit\n\npublic class ArMeasurePlugin: NSObject, FlutterPlugin {\n    private var session: ARSession?\n    private var sceneView: ARSCNView?\n    private var lastAnchors: [Int: simd_float3] = [:] // 点位缓存（多帧平均用）\n    private var anchorFrameCount: [Int: Int] = [:]\n\n    public static func register(with registrar: FlutterPluginRegistrar) {\n        let channel = FlutterMethodChannel(name: \"ar_measure\", binaryMessenger: registrar.messenger())\n        let instance = ArMeasurePlugin()\n        registrar.addMethodCallDelegate(instance, channel: channel)\n    }\n\n    public func handle(_ call: FlutterMethodCall, result: @escaping FlutterResult) {\n        switch call.method {\n        case \"isSupported\":\n            // 仅 LiDAR 机型：sceneDepth 支持判断\n            let cfg = ARWorldTrackingConfiguration()\n            result(ARWorldTrackingConfiguration.supportsFrameSemantics(.sceneDepth))\n        case \"startSession\":\n            start()\n            result(true)\n        case \"tapAt\":\n            guard let args = call.arguments as? [String: Any],\n                  let x = args[\"x\"] as? CGFloat, let y = args[\"y\"] as? CGFloat else {\n                result(FlutterError(code: \"BAD_ARGS\", message: nil, details: nil)); return\n            }\n            result(tapAt(x: x, y: y))\n        case \"measure\":\n            result(measure())\n        case \"stopSession\":\n            session?.pause(); result(true)\n        default:\n            result(FlutterMethodNotImplemented)\n        }\n    }\n\n    private func start() {\n        let cfg = ARWorldTrackingConfiguration()\n        cfg.frameSemantics = [.sceneDepth, .smoothedSceneDepth] // LiDAR 深度图\n        let view = ARSCNView(frame: .zero)\n        view.session.delegate = self\n        sceneView = view\n        session = view.session\n        session?.run(cfg)\n    }\n\n    /// 点击 → 世界坐标（raycast 优先，深度采样兜底）\n    private func tapAt(x: CGFloat, y: CGFloat) -\u003e [String: Any] {\n        guard let sceneView = sceneView else { return [:] }\n        let point = CGPoint(x: x, y: y)\n        // ① raycast（LiDAR 下对纯色墙也能命中）\n        let query = sceneView.raycastQuery(from: point,\n                                           allowing: .estimatedPlane, alignment: .any)\n        if let query = query, let hit = sceneView.session.raycast(query).first {\n            let p = hit.worldTransform.columns.3\n            let p3 = simd_float3(p.x, p.y, p.z)\n            return [\"x\": p3.x, \"y\": p3.y, \"z\": p3.z,\n                    \"depth\": hit.distance, \"confidence\": 1.0]\n        }\n        // ② 兜底：从深度图采样（点周围 5×5 中位数，置信度过滤）\n        if let depth = sceneView.session.currentFrame?.smoothedSceneDepth?.depthMap {\n            return sampleDepth(depth, at: point)\n        }\n        return [:]\n    }\n\n    /// 深度图采样：5×5 邻域取中位数，confidence\u003c1 的像素剔除\n    private func sampleDepth(_ depthMap: CVPixelBuffer, at point: CGPoint) -\u003e [String: Any] {\n        CVPixelBufferLockBaseAddress(depthMap, .readOnly)\n        defer { CVPixelBufferLockBaseAddress(depthMap, .readOnly) }\n        // … 用 CVPixelBufferGetBaseAddress 读取深度值，收集 5×5 有效值取中位数，\n        // 结合 confidenceMap 过滤，再通过 viewport→camera 反投影得到 3D 坐标 …\n        return [:]\n    }\n\n    /// 两个缓存点位距离（mm）\n    private func measure() -\u003e [String: Any] {\n        guard let a = lastAnchors[0], let b = lastAnchors[1] else { return [:] }\n        let d = simd_distance(a, b) * 1000 // 米 → 毫米\n        return [\"mm\": d]\n    }\n}\n\nextension ArMeasurePlugin: ARSessionDelegate {\n    public func session(_ session: ARSession, didUpdate frame: ARFrame) {\n        // 多帧平均：同一锚点位置连续采样，抑制抖动（可选增强）\n    }\n}\n```\n\n\u003e 说明：`sampleDepth` 的深度反投影（pixel → camera space → world space）是精度核心，用 `frame.camera` 的 `projectionMatrix`/`viewMatrix` 反算；CodeBuddy 实现时参照 [激光雷达深度感知开发指南](https://blog.csdn.net/outlejackson/article/details/159500499#1)。\n\n**iOS 配置**：`ios/Podfile` 无新增依赖（ARKit 系统框架）；`Info.plist` 加相机权限文案 `NSCameraUsageDescription`；Xcode 最低版本需支持 sceneDepth API（iOS 14+）。\n\n### 新增 B：Flutter 页面\n\n**文件：`lib/features/measure/ar_measure_page.dart`**（照 measure_page 的样式与流程）\n\n```dart\nclass ArMeasurePage extends StatefulWidget {\n  final MeasureArgs args; // 复用路由参数\n  ...\n}\n```\n\n- `MethodChannel('ar_measure')` 封装 `ArMeasureService`（照 `vision_service.dart` 的模式）\n- 页面流程：`startSession` → 全屏相机预览（用 `PlatformView` 承载 ARSCNView，或原生全屏+手势）→ 点A → 点B → 显示 mm → \"加入校对\"（填进 MeasureItem，`source: 'ar_lidar'`）\n- 进页面先调 `isSupported`：false → 提示\"需要 iPhone 12 Pro 及以上机型\"，提供\"使用照片量尺\"跳转\n\n### 修改 C：数据模型（无破坏性）\n\n- `lib/data/models.dart` — `MeasureItem` 加可选字段 `final String source;`（默认 `'photo'`；AR 量尺传 `'ar_lidar'`），`copyWith`/序列化同步；旧数据默认 'photo'，兼容\n\n### 修改 D：入口\n\n- `capture_page.dart` 或 measure 相关入口加\"AR量尺\"按钮（iOS 显示，Android/Web 隐藏或提示）\n\n## 4. 精度增强清单（LiDAR 也要做）\n\n1. **smoothedSceneDepth**（时域平滑）优先于 raw\n2. 点击采样用 **5×5 邻域中位数**，剔除 confidence \u003c 1 的像素\n3. 同一锚点**多帧平均**（3~5 帧）后再确认\n4. UI 提示：**建议 5 米内测量**；玻璃、镜面、水面测不准\n5. 可选：提供\"已知 1m 参照自校准\"修正系数（同照片标定思路）\n\n## 5. 验收标准\n\n- [ ] iPhone Pro 上：对已知距离（1m / 3m）测量，误差 ≤ 2cm / ≤ 5cm（与卷尺对比）\n- [ ] 纯色白墙可正常点选（LiDAR 特性，非 Pro 机型此场景会失败）\n- [ ] 结果能\"加入校对\"，复用现有会话保存/判定/清单\n- [ ] 非 Pro 机型：`isSupported=false` 正确提示并引导照片量尺\n- [ ] 录 90 秒演示：取景 → 点A点B → 显示距离 → 加入校对\n\n## 6. 演示脚本（给院长/设计师）\n\n\u003e \"这是iPhone Pro的激光雷达：手机对着墙，点一下、再点一下——**1米8的梁高，误差在2厘米内**。以后现场核尺寸，不用带尺子，举起手机就行。\"\n\n## 7. 红线\n\n1. 定位\"快速核对 + 科技感\"，**不替代验收测量**（全站仪/激光测距仪）\n2. 仅 iPhone 12 Pro+（含 iPad Pro 2020+）支持；演示前确认设备\n3. ARSession 耗电/发热明显，演示控制在 10 分钟内\n"},{"id":"docs/archive/AR_UX_SMOOTH.md","path":"docs/archive/AR_UX_SMOOTH.md","url":"ZG9jcy9hcmNoaXZlL0FSX1VYX1NNT09USC5tZA==","base":"AR_UX_SMOOTH.md","title":"AR量尺 — 交互优化补丁（连续测量模式，覆盖 AR_LIDAR_IMPL_DETAIL.md 的交互设计）","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-08-25","mtime":"2026-08-25","size":7514,"chars":5751,"lines":220,"nhead":15,"lead":"适用：在按 AR_LIDAR_IMPL_DETAIL.md 实现的基础上，替换交互方案。 目标：去掉\"点A/点B\"两个按钮，改为手势驱动连续测量：点一下=采A → 再点一下=采B → 自动出距离 → 可继续下一组；长按=清除；保留一个\"暂停/继续\"开关。 本补丁只改交互相关代码，深度采样/反投影等核心算法不动。","text":"# AR量尺 — 交互优化补丁（连续测量模式，覆盖 AR_LIDAR_IMPL_DETAIL.md 的交互设计）\n\n\u003e 适用：在按 AR_LIDAR_IMPL_DETAIL.md 实现的基础上，替换交互方案。\n\u003e 目标：去掉\"点A/点B\"两个按钮，改为**手势驱动连续测量**：点一下=采A → 再点一下=采B → 自动出距离 → 可继续下一组；长按=清除；保留一个\"暂停/继续\"开关。\n\u003e 本补丁只改交互相关代码，深度采样/反投影等核心算法不动。\n\n---\n\n## 1. 新交互规格\n\n| 操作 | 行为 |\n|---|---|\n| 进入页面 | 自动开始连续测量模式（无需按按钮） |\n| 单击屏幕 | 第一下=点A（蓝球）；第二下=点B（红球+绿线）→ 自动算距离 → 顶部卡片更新 → 上一组球/线保留，等下一次单击自动清理并开新组 |\n| 长按屏幕(0.6s) | 清除当前组与全部视觉残留，距离卡片清空 |\n| 「暂停/继续」按钮 | 暂停=不再采集（可旋转查看场景）；继续=恢复连续测量 |\n| 「加入校对」按钮 | 用最近一次测量值 + 手填图纸尺寸 → 写入 MeasureSession（逻辑不变） |\n| 顶部提示条 | 动态提示：\"点屏幕采点A\" → \"已采点A，请再点一次\" → \"实测 XXX mm\" |\n\n---\n\n## 2. 原生侧改动（`ios/Runner/ArMeasureView.swift`）\n\n### 2.1 枚举语义变更\n\n```swift\n/// 采集模式：0=暂停 1=连续测量\nenum CaptureMode: Int { case paused = 0, continuous = 1 }\n```\n\n### 2.2 setup() 增加长按手势（替换原 setup）\n\n```swift\nprivate func setup() {\n    sceneView.session.delegate = self\n    sceneView.automaticallyUpdatesLighting = true\n\n    let tap = UITapGestureRecognizer(target: self, action: #selector(handleTap(_:)))\n    sceneView.addGestureRecognizer(tap)\n\n    // 长按清除\n    let long = UILongPressGestureRecognizer(target: self, action: #selector(handleLongPress(_:)))\n    long.minimumPressDuration = 0.6\n    sceneView.addGestureRecognizer(long)\n\n    channel.setMethodCallHandler { [weak self] call, result in\n        self?.handle(call, result: result)\n    }\n}\n```\n\n### 2.3 handleTap 改为 A/B 循环（替换原 handleTap）\n\n```swift\n@objc private func handleTap(_ g: UITapGestureRecognizer) {\n    guard mode != .paused else { return }\n    let p = g.location(in: sceneView)\n    guard let world = worldPosition(at: p) else {\n        channel.invokeMethod(\"onError\", arguments: \"未能命中有效深度，请靠近目标/调整角度后重试\")\n        return\n    }\n    if pointA == nil {\n        // 新一轮：先清掉上一组的 B 球与连线（A 球会被新 A 覆盖）\n        nodeB?.removeFromParentNode(); nodeB = nil\n        lineNode?.removeFromParentNode(); lineNode = nil\n        pointA = world\n        placeSphere(world, color: UIColor.systemBlue, slot: 0)\n        channel.invokeMethod(\"onPointA\", arguments: true)\n    } else {\n        let a = pointA!\n        placeSphere(world, color: UIColor.systemRed, slot: 1)\n        drawLine(a, world)\n        let mm = simd_distance(a, world) * 1000.0\n        channel.invokeMethod(\"onMeasure\", arguments: [\n            \"mm\": mm,\n            \"ax\": a.x, \"ay\": a.y, \"az\": a.z,\n            \"bx\": world.x, \"by\": world.y, \"bz\": world.z,\n        ])\n        pointA = nil; pointB = nil // 本组结束，等待下一次单击开新组（视觉保留）\n    }\n}\n```\n\n### 2.4 新增长按处理 + setMode 语义更新（替换原 handle 中 setMode 分支）\n\n```swift\n@objc private func handleLongPress(_ g: UILongPressGestureRecognizer) {\n    guard g.state == .began else { return }\n    clearPicks()\n    channel.invokeMethod(\"onCleared\", arguments: true)\n}\n```\n\n`handle(_:result:)` 中 setMode 分支改为（暂停**不清除**已有结果）：\n\n```swift\ncase \"setMode\":\n    mode = CaptureMode(rawValue: (call.arguments as? Int) ?? 0) ?? .paused\n    result(true)\n```\n\n### 2.5 startSession 后默认进入连续模式\n\n`startSession()` 末尾加：`mode = .continuous`（方法返回前设置）。\n\n---\n\n## 3. Flutter 侧改动（`lib/features/measure/ar_measure_page.dart`）\n\n### 3.1 状态与回调\n\n```dart\nbool _paused = false;\nString _hint = '点屏幕采点A';\n\nFuture\u003cdynamic\u003e _onNative(MethodCall call) async {\n  if (call.method == 'onMeasure') {\n    final mm = ((call.arguments as Map)['mm'] as num).toDouble();\n    if (mounted) setState(() {\n      _lastMm = mm;\n      _hint = '测量完成，可继续测下一组，或加入校对';\n    });\n  } else if (call.method == 'onPointA') {\n    if (mounted) setState(() =\u003e _hint = '已采点A，请再点一次');\n  } else if (call.method == 'onCleared') {\n    if (mounted) setState(() {\n      _lastMm = null;\n      _hint = '点屏幕采点A';\n    });\n  } else if (call.method == 'onError') {\n    if (mounted) {\n      AppSnack.show(context, call.arguments?.toString() ?? '测量失败',\n          kind: AppSnackKind.danger);\n    }\n  }\n}\n```\n\n### 3.2 控制条改为单行三按钮（替换原\"点A/点B/清除\"行）\n\n```dart\nRow(\n  children: [\n    Expanded(\n      child: ElevatedButton.icon(\n        onPressed: () async {\n          _paused = !_paused;\n          await _svc.setMode(_paused ? 0 : 1);\n          setState(() {});\n        },\n        icon: Icon(_paused ? Icons.play_arrow : Icons.pause),\n        label: Text(_paused ? '继续' : '暂停'),\n      ),\n    ),\n    const SizedBox(width: AppTokens.space2),\n    Expanded(\n      child: OutlinedButton.icon(\n        onPressed: () async {\n          await _svc.clear();\n          setState(() { _lastMm = null; _hint = '点屏幕采点A'; });\n        },\n        icon: const Icon(Icons.delete_outline),\n        label: const Text('清除'),\n      ),\n    ),\n    const SizedBox(width: AppTokens.space2),\n    Expanded(\n      child: OutlinedButton(\n        onPressed: _lastMm == null ? null : _addToSession,\n        child: const Text('加入校对'),\n      ),\n    ),\n  ],\n),\n```\n\n### 3.3 顶部卡片区加动态提示条（卡片上方）\n\n```dart\nPositioned(\n  top: AppTokens.space4, left: 0, right: 0,\n  child: Column(\n    children: [\n      // 提示条\n      Container(\n        margin: const EdgeInsets.symmetric(horizontal: 32),\n        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),\n        decoration: BoxDecoration(\n          color: Colors.black.withValues(alpha: 0.5),\n          borderRadius: BorderRadius.circular(20),\n        ),\n        child: Text(_hint, style: const TextStyle(color: Colors.white, fontSize: 13)),\n      ),\n      // 距离卡片（_lastMm != null 时显示，原逻辑保留）\n      ...\n    ],\n  ),\n),\n```\n\n### 3.4 其余不变\n\n- `_onViewCreated`：`startSession` 后**无需**再调 setMode（原生默认连续模式）\n- `_addToSession`、`_svc` 定义、非iOS提示页、路由：均不变\n\n---\n\n## 4. 测试计划追加（在 AR_LIDAR_IMPL_DETAIL.md §5 基础上补 4 条）\n\n| # | 测试项 | 方法 | 通过标准 |\n|---|---|---|---|\n| 9 | 连续测量 | 连续测 3 组（点A→点B×3） | 每组自动出距离，卡片更新；上一组视觉在下一组首次单击时清理 |\n| 10 | 长按清除 | 测完一组后长按屏幕 | 球/线全部消失，卡片清空，提示回\"点屏幕采点A\" |\n| 11 | 暂停/继续 | 暂停后点屏幕 | 暂停时点击无反应；继续后恢复采集 |\n| 12 | 加入校对取最近值 | 测两组后点\"加入校对\" | 写入的是最近一次测量值 |\n\n## 5. 演示话术更新\n\n\u003e \"打开就是测量状态：手机对着墙，点一下、再点一下，距离就出来了——测完一组接着测，不用碰任何按钮；长按就能清掉重来。\"\n"},{"id":"docs/archive/MEASURE_FEATURE_PLAN.md","path":"docs/archive/MEASURE_FEATURE_PLAN.md","url":"ZG9jcy9hcmNoaXZlL01FQVNVUkVfRkVBVFVSRV9QTEFOLm1k","base":"MEASURE_FEATURE_PLAN.md","title":"量尺校对功能 — 实现路径（交付给 AI 实现）","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-08-25","mtime":"2026-08-25","size":8428,"chars":5276,"lines":140,"nhead":11,"lead":"目标：今天内在 site-patrol（Flutter + Express 后端）中实现\"量尺校对\"功能。 定位：半自动标定测量（不用AI识别），对照\"照片实测尺寸 vs 图纸尺寸\"，输出偏差与判定。 背景：设计师访谈痛点——\"施工尺寸与图纸不符，肉眼难以发现的，希望拍照后可以识别尺寸，并方便对照图纸正确尺寸\"。","text":"# 量尺校对功能 — 实现路径（交付给 AI 实现）\n\n\u003e 目标：**今天内**在 site-patrol（Flutter + Express 后端）中实现\"量尺校对\"功能。\n\u003e 定位：**半自动标定测量**（不用AI识别），对照\"照片实测尺寸 vs 图纸尺寸\"，输出偏差与判定。\n\u003e 背景：设计师访谈痛点——\"施工尺寸与图纸不符，肉眼难以发现的，希望拍照后可以识别尺寸，并方便对照图纸正确尺寸\"。\n\n---\n\n## 1. 功能定义（五步流程）\n\n1. **拍照/选图**：复用现有取图逻辑（Web=相册，移动端=相机）\n2. **标定**：照片上点两个点 + 选参照物（快捷项：门宽900 / 瓷砖600 / A4纸297 / 标准砖240 / 自定义），得到 比例尺\n3. **测量**：照片上点两个点 → 实时显示换算出的 mm（支持多条，各自命名、着色）\n4. **图纸对照**：从图纸视图量出该部位的\"图纸尺寸\"（优先自动，见 §3），或手动输入\n5. **对比判定 + 保存**：`|照片实测 - 图纸尺寸| ≤ 阈值`（默认 ±15mm，可配置）→ 绿\"符合\" / 红\"超差Xmm\"；保存为一条\"量尺校对记录\"\n\n核心公式（照片侧）：\n```\n比例尺 scale_mm_per_px = 参照物真实尺寸(mm) ÷ 参照物两点像素距离(px)\n被测尺寸(mm) = 被测两点像素距离(px) × scale_mm_per_px\n```\n\n---\n\n## 2. 现状盘点（已有资产，直接复用，先读这些文件）\n\n| 资产 | 文件 | 说明 |\n|---|---|---|\n| 屏幕像素↔CAD世界坐标(mm) 换算 | `lib/core/utils/cad_coord.dart` | `CadCoordMapper.screenToWorld / worldToScreen / localToViewPixel`（含 InteractiveViewer 变换）——**图纸量距的基础，已实现** |\n| 图纸校准持久化 | `lib/core/cad/cad_calibration.dart` | `CadCalibrationStore` / `CalibrationLibrary`，仿射系数 {a,b,c,d,e,f} 按图纸 key 存储 |\n| 取图+压缩 | `lib/features/capture/capture_page.dart` 的 `_pickImage`、`lib/core/utils/image_compress.dart` | `kIsWeb` 分流、maxWidth 1280 / quality 82 |\n| 图纸查看器 | `lib/features/projects/drawing_viewer_page.dart`、`blueprint_viewer_page.dart` | 先读代码确认：是否已接入 CadCoordMapper、是否已有\"量距\"模式；若已接入，图纸侧直接加按钮 |\n| 自定义绘制范例 | `lib/utils/path_metrics.dart` | `CustomPainter` 画点/线/圆/脉冲的现成写法，测量覆盖层照此风格 |\n| 本地存储 | `lib/core/storage/local_storage.dart` | `readDoc/writeDoc` JSON 文档 |\n| 仓库模式 | `lib/data/repository/repository.dart`、`remote_repository.dart`、`mock_repository.dart` | 记录保存照此模式（本地先行，服务端可选） |\n| 后端 | `backend/server.js`（Express :3000，`/api/vision` 已通） | 可选：`POST /api/measurements` |\n| 视觉模型（可选冲刺） | `lib/data/vision_service.dart` + `/api/vision`（qwen3.8-max） | 可选：prompt 改为\"读出图纸标注的尺寸数字\"，自动填图纸侧 |\n\n---\n\n## 3. 新增 / 修改文件清单\n\n### 新增（核心 4 个，建议按顺序）\n\n**① `lib/core/measure/measurement.dart` — 数据模型**\n```dart\nclass MeasureRef {          // 标定参照物\n  final String label;       // 门宽 / 瓷砖 / 自定义...\n  final double mm;          // 真实尺寸 mm\n  final Offset p1, p2;      // 照片上两点（原图像素坐标）\n  double get pxDist;        // 两点像素距离\n  double get scaleMmPerPx;  // mm / px\n}\n\nclass MeasureLine {         // 一条被测线\n  final String label;       // 如\"墙净宽\"\n  final Offset p1, p2;      // 原图像素坐标\n  final double photoMm;     // 换算结果\n  double? drawingMm;        // 图纸尺寸（自动量出或手填）\n  double? get deviation;    // photoMm - drawingMm\n  bool? get pass;           // |deviation| \u003c= threshold\n}\n\nclass MeasureRecord {       // 一条保存记录\n  final String id;\n  final String projectKey;  // 如 dy04_17\n  final String location;    // 部位描述\n  final String? photoPath;  // 或 base64\n  final MeasureRef ref;\n  final List\u003cMeasureLine\u003e lines;\n  final double threshold;   // 默认 15\n  final DateTime createdAt;\n  final String? note;\n}\n```\n\n**② `lib/core/measure/measure_math.dart` — 纯函数（可单测）**\n- `double pxDist(Offset a, Offset b)`\n- `double toMm(double pxDist, double scaleMmPerPx)`\n- `MeasureLine buildLine(p1, p2, scale)` \n- `bool judge(photoMm, drawingMm, threshold)`\n- **坐标映射**（易错点）：图片按 `BoxFit.contain` 显示，`LayoutBuilder` 拿显示区域；`原始像素 = (显示坐标 - 图片左上角偏移) ÷ 显示宽高 × 原图宽高`。**所有计算用原图像素，显示层只负责画**。参照 `cad_coord.dart` 的 `localToViewPixel` 思路。\n\n**③ `lib/features/measure/measure_page.dart` — 主页面**\n- 状态机：`idle → picked → calibrated → measuring → comparing → saved`\n- 顶部模式 Switch：`标定模式 / 测量模式`（照 capture_page `_useMock` 的 UI 模式）\n- 图片区：`GestureDetector`(onTapUp 取点) + `CustomPaint` 覆盖层（参照物线=蓝色虚线、被测线=橙色实线、端点=圆点、线中标注 mm 文字、超差线标红）\n- 图纸对照区：显示该部位图纸尺寸（自动量出或手填输入框）+ 阈值输入（默认15）\n- 对比表：每条线 照片实测 / 图纸尺寸 / 差值 / 判定（绿勾/红叉）\n- 保存按钮：组装 `MeasureRecord` → `MeasureRepository.save()`\n\n**④ `lib/data/measure_repository.dart` — 存取**\n- `save(record)` / `list(projectKey)` / `get(id)`：本地 `LocalStorage`（照 `CadCalibrationStore` 的 key 前缀模式，如 `measure_records_v1_`）\n- 可选（有余力）：`remote_repository.dart` 加 `POST /api/measurements`，后端 `server.js` 加对应路由（照 `/api/vision` 的 Express + CORS + json limit 模式）\n\n### 修改（3 处，小改）\n\n- `lib/features/capture/capture_page.dart`：拍照后加\"量尺校对\"按钮 → 跳转 measure_page（带照片）\n- `lib/features/projects/drawing_viewer_page.dart`：加\"图纸量距\"模式 → 复用 CadCoordMapper（若已接入），点两点显示 mm，支持\"填入当前测量记录\"\n- `lib/app.dart` / 底部导航 / home_page：加量尺校对入口（或并入现有巡检流程）\n\n---\n\n## 4. 图纸侧量距（重点：基本是现成的）\n\n1. 进入图纸查看器（校准库已按图纸 key 自动套用 `CadCoordMapper`）\n2. 开启\"量距\"模式：点两点 → `localToViewPixel` 得到整图像素 → `screenToWorld` 得到两个世界坐标(mm)\n3. `图纸尺寸 = (worldA - worldB).distance`（mm）——**CAD 世界坐标即毫米，不需要图纸比例**\n4. 结果回填到 measure_page 当前测量线的 `drawingMm`\n\n\u003e ⚠️ 先读 `drawing_viewer_page.dart` / `blueprint_viewer_page.dart` 确认现有接入程度：若尚未接入 CadCoordMapper，先在查看器内完成\"点两点→世界坐标→距离\"的最小接入（半天量级）。\n\n---\n\n## 5. 可选冲刺（有余力再做，不阻塞主流程）\n\n- **AI 读图纸尺寸**：复用 `/api/vision`（qwen3.8-max），prompt 如\"读取这张建筑图纸中标注的所有尺寸数字，按'部位:数值mm'输出JSON\"。把图纸截图发过去，结果预填 `drawingMm`，设计师确认。管线现成，主要是 prompt 调优（注意超时 180s、JSON 截取解析照 AI_VISION_INTEGRATION.md）\n\n---\n\n## 6. 验收标准（今天\"做完\"的定义）\n\n- [ ] `flutter analyze` 无新增 error\n- [ ] 手动流程跑通：拍照 → 标定（门宽900）→ 量一条线 → 显示mm → 输入/量出图纸尺寸 → 出判定（绿/红）→ 保存成功\n- [ ] Web 端（`flutter build web --release` + `serve_web.ps1`）可演示\n- [ ] 用一张真实照片验证数值合理（比如量已知900mm门洞，误差 \u003c 5%）\n- [ ] 录制 90 秒演示视频\n\n---\n\n## 7. 演示脚本（给设计师/院长）\n\n\u003e \"拍一面墙 → 拿门洞宽度900mm标定 → 画线量墙长 → 图纸上点两点量出设计尺寸 → 系统算差值：图纸3000、实测2985、差15mm、阈值内绿勾。以前要带尺子，现在拍照就够——肉眼看不出的偏差，这个能看出来。\"\n\n## 8. 红线（演示时如实说）\n\n1. 精度 ±1~3%，受拍照角度/透视影响；**垂直拍摄、标定线与被测线尽量同一平面**\n2. 定位是\"快速校对\"，不是精密计量（全站仪/激光测距的活）\n3. 图纸侧今天以\"点两点量距 + 可选AI读数\"为准，不承诺全自动\n"},{"id":"docs/archive/MEASURE_FIELD_TEST_KIT.md","path":"docs/archive/MEASURE_FIELD_TEST_KIT.md","url":"ZG9jcy9hcmNoaXZlL01FQVNVUkVfRklFTERfVEVTVF9LSVQubWQ=","base":"MEASURE_FIELD_TEST_KIT.md","title":"量尺实测包（真机精度基线）","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":7107,"chars":4231,"lines":154,"nhead":9,"lead":"目的：把「能不能判定」用你们自己的真实数据定下来，而不是引用别人的论文数字。 产出：一张填写完整的记录表 + 一份结论（哪些项可判定、哪些只标参考）。 前置：只需在 Web 页面跑（手机浏览器打开电脑 IP 即可），不需要编译原生 App。","text":"# 量尺实测包（真机精度基线）\n\n\u003e 目的：把「能不能判定」用你们自己的真实数据定下来，而不是引用别人的论文数字。\n\u003e 产出：一张填写完整的记录表 + 一份结论（哪些项可判定、哪些只标参考）。\n\u003e 前置：只需在 **Web 页面**跑（手机浏览器打开电脑 IP 即可），**不需要编译原生 App**。\n\n---\n\n## 一、器材\n\n| 项 | 说明 |\n|---|---|\n| 钢卷尺或激光测距仪 | 作为**真值**（激光测距仪更省事，±1.5~2mm） |\n| 手机 | 任意安卓/iPhone 均可（本轮测的是「照片+网格单应」路线，不依赖 LiDAR） |\n| A4 纸 | 297×210mm，现场随手可得的已知长度 |\n| 瓷砖/地砖/吊顶扣板面 | 已知模数网格（600 或 300），**这是标定来源** |\n| 平整白墙（乳胶漆）、木饰面、（可选）玻璃 | 覆盖不同材质 |\n\n\u003e 可选加测：iPhone Pro（LiDAR）在 AR 页单独跑一组，用于对比「LiDAR 路线 vs 照片路线」。\n\n---\n\n## 二、测试前准备（App 内，1 分钟）\n\n1. 电脑起服务：`python -m http.server 8080 -d build\\web`\n2. 查电脑 IP：`ipconfig` → IPv4（如 `192.168.1.23`）\n3. 手机连**同一 WiFi** → 浏览器开 `http://192.168.1.23:8080`（防火墙需放行）\n4. 进「拍照量尺校对」页\n\n---\n\n## 三、样本矩阵（20 组，约 40 分钟）\n\n**每组流程**：站在指定距离与角度 → 拍一张照片 → 「AI 自动识别网格」并确认（或手动点 9 个缝交点，格距 600）→ 点选**已知真值**的两端 → 记录 3 个数：**校正前（两点比例）/ 校正后（单应）/ 标定残差**。\n\n| 组号 | 距离 | 倾角 | 被测目标 | 真值(mm) |\n|---|---|---|---|---|\n| 1–4 | 0.5m | 正对 / 斜30° / 斜45° / 侧移 | 瓷砖 2 格 | 1200 |\n| 5–8 | 1.0m | 正对 / 斜30° / 斜45° / 侧移 | 瓷砖 2 格 | 1200 |\n| 9–12 | 2.0m | 正对 / 斜30° / 斜45° / 侧移 | 门洞宽 | 实测填 |\n| 13–16 | 3.0m | 正对 / 斜30° / 斜45° / 侧移 | 门洞宽 | 实测填 |\n| 17 | 1.0m | 正对 | 白墙（无网格） | 用 A4 当锚物 297 |\n| 18 | 1.5m | 斜30° | 白墙 + A4 做锚 | 297 |\n| 19 | 1.5m | 斜45° | 木饰面 | 1200 |\n| 20 | 1.5m | 斜30° | 玻璃/镜面（**预期失效**） | — |\n\n\u003e 第 20 组不是凑数：玻璃/镜面是 LiDAR 与视觉的已知失效场景，用它确认「App 会明确失败而不是给错数」。\n\n---\n\n## 四、记录表（直接填，贴回来给我）\n\n| # | 距离 | 倾角 | 材质 | 目标 | 真值 mm | 校正前 mm | 校正后 mm | 残差 mm | 网格识别 | 备注 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | 0.5m | 正对 | 瓷砖 | 2格 | 1200 | | | | 是/否 | |\n| 2 | 0.5m | 斜30° | 瓷砖 | 2格 | 1200 | | | | | |\n| 3 | 0.5m | 斜45° | 瓷砖 | 2格 | 1200 | | | | | |\n| 4 | 0.5m | 侧移 | 瓷砖 | 2格 | 1200 | | | | | |\n| 5 | 1.0m | 正对 | 瓷砖 | 2格 | 1200 | | | | | |\n| 6 | 1.0m | 斜30° | 瓷砖 | 2格 | 1200 | | | | | |\n| 7 | 1.0m | 斜45° | 瓷砖 | 2格 | 1200 | | | | | |\n| 8 | 1.0m | 侧移 | 瓷砖 | 2格 | 1200 | | | | | |\n| 9 | 2.0m | 正对 | 瓷砖 | 门洞 | | | | | | |\n| 10 | 2.0m | 斜30° | 瓷砖 | 门洞 | | | | | | |\n| 11 | 2.0m | 斜45° | 瓷砖 | 门洞 | | | | | | |\n| 12 | 2.0m | 侧移 | 瓷砖 | 门洞 | | | | | | |\n| 13 | 3.0m | 正对 | 瓷砖 | 门洞 | | | | | | |\n| 14 | 3.0m | 斜30° | 瓷砖 | 门洞 | | | | | | |\n| 15 | 3.0m | 斜45° | 瓷砖 | 门洞 | | | | | | |\n| 16 | 3.0m | 侧移 | 瓷砖 | 门洞 | | | | | | |\n| 17 | 1.0m | 正对 | 白墙+A4 | A4长边 | 297 | | | | | |\n| 18 | 1.5m | 斜30° | 白墙+A4 | A4长边 | 297 | | | | | |\n| 19 | 1.5m | 斜45° | 木饰面 | 2格 | 1200 | | | | | |\n| 20 | 1.5m | 斜30° | 玻璃 | — | — | | | | | 预期失效 |\n\nCSV 版（想用 Excel 统计就复制这段存成 `.csv`）：\n\n```csv\nno,distance,angle,material,target,truth_mm,legacy_mm,corrected_mm,residual_mm,grid_detected,note\n1,0.5,0,瓷砖,2格,1200,,,,,\n2,0.5,30,瓷砖,2格,1200,,,,,\n3,0.5,45,瓷砖,2格,1200,,,,,\n4,0.5,side,瓷砖,2格,1200,,,,,\n5,1.0,0,瓷砖,2格,1200,,,,,\n6,1.0,30,瓷砖,2格,1200,,,,,\n7,1.0,45,瓷砖,2格,1200,,,,,\n8,1.0,side,瓷砖,2格,1200,,,,,\n9,2.0,0,瓷砖,门洞,,,,,,\n10,2.0,30,瓷砖,门洞,,,,,,\n11,2.0,45,瓷砖,门洞,,,,,,\n12,2.0,side,瓷砖,门洞,,,,,,\n13,3.0,0,瓷砖,门洞,,,,,,\n14,3.0,30,瓷砖,门洞,,,,,,\n15,3.0,45,瓷砖,门洞,,,,,,\n16,3.0,side,瓷砖,门洞,,,,,,\n17,1.0,0,白墙,A4长边,297,,,,,\n18,1.5,30,白墙,A4长边,297,,,,,\n19,1.5,45,木饰面,2格,1200,,,,,\n20,1.5,30,玻璃,-,,,,,预期失效\n```\n\n---\n\n## 五、判定阈值（先用这个，实测后可调）\n\n| 条件 | 通过线 | 用途 |\n|---|---|---|\n| 正对、≤1.5m、有网格 | **\\|误差\\| ≤ 5 mm** | 可标「可判定」 |\n| 斜 ≤30°、≤1.5m | **≤ 10 mm** | 可标「可判定」 |\n| 斜 45° 或 1.5~3m | **≤ 20 mm** | 只标「参考」 |\n| \u003e3m 或残差 \u003e 15mm | — | 只标「参考」，且必须提示复核 |\n\n统一口径：**先看残差**（残差大说明标定不可信，后面的数都不用看）。\n\n---\n\n## 六、我要从数据里得出的结论（填完我帮你算）\n\n1. **单应校正到底救回多少**：`校正前误差 − 校正后误差`（斜拍组应最明显）\n2. **误差随距离/角度怎么涨**：给出「距离 × 角度」误差表\n3. **哪些项可判定**：按上表把 `_CheckItem` 的门槛写进 UI/报告（现在只有统一的 15mm/2%）\n4. **失效场景清单**：玻璃/反光/纯色面 → 明确降级路径\n5. 反推**最佳操作姿势**（距离、角度、是否必须放大后打点）写进 App 提示\n\n---\n\n## 七、常见坑（先说在前面，省得白跑）\n\n1. **必须在同一平面**——跨转角（L 形两面墙）单应不成立，误差会失控\n2. **打点前放大**——端点定位误差是主要误差源，放大后点更准\n3. **残差不是精度**——4 个控制点时残差恒 ≈0（精确解），**至少点 9 个点**残差才有判别意义\n4. **镜面/玻璃/深色**会失败，这是原理限制；第 20 组专门验证「失败时是否明确报错」\n5. **AI 认错格距**（把 800 认成 600）会让整体比例偏——确认那一步必须看一眼格距是否合理\n6. 拍完先看 App 是否提示「未识别到网格」；识别不到就用**手动点选 9 点**，别硬用两点比例法（斜拍时它就是不准）\n\n---\n\n## 八、可选：iPhone Pro 的 AR 路线（另一组数据）\n\n在 AR 页做**系统偏差校正**后再测，记录：\n\n| # | 距离 | 目标 | 真值 mm | AR 实测 mm | 重复性 ±mm | k 值 | 备注 |\n|---|---|---|---|---|---|---|---|\n| A1 | 1.0m | 瓷砖 2 格 | 1200 | | | | |\n| A2 | 2.0m | 门洞宽 | | | | | |\n| A3 | 3.0m | 门洞宽 | | | | | |\n| A4 | 6.0m | 任意 | | | | | 预期：提示超量程并丢弃 |\n\n\u003e 这组数据回答一个问题：**AR 路线（LiDAR）和照片路线（单应）谁更准**——直接决定安卓要不要继续走照片路线。\n\n---\n\n填完把表贴回来（或发 `.csv`），我负责算误差表、定门槛、把结论写进 App 的提示与报告文案。\n"},{"id":"docs/archive/MEASURE_FIX_PLAN.md","path":"docs/archive/MEASURE_FIX_PLAN.md","url":"ZG9jcy9hcmNoaXZlL01FQVNVUkVfRklYX1BMQU4ubWQ=","base":"MEASURE_FIX_PLAN.md","title":"量尺校对功能 — 改进实现清单（交付 CodeBuddy）","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-08-25","mtime":"2026-08-25","size":8131,"chars":4979,"lines":163,"nhead":12,"lead":"背景：MEASURE_FEATURE_PLAN.md 已实现（5文件），评审发现 2 个 P0 Bug + 若干 P1/P2 问题。 要求：先读现有实现再改；每项改动后保持 flutter analyze 无新增 error；不要改动与量尺无关的代码。","text":"# 量尺校对功能 — 改进实现清单（交付 CodeBuddy）\n\n\u003e 背景：MEASURE_FEATURE_PLAN.md 已实现（5文件），评审发现 2 个 P0 Bug + 若干 P1/P2 问题。\n\u003e 要求：**先读现有实现再改**；每项改动后保持 `flutter analyze` 无新增 error；不要改动与量尺无关的代码。\n\n---\n\n## 🔴 P0-1：照片标定只用 X 方向（1D），测量用 2D 距离 —— 不一致导致斜线/竖线标定算错\n\n**问题**：`PhotoCalib` 只存 `pixA/pixB`（仅 x 坐标），`mmPerPx = refMm / (pixB - pixA).abs()`（纯水平差）；而测量用 2D 欧氏距离。参考物画斜线 → 比例尺偏大；参考物竖着画（门高/层高）→ 水平差≈0 → mm/px 爆炸，量出天文数字。\n\n**涉及文件与修改**：\n\n1. `lib/data/models.dart` — `PhotoCalib`（约 512~534 行）\n   - 字段改为 `ax, ay, bx, by`（参考物两端点完整坐标）+ 保留 `imgW`\n   - `mmPerPx =\u003e refMm / sqrt((bx-ax)^2 + (by-ay)^2)`（2D 距离）\n   - `copyWith` 同步改\n2. `lib/core/storage/measure_store.dart` — `_toJson`（约 43~50 行）与 `_fromJson`（约 70~77 行）\n   - 序列化字段同步为 ax/ay/bx/by\n   - **向后兼容**：`_fromJson` 读到旧格式（只有 pixA/pixB）时，ay=by=0，退化为旧行为（水平距离），不能报错\n3. `lib/features/measure/measure_page.dart` — `_applyRefCalib`（约 198~220 行）\n   - 存点时改为 `pixA: _refPicks[0].dx, pixA_y: _refPicks[0].dy, ...`（按新模型字段）\n4. `lib/core/utils/measure_math.dart` — 无需大改（`photoMeasuredMm` 已用 2D `photoDistancePx`），确认签名与模型一致即可\n\n**验证**：用一张照片，参考物竖着标定（如 1000mm 门高），量同方向线段，数值应合理（误差 \u003c5%），不再出现巨大/异常值。\n\n---\n\n## 🔴 P0-2：选点标记显示错位（原图像素坐标直接用于 Positioned）\n\n**问题**：`_pickDot(p, c)` 把**原图像素坐标**直接当 `Positioned(left/top)` 用，但图片按 `BoxFit.contain` 缩放显示，标记画在错误位置（原图坐标 \u003e 容器尺寸时直接不可见）。\n\n**涉及文件**：`lib/features/measure/measure_page.dart`\n\n**修改**：\n1. 新增坐标换算工具方法（页面内私有函数即可，或放 `measure_math.dart`）：\n   ```dart\n   /// 原图像素坐标 → 显示坐标（BoxFit.contain 反算，_onDrawTap 的逆变换）\n   Offset imageToDisplay(Offset imgPx, Size box, Size imgSize) {\n     final contain = _containSize(box, imgSize); // 已有此函数\n     final offX = (box.width - contain.width) / 2;\n     final offY = (box.height - contain.height) / 2;\n     return Offset(\n       offX + imgPx.dx / imgSize.width * contain.width,\n       offY + imgPx.dy / imgSize.height * contain.height,\n     );\n   }\n   ```\n2. 三处标记渲染改为先换算再定位：\n   - 图纸侧：`_drawingPicker` 中 `_drawPicks.map((p) =\u003e _pickDot(...))`（约 401 行）\n   - 照片侧：`_refPicks`（橙色，约 503 行）与 `_photoPicks`（红色，约 504 行）\n   - `_pickDot` 调用处需要能拿到 `box`（LayoutBuilder 的尺寸）与图片尺寸（`_imageSize` / `_photoSize`）\n\n**验证**：点选任意位置，标记应精确落在点击处（原图放大/缩小时都正确）。\n\n---\n\n## 🟡 P1-1：图纸尺寸手填降级（图纸未校准时功能瘫痪）\n\n**问题**：`_addItem`（约 156~195 行）要求 `_mapper != null` 才能加项；图纸未校准时整个量尺功能不可用。设计师需要\"对照图纸正确尺寸\"的最低保障是手填。\n\n**修改**（`lib/features/measure/measure_page.dart`）：\n1. 名称输入行旁（约 309~321 行）增加\"图纸尺寸\"输入框 `_drawingMmCtl`\n2. 逻辑改为：\n   - 图纸已校准：默认用两点量得值（可编辑覆盖），输入框预填量得值\n   - 图纸未校准：允许手填图纸尺寸后添加（跳过 `_drawPicks` 校验，跳过 `drawingDistanceMm`）\n3. 判定/清单/持久化不变\n\n**验证**：删掉某图纸校准后，仍能手填图纸尺寸完成校对。\n\n---\n\n## 🟡 P1-2：默认容差过严（5mm/2% → 建议 15mm/2%）+ 快捷档位\n\n**问题**：照片标定法精度约 ±1~3%；3000mm 墙配 5mm 容差（0.17%）几乎必判超差。\n\n**修改**：\n1. `lib/data/models.dart` — `MeasureSession` 默认值 `tolMm: 5, tolPct: 2`（约 579~580 行）→ 改为 `tolMm: 15, tolPct: 2`\n2. `lib/features/measure/measure_page.dart` — 初始控制器文本（约 54~55 行 `'5'`/`'2'`）→ `'15'`/`'2'`；`_loadSession` 默认（约 103~104 行）同步\n3. 可选（有余力）：容差行加三档快捷选择 `ChoiceChip`：严格 5/1、标准 10/1.5、宽松 15/2\n\n**验证**：新建会话默认显示 ±15mm / 2%。\n\n---\n\n## 🟡 P1-3：照片上显示参考线 + 像素跨度\n\n**问题**：标定只有两个橙点，无法确认参考物两端位置与跨度。\n\n**修改**（`lib/features/measure/measure_page.dart` `_photoPanel` 约 486~528 行）：\n- 照片 Stack 加 `CustomPaint` 覆盖层（参考 `path_metrics.dart` 的绘制风格）：\n  - 参考物两点间画橙色实线，中点标注 `跨度 px`（用 `imageToDisplay` 换算显示坐标）\n  - 被测两点间画红色实线，中点标注换算 mm 值（已有文字显示，可保留）\n- 线宽 2~3，端点沿用现有圆点标记\n\n**验证**：标定后照片上可见橙色参考线；量测后可见红色线+数值。\n\n---\n\n## 🟡 P1-4：增加\"重新标定\"入口\n\n**问题**：标定错了无法重置（`copyWith` 已有 `clearPhotoCalib` 参数但 UI 未用）。\n\n**修改**（`lib/features/measure/measure_page.dart`）：\n- 标定成功后的 Chip 旁（约 447~455 行）加 `TextButton('清除标定')`：\n  ```dart\n  setState(() {\n    _session = _session!.copyWith(clearPhotoCalib: true);\n    _refPicks.clear();\n    _photoPicks.clear();\n  });\n  _persist();\n  ```\n- 清除后状态回到\"未标定\"，点照片进入参考物标定模式\n\n**验证**：清除后 mm/px Chip 消失，重新标定数值更新。\n\n---\n\n## 🟡 P1-5：云端同步端口/地址核对\n\n**问题**：`lib/data/repository/remote_repository.dart`（约 14~17 行）默认 host `http://120.24.240.129:3000`，但 `server/measure_server.py` 默认端口 **8820**（`MEASURE_PORT`），Express 视觉服务才是 3000。默认地址打到的不是量尺服务。\n\n**修改**：\n1. 确认部署拓扑：若 8820 已被反代/映射到 :3000，则只改注释说明；否则把默认值改为实际可达的 `http://\u003chost\u003e:8820`（或与部署方确认统一入口）\n2. `MEASURE_HOST` 的 `--dart-define` 用法已在注释中，保持\n3. 同步检查 `_start_server.py` / 部署脚本是否同时拉起 `measure_server.py`\n\n**验证**：prod 环境保存后 GET 能取回会话（本地保存不受影响）。\n\n---\n\n## 🟢 P2-1：测试脚本路径硬编码\n\n**修改**：`_test_measure.ps1`（第 1 行）`c:\\sp\\server\\measure_server.py` → 相对路径：\n```powershell\n$server = Start-Process python -ArgumentList \"$PSScriptRoot\\server\\measure_server.py\",'8820' -WindowStyle Hidden -PassThru\n```\n\n## 🟢 P2-2：_onDrawTap 回退分支坐标体系统一\n\n**修改**：`_onDrawTap`（约 408~423 行）`_imageSize == null` 时目前把显示坐标原样存入 `_drawPicks`，与正常分支（整图像素）混用。改为：`_imageSize == null` 时提示\"图纸未加载\"并 return，不存点。\n\n## 🟢 P2-3：提示文案按状态显示\n\n**修改**：`_photoPanel` 底部提示（约 530 行）改为状态相关：\n- 未标定：`请在照片上点选参考物两端（橙），再点击「标定」`\n- 已标定：`请在照片上点选被测两点（红）`\n\n---\n\n## ✅ 完成验收清单\n\n- [ ] `flutter analyze` 无新增 error\n- [ ] 竖线参考物标定数值合理（P0-1）\n- [ ] 标记与点击位置重合（P0-2）\n- [ ] 图纸未校准可手填完成校对（P1-1）\n- [ ] 默认容差 ±15mm/2%（P1-2）\n- [ ] 照片可见参考线与量测线（P1-3）\n- [ ] 可清除标定并重新标定（P1-4）\n- [ ] Web 端（flutter build web + serve_web.ps1）全流程可演示\n- [ ] 录 90 秒演示视频（拍墙→标定→量距→对比→判定）\n"},{"id":"docs/archive/MEASURE_ROOM_PLAN.md","path":"docs/archive/MEASURE_ROOM_PLAN.md","url":"ZG9jcy9hcmNoaXZlL01FQVNVUkVfUk9PTV9QTEFOLm1k","base":"MEASURE_ROOM_PLAN.md","title":"装修量房 · 户型记录量尺（产品+技术方案）","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":7098,"chars":3612,"lines":85,"nhead":10,"lead":"需求还原（本次提出）：AR量尺要 ①精准度更高 ②符合工程习惯 ③参考室内装修量尺 ④适配装修 ⑤能记录户型并在图上标注好尺寸。 定位判断：从\"点对点测距\"升级为 \"量房成图\"——沿墙扫/点一圈 → 自动生成标注尺寸的户型图 → 保存为量房记录（可进报告/对比图纸）。 出处参考：[Apple RoomPlan（官方，L","text":"# 装修量房 · 户型记录量尺（产品+技术方案）\n\n\u003e 需求还原（本次提出）：AR量尺要 **①精准度更高 ②符合工程习惯 ③参考室内装修量尺 ④适配装修 ⑤能记录户型并在图上标注好尺寸**。\n\u003e 定位判断：从\"点对点测距\"升级为 **\"量房成图\"**——沿墙扫/点一圈 → 自动生成标注尺寸的户型图 → 保存为量房记录（可进报告/对比图纸）。\n\u003e 出处参考：[Apple RoomPlan（官方，LiDAR 扫描自动成户型）](https://developer.apple.com/cn/augmented-reality/roomplan/)、[平面圖設計 3D \u0026 LiDAR 掃描（消费App案例）](https://apps.apple.com/us/app/%E5%B9%B3%E9%9D%A2%E5%9C%96%E8%A8%AD%E8%A8%88-3d-lidar%E6%8E%83%E6%8F%8F/id6475383389?l=zh-Hant-TW#1)、[如视·庞加莱智慧量房（贝壳系行业方案）](https://www.realsee.com/article/g6o8kyxq?utm_source=website\u0026utm_medium=social_organic\u0026utm_campaign=CO_galois-kolvideo)、[知户型类\"边量边画\"App](https://www.diyiyou.com/soft/14476.html#1)\n\n---\n\n## 一、目标产品定义\n\n**「量房模式」**：打开手机对房间 → 用 LiDAR 扫描/定点 → 系统自动生成**户型多边形（墙段）+ 尺寸标注** → 设计师在图上补门窗型号/墙厚/完成面/净高等 → 保存为\"量房记录\" → 可与施工图对照、进报告。\n\n一句话卖点：**\"举着手机走一圈，户型图带尺寸就出来了，还能对照施工图查偏差。\"**\n\n## 二、两条技术路线\n\n| | 路线A：RoomPlan 官方扫描（推荐主力） | 路线B：自研 LiDAR 定点成图 |\n|---|---|---|\n| 原理 | ARKit RoomPlan API：LiDAR 扫一圈自动识别墙/门/窗/房间，输出 USDZ+JSON（墙段、洞口、房间、尺寸） | 复用现有 AR 量尺：手动点墙角→线段→正交吸附→闭合→成图 |\n| 精度 | 官方优化，厘米级（短距离更佳） | 取决于打点质量，需自研误差校正 |\n| 工作量 | 小（官方框架），但**深度二次开发受限** | 大，可控性强 |\n| 成图 | 自动出房间/墙体/洞口 | 手动定点，半自动 |\n| 上手 | 需\"拿手机绕房间扫一圈\"教学 | 指哪打哪，工程习惯可控 |\n| 适配 | iOS 16+ 且 **仅 LiDAR 机型**（iPhone 12 Pro+ / iPad Pro 2020+） | 同左 |\n| 国内生态 | RoomPlan 仅 iOS；安卓无官方替代 | 安卓可退化为照片/手动量房 |\n\n**推荐：路线A 为主（v1 快速成图），路线B 作为\"补点/修正\"模式叠加**——RoomPlan 出骨架，设计师手动补工程信息（正是装修量房行业流程：机器给骨架、人工给细节）。\n\n## 三、工程习惯（差异化功能清单，写进 v1）\n\n1. **标注规范**：净尺寸为主、可选轴/完成面；标注线样式对齐图纸习惯（如 900/4200 加圈或箭头），数字单位 mm\n2. **正交修正**：\u003e85°\u003c95° 墙角吸附为直角；明显斜墙保留并提示\"非直角，请复核\"\n3. **闭合与闭合差**：首尾自动闭合；周长闭合差 \u003e15mm 提示\"存在误差，请复核 X 段\"（对应量房行业允许误差口径）\n4. **洞口打断**：门窗在墙段上自动打断并标注（门宽900、窗宽+窗台高由 RoomPlan 或手动补）\n5. **面积自动**：房间面积自动计算（㎡，保留两位），标注在图中心或列表\n6. **净高/标高**：可录入/扫描层高，图侧注标高\n7. **成图留痕**：量房记录=照片证据+图+尺寸表，可进报告/与 CAD 施工图对照超差（对接现有量尺校对逻辑：RoomPlan 尺寸 vs 图纸尺寸偏差判定）\n\n## 四、功能流程（v1 草案）\n\n```\n入口「量房」→ 选项目/房间\n→ ①扫描：RoomPlan 绕房间扫描（提示语：沿墙走一圈，角角落落都扫到）\n→ ②确认骨架：墙段/洞口/房间预览，可增删墙段、手动补点（路线B修正）\n→ ③标注/补信息：门窗型号、墙厚/材质、净高、完成面（手动表单）\n→ ④校验：闭合差/正交提示、与已有图纸对照（若有）→ 判定\n→ ⑤保存：量房记录（照片+户型图PNG/SVG+尺寸表JSON）→ 列表/报告\n```\n\n## 五、精度与诚实边界（对外口径）\n\n1. **精度声明**：LiDAR 量房为厘米级（约 ±1~2cm@5m 内，RoomPlan 官方优化）；**工程复核仍建议卷尺/激光测距仪对关键尺寸抽测**（行业惯例：机器给骨架、人工精测复核）\n2. \"高精度+符合工程习惯\"= 技术（LiDAR/官方框架）+流程（正交/闭合差/标注规范）双保险，**不是承诺替代验收测量**\n3. 装修量房细分：完成面尺寸为主，需设计师补\"做法/厚度\"——v1 用标注层解决，不做自动识别材质\n\n## 六、与现有 App 的集成点\n\n- 复用：现有 AR LiDAR 原生（`ArMeasureView.swift`）的会话管理/权限；`MeasureSession/MeasureItem` 数据模型扩展（source 加 `'roomplan'`）；报告生成器加\"量房记录\"章节；校准/图纸对照逻辑\n- 新增模型：`RoomPlanRecord {id, projectKey, name, scannedAt, walls[{a,b,lengthMm,openings[]}], rooms[{name,areaM2}], dims[], status, rawJson?}`（兼容默认）\n- iOS 原生新增：`RoomCaptureController`（RoomPlan `RoomCaptureSession` 包装，MethodChannel 暴露：start/stop/export→JSON+USDZ）\n\n## 七、分期与硬依赖\n\n| 阶段 | 内容 | 依赖 | 本机可验 |\n|---|---|---|---|\n| v1 立项 | 产品设计+RoomPlan 原生封装+成图标注层 | **Mac + iPhone Pro(iOS16+) 真机** | ❌（Windows 只能写 Dart 侧） |\n| v1.5 | 骨架确认/手动修正 UI（路线B）、数据模型、报告接入 | 同 v1 | Dart 侧部分可 Web 验 |\n| v2 | 安卓适配（照片/手动量房成图，参照知户型类） | 无硬依赖 | ✅ 可先做 |\n\n**⚠️ 最大风险与现状**：当前无 Mac、无 iPhone Pro——**v1 无法真机验证**（与现有 AR 量尺同一瓶颈）。建议：v1.5 的模型+UI 层现在可写可 Web 验；原生 RoomPlan 封装待设备到位。\n\n## 八、给 CodeBuddy 的立项任务（若批准，先做 v1.5 Dart 侧）\n\n1. 数据模型：`RoomPlanRecord` 等（models.dart 追加，兼容）\n2. 页面骨架：`room_measure_page.dart`（选项目→占位\"开始扫描\"（iOS 真机启用）→骨架确认→标注表单→保存列表入口），Web 上可走\"手动打点成图\"演示路径（复用现有照片量尺打点逻辑画墙多边形）\n3. 报告接入：量房记录进导出报告（四端同步字段）\n4. 输出标注层引擎：尺寸标注线/文字绘制（CustomPaint，方向可控，v1 简单版：墙段中点垂直引出）\n5. iOS 原生封装（仅代码，不编）：`RoomCaptureController.swift` + MethodChannel 契约文档，待 Mac 联调\n\n## 九、需要你拍板（回复后我细化任一项）\n\n1. **路线**：A(RoomPlan 自动扫描) / B(手动定点) / A+B 叠加（推荐）？\n2. **场景范围**：仅\"室内装修量房\"还是也含\"工地房间核尺（对照施工图超差）\"？（决定是否重用量尺校对逻辑）\n3. **设备**：能否借到 iPhone Pro + Mac（决定 v1 何时能验）？借不到就先做 v1.5 Dart 侧 + 安卓手动量房路径（v2）\n"},{"id":"docs/archive/PHOTOCALIB_2D_FIX.md","path":"docs/archive/PHOTOCALIB_2D_FIX.md","url":"ZG9jcy9hcmNoaXZlL1BIT1RPQ0FMSUJfMkRfRklYLm1k","base":"PHOTOCALIB_2D_FIX.md","title":"P0-1 修复：PhotoCalib 升级为 2D 坐标（含序列化兼容）— 交付 CodeBuddy","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-08-25","mtime":"2026-08-25","size":6976,"chars":5649,"lines":204,"nhead":9,"lead":"只改 4 个文件，共 6 处替换。按下面顺序操作，每处都是\"找到旧代码 → 整段替换为新代码\"。 前置：先读 lib/data/models.dart（PhotoCalib 约 511~534 行、MeasureSession.toJson/fromJson 约 612~664 行）、lib/core/storage/","text":"# P0-1 修复：PhotoCalib 升级为 2D 坐标（含序列化兼容）— 交付 CodeBuddy\n\n\u003e 只改 4 个文件，共 6 处替换。按下面顺序操作，每处都是\"找到旧代码 → 整段替换为新代码\"。\n\u003e 前置：先读 `lib/data/models.dart`（PhotoCalib 约 511~534 行、MeasureSession.toJson/fromJson 约 612~664 行）、`lib/core/storage/measure_store.dart`（约 36~88 行）、`lib/features/measure/measure_page.dart`（`_applyRefCalib` 约 198~220 行）。\n\u003e 注意：`models.dart` 已 `import 'dart:math' as math;`（第 1 行），新代码直接用 `math.sqrt`，不要重复导入。\n\n---\n\n## ① `lib/data/models.dart` — 整段替换 PhotoCalib 类（原 511~534 行）\n\n```dart\n/// 照片侧量距的一次标定：以已知尺寸参考物（卷尺/标准块）标定照片上的像素比例。\n/// 存储参考物两端点完整像素坐标（2D），mm/px 用 2D 欧氏距离计算。\nclass PhotoCalib {\n  final double refMm; // 参考物真实尺寸（mm）\n  final double ax; // 起点像素 x（整图坐标系，0..imgW）\n  final double ay; // 起点像素 y（整图坐标系，0..imgH）\n  final double bx; // 终点像素 x\n  final double by; // 终点像素 y\n  final double imgW; // 照片整图像素宽\n  final double imgH; // 照片整图像素高\n  const PhotoCalib({\n    required this.refMm,\n    required this.ax,\n    required this.ay,\n    required this.bx,\n    required this.by,\n    required this.imgW,\n    this.imgH = 0,\n  });\n\n  /// 参考物像素跨度（2D 欧氏距离，px）。\n  double get spanPx =\u003e math.sqrt(math.pow(bx - ax, 2) + math.pow(by - ay, 2));\n\n  /// 照片像素比例（mm/px）：参考物尺寸 / 像素跨度（2D）。\n  double get mmPerPx =\u003e spanPx \u003c= 1e-6 ? 0 : refMm / spanPx;\n\n  PhotoCalib copyWith({\n    double? refMm,\n    double? ax,\n    double? ay,\n    double? bx,\n    double? by,\n    double? imgW,\n    double? imgH,\n  }) =\u003e\n      PhotoCalib(\n        refMm: refMm ?? this.refMm,\n        ax: ax ?? this.ax,\n        ay: ay ?? this.ay,\n        bx: bx ?? this.bx,\n        by: by ?? this.by,\n        imgW: imgW ?? this.imgW,\n        imgH: imgH ?? this.imgH,\n      );\n\n  /// 新格式序列化。\n  Map\u003cString, dynamic\u003e toJson() =\u003e {\n        'refMm': refMm,\n        'ax': ax,\n        'ay': ay,\n        'bx': bx,\n        'by': by,\n        'imgW': imgW,\n        'imgH': imgH,\n      };\n\n  /// 兼容旧格式（仅 {refMm, pixA, pixB, imgW}）：旧数据 ay=by=0，\n  /// 退化为水平距离计算，与旧版行为一致，不抛异常。\n  factory PhotoCalib.fromJson(Map\u003cString, dynamic\u003e m) {\n    final pixA = (m['pixA'] as num?)?.toDouble();\n    final pixB = (m['pixB'] as num?)?.toDouble();\n    return PhotoCalib(\n      refMm: (m['refMm'] as num?)?.toDouble() ?? 0,\n      ax: (m['ax'] as num?)?.toDouble() ?? pixA ?? 0,\n      ay: (m['ay'] as num?)?.toDouble() ?? 0,\n      bx: (m['bx'] as num?)?.toDouble() ?? pixB ?? 0,\n      by: (m['by'] as num?)?.toDouble() ?? 0,\n      imgW: (m['imgW'] as num?)?.toDouble() ?? 0,\n      imgH: (m['imgH'] as num?)?.toDouble() ?? 0,\n    );\n  }\n}\n```\n\n---\n\n## ② `lib/data/models.dart` — MeasureSession.toJson 中 photoCalib 段（原 619~626 行）\n\n**旧代码**（整段删除）：\n```dart\n        'photoCalib': photoCalib == null\n            ? null\n            : {\n                'refMm': photoCalib!.refMm,\n                'pixA': photoCalib!.pixA,\n                'pixB': photoCalib!.pixB,\n                'imgW': photoCalib!.imgW,\n              },\n```\n**替换为**：\n```dart\n        'photoCalib': photoCalib?.toJson(),\n```\n\n## ③ `lib/data/models.dart` — MeasureSession.fromJson 中 photoCalib 段（原 646~653 行）\n\n**旧代码**（整段删除）：\n```dart\n      photoCalib: calib == null\n          ? null\n          : PhotoCalib(\n              refMm: (calib['refMm'] as num).toDouble(),\n              pixA: (calib['pixA'] as num).toDouble(),\n              pixB: (calib['pixB'] as num).toDouble(),\n              imgW: (calib['imgW'] as num).toDouble(),\n            ),\n```\n**替换为**：\n```dart\n      photoCalib: calib == null ? null : PhotoCalib.fromJson(calib),\n```\n\n## ④ `lib/core/storage/measure_store.dart` — _toJson 中 photoCalib 段（原 43~50 行）\n\n**旧代码**（整段删除）：\n```dart\n        'photoCalib': s.photoCalib == null\n            ? null\n            : {\n                'refMm': s.photoCalib!.refMm,\n                'pixA': s.photoCalib!.pixA,\n                'pixB': s.photoCalib!.pixB,\n                'imgW': s.photoCalib!.imgW,\n              },\n```\n**替换为**：\n```dart\n        'photoCalib': s.photoCalib?.toJson(),\n```\n\n## ⑤ `lib/core/storage/measure_store.dart` — _fromJson 中 photoCalib 段（原 70~77 行）\n\n**旧代码**（整段删除）：\n```dart\n      photoCalib: calib == null\n          ? null\n          : PhotoCalib(\n              refMm: (calib['refMm'] as num).toDouble(),\n              pixA: (calib['pixA'] as num).toDouble(),\n              pixB: (calib['pixB'] as num).toDouble(),\n              imgW: (calib['imgW'] as num).toDouble(),\n            ),\n```\n**替换为**：\n```dart\n      photoCalib: calib == null ? null : PhotoCalib.fromJson(calib),\n```\n\n## ⑥ `lib/features/measure/measure_page.dart` — _applyRefCalib 构造处（原 208~213 行）\n\n**旧代码**：\n```dart\n    final calib = PhotoCalib(\n      refMm: refMm,\n      pixA: _refPicks[0].dx,\n      pixB: _refPicks[1].dx,\n      imgW: _photoSize!.width,\n    );\n```\n**替换为**：\n```dart\n    final calib = PhotoCalib(\n      refMm: refMm,\n      ax: _refPicks[0].dx,\n      ay: _refPicks[0].dy,\n      bx: _refPicks[1].dx,\n      by: _refPicks[1].dy,\n      imgW: _photoSize!.width,\n      imgH: _photoSize!.height,\n    );\n    if (calib.spanPx \u003c= 1e-3) {\n      AppSnack.show(context, '参考物两点过近，请重新点选', kind: AppSnackKind.danger);\n      return;\n    }\n```\n\n---\n\n## 不需要改的文件\n\n- `lib/core/utils/measure_math.dart`：`photoMeasuredMm` / `photoDistancePx` / `photoMmPerPx` 都基于 `calib.mmPerPx`，新模型 getter 已兼容，无需改动。\n- `server/measure_server.py`：服务端只存原始 JSON，字段透传，无需改动。\n- `_test_measure.ps1`：POST body 里 photoCalib 仍是旧格式 {refMm,pixA,pixB,imgW}——**有意保留**，正好验证向后兼容。\n\n---\n\n## 验证清单\n\n1. `flutter analyze` 无新增 error（两处 toJson 替换后无未使用变量告警）\n2. **兼容验证**：用 `_test_measure.ps1` 的旧格式 JSON 走一遍 MeasureStore.load → 会话能读出、photoCalib 非空、mmPerPx = refMm/|pixB-pixA|（水平退化行为与旧版一致）\n3. **新格式验证**：照片上竖着标定参考物（如门高 1000mm，两点 dy 差大、dx 差≈0）→ Chip 显示 mm/px 为合理值（≈1000/竖跨距），量同方向线段数值合理；修复前此场景会爆出天文数字\n4. **全流程**：标定（斜线/竖线各一次）→ 量距 → 加入校对 → 判定 → 保存 → 重进页面会话恢复，数值一致\n"},{"id":"docs/archive/TEST_PLAN_MEASURE.md","path":"docs/archive/TEST_PLAN_MEASURE.md","url":"ZG9jcy9hcmNoaXZlL1RFU1RfUExBTl9NRUFTVVJFLm1k","base":"TEST_PLAN_MEASURE.md","title":"量尺功能下午测试清单（照片量尺 + P0/P1 修复验证）","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-08-25","mtime":"2026-08-25","size":5221,"chars":2714,"lines":95,"nhead":10,"lead":"时间预算：约 2 小时。标注【必测】的必须全部通过，【可跳】时间不够可延后。 测试对象：site-patrol 照片量尺（MeasurePage）。AR量尺不在本次范围（待 Mac + iPhone Pro）。 前提：CodeBuddy 已完成 MEASURE_FIX_PLAN.md 的 P0-1 / P0-2 / P","text":"# 量尺功能下午测试清单（照片量尺 + P0/P1 修复验证）\n\n\u003e 时间预算：约 2 小时。标注【必测】的必须全部通过，【可跳】时间不够可延后。\n\u003e 测试对象：site-patrol 照片量尺（MeasurePage）。AR量尺不在本次范围（待 Mac + iPhone Pro）。\n\u003e 前提：CodeBuddy 已完成 MEASURE_FIX_PLAN.md 的 P0-1 / P0-2 / P1-1 / P1-2 / P1-3 / P1-4 修复。\n\n---\n\n## 0. 测试前准备（15 分钟）【必测】\n\n| # | 检查项 | 通过标准 |\n|---|---|---|\n| 0.1 | 修复已合入 | `lib/data/models.dart` 中 PhotoCalib 有 `ax/ay/bx/by` 字段（P0-1）；`measure_page.dart` 有 `imageToDisplay`（P0-2） |\n| 0.2 | 静态检查 | `flutter analyze` 无新增 error |\n| 0.3 | 测试图纸已校准 | MeasurePage 顶部横幅显示\"图纸已校准\"（绿色）。若无，先到图纸查看页完成该图纸的坐标校准 |\n| 0.4 | 环境 | Web 端：`flutter build web --release` + `serve_web.ps1` 起 8000；手机端：能跑 debug |\n| 0.5 | 参照物 | 备好：卷尺、A4纸（297mm）、门洞（900mm）、瓷砖（600mm）任选其二；**同时准备一张已知尺寸的现场照片**（比如已知门宽900的墙面照，供快速回归） |\n| 0.6 | 记录工具 | 截图工具 + Bug记录模板（见§7） |\n\n---\n\n## 1. P0-1 标定 2D 修复验证【必测，最关键】\n\n| # | 测试 | 操作 | 通过标准 |\n|---|---|---|---|\n| 1.1 | 竖线标定（修复前会爆表） | 照片里竖着放卷尺：标定两点选卷尺 0→1000mm（两点几乎同X、不同Y）→ 点\"标定\" | Chip 显示 mm/px 为合理值；量同方向线段误差 \u003c5%；**不出现天文数字** |\n| 1.2 | 斜线标定 | 参照物两端沿对角线放置（如A4纸对角297×210的边斜放），标定后量同平面另一斜距 | 误差 \u003c5% |\n| 1.3 | 两点过近防护 | 标定两点几乎重合（\u003c几像素）→ 点\"标定\" | 弹出\"参考物两点过近\"提示，不崩溃 |\n| 1.4 | 旧数据兼容 | 用 `_test_measure.ps1` 的旧格式 JSON（pixA/pixB）写入后打开会话 | 会话正常读出，mm/px = refMm/|pixB-pixA|（水平退化行为） |\n\n\u003e 1.1 是本次测试的第一优先级：修不好它，量尺数值就是错的，其余全白测。\n\n## 2. P0-2 标记错位修复验证【必测】\n\n| # | 测试 | 操作 | 通过标准 |\n|---|---|---|---|\n| 2.1 | 图纸侧标记 | 图纸上点任意两点 | 蓝点精确落在点击处 |\n| 2.2 | 照片侧标记 | 照片上点标定两点、量测两点 | 橙点/红点精确落在点击处 |\n| 2.3 | 不同缩放 | Web 端缩放浏览器窗口到半屏后重复 2.1/2.2 | 标记仍对齐 |\n\n## 3. P1 修复验证【必测其中 3.1，其余可跳】\n\n| # | 测试 | 操作 | 通过标准 |\n|---|---|---|---|\n| 3.1 | 手填降级 | 删除该图纸校准（或换一张未校准图纸）→ 手填图纸尺寸 → 加入校对 | 能正常加项并判定（修复前直接报\"图纸未校准\"瘫痪） |\n| 3.2 | 默认容差 | 新建会话 | 容差显示 ±15mm / 2% |\n| 3.3 | 参考线 | 标定完成后看照片 | 橙色参考线+像素跨度显示；量测后红色线+mm显示 |\n| 3.4 | 重新标定 | 标定后点\"清除标定\"→ 重新标定 | Chip 消失→新值生效 |\n\n## 4. 全流程端到端【必测，最后做】\n\n按演示顺序完整走一遍：\n选图纸（已校准）→ 图纸点两点量出图纸尺寸 → 拍/选照片 → 标定参照物 → 照片点两点量实测 → 加入校对 → 清单显示（图纸mm/实测mm/偏差/判定）→ 保存 → **重进页面**确认会话恢复。\n\n| # | 断言 | 通过标准 |\n|---|---|---|\n| 4.1 | 数值合理 | 量已知尺寸（如A4纸宽210mm）：实测 210±10mm |\n| 4.2 | 判定正确 | 构造两种场景：①偏差小于容差→绿勾\"合格\"；②手填图纸尺寸使偏差超容差→红\"超差\" |\n| 4.3 | 会话恢复 | 重进页面：容差、标定、清单完整恢复 |\n| 4.4 | 删除项 | 删除一条清单项 → 本地存储同步删除 |\n\n## 5. 精度抽测（有真实墙面才做）【可跳】\n\n卷尺实测 1m / 3m 两段墙面，各拍照测量 3 次：\n\n| 距离 | 目标误差 | 记录 |\n|---|---|---|\n| 1m | ≤ ±3%（±30mm） | 测3次填偏差表 |\n| 3m | ≤ ±5%（±150mm） | 同上 |\n\n\u003e 超过目标误差不一定是代码bug，可能是拍照角度/透视问题——记录拍摄角度，作为后续\"透视修正\"的优化依据。\n\n## 6. 演示视频录制【必测，最后 10 分钟】\n\n90 秒脚本：打开项目 → 图纸量距 → 拍照 → 标定（卷尺0-1000）→ 量墙长 → 加入校对 → 判定绿勾 → 保存。\n要求：竖屏、光线充足、垂直拍摄、录全程不剪辑（真实感）。\n\n## 7. Bug 记录模板（发现即填）\n\n```\n编号: B-xx\n严重级: P0数值错误 / P1交互 / P2样式\n复现步骤: 1. ... 2. ...\n预期: ...\n实际: ...\n截图: 有/无\n环境: Web / Android / 机型\n```\n\n## 8. 收尾判读标准\n\n- **P0-1 1.1 竖线标定通过 + P0-2 标记对齐 + 4.x 全流程通过** → 量尺功能可交付演示，剩余bug进 backlog\n- 任一【必测】失败 → 记录 bug，安排 CodeBuddy 修复，**未修复前不要向设计师/院长演示**\n- 全部通过 → 明天起准备 AR 量尺的 Mac/设备 + 安排演示日\n"},{"id":"docs/archive/CAPTURE_FLOW_REDESIGN.md","path":"docs/archive/CAPTURE_FLOW_REDESIGN.md","url":"ZG9jcy9hcmNoaXZlL0NBUFRVUkVfRkxPV19SRURFU0lHTi5tZA==","base":"CAPTURE_FLOW_REDESIGN.md","title":"拍照记录流程重构方案（拍照 → 照片 → AI 分析 → 语音描述 → 保存 → 记录列表/详情）","group":"归档 · 拍照验收与报告","scope":"archive","date":"2026-08-27","mtime":"2026-08-27","size":12434,"chars":6691,"lines":195,"nhead":16,"lead":"本文档仅做方案设计，不涉及代码改动。 目标：把\"拍照记录\"从「自动识别即自动暂存」改为「用户分步主动操作」的清晰闭环，新增语音描述、独立拍照记录列表页、记录详情弹层，并与图纸关联。 本期范围：专注拍照记录相关（拍照、AI 分析按钮化、语音描述、保存、记录列表、记录详情）。缺陷工单入库（\"多一层处理\"）本期不实现，仅预留","text":"# 拍照记录流程重构方案（拍照 → 照片 → AI 分析 → 语音描述 → 保存 → 记录列表/详情）\n\n\u003e 本文档仅做方案设计，不涉及代码改动。\n\u003e 目标：把\"拍照记录\"从「自动识别即自动暂存」改为「用户分步主动操作」的清晰闭环，新增语音描述、独立拍照记录列表页、记录详情弹层，并与图纸关联。\n\u003e **本期范围**：专注拍照记录相关（拍照、AI 分析按钮化、语音描述、保存、记录列表、记录详情）。**缺陷工单入库（\"多一层处理\"）本期不实现，仅预留数据结构。**\n\n---\n\n## 0. 结论速览（已拍板）\n\n| 议题 | 结论 |\n|------|------|\n| AI 分析触发 | **按钮触发**（不再是自动）；异步机制已存在，仅迁移触发点 |\n| loading | **需要**，页面内 overlay（保留现有 `_scanning`），不阻塞 Dialog |\n| 照片位置 | **图纸下方独立卡片**，不再叠在图纸 Stack |\n| 问题描述 | 新增 `note` 字段，手打 / 语音（语音**追加**到 note） |\n| 保存时机 | **显式「保存记录」按钮**，不再自动暂存 |\n| 入库？ | **不入库**；拍照记录与缺陷工单解耦 |\n| 记录列表 | **内嵌拍照页（方案 A）**：操作区下方直接展示「本图纸拍照记录」列表，不跳转独立页 |\n| 记录与图纸 | **按图纸隔离**：切图纸 = 切对应的拍照记录列表（按 `drawingKey` 维度，列表随 `/capture` 携带的图纸自动切换） |\n| 详情页 | **底部弹层** `showModalBottomSheet`（非独立路由） |\n| 拍照/相册按钮 | 保持**单个按钮**（现有平台分流：移动端相机/相册原生选择，Web/PC 文件选择） |\n| \"多一层处理\" | 详情里选某条 AI 缺陷补信息后转工单——**本期不实现**，仅预留 `defect.status` 状态位 |\n\n---\n\n## 1. 现状基线（改造前）\n\n`capture_page.dart` 当前痛点：\n\n1. **AI 分析自动触发**：`_runScan` 拍照后自动调 `VisionService.recognizeDefects`。\n2. **暂存自动**：`_runScan` 结束直接 `_persistResult`（写 `LocalStorage`），用户无选择权。\n3. **照片叠图纸**：`_buildResultPanel` 把预览叠在图纸 `Stack`。\n4. **无问题描述字段**：entry 仅 `ts/anchor/floor/count/defects/photo`。\n5. **暂存无详情页**：底部列表只显示一行摘要。\n6. **记录无独立页面**：暂存仅存在于 `/capture` 底部，无法跨图纸隔离、无列表页。\n\n**已具备能力（可直接复用）**：\n- AI 分析本就是异步网络调用（有 `_scanning` overlay、`TimeoutException`、Mock 回放 `vlPreset`）。\n- 语音：`VoiceInputSheet` / `VoiceInputButton` + `SpeechRecognizer`（设备离线中文 ASR，无需后端）。\n- 本地存储：`LocalStorage`（移动端 Hive / Web localStorage）、`writeFile/readFile/deleteFile`（照片落盘已可用）。\n- 导航：GoRouter + ShellRoute，底部 4 Tab（项目/图纸/巡场/工单）+ 中间\"验收\"按钮（进 `/capture`）。\n\n---\n\n## 2. 产品功能方案（Product Perspective）\n\n### 2.1 主流程（用户主控）\n\n```\n① 选点（图纸选部位/楼层，带 drawingKey/worldX/Y）\n   ↓\n② 拍照 / 相册（单按钮，平台分流） → 水印后 _shotPhoto\n   ↓\n③ 照片显示图纸下方预览（可重拍/重选）\n   ↓\n④ 点「AI 分析」→ overlay loading → 异步 VisionService → 结果显照片下方\n   ↓\n⑤ 填「问题描述」（手打 / 语音追加；可空）\n   ↓\n⑥ 点「保存记录」→ 才写入暂存（LocalStorage，带 drawingKey 维度）\n   ↓\n⑦ 页内下方「本图纸拍照记录」列表（按 drawingKey 自动筛选，随当前图纸切换）\n   ↓\n⑧ 点列表条目 → 底部弹层详情（照片+AI结果+描述+部位楼层时间）\n```\n\n### 2.2 与图纸关联（记录隔离维度）\n\n- 每条记录存 `drawingKey`（来自选点 `widget.args.drawingKey`）。\n- 拍照页（`/capture`）本身从图纸页带 `drawingKey` 进入，页内记录列表**只显示该图纸**的记录；在图纸页切到另一张图再进拍照页，列表随之切换（无需独立页跳转）。\n- 存储上所有图纸记录放同一 `LocalStorage` 文档（如 `capture_records`），列表按 `drawingKey` 过滤；或每图纸一个 key（`capture_records_\u003cdrawingKey\u003e`）。**推荐前者**（单文档、过滤简单，记录量不大）。\n\n### 2.3 字段与数据结构（暂存 entry 扩展）\n\n```jsonc\n{\n  \"id\": \"\u003cunique\u003e\",                 // 记录唯一 id（用于详情/删除定位）\n  \"drawingKey\": \"b3-struct\",        // ★新增：所属图纸，列表筛选维度\n  \"ts\": \"2026-08-27 14:03:09\",      // 保存时间\n  \"anchor\": \"B 区 3 层 柱 02\",       // 部位（选点）\n  \"floor\": \"B3\",                     // 楼层\n  \"worldX\": 123.4, \"worldY\": 56.7,   // 图纸坐标（可选，详情展示）\n  \"count\": 2,                        // AI 识别缺陷数\n  \"defects\": [                       // AI 结果（VlDefect.toJson + 预留 status）\n    {\n      \"name\": \"钢筋间距不足\", \"severity\": \"orange\", \"conf\": 0.83, \"desc\": \"…\",\n      \"status\": \"pending\"            // ★预留：pending=未转工单 / converted=已转（本期恒 pending）\n    }\n  ],\n  \"photo\": \"photos/\u003cts\u003e.jpg\",        // 移动端落盘相对路径；Web 无\n  \"note\": \"现场柱筋间距明显偏小…\"      // ★新增：问题描述（手打/语音追加），可空\n}\n```\n\n- `note` 可空；空时不强校验，允许只存照片+AI结果。\n- 删除时同步 `LocalStorage.deleteFile(photo)`（已实现逻辑保留）。\n- **转工单预留**：`defects[].status` 本期恒 `pending`，详情页不展示\"转工单\"按钮（后续实现时再加，从 pending → converted 并写缺陷库）。\n\n### 2.4 边界与降级\n\n- AI 失败（超时/鉴权/网络）：保留 `_scanError` 文案，提示可重试；**不落暂存**（无结果可存，用户仍可仅保存照片+描述——需允许\"未分析也保存\"）。\n- Mock 模式：仍 `vlPreset(replayReal:true)`，但**不再自动暂存**，需点「保存记录」才落盘。\n- Web 无照片落盘：`photo` 为空，详情/列表缩略图显示占位。\n- 未分析直接保存：允许，列表/详情显示\"未分析\"标记。\n\n---\n\n## 3. UI 布局设计（UI Perspective）\n\n### 3.1 拍照页（`/capture`）整体结构（自上而下）\n\n```\n┌─────────────────────────────────────────┐\n│ AppBar: 拍照记录                 [Mock 开关]│\n├─────────────────────────────────────────┤\n│ ① 锚点信息条：部位 · 楼层 · 图纸名        │  (_buildAnchorBar，保留)\n│ ② 图纸区（纯画布，不含照片）              │  (_buildDrawingStage，移除照片叠加)\n│ ③ 照片预览区（图纸下方独立卡片）          │  ★新增 _buildPhotoPanel\n│    [水印照片 Image.memory]  重拍/重选      │\n│ ④ AI 分析按钮区                          │  ★新增 _buildAnalyzeBar\n│    [📷 拍照/选择]   [🤖 AI 分析](未拍照置灰) │\n│ ⑤ AI 结果区（照片下方，仅分析后显示）     │  (_buildDefectSection)\n│ ⑥ 问题描述输入区                         │  ★新增 _buildNoteField\n│    [文本框……] [🎤 语音]                  │\n│ ⑦ 保存记录按钮（主操作）                 │  ★改造：显式保存（未拍照禁用）\n├─────────────────────────────────────────┤\n│ ⑧ 本图纸拍照记录列表（页内直接展示）      │  ★升级现有 _buildStoredResults\n│    [缩略图] 部位·楼层  时间  识别N处/未分析│  （按 drawingKey 过滤，点开详情弹层）\n│    ··· 空态：本图纸暂无拍照记录 ···        │\n└─────────────────────────────────────────┘\n```\n（记录列表**直接内嵌本页**⑧区，不跳转独立页；随进入 `/capture` 携带的 `drawingKey` 自动筛选。）\n\n### 3.2 拍照页内记录列表区（方案 A，非独立页）\n\n- 位置：拍照页操作区（①~⑦）下方，即第 ⑧ 区，**与原底部暂存列表同位置**，但升级为：\n  - 按 `drawingKey` 过滤，只显示当前图纸记录；切图纸进 `/capture` 即自动切换。\n  - 顶部小标题\"本图纸拍照记录（N）\"。\n- 列表项（复用并增强现有 `_buildStoredResultTile`）：缩略图 + 部位·楼层 + 时间 + \"识别 N 处 / 未分析\" + \"含描述\"标记。\n- 点条目 → 底部弹层详情（见 3.3）。\n- 空态：灰字\"本图纸暂无拍照记录\"。\n\n### 3.3 记录详情（底部弹层，方案 ③）\n\n`showModalBottomSheet` 展开式 `StoredDetailSheet(entry)`：\n- 顶部拖拽条 + 部位·楼层·时间 + 关闭。\n- 照片大图（`photo` → `LocalStorage.readFile` → `Image.memory`；Web 占位）。\n- AI 识别结果：缺陷卡片列表（复用 `_buildDefectCard` 只读版）；未分析显示占位。\n- 问题描述：`note` 文本（空→\"无描述\"灰字）。\n- 底部：`删除`（复用确认弹窗 + `_deleteStoredResult`）。\n- **本期不含\"转工单\"按钮**（预留，`defects[].status` 后续驱动）。\n\n### 3.4 loading 与按钮态\n\n- AI 分析：保留 `_scanning` 页面内 overlay（轻量、不遮照片）；期间禁用 AI 分析与保存按钮防竞态。\n- 拍照按钮：单按钮，内部按平台分流（移动端原生相机/相册选择；Web/PC 文件选择），与现状一致。\n- 语音：文本框右侧 `VoiceInputButton` → `VoiceInputSheet`，`onResult` **追加**到 `note` 的 `TextEditingController`（可继续手打编辑）。\n\n---\n\n## 4. 导航落地（GoRouter 改动）\n\n- **不新增任何路由**。拍照记录列表直接内嵌 `/capture` 页（第 ⑧ 区），随进入拍照页携带的 `drawingKey` 自动按图纸筛选。\n- `app.dart` **无需改动**（保留现有 `/capture` 路由与 ShellRoute 底部导航）。\n- 底部 Tab **不变**（不新增第 5 Tab，符合方案 A：列表就在拍照页内）。\n\n---\n\n## 5. 与现有代码映射（改造清单，供后续编码）\n\n| 现有元素 | 处理方式 |\n|----------|----------|\n| `_buildResultPanel`（照片叠图纸 Stack） | 拆分：照片移到新 `_buildPhotoPanel`（图纸下方）；图纸区保持纯画布 |\n| `_runScan`（自动分析 + 自动 `_persistResult`） | 拆为：① 纯分析（异步、仅出结果，去掉自动暂存）；② 暂存逻辑移到「保存记录」按钮 |\n| `_scanning` / `_buildScanningOverlay` | 保留，AI 分析 loading |\n| 底部\"暂存列表\"（`_buildStoredResults`） | **升级为页内记录列表区**：按 `drawingKey` 过滤、加小标题、空态文案；条目点击 → 详情弹层（不再跳转独立页） |\n| `_persistResult` / `_deleteStoredResult` | 保留，仅调用时机变化（按钮触发）；entry 新增 `id/drawingKey/worldX/Y/note`；删除仍清 `photo`；恢复/过滤按 `drawingKey` |\n| `VoiceInputSheet` / `VoiceInputButton` | 复用，挂 `_buildNoteField` 语音按钮，结果追加 |\n| `LocalStorage` | 复用；记录文档建议统一为 `capture_records`（多图纸存一文档，列表按 `drawingKey` 过滤），替代原 `_storageKey` |\n| 新：`StoredDetailSheet` | 底部弹层详情（照片+AI+描述+删除），由列表条目点击触发 |\n| `app.dart` | **无需改动**（列表内嵌拍照页，不新增路由） |\n| 转工单 | **不实现**；仅 `defects[].status` 字段预留（恒 `pending`） |\n\n---\n\n## 6. 待确认（已闭合，记录备查）\n\n- ~~「保存记录」是否入库~~ → **不入库**，拍照记录独立。\n- ~~拍照/相册按钮~~ → 单按钮，现状即为平台分流。\n- ~~详情页形式~~ → 底部弹层。\n- ~~语音结果~~ → 追加到 note。\n- ~~记录列表入口~~ → 方案 A（内嵌拍照页，不跳转独立页），并与图纸关联（按 drawingKey 筛选）。\n- ~~多一层处理（转工单）~~ → 本期不实现，仅预留 status 字段。\n"},{"id":"docs/archive/VIDEO_PLAN_0908.md","path":"docs/archive/VIDEO_PLAN_0908.md","url":"ZG9jcy9hcmNoaXZlL1ZJREVPX1BMQU5fMDkwOC5tZA==","base":"VIDEO_PLAN_0908.md","title":"建筑漫游视频制作手册（A/B 两版）2026-09-08","group":"归档 · 拍照验收与报告","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":10287,"chars":6334,"lines":214,"nhead":12,"lead":"方法论来源：skill「建筑漫游AI视频生成」（SkillHub）+ 联网核实的项目真实造型。 核心原则：全部用图生视频（Image-to-Video），真实照片/效果图锁造型，Prompt 只写运动。 参考 DEVELOPMENT_LOG_2026-09-07.md。","text":"# 建筑漫游视频制作手册（A/B 两版）2026-09-08\n\n\u003e 方法论来源：skill「建筑漫游AI视频生成」（SkillHub）+ 联网核实的项目真实造型。\n\u003e **核心原则：全部用图生视频（Image-to-Video），真实照片/效果图锁造型，Prompt 只写运动。**\n\u003e 参考 `DEVELOPMENT_LOG_2026-09-07.md`。\n\n---\n\n## 〇、素材清单（12 张，全部就位）\n\n目录：`F:\\建筑验收工具\\参考照片\\`\n\n### A 版 · 南方科技大学附属医院（校本部）\n| 文件 | 内容 | 用于镜头 |\n|---|---|---|\n| hospital-01-fengding-aerial.jpg | 封顶实景航拍（2025.7） | A1 / A6 |\n| hospital-02-niaokan-render.jpg | 鸟瞰效果图 | A1 / A6 |\n| hospital-03-yugu-tower.jpg | 鱼骨式塔楼 U 形平面 | A2 |\n| hospital-04-menzhen.jpg | 从景观生态面看门诊区域 | A4 |\n| hospital-05-north-south.jpg | 附院与医学院自北向南连续 | A5 |\n| hospital-06-arc-green.jpg | 弧形造型 + 绿色基台 | A3 |\n\n来源：澎湃·蛇口消息报 2025.7.8（蛇口消息报融媒体记者刘野 / 深圳市建筑工务署）\nhttps://m.thepaper.cn/newsDetail_forward_31131175\n\n### B 版 · 腾云中心（腾讯大铲湾 DY04）\n| 文件 | 内容 | 用于镜头 |\n|---|---|---|\n| tengyun-01-overview.jpg | 项目总览（三座圆形云楼） | B1 |\n| tengyun-02-aerial.jpg | 建筑鸟瞰 | B6 |\n| tengyun-03-floating.jpg | 被托离地面（8.6 米架空） | B2 |\n| tengyun-04-bridge.jpg | 钢桁架空中连桥 | B3 |\n| tengyun-05-facade.jpg | 弯弧无框玻璃 + 横向遮阳板 | B4 |\n| tengyun-06-skylight.jpg | 贝壳状天窗（ETFE 膜） | B5 |\n\n来源：谷德 gooood（摄影 © 奥观AOGVISION / 张超 / 朱雨蒙）\nhttps://www.gooood.cn/tencent-dachanwan-by-mad.htm\n\n\u003e ⚠️ 素材仅供内部汇报参考，对外发布注意版权。\n\n---\n\n## 一、A 版 · 南科大附属医院「山水动脉」\n\n**规格**：45s / 1920×1080 / 25fps / MP4 8-12Mbps\n**真实造型锚点**：U 形平面 + 鱼骨式塔楼 ｜ 弧形造型 + 绿色基台 ｜ 视觉健康通廊 ｜ 南北向通廊引大沙河入建筑\n**项目事实**：深圳市建筑工务署 / 盖博建筑（德）+ 深圳华森 / 用地 5.68 万㎡ / 建面 16.76 万㎡ / 800 床 / 2025.6 封顶 / 2027 竣工\n\n| # | 时间 | 参考图 | 画面 | 运镜 |\n|---|---|---|---|---|\n| A1 | 0-6s | hospital-01 / 02 | 大沙河上空鸟瞰，U 形平面 + 鱼骨状塔楼，绿色基台 | 无人机前推+微下俯 |\n| A2 | 6-13s | hospital-03 | 鱼骨状病房翼层层展开，每间病房有景观面 | 缓慢横移 |\n| A3 | 13-20s | hospital-06 | 弧形立面 + 绿色基台，建筑从绿意升起 | 低角度上摇 |\n| A4 | 20-27s | hospital-04 | 视觉健康通廊（东西座 1-2 层），光影通透 | 室内推轨前推 |\n| A5 | 27-34s | hospital-05 | 南北向通廊把大沙河景观引入，框景河景 | 缓慢前推穿廊 |\n| A6 | 34-45s | hospital-01 / 02 | 黄昏鸟瞰，与医学院自北向南如动脉连续 + Slogan | 环绕拉升 |\n\n### 图生视频 Prompt（只写运动，造型由参考图锁定）\n\n**A1 鸟瞰**\n```\n无人机缓慢向前推进，镜头轻微下俯，\n云影在屋面缓慢流动，大沙河水面波光轻微闪烁，\n天光柔和变化，画面平稳无抖动\n```\n`EN: drone slowly pushes forward, slight tilt down, cloud shadows drifting across roofs, river shimmering, soft light transition, smooth stable motion`\n\n**A2 鱼骨塔楼**\n```\n镜头缓慢向右横移，建筑立面光影缓慢移动，\n玻璃幕墙反射天光渐变，近处树影轻微摇曳，\n画面平稳，无变形\n```\n`EN: slow lateral camera pan to the right, light and shadow moving gradually across facade, sky reflection shifting on glass, nearby trees swaying slightly`\n\n**A3 弧形造型 + 绿色基台**\n```\n镜头从绿色基台缓慢上摇至弧形立面，\n前景草叶轻微摆动，光影沿弧面柔和流动，\n建筑体量保持稳定不变形\n```\n`EN: camera slowly tilts up from green podium to curved facade, foreground grass swaying gently, soft light flowing along the curved surface, architecture stays stable`\n\n**A4 视觉健康通廊**\n```\n镜头沿通廊缓慢向前推进，\n自然光影在地面缓慢移动，远处人影缓慢走动，\n室内空气通透，无闪烁\n```\n`EN: camera slowly pushes forward along the corridor, daylight shadows moving slowly on the floor, distant figures walking slowly, bright airy interior`\n\n**A5 南北通廊引景**\n```\n镜头沿通廊缓慢前推，尽头大沙河景致逐渐放大，\n河面波光流动，绿植轻微摇曳，画面平稳\n```\n`EN: camera slowly moves forward through the corridor, river view at the end gradually enlarging, water shimmering, plants swaying gently`\n\n**A6 黄昏收尾**\n```\n镜头缓慢拉升并环绕，天色由金转蓝，\n建筑窗户逐一点亮暖光，河面倒影流动\n```\n`EN: camera slowly rises and orbits, sky shifts from golden to blue, windows lighting up one by one, river reflection flowing`\n\n**Slogan**：`山水动脉 · 临河而治，望水而愈`\n\n---\n\n## 二、B 版 · 腾云中心「漂浮的云」\n\n**规格**：45s / 1920×1080 / 25fps / MP4 8-12Mbps\n**真实造型锚点**：三座圆形云楼 ｜ 10 组落地筒体托起 8.6 米 ｜ 钢桁架空中连桥 ｜ 6 米弯弧无框玻璃 + 横向遮阳板 ｜ 绿毯草坡 ｜ 保留红树林\n**项目事实**：MAD（马岩松/党群/早野洋介）/ 用地 7.2 万㎡ / 建面 41.2 万㎡ / 1.4 万员工 / 80% 工位面海 / 2026.5 建成开放\n\n| # | 时间 | 参考图 | 画面 | 运镜 |\n|---|---|---|---|---|\n| B1 | 0-7s | tengyun-01 | 三座圆形云楼从大铲湾晨雾中浮现，绿毯草坡与红树林岸线 | 无人机前推+微下俯 |\n| B2 | 7-14s | tengyun-03 | 10 组筒体托起建筑，8.6 米架空，超高无肋玻璃，市民穿行 | 缓慢前推 |\n| B3 | 14-21s | tengyun-04 | 钢桁架空中连桥连接三座云楼，观海动线 | 沿连桥横移 |\n| B4 | 21-28s | tengyun-05 | 6 米弯弧无框玻璃反射海天，横向遮阳板顺曲线延伸 | 缓慢横移+微推 |\n| B5 | 28-35s | tengyun-06 | 中庭贝壳状天窗，白色 ETFE 叶片膜，柔和自然采光 | 中庭垂直上摇 |\n| B6 | 35-45s | tengyun-02 | 蓝调时刻，云楼亮灯，前海湾 + Slogan | 环绕拉升 |\n\n### 图生视频 Prompt\n\n**B1 云楼浮现**\n```\n无人机缓慢向前推进，镜头轻微下俯，海面晨雾缓缓流动，\n云影在建筑立面缓慢移动，水面波光轻微闪烁\n```\n`EN: drone slowly pushes forward with slight tilt down, morning sea mist drifting, cloud shadows moving slowly across facades, water shimmering`\n\n**B2 8.6 米架空**\n```\n镜头缓慢向前推进，行人从建筑下方穿行，\n玻璃幕墙反射光影缓慢变化，前景草叶轻微摆动，建筑体量保持稳定不变形\n```\n`EN: camera slowly pushes forward, pedestrians walking beneath the building, light reflections shifting slowly on glass, foreground grass swaying, architecture stays stable`\n\n**B3 钢桁架连桥**\n```\n镜头沿连桥缓慢横移，海面波光流动，\n钢结构阴影随光线缓慢移动，远处云层轻微飘动\n```\n`EN: camera slowly pans along the bridge, sea shimmering, steel shadows shifting gradually, distant clouds drifting slightly`\n\n**B4 弯弧玻璃立面**\n```\n镜头缓慢横移并轻微推进，海天光影在弯弧玻璃上流动，\n遮阳板阴影缓慢变化，建筑曲线保持稳定不变形\n```\n`EN: slow lateral pan with slight push-in, sea and sky light flowing across curved glass, sunshade shadows shifting slowly, curved geometry stays stable`\n\n**B5 贝壳状天窗**\n```\n镜头从中庭缓慢上摇至天窗，\nETFE 膜透光柔和变化，光斑在地面缓慢移动，空间保持稳定\n```\n`EN: camera slowly tilts up from atrium to skylight, soft light filtering through ETFE membrane, light patches moving slowly on floor, geometry stable`\n\n**B6 蓝调收尾**\n```\n镜头缓慢拉升并环绕，天色由金转蓝，\n建筑窗户逐一点亮暖光，海面倒影流动\n```\n`EN: camera slowly rises and orbits, sky shifting from golden to blue, windows lighting up one by one, sea reflection flowing`\n\n**Slogan**：`漂浮的云 · 把地面还给城市`\n\n---\n\n## 三、生成工具参数\n\n| 工具 | 设置 |\n|---|---|\n| **Kling 图生视频**（推荐，中文 Prompt 友好） | 上传参考图 → 运动幅度 **30-40%**（低！防变形）→ 高品质模式 |\n| **Runway Gen-3**（一致性最好） | Image-to-Video → Camera control 手动设运动方向 → Motion **3-4**（低） |\n| 备选 | 即梦 / Seedance 图生视频，运动幅度同样调低 |\n\n**执行纪律**：\n1. 每镜生成 **3 个候选**，挑造型最稳的（建筑不飘、不变形、不闪烁）\n2. 全部镜头**同一工具同一参数**，保证质感统一\n3. 造型失真的候选直接弃用，不要靠后期救\n\n## 四、后期合成\n\n| 环节 | A 版 | B 版 |\n|---|---|---|\n| 调色 | 暖白 + 大沙河绿 + 天光灰蓝；A6 加重金橙 | 冷银蓝 LUT，海天青蓝 + 建筑银白；B6 蓝橙对比 |\n| 音频 | 极简钢琴 + 环境白噪音（鸟鸣/水声）+ 空间混响 | 氛围电子 + 环境白噪音（海浪/风声）+ 空间混响 |\n| 旁白 | 男声沉稳，语速偏慢（ElevenLabs） | 同左 |\n| 转场 | A1→A2 溶解；A3→A4 弧面推入室内匹配转场 | B1→B2 鸟瞰\"下沉\"到架空层匹配转场；其余溶解 |\n| 字幕 | A6 淡入 Slogan | B6 淡入 Slogan |\n\n## 五、质量检查清单\n\n- [ ] 前 3 秒有识别 Hook（A：大沙河鸟瞰 / B：云楼浮出晨雾）\n- [ ] 建筑造型与参考照片**逐帧比对无变形**（最重要）\n- [ ] 全片光照方向一致、色调统一\n- [ ] 运镜全部缓速，无跳帧闪烁\n- [ ] 音频氛围匹配情绪基调\n- [ ] 1080P 起，码率 8-12Mbps\n- [ ] 特效克制，不加粒子/光污染\n\n## 六、执行步骤（操作顺序）\n\n1. 打开 Kling（klingai.com）或 Runway → 选 **Image-to-Video** 模式\n2. 按分镜表逐镜上传参考图 → 粘贴对应 Prompt → 生成 3 个候选\n3. 每镜选定最佳候选，下载保存（命名如 `A1_take2.mp4`）\n4. 6 镜全部完成后 → 剪映/CapCut 按时间轴拼接 → 转场 → 调色\n5. 加音频（Suno AI 生成 BGM / Artlist 选曲）→ 旁白 → Slogan 字幕\n6. 导出 1920×1080 / 25fps → 按质量清单检查 → 成片\n"},{"id":"docs/archive/WIDGET_TEST_ROOM_P2.md","path":"docs/archive/WIDGET_TEST_ROOM_P2.md","url":"ZG9jcy9hcmNoaXZlL1dJREdFVF9URVNUX1JPT01fUDIubWQ=","base":"WIDGET_TEST_ROOM_P2.md","title":"量房段2 · Widget 测试替代截图（交付 CodeBuddy，用户无电脑时的验收替代）","group":"归档 · 拍照验收与报告","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":3192,"chars":1747,"lines":31,"nhead":5,"lead":"背景：段2 动态验收原计划\"人工点 Web 截图 4 张\"；用户下班无电脑 → 改由 widget 测试程序化覆盖手动流程（比截图更能回归）。本文件给出目标与实现口径；若 LocalStorage 无法在测试注入，如实降级并说明，不硬编假结果。 先读：lib/features/room/room_draw_page.d","text":"# 量房段2 · Widget 测试替代截图（交付 CodeBuddy，用户无电脑时的验收替代）\n\n\u003e 背景：段2 动态验收原计划\"人工点 Web 截图 4 张\"；用户下班无电脑 → 改由 **widget 测试程序化覆盖手动流程**（比截图更能回归）。本文件给出目标与实现口径；**若 LocalStorage 无法在测试注入，如实降级并说明**，不硬编假结果。\n\u003e 先读：`lib/features/room/room_draw_page.dart`、`room_records_page.dart`、`lib/core/storage/local_storage.dart`（确认测试环境下的存储实现/Hive 初始化方式）、`test/` 现有测试写法与 pubspec 的 flutter_test。\n\n## 目标行为（对应用户原人工清单）\n1. 成图页可\"点 4 角\"并给出 周长/面积/闭合差；点回起点闭合后闭合差=记录缺口\n2. 双击墙段可加\"门/窗\"洞口（含超范围校验提示）\n3. 保存（≥3 点、闭合差\u003e50 弹确认）→ RoomScanRecord 落库（source='manual'）\n4. 列表页显示该记录（名称/面积/闭合差色标），长按可删\n\n## 测试文件与用例建议（新增 `test/room_draw_flow_test.dart`）\n实现时以\"可跑、不崩、断言关键数值\"为准；页面内部状态为私有 → 通过**手势事件**驱动（tester.tapAt / longPress / doubleTap），坐标注意 InteractiveViewer 变换（进入页 _resetView 后 scale≈0.12+translate(80,80)；画布 8000×8000，屏幕坐标→画布坐标=先平移反算再缩放）。\n\n- T1 空列表态：pump `RoomRecordsPage`（ProviderScope overrides: currentProjectIdProvider='p1'）→ expect 空态文案存在、无异常\n- T2 保存一条：pump `RoomDrawPage(args: RoomScanArgs(projectKey:'p1'))` → 依屏幕坐标 tap 4 个成矩形点（先算好屏幕落点）→ 底部状态条出现 面积≈期望值（容许闭合差逻辑差异）→ 点\"保存\" → 期望 Navigator pop / 或 RoomScanStore.list('p1') 出现 1 条 name='房间'（若 LocalStorage 可用）\n- T3 闭合差确认流：4 点后不点回起点直接保存 → 若缺口\u003e50 期望弹\"闭合差偏大\"对话框\n- T4 洞口校验：双击墙段 → 填 offset+宽 超出墙长 → 期望 danger 提示不崩溃\n- T5 记录卡渲染：预置一条 record（直接构造 RoomScanRecord）→ pump RecordsPage → expect 卡内出现 name 与 '㎡'、闭合差文案\n\n## 关键实现提示\n1. LocalStorage：先读实现；若是 Hive/平台通道，测试需 `TestWidgetsFlutterBinding.ensureInitialized()` 并按现有 mock 通道处理；做不到注入 → 把 T2/T5 降级为\"构造 store 的内存假实现注入\"或在交付说明标注\"无法自动化、仍待人工\"，**不许绕过断言假装通过**\n2. 坐标换算助手：抽一个纯函数（屏幕→画布 mm），在测试里复用与页面相同的 0.12/translate 常量\n3. 每条用例失败时输出实际值便于定位（expect 信息带期望/实际）\n4. 跑完：`flutter test test/room_draw_flow_test.dart` 全绿为通过；`flutter analyze` 0 error\n\n## 交付输出\n1. 新增测试文件与用例清单（各自断言了什么）\n2. flutter test 结果\n3. 若部分用例无法注入/不可测：列出并给出替代（人工项清单），**不伪造**\n"},{"id":"docs/archive/PPT_OUTLINE_0902.md","path":"docs/archive/PPT_OUTLINE_0902.md","url":"ZG9jcy9hcmNoaXZlL1BQVF9PVVRMSU5FXzA5MDIubWQ=","base":"PPT_OUTLINE_0902.md","title":"0902 汇报 PPT 大纲（文字版）","group":"归档 · 需求与汇报","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":1833,"chars":820,"lines":39,"nhead":7,"lead":"## 页1 · 封面 - 标题：0902 设计师需求落实情况汇报 - 副题：AI中心 · 3人组 | 2026-09 - 一句话：7条需求——3条已有、4条3~4天交付、1条待决策","text":"# 0902 汇报 PPT 大纲（文字版）\n\n## 页1 · 封面\n- 标题：0902 设计师需求落实情况汇报\n- 副题：AI中心 · 3人组 | 2026-09\n- 一句话：**7条需求——3条已有、4条3~4天交付、1条待决策**\n\n## 页2 · 已有什么（可直接演示）\n- AI整改建议：识别后自动出整改措施，已进报告\n- 巡场报告：PDF/Word/Excel/HTML 四格式导出，对齐巡场报告单（巡场意见→整改回复→闭合确认）\n- 证据链：照片+坐标+时间+水印，识别附置信度\n- 手机看CAD：DWG→OCF管线已通，7栋10张真实图纸可看\n- 演示点：现场导一份报告\n\n## 页3 · 待补什么（3~4天）\n\n| 事项 | 解决什么 | 天数 |\n|---|---|---|\n| 检查点打卡制 | 地下室无信号也能记点位 | 1 |\n| DWG自助上传 | CAD不用导PDF | 1.5 |\n| 设计师远程处置 | 小问题远程解决、取信甲方 | 0.5 |\n| 施工方App内填整改回复 | 报告发施工方闭环 | 0.5~1 |\n\n## 页4 · 需要领导拍板的3件事\n1. 安卓AR：倾向安卓用照片量尺（国行无谷歌服务，ARCore覆盖有限；华为路线成本高）——还投不投？\n2. 网页协作链接的后端：当前后端在远端服务器、不在工程内——归属与部署预算？\n3. 浩辰转换API授权/配额：DWG上传按次消耗——有没有企业合同？\n\n## 页5 · 结语\n- 需求响应快、已有成果可演示\n- 请领导对3件事拍板 → 我们按优先级开工\n- 红线：AI建议标注\"人工复核\"；网页端/后端能力未做承诺\n\n## 口播提示（每页一句话）\n- P1：七个需求，三个已能演示，四个三到四天出货\n- P2：先看报告导出——这是现成的\n- P3：剩下四块都是纯增量，不碰现有功能\n- P4：这三件事定了，我们就开跑（这页多停留，等领导表态）\n"},{"id":"docs/archive/REPLY_TO_LEADER_0902.md","path":"docs/archive/REPLY_TO_LEADER_0902.md","url":"ZG9jcy9hcmNoaXZlL1JFUExZX1RPX0xFQURFUl8wOTAyLm1k","base":"REPLY_TO_LEADER_0902.md","title":"0902 设计师需求交流 — 落实情况汇报（给领导版）","group":"归档 · 需求与汇报","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":3420,"chars":1522,"lines":48,"nhead":7,"lead":"日期：2026-09  编制：AI中心·3人组","text":"# 0902 设计师需求交流 — 落实情况汇报（给领导版）\n\n日期：2026-09  编制：AI中心·3人组\n\n---\n\n## 一句话结论\n\n0902 提出的 7 条需求，**3 条产品里已有可直接演示，4 条开发 3~4 天可交付，1 条为安卓 AR 调研（需决策）**；另有 2 个依赖后端/浩辰授权的点需要支持。\n\n---\n\n## 一、已具备（可直接演示，无需再等）\n\n| 需求 | 现状 |\n|---|---|\n| 拍照识别 + AI 整改建议 | 识别后自动给\"整改措施\"，已显示在缺陷卡并进报告（模型未返回时本地知识库兜底） |\n| 巡场报告自动生成 | **已支持导出 PDF / Word / Excel / HTML** 四格式，版式对齐 LDI 巡场报告单（巡场意见→整改回复→闭合确认三段式），自动整合现场照片、缺陷清单、销项汇总，可系统分享 |\n| 缺陷证据链（取信甲方基础） | 每条问题带照片/部位/坐标/时间/水印凭证，识别结果附置信度与 AI 判定 |\n| 手机查看 CAD（部分） | DWG→OCF 管线已通，7 栋 10 张真实图纸已转，手机端可看（图层/测量） |\n\n## 二、待开发（4 项，3~4 天，分模块交付）\n\n| 优先级 | 事项 | 解决的需求 | 工作量 |\n|---|---|---|---|\n| P0 | 检查点打卡制：巡场沿路线到点打卡（时间+照片），无信号也能记录，报告含\"达成率\" | 地下室无信号记点位 | 1 天 |\n| P0 | DWG 自助上传：手机/电脑传图纸→自动转 OCF→图纸库即时出现 | CAD 不用导 PDF | 1~1.5 天 |\n| P1 | 设计师远程处置：小问题设计师远程\"已答复/已解决/需到场\"，报告统计\"远程解决 N 条\" | 取信甲方、小问题远程解决 | 0.5~1 天 |\n| P1 | 施工方整改回复入口：施工方在 App 内填整改回复+照片 → 进报告 | 报告发施工方闭环 | 0.5~1 天 |\n\n## 三、需要领导拍板的 3 件事\n\n1. **安卓 AR 量尺**：调研倾向\"安卓以照片量尺为主，真 AR 仅 iPhone Pro（LiDAR）演示\"。国行安卓多数无谷歌服务，ARCore 覆盖有限；华为路线成本高。**是否值得继续投入安卓真 AR？**（可先出 1 页实测报告再定）\n2. **网页协作链接**：把巡场报告/整改回复做成网页链接发给施工方，需要部署后端服务。**当前后端（视觉服务）不在工程内、在远端服务器——请确认后端归属与部署预算**；未确认前先用 App 内闭环 + 报告导出过渡。\n3. **浩辰转换 API**：DWG 自助上传依赖浩辰云转换服务（按次消耗配额）。**确认商用授权与配额来源**（是否已有企业合同）。\n\n## 四、30 秒口播版（开会直接说）\n\n\u003e \"0902 六条需求我们盘过了：**报告导出（PDF/Word/Excel/HTML）、AI 整改建议、证据链**这些已经在产品里，可以演示。还要补四块：**无信号打卡、DWG 手机直接看、设计师远程处置、施工方 App 内回整改**——3 到 4 天能交付。需要您定的三件事：安卓 AR 值不值得继续投、网页链接的后端谁部署、浩辰转换的授权配额有没有。您拍板，我们按优先级开工。\"\n\n---\n\n## 附：口径红线（对外演示/汇报别越界）\n\n1. AI 整改建议标注\"AI 辅助，人工复核\"；不编造规范条文号\n2. \"已具备\"仅指 App 内能力；网页端、后端相关勿承诺\n3. 时间估算是 3 人组工作量；遇后端/授权阻塞会提前上报\n"},{"id":"docs/archive/REQUIREMENTS_0902_IMPL.md","path":"docs/archive/REQUIREMENTS_0902_IMPL.md","url":"ZG9jcy9hcmNoaXZlL1JFUVVJUkVNRU5UU18wOTAyX0lNUEwubWQ=","base":"REQUIREMENTS_0902_IMPL.md","title":"0902 需求 — 现状盘点 + 差距任务实施文档（交付 CodeBuddy）","group":"归档 · 需求与汇报","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":9612,"chars":5404,"lines":113,"nhead":12,"lead":"重要：代码近期迭代很快，动手前必须先读最新文件确认现状，本表标注 ✅已完成 的不再重做；标 ✅部分 的在其基础上叠加；标 ❌ 的为新增。字段类修改全部向后兼容（默认 null/false）。 工作目录：F:\\建筑验收工具\\site-patrol。","text":"# 0902 需求 — 现状盘点 + 差距任务实施文档（交付 CodeBuddy）\n\n\u003e 重要：代码近期迭代很快，**动手前必须先读最新文件确认现状**，本表标注 ✅已完成 的不再重做；标 ✅部分 的在其基础上叠加；标 ❌ 的为新增。字段类修改全部向后兼容（默认 null/false）。\n\u003e 工作目录：`F:\\建筑验收工具\\site-patrol`。\n\n---\n\n## A. 现状盘点（已读代码核实，2026-09 基线）\n\n| 需求 | 状态 | 已存在的代码（文件/要点） | 差距 |\n|---|---|---|---|\n| 1 AI整改意见 | ✅ 部分完成 | `VlDefect/DefectItem/Defect.suggestion`；`core/utils/defect_suggestions.dart` 本地规则库兜底（约11条）；`capture_page` 识别后模型值优先→本地库兜底；缺陷卡显示\"AI整改建议\"；报告含建议 | 本地库词条少；后端是否两段式返回未知 |\n| 3 无信号记点位 | ❌ 未做 | 巡场已建模：`PatrolPlan`(models 1213)/`PatrolRecord`(models 1284)/`PatrolPlanStore` | 无打卡机制（checkins 不存在） |\n| 4 手机看CAD | ✅ 部分 | DWG→OCF 管线与查看器已有（`backend_api.txt` 有 dwgToOcf API；dy7 已转 10 张） | 无\"用户上传DWG→自动转换\"入口 |\n| 5 巡场报告 | ✅ 大部分 | **完整报告生成器**：`weekly_report.dart`/`report_builder.dart`(html)/`report_pdf.dart`/`report_docx.dart`/`report_xlsx.dart`/`report_content.dart`；`defects_page` 导出报告（PDF/Word/Excel/HTML+分享）；版式对齐 LDI 巡场报告单（三段式：巡场意见/整改回复/闭合确认）；`Defect` 已扩：building/importance/reply/replyBy/replyTs/completion/closeNote/suggestion/photoPath | 巡场(PatrolRecord)数据未进报告；网页链接待后端 |\n| 6 施工方协作 | ❌ | `Defect.reply/replyBy/replyTs`（整改回复数据模型已就绪）；报告已含整改回复区 | 无施工方填写入口(UI/网页)；网页链接待后端 |\n| 7 远程解决/取信甲方 | ✅ 部分 | 缺陷证据链字段齐全（照片/坐标/时间/水印哈希）；`Defect.reply` 支持整改回复流；状态机 draft/doing/done/reject | 无\"设计师远程处置\"动作标记与统计 |\n\n---\n\n## B. 实施任务（按优先级）\n\n### 任务1【P0】扩充本地整改建议库（需求1 收尾）\n\n文件：`lib/core/utils/defect_suggestions.dart`\n\n1. 先读现有 `_rules`（约11条：空鼓/裂缝/渗漏/露筋…）\n2. 增补高频缺陷到 **30+ 条**，至少覆盖：结构（蜂窝麻面/孔洞/施工缝渗漏/保护层不足/胀模/错台）、砌筑（灰缝不饱满/通缝/构造柱漏设/拉结筋遗漏）、防水（卷材搭接不足/阴阳角未做附加层/止水带偏位）、装饰（平整度超标/阴阳角不顺直/瓷砖空鼓已覆盖）、机电（套管未封堵/桥架跨接缺失/管道支架间距）\n3. 每条格式照现有 `(keywords, suggestion)`：suggestion 写\"①…②…③…\"分步处置 + 末尾\"处理后报监理/设计复核\"\n4. 验收：`suggestionFor('蜂窝麻面')` 有值；`flutter analyze` 通过\n\n### 任务2【P0】巡场检查点打卡制（需求3）\n\n1. **模型**（先读 `models.dart` 1284 行 `PatrolRecord` 与 `patrol_plan_store.dart`/巡场页现状，若字段已存在则跳过）：\n   ```dart\n   class CheckIn {\n     final int pointIdx;   // 对应 PatrolPlan.points 下标\n     final int tsMs;       // 打卡时间\n     final String? note;   // 备注（可空）\n     // toJson/fromJson\n   }\n   // PatrolRecord 增加: final List\u003cCheckIn\u003e checkins;（默认 const []）\n   ```\n2. **巡场页**（`lib/features/patrol/patrol_page.dart`）：运行中底部操作条加\"到达打卡\"按钮（或长按当前位置=打卡）：\n   - 记录当前所在路线最近检查点下标（按 progress 对应最近 checkpoint，或让用户选）\n   - 打卡成功 → 顶部提示\"已打卡 检查点X/共Y\"；重复打卡同一检查点 → 提示已打过\n   - 完成后 `PatrolRecord.checkins` 存入 `PatrolRecordStore`（照 patrol_plan_store 模式）\n3. **达成率**：完成页/历史详情显示\"打卡 已到 n/m（达成率 xx%）\"，漏检的检查点在路线图上标红\n4. 验收：真机/Web模拟巡场→走2个检查点打卡→完成→历史记录含checkins与达成率；`flutter analyze`+Web构建通过\n\n### 任务3【P0】DWG 自助上传 → OCF 手机查看（需求4）\n\n1. **入口**：`projects_page`（图纸库）或图纸列表页加\"上传DWG\"按钮（iOS/Android选文件用 `file_picker` 或 `image_picker`不支持dwg→用 file_picker 包；Web 用 file 选择器，`file_picker` 支持全平台；若不愿加依赖，Web先支持+移动端用系统\"文件\"选择器）\n2. **流程**：\n   - 选 .dwg → 上传到转换服务（复用 `backend_api.txt` 的浩辰华为云 API：`dwgToOcf` 提交 → 拿 requestId → 轮询 `getTaskStatus` 至 status=2）→ 得 ocfUrl → 落 `server/ocf_cache/` 并登记到项目图纸库（照 `cad_meta_build.py`/`ocf_server.py` 现有逻辑）\n   - 转换中显示进度；失败给可读错误（超时/配额/格式）\n3. **服务端位置**：先确认 Python 服务（`ocf_server.py`/`cad_meta_server.py`）是否在跑、是否有上传端点；没有则新增 `POST /api/upload-dwg`（multipart）→ 调浩辰转换 → 回调/轮询 → 存 ocf_cache → 返回 drawingKey\n4. ⚠️ 商用红线：调用浩辰转换消耗配额，UI 提示\"转换中，约 1-2 分钟\"\n5. 验收：上传1张真实DWG → 图纸库出现 → 手机查看器可打开（图层/测量可用）\n\n### 任务4【P1】设计师远程处置（需求7）\n\n1. **模型**（`Defect` 增加，先读现有字段 363~560 行）：\n   ```dart\n   /// 设计师处置动作：null=未处置 / remoteFix=远程已解决 / remoteConfirm=远程已答复 / onsite=需到场\n   final String? designerAction;  // 'remoteFix'|'remoteConfirm'|'onsite'\n   final String? designerNote;    // 处置说明\n   final String? designerBy;      // 设计师（默认当前用户）\n   final String? designerTs;\n   ```\n2. **缺陷详情页**（`record_detail_page.dart`）加\"设计师处置\"卡（仅设计师身份/当前用户）：\n   - 三个动作按钮：`远程已解决(销项)` / `远程已答复` / `需到场`\n   - 选远程已解决 → 填说明 → status=done、填 designerAction/Note/By/Ts\n3. **列表/筛选**：`defects_page` 筛选项加\"待设计师处置\"（designerAction==null 且 需要处置）；缺陷卡显示设计师处置结果\n4. **报告体现**：report_content/stats 增加\"设计师远程解决 N 条\"，HTML/PDF/DOCX 输出\n5. 验收：处置一条→状态与统计正确→报告含\"N条远程解决\"；字段兼容旧数据\n\n### 任务5【P1】巡场数据进报告 + 施工方回复入口（需求5/6 App 内闭环，网页链接待后端）\n\n\u003e 后端（Express/网页托管）当前目录不存在——**网页链接/施工方网页端一律不做**，先做 App 内闭环，报告照常导出分享。\n\n1. **施工方回复 UI**（利用已有 `Defect.reply/replyBy/replyTs`，目前只有 mock 数据无填写入口）：\n   - `record_detail_page.dart` 加\"整改回复\"卡：施工方角色填 reply（文字）+ 可选整改后照片（复用 image_picker/compress）+ 提交 → 写 reply/replyBy/currentUser/replyTs + status=doing→done（可选\"申请复核\"）\n   - `defects_page` 加筛选项\"待回复\"（reply 为空）\n2. **巡场汇总入报告**：`WeeklyReport`/`report_content.dart` 的板块列表加 `PatrolBlock`（可选）：一次巡场的数据（名称/时间/打卡达成率/里程/问题数）渲染进报告\"巡场记录\"区——若 PatrolRecord 尚未与 WeeklyReport 打通，先做\"周报素材增加巡场小结字段（App内可填）\"，巡场模块稳定后再自动注入\n3. 验收：施工方回复一条→详情显示→导出报告含\"整改回复\"；flutter analyze/Web 构建通过\n\n### 任务6【调研】安卓 AR 量尺调研报告（需求2，只出文档不写功能代码）\n\n产出 `ANDROID_AR_RESEARCH.md`，内容：\n1. ARCore 支持设备清单口径与国行无 GMS 现实（需实测1台有GMS安卓验证 `ar_flutter_plugin_plus` 示例能否跑通与量距精度 ±?）\n2. 华为 AR Engine（HMS）在 Flutter 的实现成本评估（无官方插件→原生插件≈iOS LiDAR 插件工作量）\n3. 结论建议（预计：安卓主路径=照片标定量尺；AR 仅 iOS Pro 展示；若必须安卓真AR，选 ARCore POC 并注明覆盖机型）\n4. 给决策的一句话 + 若立项的排期估算\n\n### 任务7【P2 待后端确认】施工方网页协作链接（需求6 延伸，本期不做代码）\n\n需求确认点：后端部署位置与接口现状 → 再设计：带 token 链接（查看报告/逐条回复/照片上传）。本期只在文档 `REQUIREMENTS_0902_SOLUTIONS.md` 需求5/6 保留设计说明。\n\n---\n\n## C. 全局约束与验收\n\n1. 每任务先读最新文件（models.dart 已到 1355+ 行，字段以现状为准，存在即跳过/叠加，不重复造）\n2. 全部新增字段向后兼容（fromJson 默认 null/false/[]）\n3. 分任务交付：每任务 `flutter analyze` 无新增 error + Web 构建通过 + 输出改动清单\n4. 不碰与任务无关的功能；不动 AR/iOS 原生（除非任务3涉及后端 Python 服务）\n5. 后端（Express/网页）未确认前不做网页链接；改 Python 服务前先确认运行方式（`_start_server.py`/各 server 启动脚本）\n\n## D. 交付顺序建议\n\n任务1（半小时）→ 任务2（1天）→ 任务3（1~1.5天）→ 任务4（0.5~1天）→ 任务5（0.5~1天）→ 任务6 调研文档（并行产出）→ 任务7 待后端\n"},{"id":"docs/archive/REQUIREMENTS_0902_SOLUTIONS.md","path":"docs/archive/REQUIREMENTS_0902_SOLUTIONS.md","url":"ZG9jcy9hcmNoaXZlL1JFUVVJUkVNRU5UU18wOTAyX1NPTFVUSU9OUy5tZA==","base":"REQUIREMENTS_0902_SOLUTIONS.md","title":"0902 需求交流 — 解决方案映射（交付 CodeBuddy）","group":"归档 · 需求与汇报","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":7950,"chars":4027,"lines":121,"nhead":10,"lead":"背景：结构设计师反馈 6+1 条需求。本文件把每条需求映射到现有代码资产，给出解决方向与实现任务。 现状盘点结论（已读代码）： - 拍照识别已接 qwen3.8-max 视觉模型（vision_service.dart），缺陷模型 VlDefect{name,severity,conf,desc}、Defect{...","text":"# 0902 需求交流 — 解决方案映射（交付 CodeBuddy）\n\n\u003e 背景：结构设计师反馈 6+1 条需求。本文件把每条需求映射到**现有代码资产**，给出解决方向与实现任务。\n\u003e 现状盘点结论（已读代码）：\n\u003e - 拍照识别已接 qwen3.8-max 视觉模型（`vision_service.dart`），缺陷模型 `VlDefect{name,severity,conf,desc}`、`Defect{...status,resp,...}`\n\u003e - 巡场改造已有完整规划：`PATROL_MASTER_PLAN.md`（PatrolPlan/PatrolRecord/编辑器/GPS/历史）\n\u003e - 图纸管线已通：DWG → 浩辰云图转 OCF → 查看器；dy7 有 10 张已转 OCF\n\u003e - ⚠️ **后端 Express（backend/server.js，/api/vision、/api/weather）在当前代码目录中已不存在**——视觉/天气走远端（vi
