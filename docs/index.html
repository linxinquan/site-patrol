<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="vF76zB9SNPEZk7CxjElDJl">
<head data-page-node-id="YLE64PLu79CHhdwhImPLDl">
<meta charset="utf-8" data-page-node-id="yAz5vKHGaVS3nGw0gxCRfo">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="Shexr3B1plW3qZCeXxzNFX">
<title>蓝图落地 · 文档中心</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfbfc; --border:#e5e7eb; --border2:#eef0f3;
  --text:#1b1f24; --text2:#3d444d; --muted:#6d7680; --faint:#98a1ab;
  --accent:#2c6bed; --accent2:#eaf1fe; --code-bg:#f4f5f7; --code-bd:#e8eaed;
  --warn-bg:#fff8ec; --warn-bd:#f0d9a8; --ok:#1a7f4b;
  --r:9px; --fs:15px; --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:var(--fs)/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}

/* ---------- 布局 ---------- */
.shell{display:grid;grid-template-columns:296px minmax(0,1fr);height:100vh;overflow:hidden}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--border2)}
.brand h1{margin:0;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand h1 span.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.brand .sub{margin-top:5px;font-size:11.5px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap}
.searchwrap{padding:10px 12px 8px;position:relative}
.searchwrap .ico{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:12px;pointer-events:none}
#q{width:100%;padding:7px 28px 7px 30px;border:1px solid var(--border);background:var(--panel2);
   border-radius:8px;font-size:13px;color:var(--text);outline:none}
#q:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent2)}
.searchwrap .clr{position:absolute;right:20px;top:50%;transform:translateY(-50%);border:0;background:none;
   color:var(--faint);cursor:pointer;font-size:14px;line-height:1;padding:2px;display:none}
.chips{display:flex;gap:6px;padding:2px 12px 10px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--panel2);color:var(--text2);border-radius:20px;
   padding:3px 10px;font-size:11.5px;cursor:pointer;user-select:none}
.chip:hover{border-color:#cfd6e0}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tree{overflow-y:auto;flex:1;padding:0 8px 28px;min-height:0}
.tree::-webkit-scrollbar,.content::-webkit-scrollbar,.toc::-webkit-scrollbar{width:9px}
.tree::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.toc::-webkit-scrollbar-thumb{
   background:#d8dce2;border-radius:9px;border:2px solid var(--panel)}
.grp{margin-top:10px}
.grp>.gh{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11.5px;font-weight:600;
   color:var(--muted);letter-spacing:.4px;cursor:pointer;user-select:none;border-radius:6px}
.grp>.gh:hover{background:var(--panel2)}
.grp>.gh .cnt{color:var(--faint);font-weight:400;margin-left:auto;font-size:11px}
.grp>.gh .cv{color:var(--faint);font-size:9px;transition:transform .15s}
.grp.closed>.gh .cv{transform:rotate(-90deg)}
.grp.closed>.gi{display:none}
.gi{display:block;padding:5px 9px 5px 14px;border-radius:6px;color:var(--text2);font-size:13px;
   cursor:pointer;border-left:2px solid transparent;line-height:1.45}
.gi:hover{background:var(--panel2);color:var(--text)}
.gi.on{background:var(--accent2);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.gi .meta{display:block;font-size:10.5px;color:var(--faint);margin-top:1px;font-weight:400}
.gi.on .meta{color:#7b9bd8}
.empty-tip{padding:18px 14px;color:var(--faint);font-size:12.5px;line-height:1.7}

/* ---------- 主体 ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 226px;
  grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
.content{grid-column:1;grid-row:2;overflow-y:auto;padding:0 0 80px;min-height:0;position:relative}
.cbar{grid-column:1;grid-row:1;z-index:5;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);
   border-bottom:1px solid var(--border);padding:9px 34px;display:flex;align-items:center;gap:10px;
   font-size:11.5px;color:var(--muted);min-height:42px}
.cbar .path{font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .sp{flex:1}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text2);border-radius:6px;
   padding:3px 9px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfd6e0;background:#fff;color:var(--text)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.inner{max-width:820px;margin:0 auto;padding:30px 34px 0}
.hero{padding:34px 34px 6px;max-width:1000px;margin:0 auto}
.hero h2{margin:0 0 6px;font-size:26px;letter-spacing:-.2px}
.hero p.lead{margin:0;color:var(--muted);font-size:13.5px;max-width:640px;line-height:1.8}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:24px 0 4px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card .n{font-size:22px;font-weight:700;letter-spacing:-.5px}
.card .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.card.accent .n{color:var(--accent)}
.cmdbar{margin:18px 0 4px;background:var(--panel);border:1px solid var(--border);
   border-left:3px solid var(--accent);border-radius:var(--r);padding:13px 17px 14px}
.cmdbar .cb-t{font-size:12.5px;color:var(--text2);font-weight:600;margin-bottom:9px}
.cmdbar .cb-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cmdbar code.cmd{background:var(--code-bg);border:1px solid var(--code-bd);border-radius:6px;
   padding:5px 11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
   font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap}
.cmdbar code.cmd:hover{border-color:var(--accent);background:var(--accent2)}
.cmdbar .cp{cursor:pointer;font:inherit;font-size:11.5px;color:var(--accent);background:var(--accent2);
   border:1px solid #cfe0fd;border-radius:6px;padding:4px 10px}
.cmdbar .cp:hover{background:#dfeafd}
.cmdbar .cb-n{font-size:11.5px;color:var(--faint);margin-top:9px;line-height:1.95}
.cmdbar .cb-n code{background:var(--code-bg);border:1px solid var(--code-bd);border-radius:4px;
   padding:1px 5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.6px;margin:34px 0 12px;
   padding-bottom:7px;border-bottom:1px solid var(--border)}
ul.recents{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
ul.recents li{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
   padding:10px 15px;cursor:pointer;transition:.12s}
ul.recents li:hover{border-color:#c9d4e6;box-shadow:var(--shadow);transform:translateY(-1px)}
ul.recents .r1{display:flex;align-items:baseline;gap:10px}
ul.recents .t{font-size:13.5px;font-weight:600;flex:1 1 auto;min-width:0;line-height:1.5}
ul.recents .dt{font-size:11px;color:var(--faint);flex:none;font-family:ui-monospace,monospace;
   max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.recents .d{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;
   text-overflow:ellipsis;white-space:nowrap}
.hints{margin-top:26px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;font-size:12.5px;color:var(--muted);line-height:1.9}
.hints b{color:var(--text2)}
kbd{background:var(--code-bg);border:1px solid var(--code-bd);border-bottom-width:2px;border-radius:4px;
   padding:0 5px;font-size:11px;font-family:ui-monospace,monospace;color:var(--text2)}

/* ---------- 正文排版 ---------- */
.doc-h{max-width:820px;margin:0 auto;padding:0 34px}
.doc-title{margin:26px 0 4px;font-size:25px;line-height:1.35;letter-spacing:-.3px}
.doc-sub{color:var(--faint);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap;padding-bottom:16px;
   border-bottom:1px solid var(--border);font-family:ui-monospace,Menlo,monospace}
.md{max-width:820px;margin:0 auto;padding:0 34px}
.md h1{font-size:21px;margin:32px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border2)}
.md h2{font-size:18px;margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border2)}
.md h3{font-size:15.5px;margin:26px 0 10px}
.md h4{font-size:14px;margin:20px 0 8px;color:var(--text2)}
.md h5,.md h6{font-size:13px;margin:16px 0 6px;color:var(--muted)}
.md p{margin:11px 0}
.md ul,.md ol{margin:10px 0;padding-left:24px}
.md li{margin:5px 0}
.md li>ul,.md li>ol{margin:4px 0}
.md hr{border:0;border-top:1px solid var(--border);margin:26px 0}
.md blockquote{margin:14px 0;padding:10px 16px;background:#f8fafc;border-left:3px solid #cdd8e8;
   border-radius:0 7px 7px 0;color:var(--text2)}
.md blockquote p{margin:5px 0}
.md blockquote blockquote{background:#f2f5f9}
.md code.ic{background:var(--code-bg);border:1px solid var(--code-bd);border-radius:4px;padding:1px 5px;
   font-size:.88em;color:#9c3d1e;cursor:pointer}
.md code.ic:hover{background:#efe1da;border-color:#e2c9bd}
.md a.doclink{background:var(--accent2);border:1px solid #cfe0fd;border-radius:4px;padding:1px 6px;
   font-size:.88em;font-family:ui-monospace,monospace;color:#1c56c9;white-space:nowrap}
.md a.doclink:hover{background:#dbe8fe;text-decoration:none}
.md a.doclink::after{content:" →";font-size:.85em;opacity:.65}
.md pre.code{background:#fbfbfc;border:1px solid var(--code-bd);border-radius:8px;margin:14px 0;
   overflow:hidden;position:relative}
.md pre.code .cbar2{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#f4f5f7;
   border-bottom:1px solid var(--code-bd);font-size:10.5px;color:var(--faint);letter-spacing:.4px}
.md pre.code .cbar2 .cp{margin-left:auto;cursor:pointer;color:var(--faint)}
.md pre.code .cbar2 .cp:hover{color:var(--accent)}
.md pre.code code{display:block;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.62;
   color:#2f3742;white-space:pre;tab-size:2}
.md table{border-collapse:separate;border-spacing:0;width:100%;margin:15px 0;font-size:12.8px;
   display:block;overflow-x:auto;max-width:100%}
.md table th,.md table td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.md table th{background:#f4f6f9;font-weight:600;color:var(--text2);white-space:nowrap}
.md table tr:nth-child(even) td{background:#fcfcfd}
.md strong{font-weight:650;color:#11151a}
.md del{color:var(--faint)}
.md .task li{list-style:none;margin-left:-18px}
.md .task input{margin-right:6px}
.md .h-anchor{scroll-margin-top:14px}
.headmark{opacity:0;margin-left:8px;font-size:.62em;color:var(--faint);text-decoration:none;font-weight:400}
.md h1:hover .headmark,.md h2:hover .headmark,.md h3:hover .headmark,.md h4:hover .headmark{opacity:1}

/* ---------- 右侧目录 ---------- */
.toc{grid-column:2;grid-row:1/3;border-left:1px solid var(--border);background:var(--panel);
   overflow-y:auto;padding:20px 10px 40px 14px;min-height:0}
.toc .th{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.6px;margin:0 0 8px;padding-left:8px}
.toc a{display:block;font-size:11.8px;color:var(--muted);padding:3px 8px;border-radius:5px;
   border-left:2px solid transparent;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc a:hover{background:var(--panel2);color:var(--text);text-decoration:none}
.toc a.lv2{padding-left:8px}
.toc a.lv3{padding-left:20px;font-size:11.4px}
.toc a.lv4{padding-left:32px;font-size:11px;color:var(--faint)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent2);font-weight:600}
.toc .none{font-size:11.5px;color:var(--faint);padding-left:8px}

/* ---------- 搜索结果 ---------- */
.sres{max-width:900px;margin:0 auto;padding:26px 34px 0}
.sres .sh{font-size:13px;color:var(--muted);margin-bottom:14px}
.sres .sh b{color:var(--text);font-size:15px}
.hit{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px 17px;
   margin-bottom:10px;cursor:pointer}
.hit:hover{border-color:#c9d4e6;box-shadow:var(--shadow)}
.hit .ht{font-size:14px;font-weight:650;margin-bottom:3px}
.hit .hp{font-size:11px;color:var(--faint);font-family:ui-monospace,monospace;margin-bottom:8px}
.hit .hs{font-size:12.5px;color:var(--text2);background:var(--panel2);border-radius:6px;padding:7px 10px;
   line-height:1.7;word-break:break-word}
.hit mark{background:#fff2ba;color:#7a4a00;border-radius:3px;padding:0 2px}
.progress{position:sticky;top:0;height:2px;background:transparent;z-index:9}
.progress i{display:block;height:2px;background:var(--accent);width:0}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);background:#1b1f24;
   color:#fff;font-size:12.5px;padding:8px 16px;border-radius:20px;opacity:0;transition:.2s;
   pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.menubtn{display:none;border:1px solid var(--border);background:var(--panel);border-radius:6px;
   padding:3px 9px;font-size:11.5px;cursor:pointer}
.scrim{display:none}
.note{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:8px;padding:11px 14px;
   font-size:12.3px;color:#8a5a12;margin:16px 0;line-height:1.75}

@media(max-width:1240px){ .main{grid-template-columns:minmax(0,1fr)} .toc{display:none} }
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:296px;z-index:40;transform:translateX(-100%);
     transition:transform .18s;box-shadow:0 0 40px rgba(0,0,0,.14)}
  body.menu .sidebar{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(16,24,40,.28);z-index:39}
  .menubtn{display:inline-block}
  .inner,.md,.doc-h,.hero,.sres{padding-left:18px;padding-right:18px}
}
@media print{
  .sidebar,.toc,.cbar,.menubtn,.progress{display:none!important}
  .shell,.main{display:block!important;height:auto!important;overflow:visible!important}
  .content{overflow:visible!important}
  body{background:#fff}
}
</style>
</head>

**设计院视角的现场数据闭环工具**（Flutter，iOS / Android / Web）：\n现场取证 → 问题判定与闭环 → 巡检留痕 → 实测校核 → 报告交付 → 知识回流。\n\n闭环主线：\n```\n拍照验收(AI识别)  →  问题清单(责任判定/整改回复/销项)  →  报告导出(HTML/PDF/DOCX/XLSX)\n      ↑                                                        ↑\n   巡场(路线/打卡/GPS)          照片量尺 · AR量尺 · 量房成图(实测校核)\n```\n\n**当前定性**：客户端闭环已跑通（可演示）；数据以**本地存储 + mock 种子**为主；线上后端**只有 1 个接口** `/api/vision`；CAD 链路已判废案待剥离；团队正在做**减法**（本轮删减已留痕，见 §4 第 10 条）。\n\n---\n\n## 1. 状态图例\n\n| 标记 | 含义 |\n|---|---|\n| ✅ | 已闭环：代码完整、可跑通、可演示 |\n| 🟡 | 部分/受限：主体在，但依赖真机、外部服务，或已降级 |\n| 🔴 | 未完成/占位：UI 在但逻辑为空、写死或 mock |\n| ⛔ | 判废 / 冻结 / 待剥离 |\n\n---\n\n## 2. 功能全景（11 个模块）\n\n### M1 账号、身份与引导\n\n| # | 功能点 | 状态 | 入口/路由 | 关键证据 |\n|---|---|---|---|---|\n| 1.1 | 开屏登录页（点「开始使用」即登录，写死 demo 用户） | 🔴 | `/login` | `features/auth/login_page.dart:25-34` |\n| 1.2 | 引导第 1 步：选择身份（4 个 mock 用户） | 🟡 | `/onboard` | `onboard_page.dart:42-47` |\n| 1.3 | 引导第 2 步：选择项目 | ✅ | `/onboard/project` | `onboard_project_page.dart:43-50` |\n| 1.4 | 路由守卫（未登录→login；未引导→onboard；已登录在 login→跳转） | ✅ | 全局 | `app.dart:43-61` |\n| 1.5 | 会话持久化（已按 JWT 建模 token/refresh/expiresAt，但无真实鉴权） | 🟡 | — | `core/storage/session_store.dart:9-59` |\n| 1.6 | 切换身份 / 切换项目 / 退出登录 | ✅ | 个人中心侧边栏 | `shared/widgets/profile_drawer.dart`、`user_switcher.dart` |\n| 1.7 | 「添加更多账号 / 帮助 / 设置」 | 🔴 | 侧边栏 | `profile_drawer.dart:409-429`（仅提示\"敬请期待\"） |\n\n\u003e 结论：**整条账号线是演示态**。真实登录是后端重建方案中的客户端改造项之一。\n\n---\n\n### M2 项目与图纸\n\n| # | 功能点 | 状态 | 入口/路由 | 关键证据 |\n|---|---|---|---|---|\n| 2.1 | 项目列表 / 切换（2 个种子项目：南科大附院 `nkf`、腾讯大铲湾 DY04·7栋） | ✅ | `/home` 顶部 | `mock/mock_data.dart:35-89`、`project_switcher.dart` |\n| 2.2 | 楼层 + 图纸目录（各 11 张） | ✅ | `/projects` | `projects_page.dart` |\n| 2.3 | 图纸查看：缩放 / 平移 / 复位 | ✅ | `/projects/drawing/:key` | `drawing_viewer_page.dart` |\n| 2.4 | 热点跳转 + 长按锚定 | ✅ | 同上 | `drawing_viewer_page.dart:1174-1238` |\n| 2.5 | 坐标校准（内置种子 / 轴网交点自动套图 / 图上多点最小二乘 / 粘贴 JSON / 清除） | ✅ | 校准弹窗 | `drawing_viewer_page.dart:190-283, 496-720` |\n| 2.6 | 图上打点 → 直接创建缺陷 + 图钉标记 | ✅ | 图纸长按/点选 | `drawing_viewer_page.dart:785-965` |\n| 2.7 | 上传 DWG（Web 自实现选择器；**移动端选择器已冻结返回 null**） | ⛔ 迁移 TODO | `/projects` | `_dwg_picker_io.dart:3-7`、`cad_service.dart:190-207`；**后续随 CAD 剥离迁往独立 Web 项目，本仓库不再投入** |\n| 2.8 | 导入图纸（PDF / JPG / PNG） | 🔴 | `/projects` | `projects_page.dart:189-191`（仅弹提示，未解析） |\n| 2.9 | 矢量看图（浩辰 OCF，仅 Web 外链新窗口） | ⛔ | 工具条 | `drawing_viewer_page.dart:353-406`；随 CAD 剥离 |\n| 2.10 | 蓝图原稿页（3 张预置 PNG，非真实 PDF 渲染） | 🟡 | `/blueprint` | `blueprint_viewer_page.dart` |\n| 2.11 | 图层 / 布局面板（需真实 DWG 数据源） | 🔴 | 图纸工具条 | `cad_info_panel.dart:64-82` |\n\n\u003e **红线**：`2.5 / 2.6`（CAD **坐标系**能力）虽属 CAD 相关，但**必须保留**，它支撑「图纸打点定位 / 量尺图纸侧取值 / 巡场防穿墙」三条主功能；`2.7/2.9`（CAD **渲染转换看图**）随新网页版 CAD 项目剥离。\n\n---\n\n### M3 拍照验收（核心主链）\n\n\u003e 详细流程、数据契约与偏离清单见 **`docs/specs/CAPTURE_FLOW.md`**（2026-09-18，含 18 条偏离 + 8 条有意设计）。\n\n| # | 功能点 | 状态 | 关键证据 |\n|---|---|---|---|\n| 3.1 | 三步流程：选图纸部位 → 现场拍照 → AI 识别并保存 | ✅ | `capture/capture_page.dart`（两阶段 `select`/`operate`） |\n| 3.2 | 楼层选择 + 图上选点 + 附近定位选择（点位写入水印 GPS/海拔） | ✅ | `capture_page.dart:2860` |\n| 3.3 | 真实相机（移动端相机 + 权限引导 + 相册兜底；Web 走相册选图） | ✅ | `capture_page.dart:532-552` + `core/utils/camera_pick.dart` |\n| 3.4 | 防篡改水印烧录（信息栏 + 全图斜水印 + 图纸坐标 + 凭证号 + 哈希） | ✅ | `core/utils/photo_watermark.dart:58-165` |\n| 3.5 | AI 缺陷识别（qwen3.8-max，`POST /api/vision`） | 🟡 | `vision_service.dart:107`；Web 走 `vlPreset` mock，真机走真实 |\n| 3.6 | 结果区 4 段：缺陷识别 / 量尺校对 / 问题描述 / 拍照记录 | ✅ | `capture_page.dart:95, 1531` |\n| 3.7 | 量尺校对（图纸侧 vs 照片侧，双容差 ±10mm/±5%） | ✅ | `capture_page.dart:2441` |\n| 3.8 | 问题描述：手打 + 语音追加 | ✅ | `capture_page.dart:123`、`speech_recognizer.dart` |\n| 3.9 | 保存记录（可继续验收 / 查看记录） | ✅ | `capture_page.dart:3128-3195` |\n| 3.10 | 验收记录工作台：统计条 + 时间/楼层/仅 AI 筛选 + 分组网格 + 详情 + 批量转问题清单 + 删除 | ✅ | `capture_records/capture_records_page.dart`、`capture_records_controller.dart` |\n| 3.11 | 本地存储 `stored_vision_results` | 🟡 | Web 端 File 走内存，**刷新即丢** |\n\n\u003e 已知降级：AI 未返回严重程度 → 统一默认 `orange`（`capture_page.dart:805-806`）；类头注释「真实相机已注释」**已过期**（实际已接真机相机）。\n\n---\n\n### M4 问题清单与闭环（核心主链）\n\n rage 持久化 + 350ms 假延迟） | ✅ | `mock_repository.dart`（命名属历史遗留） |\n| 10.3 | `RemoteRepository`（仅 `saveMeasurement`/`getMeasurement`，其余 12 方法 `throw UnimplementedError`） | 🔴 | `remote_repository.dart:52-90` |\n| 10.4 | 数据源开关 | 🟡 | `providers.dart:26-28`；`Env.isProd ? Remote : Mock`（默认 dev→Mock） |\n| 10.5 | 视觉服务 `POST /api/vision`（外挂 Express，`120.24.240.129:3000`，qwen3.8-max） | ✅ | `vision_service.dart:84-183` |\n| 10.6 | CAD 服务（浩辰云图 `:8800` + 本地 ODA/ezdxf） | ⛔ | `cad_service.dart`；`server/ocf_server.py` 正在清理（本次已删 141 行） |\n| 10.7 | 量尺落库服务 `measure_server.py`（`:8820`，从未上线） | 🔴 | `server/measure_server.py`；且 Flutter 默认 host 指向 `:3000`（**端口不一致**） |\n| 10.8 | 后端重建方案（FastAPI + PostgreSQL + Redis + COS，离线优先 + SyncEngine/outbox） | ⛔ | `BACKEND_ARCHITECTURE.md`（2026-09-17 设计定稿，**待实施**） |\n\n**客户端实际请求的外部地址（技术债：3 个硬编码 host）**\n\n| 服务 | 配置项 | 默认值 |\n|---|---|---|\n| CAD / 底图 PNG / SVG | `CAD_HOST` | `http://localhost:8800` |\n| 视觉识别 | `VISION_HOST` | `http://120.24.240.129:3000` |\n| 量尺落库 | `MEASURE_HOST` | `http://120.24.240.129:3000` |\n\n---\n\n### M11 基础设施\n\n| # | 能力 | 状态 | 关键证据 |\n|---|---|---|---|\n| 11.1 | 本地存储抽象（IO：secure_storage + Hive + 文件；Web：localStorage + **内存文件**） | 🟡 | `core/storage/local_storage.dart`、`app_storage_io/web.dart` |\n| 11.2 | 语音输入（设备端离线 ASR，中文） | ✅ | `speech_recognizer.dart`、`voice_input.dart` |\n| 11.3 | 水印 + SHA256/MD5（isolate） | ✅ | `photo_watermark.dart` |\n| 11.4 | 图片压缩（isolate） | ✅ | `image_compress.dart` |\n| 11.5 | 报告分享 / 下载（三分支） | ✅ | `report_share.dart`、`report_export.dart` |\n| 11.6 | 离线提示条 | 🟡 | `offline_bar.dart`（静态文案） |\n| 11.7 | 设计令牌 / 主题 / MiSans 字体 | ✅ | `core/theme/`、`DESIGN_TOKENS.md` |\n| 11.8 | 相机取图工具 `pickPhotoRobust`（权限引导 + 相册兜底） | ✅ | `core/utils/camera_pick.dart` |\n| 11.9 | 环境变量（`ENV` / 4 个 dart-define） | ✅ | `core/env/env.dart` |\n\n---\n\n## 3. 本地存储 Key 清单（数据事实源）\n\n| Key | 内容 | 写入方 |\n|---|---|---|\n| `stored_vision_results` | 拍照验收记录（AI 结果 + 照片） | `capture_page.dart` / `capture_records_controller.dart` |\n| `added_defects_v1` | 运行期新增缺陷 | `mock_repository.dart` |\n| `measure:\u003cproject\u003e:\u003cdrawing\u003e` | 量尺会话 | `measure_store.dart` |\n| `measure_thresholds_v1:\u003cproject\u003e` | 判定门槛 | `measure_threshold_store.dart` |\n| `room_scan_v1_\u003cproject\u003e` | 量房记录 | `room_scan_store.dart` |\n| `patrol_plans_v1_\u003cproject\u003e` | 巡场路线 | `patrol_plan_store.dart` |\n| `patrol_records_v1_\u003cproject\u003e` | 巡场记录 | `patrol_record_store.dart` |\n| `report_records_v1_\u003cproject\u003e` | 报告归档元数据 | `report_record_store.dart` |\n| `cad_calib_v3_\u003cdrawing\u003e` / `cad_calib_library_v1` | 图纸校准 | `cad_calibration.dart` |\n| `ar_scale_calib_v1` | AR 尺度校正 | `ar_scale_calibration.dart` |\n| `uploaded_drawings_v1_\u003cproject\u003e` | 上传图纸登记 | `uploaded_drawing_store.dart` |\n\n\u003e ⚠️ 这些 Key **互不连通**，是否同步到后端、如何同步，目前**无任何设计**。\n\n---\n\n## 4. 关键发现（功能漂移与风险）\n\n1. **两条平行的\"记录→清单\"通路**：验收记录（`stored_vision_results`）与问题清单（`Defect`）是两套数据，靠「转入问题清单」手工转换；报告归档又是第三套元数据。三套之间无统一 ID 链。\n2. **数据来源三重分裂**：默认走本地 Mock、真机走真实视觉模型、CAD 走另一个外部服务；三个 host 各自硬编码，且量尺 host 端口与服务实现**不一致**。\n3. **后端处于\"已判废 → 待重建\"中间态**：`server/` 正在被清理，但客户端 `cad_service.dart`、`uploaded_drawing_store.dart`、`remote_repository.dart` 仍在工程内。\n4. **\"想到就加\"的实锤**：首页快捷操作曾达 **9 个入口**（图纸管理 / 问题清单 / 语音记录 / 图层索引 / PDF 原稿 / 量房…），现被砍到 **5 个**；天气模块（模型 + provider + banner）整块删除；语音记录独立页删除。**收敛正在进行，但没有文档记录\"为什么砍\"**，易被下一轮重复加回。\n5. **精度口径不统一**：拍照量尺 / AR 已接入项目级门槛，**量房核尺写死 15mm/2%**，同一份报告里两种判定口径并存。\n6. **巡场三处\"半接线\"**：GPS 只算里程不上图、`issueCount` 恒 0、历史轨迹读写字段不一致（轨迹退化到原点）。\n7. **文档与代码互相打脸**：`BACKEND_ARCHITECTURE.md` 称 `remote_repository.dart`「已删除」——实际仍在；称天气已拆成 `server/weather_server.py`——**该文件不存在**；`capture_page.dart` 类注释称相机已注释——**实际已接真机相机**。\n8. **平台能力矩阵先天不齐**（同一功能各端可用性不同，需在验收标准里写清）：\n   - AR 量尺：仅 iOS 真机\n   - 矢量看图 / DWG 上传：仅 Web\n   - Web 文件存储：刷新即丢\n   - 报告导出：Web 下载 / 移动分享 / 桌面落盘\n9. **非产品产物混入功能文档体系**：`VIDEO_PLAN_0908.md`（建筑漫游 AI 视频制作手册）、`PPT_OUTLINE_0902.md`、`REPLY_TO_LEADER_0902.md`、`email_drafts/` 属**对外汇报素材**，不是 App 功能。（2026-09-18：前三份已随本轮归档至 `docs/archive/`）\n\n10. **本轮已下线的功能（未提交改动，必须留痕）**——此前\"想到就加\"的入口正在被剪除，但没有记录\"砍了什么、为什么砍\"，极易被下一轮重复加回：\n\n| 被下线项 | 原入口 | 处置 | 影响 / 说明 |\n|---|---|---|---|\n| 天气（`WeatherInfo`/`WeatherWarning` 模型 + `weatherProvider` + 首页预警 banner） | 首页置顶 | **整块删除** | 无残留引用；但 `CAD_MIGRATION_BACKUP.md` §4 仍写\"天气已拆为独立服务且保留\"，**与代码不符，执行迁移前必须先修正** |\n| 语音记录独立页 | 首页快捷操作 → `/voice-records` | **页面 + 路由双双删除**（`voice_records_page.dart` 已删） | 语音**输入**能力保留（验收页问题描述仍用 `VoiceInputButton`） |\n| 首页快捷操作 9 个 → 5 个 | 首页 | 删除：图纸管理、问题清单、语音记录、图层索引、PDF 原稿、量房 | 图纸 / 问题清单仍有底部导航 tab，**属去重**；**量房为唯一入口，删除后成孤儿**（见 M9 模块定位） |\n| CAD 服务端 `server/ocf_server.py` | — | 本轮删除 141 行 | CAD 剥离已启动，但客户端 `cad_service.dart` / `uploaded_drawing_store.dart` 仍在（见 §4 第 3 条） |\n\n11. **三套「记录 → 清单 → 归档」数据互不连通**（结论见 §6 第 3 条）：\n   - 验收记录 `stored_vision_results`、问题清单 `added_defects_v1` + 种子、报告归档 `report_records_v1_\u003cproject\u003e` 三套独立存储；\n   - 仅「验收 → 缺陷」有**弱关联**（`Defect.sourceCaptureId` + 验收侧 `converted` 标记，`capture_records_controller.dart:279`）；\n   - 报告归档**只存统计数字**，既无法回答\"这份报告包含哪些问题\"，也无法复现同一份报告。\n\n---\n\n## 5. 功能边界建议（**待你拍板，非既成事实**）\n\n### 建议保留（主线，投入优先级最高）\n- 拍照验收 → 问题清单闭环 → 报告四端\n- 巡场（路线 / 打卡 / 报告归档）\n- 照片量尺校对（含 CAD 坐标系能力）\n- AR 量尺（真机已通过，继续开发）\n\n### 建议降级为\"演示可用、不做真机投入\"\n- 量房成图（手动打点保留；RoomPlan 待 iPhone Pro 真机到位再评估）\n\n### 建议剥离 / 移出本仓库\n- CAD 渲染 / 转换 / 看图（浩辰 OCF、GStarSDK、ODA/ezdxf、DWG 上传预览）→ 新网页版 CAD 项目\n- **保留** CAD 坐标系能力（屏幕像素↔图纸 mm、校准、轴网、墙线）\n\n### 建议明确暂停（避免被重新加回）\n- 天气 / 语音记录页 / PDF 原稿 / 图层索引 / 导入 PDF 图纸\n\n### 待建（后端线，独立排期）\n- 真实登录与权限（权限点而非角色）\n- 后端服务 + 离线优先同步（SyncEngine / outbox）\n\n---\n\n## 6. 下一步\n\n1. ~~确认模块划分与状态标记~~ ✅ **已完成**（2026-09-18 按团队反馈订正：AR 已真机通过可继续开发 / 量房寄居待迁独立 APP / DWG 上传待迁新 Web 项目 / 报告归档存储与管理未设计）。\n2. ~~归档历史文档~~ ✅ **已完成**（45 份 → `docs/archive/`）。\n3. **数据连通 —— 结论：不是二选一，必须拆两层**（2026-09-18 判定）：\n   - **前端现在就要做（与后端无关，且后端接上不返工）**：统一 ID 与引用字段（`client_uuid` / `projectId` / `updatedAt` / `deletedAt`，对齐 `BACKEND_ARCHITECTURE.md` §7.2 公共列）；报告归档从\"只存统计\"改为\"**报告快照 + 明细 ID 列表**\"；三套存储收敛为项目级数据根。\n     **理由**：`BACKEND_ARCHITECTURE.md` §1.4 的前提是\"没有存量数据、不需要兼容层\"，该前提**只在客户端尚未产生用户数据时成立**；若先上线再接后端，三条链都要重写并补数据迁移。**数据模型对齐必须现在做。**\n   - **留给后端（前端原理上做不到）**：跨设备 / 多角色可见性、变更冲突解决、报告分享与签收、按项目全量索引与增量拉取。\n   - **可立即缓解（小成本，先改善体验）**：报告归档落一份正文快照（JSON / 文件），让「巡场报告」页真正能回看，而非只显示几个数字。\n4. 补充 **角色与权限矩阵**（甲方 / 设计院 / 监理 / 施工方 × 业务动作）；当前仅 `Party` 展示档案，无真实账号体系。\n5. 产出**功能优先级与迭代计划**（结合后端重建里程碑）。\n6. 补写**产品红线口径**（AI 辅助人工复核 / 判定精度诚实 / 不伪造验证结果）——原 `SESSION_CONTEXT.md` §9 内容，已随该文件归档。\n"},{"id":"AI_VISION_INTEGRATION.md","path":"AI_VISION_INTEGRATION.md","url":"QUlfVklTSU9OX0lOVEVHUkFUSU9OLm1k","base":"AI_VISION_INTEGRATION.md","title":"拍照验收接入 AI 视觉模型（关键步骤）","group":"后端与配套服务","scope":"current","date":"2026-08-14","mtime":"2026-08-14","size":5983,"chars":4066,"lines":122,"nhead":16,"lead":"本文档记录「拍照验收」页面接入真实视觉模型（千问 qwen3.8-max）从 0 到联调通过的重要步骤，供后续维护与二次开发参考。","text":"# 拍照验收接入 AI 视觉模型（关键步骤）\n\n\u003e 本文档记录「拍照验收」页面接入真实视觉模型（千问 qwen3.8-max）从 0 到联调通过的重要步骤，供后续维护与二次开发参考。\n\n## 一、总体架构\n\n```\n[拍照验收页面 CapturePage]\n   │ 1. 按平台取图（Web=相册选图 / 移动端=相机）\n   │ 2. 图片字节压缩\n   ▼\n[VisionService.recognizeDefects]   ← lib/data/vision_service.dart\n   │ 3. POST http://localhost:3000/api/vision（body 带 dataURL 图片 + prompt）\n   ▼\n[Express 代理后端]                 ← backend/server.js\n   │ 4. 组装消息（text prompt + image_url），带 DashScope key 调 OpenAI SDK\n   ▼\n[千问视觉模型 qwen3.8-max]\n   │ 5. 返回缺陷 JSON\n   ▼\n[解析 + 页面展示 / Web 暂存]\n```\n\n## 二、后端：Express + OpenAI SDK\n\n**文件：`backend/server.js`**\n\n1. **环境变量（`.env`）**\n   - `DASHSCOPE_API_KEY`：DashScope（阿里云百炼）API Key\n   - `QWEN_BASE_URL`：OpenAI 兼容的 baseURL\n   - `QWEN_MODEL`：默认 `qwen3.8-max`\n\n2. **POST `/api/vision`**\n   - 请求体：`{ image: \"data:image/jpeg;base64,...\" | http url, prompt? }`\n   - 组装消息：`messages = [{ role:'user', content: [ {type:'text', text: prompt}, {type:'image_url', image_url:{url: image}} ] }]`\n   - 返回：`{ content: \"\u003c模型返回的 JSON 字符串\u003e\" }`\n   - 关键点：`express.json({ limit: '5mb' })` —— base64 图片体量大，默认 100kb 会 413，必须调大。\n\n3. **CORS（Web 联调必需）**\n   - 后端若未配置 CORS，浏览器会拦截 `localhost:8000 → localhost:3000` 的跨域请求。\n   - 手写中间件：`Access-Control-Allow-Origin: *` + 处理 `OPTIONS` 预检返回 204。\n   - 启动：`cd backend \u0026\u0026 node server.js`（默认 3000 端口，`/health` 健康检查）。\n\n## 三、前端 Flutter\n\n### 1. 依赖（`pubspec.yaml`）\n```yaml\nimage_picker: ^1.1.2   # 取图（相机/相册）\nimage: ^4.2.0          # 图片压缩\nhttp: ^1.6.0           # 调后端 /api/vision\n```\n\n### 2. 取图按平台分流（`capture_page.dart` `_pickImage`）\n- **Web** → `ImageSource.gallery`（相册选图；桌面浏览器无法直接调相机）\n- **Android/iOS** → `ImageSource.camera`，带 `maxWidth: 1280, imageQuality: 82`（原生压缩）\n- 用 `kIsWeb` 判断平台（不能用 `dart:io` 的 `Platform`，Web 不可用）。\n\n### 3. 图片压缩（`lib/core/utils/image_compress.dart`）\n`compressImage(bytes, {maxDim:1280, quality:82})`：\n- `image` 包解码 → 最长边等比缩放 → JPEG 编码\n- 解码失败原样返回，不破坏不可解析的图\n\n### 4. 视觉识别服务（`lib/data/vision_service.dart`）\n- `VisionService.host`：`String.fromEnvironment('VISION_HOST', defaultValue:'http://localhost:3000')`\n  - 上云时：`flutter build web --dart-define=VISION_HOST=https://xxx`\n- `recognizeDefects(Uint8List, {prompt})`：\n  1. `base64Encode` 图片字节 → `data:image/jpeg;base64,`\n  2. POST JSON body\n  3. **超时调大**：`.timeout(Duration(seconds: 180))` —— 千问模型冷启动+推理常超 60s，`60s` 会误触发超时（实测约 50s~1.7min）。\n- 解析：模型可能返回 markdown 代码块/多余文字 → 用 `content.indexOf('{')`~`lastIndexOf('}')` 截取第一个 JSON 对象再 `jsonDecode`。\n- 返回 `VisionResult { count, defects:[{name, desc}] }`。\n\n### 5. 拍照验收页面接入（`capture_page.dart`）\n- `_runScan`：有照片 → 调真实模型；映射成 `List\u003cVlDefect\u003e`。\n- **Mock 开关**（顶栏 Switch，`_useMock`）：\n  - 开 → `vlPreset`（秒级，省模型配额，便于验证 UI）\n  - 关 → 真实接口\n- **超时/失败**：`on TimeoutException` / `catch(e)` 分别捕获，写入 `_scanError` 状态，页面红字提示（不要静默吞异常）。\n\n### 6. 缺陷卡片展示\n- 缺陷卡片独立成区块 `_buildDefectSection`，放在图纸**外部**（`_buildResultPanel` 之后），避免被图纸 Stack 裁剪/遮挡。\n- 描述 `desc` 有值则显示在缺陷名下。\n- **置信度徽标按 conf 档位**（不是按 severity）：\n  - `conf \u003e= 0.8` → 高 / 绿 `#16A34A`\n  - `0.5 \u003c= conf \u003c 0.8` → 中 / 橙 `#EA580C`\n  - `conf \u003c 0.5` → 低 / 红 `#DC2626`\n\n## 四、Web 端暂存（仅测试用）\n\n**文件：`lib/core/utils/web_storage.dart`**（依赖 `dart:html`，仅 Web）\n\n- 用 `window.localStorage` 持久化识别结果，刷新页面后仍可见。\n- `CapturePage`：vision 返回即写入 `_storedResults` 并 `WebStorage.setList`；`initState` 时 `_loadStoredResults()` 恢复。\n- 展示在「保存验收记录」按钮下方列表。\n- ⚠️ `dart:html` 不兼容 wasm、不可用于移动端；跨平台后续应换 `shared_preferences` 等。\n\n## 五、验证与常见坑\n\n| 现象 | 原因 | 解决 |\n| --- | --- | --- |\n| 请求发起了但页面停在\"等待识别\" | 60s 超时太短，模型 50s~1.7min 才返回 | 超时调到 180s；失败红字提示 |\n| Web 端请求被拦截 | 后端无 CORS | 后端加 `Access-Control-Allow-Origin` + OPTIONS 204 |\n| 后端 413 | body 默认 100kb，图片 base64 大 | `express.json({ limit:'5mb' })` |\n| 缺陷卡片被图纸裁剪/显示不全 | 浮层在图纸 Stack 内 | 挪到图纸外部独立区块 |\n| 置信度显示\"轻微/中等/高\" | 误用 severity | 改为按 conf 分低/中/高 |\n\n## 六、运行方式\n\n```bash\n# 1. 启动后端\ncd backend \u0026\u0026 node server.js   # http://localhost:3000\n\n# 2. 构建 + 本地静态服务前端（本环境无 python/node，用 PowerShell 脚本）\nflutter build web --release\npowershell -ExecutionPolicy Bypass -File serve_web.ps1   # http://localhost:8000\n\n# 3. 上云时指定后端地址\nflutter build web --release --dart-define=VISION_HOST=https://xxx\n```\n\n\u003e `serve_web.ps1` 是临时静态文件服务器（监听 build/web 8000 端口），供开发预览用。\n"},{"id":"AUTH_STORAGE_DESIGN.md","path":"AUTH_STORAGE_DESIGN.md","url":"QVVUSF9TVE9SQUdFX0RFU0lHTi5tZA==","base":"AUTH_STORAGE_DESIGN.md","title":"工地验收 App · 登录与本地存储方案设计","group":"后端与配套服务","scope":"current","date":"2026-08-14","mtime":"2026-08-14","size":10272,"chars":6316,"lines":214,"nhead":17,"lead":"状态：S1/S2 已实施，S3–S5 待实施。最后更新 2026-08-13。 对应工程：D:\\code\\gongdi\\flutter_app（南方科技大学附属医院/校本部 · 工地验收）。","text":"# 工地验收 App · 登录与本地存储方案设计\n\n\u003e 状态：**S1/S2 已实施，S3–S5 待实施**。最后更新 2026-08-13。\n\u003e 对应工程：`D:\\code\\gongdi\\flutter_app`（南方科技大学附属医院/校本部 · 工地验收）。\n\n---\n\n## 0. 决策摘要（已与用户确认）\n\n| # | 议题 | 结论 |\n|---|---|---|\n| 1 | 存储位置 | **全本地存储优先**，暂不依赖后端 |\n| 2 | 目标平台 | **iOS 为主**，Android 同构；**Web 兼容**（预览降级） |\n| 3 | 登录实现 | **S2 已建会话层与登录守卫**；S3 补预置用户校验（本文件） |\n| 4 | 测试规模 | 3 个用户内测 |\n| 5 | 项目图纸 | 提前准备好，**随包预置**（assets → 首次启动拷贝本地，S1 已实现） |\n| 6 | 数据形态 | 登录信息 / 图纸大文件 / 标记数据 / 拍照图片 / AI 生成文字 |\n\n---\n\n## 1. 存储层总体架构\n\n```\n┌─────────────────────────────────────────────┐\n│            业务层（页面 / Provider）           │\n│      只依赖 Repository 抽象接口，平台无感      │\n└──────────────────┬──────────────────────────┘\n                   │\n┌──────────────────▼──────────────────────────┐\n│            LocalStorage 抽象接口              │\n│   readKV / writeKV / deleteKV / readFile /   │\n│   writeFile / deleteFile                     │\n└──────┬──────────────────────────┬───────────┘\n       │ 条件导入                    │ 条件导入\n┌──────▼───────────┐   ┌──────────▼───────────┐\n│ 移动端 iOS/Android │   │      Web（降级）       │\n│ · secure_storage  │   │ · WebCrypto 加密 KV   │\n│ · Hive（结构化）   │   │ · IndexedDB（KV+Blob） │\n│ · path_provider   │   │ · 无文件系统           │\n│   （大文件）        │   │                      │\n└──────────────────┘   └──────────────────────┘\n```\n\n- **业务代码零平台分支**：用 Dart 条件导入（`app_storage_io.dart` / `app_storage_web.dart`）在编译期选定实现。\n- iOS 是主力，全量功能本地存储；Web 仅预览，同一接口降级实现。\n\n---\n\n## 2. 存储选型映射\n\n| 数据 | 移动端（iOS/Android） | Web（兼容/预览） |\n|---|---|---|\n| 登录会话（token/用户信息） | flutter_secure_storage（Keychain/Keystore 加密） | WebCrypto 加密后存 Web Storage（容量小，仅会话级） |\n| 标记数据（锚点/缺陷/识别结果） | **Hive**（本地 DB 文件，JSON 直接存） | Hive 的 IndexedDB 后端（或 IndexedDB 直存） |\n| 项目图纸（大文件） | path_provider + File（Documents/drawings/） | IndexedDB 存 Blob（预览降级，不保证大图纸） |\n| 拍照图片 | path_provider + File（Documents/photos/，压缩后存） | IndexedDB 存 Blob（容量受限，仅演示） |\n| AI 生成文字 | Hive（复用 VisionResult.toJson/fromJson） | IndexedDB（同上） |\n\n\u003e 选型理由：Hive 是纯 Dart 嵌入式数据库，跑在 App 进程内、数据在设备本地，**不是后端数据库**——没有网络接口、不支持多用户并发；个人设备数据放本地，账号/同步/多端一致性才属于后端。当前单设备离线验收场景天然是本地存储。\n\n---\n\n## 3. 登录方案设计\n\n### 3.1 登录模式演进\n\n| 阶段 | 模式 | 说明 |\n|---|---|---|\n| 测试期（当前） | **本地登录（预置用户）** | 内置 3 个测试账号，输入用户名/密码校验通过后生成本地会话 |\n| 正式期（后端就绪） | **后端认证（JWT）** | `POST /auth/login` 换取 access/refresh token，本地只存 token |\n\n设计上**按正式期模式建模**：本地登录只是\"校验来源\"不同，会话模型、存储、守卫完全一致，后端就绪后只替换校验逻辑。\n\n### 3.2 会话数据模型（建议）\n\n```dart\nclass UserSession {\n  final String userId;      // 唯一标识（测试期固定 id，正式期后端下发）\n  final String username;    // 登录名\n  final String displayName; // 显示名（如「杨工」）\n  final String? token;      // 测试期可为空/固定串；正式期 access token\n  final String? refreshToken; // 正式期用于续期\n  final DateTime loginAt;\n  final DateTime? expiresAt;  // 过期时间（null = 长期有效）\n}\n```\n\n### 3.3 登录流程\n\n```\nApp 启动\n  ├─ 读取本地会话（移动端 secure_storage / Web 加密 KV）\n  │    ├─ 有且未过期 → 直接进入 /home（免登录）\n  │    └─ 无 / 已过期 → 进入 /login\n  └─ /login 输入用户名+密码\n       ├─ 本地校验（测试期：比对预置 3 用户）\n       └─ 校验通过 → 生成 UserSession → 写入本地存储 → 跳转 /home\n```\n\n### 3.4 登出流程\n\n```\n用户点击登出\n  ├─ 清除本地会话（secure_storage / Web KV）\n  ├─ 清除内存中的 Riverpod 会话状态（authStateProvider 置 null）\n  └─ GoRouter redirect 自动回到 /login\n```\n\n\u003e 登出**不清除**图纸、标记、照片等业务数据，仅清会话；后续可加\"清除所有本地数据\"按钮（含图纸拷贝目录）。\n\n### 3.5 会话状态管理（Riverpod + GoRouter）\n\n```dart\n// 会话状态：null = 未登录；UserSession = 已登录\nfinal authStateProvider = StateProvider\u003cUserSession?\u003e((ref) =\u003e null);\n\n// 初始化时从本地存储恢复会话（main 里 await 一次）\nfinal initAuthProvider = FutureProvider\u003cvoid\u003e((ref) async {\n  final session = await LocalStorage.instance.readSession();\n  ref.read(authStateProvider.notifier).state = session;\n});\n```\n\n```dart\n// GoRouter 登录守卫\nredirect: (context, state) {\n  final loggedIn = ref.read(authStateProvider) != null;\n  final onLogin = state.matchedLocation == '/login';\n  if (!loggedIn \u0026\u0026 !onLogin) return '/login';\n  if (loggedIn \u0026\u0026 onLogin) return '/home';\n  return null;\n},\n```\n\n### 3.6 安全设计\n\n| 项 | 移动端 | Web |\n|---|---|---|\n| token/密码存储 | flutter_secure_storage（系统级加密） | WebCrypto AES 加密后存储（浏览器无 Keychain 等价物） |\n| 明文落盘 | 禁止（密码/refresh token 不入 Hive、不入文件） | 同左 |\n| 会话过期 | expiresAt 校验，过期自动登出 | 同左 |\n| 生物识别（可选） | iOS 支持 local_auth 二次解锁（P6 可选） | 不支持 |\n\n\u003e ⚠️ 明确边界：**标记数据/图纸/照片是业务数据，可明文本地存储；登录凭证是敏感数据，必须加密存储**。两者物理隔离（不同存储介质/目录）。\n\n---\n\n## 4. 目录与依赖规划\n\n### 4.1 代码目录（S1/S2 已落地）\n\n```\nlib/core/storage/\n  ├── local_storage.dart        # ✅ 抽象接口（条件导入入口）\n  ├── app_storage_io.dart       # ✅ 移动端实现（secure_storage + Hive + path_provider）\n  ├── app_storage_web.dart      # ✅ Web 降级实现（localStorage + 内存文件，预览用）\n  ├── session_store.dart        # ✅ 会话读写封装（UserSession 模型 + SessionStore）\n  └── seed_assets.dart          # 图纸拷贝已并入 app_storage_io.seedDrawingsIfNeeded()\n\nlib/features/auth/\n  ├── login_page.dart           # ⚠️ 占位（S2 仅「进入应用」闭环可测，S3 补表单校验）\n  └── auth_controller.dart      # ✅ authStateProvider / sessionStoreProvider / initAuthProvider\n\nlib/data/repository/\n  └── local_repository.dart     # S4 实现现有 Repository 接口，读写 Hive/文件\n\nlib/core/utils/\n  └── web_storage.dart          # ✅ 重构为条件导入（Web 生效，其他平台空实现）\n```\n\n### 4.2 pubspec 增量依赖（设计稿）\n\n```yaml\ndependencies:\n  flutter_secure_storage: ^9.2.0   # 登录会话（移动端加密）\n  hive: ^2.2.3                     # 标记数据 / AI 结果（JSON 直存）\n  hive_flutter: ^1.1.0\n  path_provider: ^2.1.4            # 图纸/照片文件目录\n  path: ^1.9.0\n  crypto: ^3.0.3                   # Web 端加密辅助（WebCrypto 封装）\n  local_auth: ^2.2.0               # 可选：iOS 生物识别（P6）\n```\n\n---\n\n## 5. 实施步骤\n\n- [x] **S1 存储层**：LocalStorage 抽象 + 移动端/Web 双实现 + 首次启动图纸拷贝（`seedDrawingsIfNeeded`）\n- [x] **S2 会话层**：UserSession 模型 + SessionStore + authStateProvider + 登录守卫（routerProvider + /login 占位页）\n- [ ] **S3 登录页**：预置 3 用户本地校验 → 登录/登出全流程（替换占位 LoginPage）\n- [ ] **S4 业务持久化**：LocalRepository 接入标记数据/识别结果/照片保存\n- [ ] **S5 验证**：`flutter analyze`（已通过）+ Android/iOS 真机 + Web 预览三端跑通\n\n\u003e S1/S2 已完成；`flutter analyze` 通过，`flutter test` 4 用例通过，`flutter build web` 成功。\n\n---\n\n## 6. 待确认事项\n\n- [ ] **测试期 3 个账号**：具体用户名/密码/显示名是什么？（默认建议：yang/yang123、liu/liu123、zhao/zhao123）\n- [ ] **登录是否需要\"记住我\"**：测试期默认长期有效，还是 24h 过期？\n- [ ] **Web 端图纸**：仅预览缩略图，还是要求能查看原图（涉及 IndexedDB 容量与加载体验）？\n- [ ] **登出时是否保留图纸本地拷贝**：默认保留（省流量），可加手动清除。\n- [ ] **iOS 生物识别解锁**：是否在 P6 加入 local_auth（Face ID / Touch ID）？\n\n---\n\n## 7. 参考\n\n- 现有仓库抽象：`lib/data/repository/repository.dart`（UI 只依赖接口，切换实现零改动）\n- 现有识别结果序列化：`lib/data/vision_service.dart`（`VisionResult.toJson/fromJson` 已具备）\n- 现有 Web 暂存：`lib/core/utils/web_storage.dart`（仅测试用，将被新存储层替换）\n- 环境切换：`--dart-define=ENV=dev|prod`（`lib/core/env/env.dart`）\n"},{"id":"BACKEND_ARCHITECTURE.md","path":"BACKEND_ARCHITECTURE.md","url":"QkFDS0VORF9BUkNISVRFQ1RVUkUubWQ=","base":"BACKEND_ARCHITECTURE.md","title":"后端架构与技术方案","group":"后端与配套服务","scope":"current","date":"2026-09-18","mtime":"2026-09-18","size":41413,"chars":24895,"lines":619,"nhead":46,"lead":"项目：「蓝图落地」工地验收 App（深圳市建筑设计研究总院 · 环境院 AI 中心） 客户端：Flutter（iOS / Android / Web） 版本：v2.0 · 2026-09-18 · 状态：内容定稿（语言/ORM 与部署方式待确认）","text":"# 后端架构与技术方案\n\n\u003e 项目：「蓝图落地」工地验收 App（深圳市建筑设计研究总院 · 环境院 AI 中心）\n\u003e 客户端：Flutter（iOS / Android / Web）\n\u003e 版本：**v2.0 · 2026-09-18** · 状态：**内容定稿（语言/ORM 与部署方式待确认）**\n\u003e\n\u003e 相关文档：`CAD_MIGRATION_BACKUP.md`（CAD 剥离交接）、`SESSION_CONTEXT.md`（项目上下文）、\n\u003e `AUTH_STORAGE_DESIGN.md`（客户端登录与存储，S1/S2 已实施）、\n\u003e **`../蓝图落地_后端技术选型重新分析.md`（语言/数据库论证 + 与 09-10 方案的合并结论）**\n\n---\n\n## 0. 一句话方案\n\n客户端数据层与抽象已经就绪，后端**从零重建**为：**模块化单体 + PostgreSQL 16 + Redis 7 + 阿里云 OSS**，\n统一走一个入口，离线优先（本地为主、后端做后台同步），AI 从「裸转发」升级为「有治理的网关」。\n\n\u003e **已确定**：对象存储 = 阿里云 OSS（华南1 深圳）· 服务器 = 阿里云现有 ECS node0 `47.106.123.210` · 不考虑预算\n\u003e **待确认（2 项）**：① **语言 / ORM**（推荐 Node 22 + TS + Express 5 + Prisma）② **部署方式**（留空）\n\u003e → 论证与推荐见 **《蓝图落地_后端技术选型重新分析.md》**\n\u003e 本文其余部分（数据模型、同步机制、接口、权限、AI 网关）**不受影响**。\n\n---\n\n## 1. 现状基线（接手盘点结论）\n\n### 1.1 客户端\n\n业务闭环已完整：项目/图纸 → 拍照验收（AI 视觉）→ 缺陷清单（状态机 + 设计师处置 + 施工方回复）\n→ 巡场（路线/打卡/GPS）→ 量尺校对 / 量房 → 周报导出（HTML/PDF/DOCX/XLSX，纯客户端生成）。\n\n已具备的正确接缝（**重建后端要顺着它们做，而不是推翻**）：\n\n| 接缝 | 文件 | 说明 |\n|---|---|---|\n| 仓库接口 | `lib/data/repository/repository.dart` | UI 只依赖接口 |\n| 本地仓库实现 | `lib/data/repository/mock_repository.dart` | **已做本地持久化**（`LocalStorage.readDoc/writeDoc`），实际角色是「本地仓库」，名字叫 Mock 属历史遗留 |\n| 存储抽象 | `lib/core/storage/local_storage.dart` | 条件导入：Hive + secure_storage + 文件 / localStorage |\n| 模型序列化 | `lib/data/models.dart` | `Defect` / `PatrolPlan` / `MeasureSession` / `RoomScanRecord` 等全部 `toJson/fromJson`，且向后兼容 |\n| 会话模型 | `lib/core/storage/session_store.dart` | `UserSession{token, refreshToken, expiresAt}` 已按 JWT 建模 |\n| 环境开关 | `lib/core/env/env.dart` | `ENV` 目前**不控制数据源**（已明确），保留供后续环境差异 |\n\n### 1.2 现有后端\n\n| 项 | 事实 |\n|---|---|\n| 线上真实后端 | **只有 1 个接口**：`POST /api/vision`（Express，`120.24.240.129:3000`），**代码仓库分离** |\n| 实测 | `GET /health` → 200；`GET /`、`GET /api/vision`、`/api/measurements` → 404（只定义了少量 POST 路由） |\n| 密钥 | DashScope Key 存于该服务器环境变量，**非明文入库**，沿用 |\n\n### 1.3 已判定为废案 / 孤儿的东西\n\n| 项 | 判定 |\n|---|---|\n| 浩辰云图 OCF 链路 + 本地 ODA/ezdxf 转换 | **废案**，整体移交新建的网页版 CAD 项目 → 见 `CAD_MIGRATION_BACKUP.md` |\n| `server/ocf_server.py`（:8800） | 随 CAD 迁移删除。其中**和风天气已拆出**为独立服务 `server/weather_server.py`（:8830） |\n| `server/measure_server.py`（:8820） | **开发期一次性脚手架，从未上线**。云端 8820 实测不可达，`/api/measurements` 在生产不存在。删除 |\n| `server/` 其余 py | 一次性离线脚本 / CAD 依赖 → 随 CAD 迁移走 |\n| `lib/data/repository/remote_repository.dart` | **已删除**。空壳（12 个 `UnimplementedError`），且「整体替换式远端仓库」的形态与离线优先冲突 |\n\n### 1.4 起点结论（**这三条决定方案形态**）\n\n1. **后端不是\"迁移/接管\"，是\"从零建\"。** 唯一要接管的只有 `/api/vision` 这 1 个接口，且需要的是**升级**而非兼容。\n2. **没有存量数据、没有存量调用方**（`measure_server` 从未启用），因此**不需要任何兼容层与数据迁移**，表结构可以一次到位。\n3. **CAD 不在本方案范围内**，已剥离；本方案不设计任何 CAD 转换能力。\n\n---\n\n## 2. 目标与设计原则\n\n| # | 原则 | 说明 |\n|---|---|---|\n| 1 | **离线优先** | 本地是主副本，UI 永远只读本地；后端是汇集点与协作端，不是\"数据源\" |\n| 2 | **不推翻客户端** | 后端顺着现有抽象实现；客户端改造集中在 BASE_URL、Repository 本地化、SyncEngine、登录页 |\n| 3 | **一个入口** | 客户端只配一个 `BASE_URL`，所有能力收敛到一个网关（现有 3 个硬编码 host 是主要技术债） |\n| 4 | **模块化单体优先** | 1–3 人团队，不上微服务/K8s；用包结构做模块边界，真到瓶颈再拆 worker |\n| 5 | **权限点而非角色** | 角色是数据不是代码，加角色不发版（角色名单尚未确定） |\n| 6 | **从零建，不带包袱** | 不做兼容层；同步所需字段（`client_uuid` / `version` / `deleted_at`）建表即带上 |\n| 7 | **成本可见** | AI 调用与对象存储流量必须可记账、可看板 |\n\n---\n\n## 3. 总体架构\n\n```\n┌──────────────────── Flutter (iOS / Android / Web) ─────────────────────┐\n│  页面 / Provider                                                        │\n│    └── Repository（本地为准，立即返回）                                  │\n│          ├── LocalStore（Hive / 文件 / secure_storage）  ← UI 唯一数据源 │\n│          └── SyncEngine                                                 │\n│                ├── outbox：写本地时同时入队变更                          │\n│                └── 后台：push 变更 / pull 增量 → 回写本地                 │\n└───────────────────────────────┬────────────────────────────────────────┘\n                                │ HTTPS · 单一 BASE_URL · JWT\n┌───────────────────────────────▼────────────────────────────────────────┐\n│ Nginx（TLS · 限流 · 静态托管 /jianzhu · 访问日志）                       │\n├────────────────────────────────────────────────────────────────────────┤\n│ 业务服务（模块化单体 · 语言见 §4）                                      │\n│  auth · users · projects · drawings · defects · patrol · measure        │\n│  · captures · reports · sync · files · notifications · ai · weather     │\n├────────────────────────────────────────────────────────────────────────┤\n│ PostgreSQL 16（主数据 + 同步变更流）   Redis 7（缓存 / 队列 / 限流）      │\n│ 阿里云 OSS · 华南1深圳 · 私有读（照片/图纸/报告）  Worker（AI 批处理）    │\n└────────────────────────────────────────────────────────────────────────┘\n```\n\n\u003e **代码位置【待定】**：建议后端独立成新仓库（如 `blueprint-server`），与本客户端仓库解耦，CI 独立，\n\u003e 与新建的「网页版 CAD 项目」平级。本文档按「独立仓库」撰写。\n\n---\n\n## 4. 技术选型\n\n\u003e **本节 3 处待确认（⚠️）**，论证见《蓝图落地_后端技术选型重新分析.md》§1 §2。\n\u003e **推荐**：Node 22 + TS + Express 5 + Prisma —— 理由一句话：现有生产代码就是 Node（`backend/` 3 条路由），\n\u003e 09-17 原定 FastAPI 所依据的\"服务端 Python 资产\"已被本文档 §1.3 自己判为废案；\n\u003e 且宝塔「Node 项目」是你**正在使用**的部署路径，选 Node 则**语言数收敛为 1**。\n\n| 层 | 选型 | 理由 / 备选 |\n|---|---|---|\n| ⚠️ 语言 / 框架 | **Node 22 LTS + TypeScript 5 + Express 5**（推荐）\u003cbr\u003e备选：Python 3.12 + FastAPI | 现有 `backend/` 3 条 AI 路由**可原样搬入**，迁移成本≈0；Express 5 已原生支持 async 错误处理。**Express `/api/vision` 逻辑迁入**。备选触发条件见分析文档 §1.5 |\n| **数据库** | **PostgreSQL 16**（**已定，无分歧**） | 关系模型清晰（项目-图纸-缺陷-回复-事件）；`JSONB` 承接半结构化字段（`items` / `walls` / `track` / `parties`）。**不用 MySQL**：同步变更流的序号分配需要事务级咨询锁（`pg_advisory_xact_lock`），MySQL 的 `AUTO_INCREMENT` 会让客户端**静默丢数据**；**不用 MongoDB**：关联与约束体系不匹配 |\n| 缓存 / 队列 | **Redis 7** | 会话吊销、限流、AI 结果缓存、后台任务队列（BullMQ / RQ / Celery） |\n| **对象存储** | **阿里云 OSS · 华南1（深圳）· 私有读**（**已定**） | 与 ECS 同地域 → **内网读免费**；缩图走 `x-oss-process`（服务端不做图）。详见 §8 |\n| 认证 | **JWT**（access 15min + refresh 30d 轮换） | 与 `UserSession` 一一对应，客户端零改造 |\n| 密码哈希 | argon2id | — |\n| ⚠️ ORM / 迁移 | **Prisma**（Node 派生 / 推荐）\u003cbr\u003e备选：SQLAlchemy 2.0 async + Alembic | 随语言走；要求**迁移从第一天就有**、每个 migration 可向前兼容（新增字段可空、不删旧字段） |\n| 校验 | **Zod** | 承担「AI 返回结构校验 + 失败重试一次」（见 §10），并替代客户端 `indexOf('{')` 截串兜底 |\n| ⚠️ 部署 | **留空待定** | 约束与候选路径见 §14。**推荐方向：宝塔 + PM2 + Nginx**（贴合\"不碰 SSH\"）；`docker compose pull \u0026\u0026 up -d` 与你的习惯直接冲突 |\n| 观测 | structlog + Sentry + `/health` 聚合 | 分阶段接入 |\n\n---\n\n## 5. 统一入口与客户端接入\n\n### 5.1 服务端：路径式同源部署\n\n**`https://\u003c域名\u003e/api/v1/**`**\n\n| 理由 | 说明 |\n|---|---|\n| 零 CORS | Web 端从 `\u003c域名\u003e/jianzhu/` 提供，API 同域 → 不再需要 `Access-Control-Allow-Origin: *`（现方案既是安全洞又是维护负担） |\n| 复用证书 | 不新增域名/证书配置 |\n| 原生端一致 | iOS/Android 用同一 URL，无分支 |\n\n**⚠️ 证书**：现有 `certificate.pem` 是**自签证书**（`subject = issuer = CN=yangyuting.cloud`），\niOS ATS 会直接拒绝、Android 7+ 拒绝用户证书、浏览器红锁。**必须换正式 CA 证书**（Let's Encrypt / 云厂商免费 DV）。\n\n### 5.2 客户端改造清单\n\n| # | 改造 | 文件 |\n|---|---|---|\n| 1 | 新增 API 基址配置（`--dart-define=BASE_URL`） | **新增** `lib/core/api/api_config.dart` |\n| 2 | 视觉服务改用基址 | `lib/data/vision_service.dart` |\n| 3 | 天气服务改用基址（**已完成**，现为 `WeatherService.host`） | `lib/data/weather_service.dart` |\n| 4 | 删除 CAD 服务 | `lib/data/cad_service.dart`（随 CAD 迁移） |\n| 5 | 实现真实登录页（当前为占位） | `lib/features/auth/login_page.dart` |\n| 6 | 实现 `SyncEngine` + outbox | **新增** `lib/core/sync/` |\n| 7 | 统一数据源边界（见 §9.6） | `lib/core/di/providers.dart` 等 |\n\n### 5.3 迁移期兼容\n\n`/api/vision` 旧路径在迁移期保留并内部转发到 `/api/v1/ai/vision`，待客户端切换完成后下线。\n\n---\n\n## 6. 用户体系与权限\n\n### 6.1 核心设计：**代码只认权限点，不认角色**\n\n角色名单尚未确定，因此**不写死枚举**：\n\n```\nroles(code PK, name, description, permissions jsonb, sort, is_system)\nmemberships(id, user_id, project_id, role_code, created_at)      -- 项目级\n```\n\n代码里只硬编码**权限点**（稳定的业务动作）：\n\n```\ndefect.create / defect.reply / defect.close / defect.assign\npatrol.run / measure.write / report.export / drawing.manage / member.manage\n```\n\n- 角色 → 权限的映射**放数据**（`roles.permissions`）；新增角色不改代码、不发版。\n- 建库时 seed 3 个系统角色兜底：`admin` / `editor` / `viewer`；甲方 / 设计院 / 监理 / 施工方等\n  **待业务角色确定后往表里加**（见 §15）。\n- 校验规则：`(user, project) → role.permissions → 是否含所需权限点`，**role 不放 JWT**\n  （避免权限变更后旧 token 继续生效）。\n\n### 6.2 认证流程\n\n```\nPOST /api/v1/auth/login      → { access, refresh, expiresAt, user, permissions }\nPOST /api/v1/auth/refresh    → 轮换 refresh（旧的立即失效）\nPOST /api/v1/auth/logout     → refresh 入 Redis 黑名单\nGET  /api/v1/auth/me         → 当前用户 + 项目列表 + 各项目权限\n```\n\n### 6.3 施工方接入（两种）\n\n| 方式 | 说明 |\n|---|---|\n| 受限账号 | 只看指派给自己的缺陷 + 可回复 |\n| **分享 token** | 免登录网页 `/share/{token}`，只读 + 可回复，短有效期（对应需求「施工方网页协作链接」） |\n\n### 6.4 客户端影响\n\n- `UserSession` / `SessionStore` **不改**（本就是 JWT 形状）\n- `LoginPage` 从占位改为真实表单校验\n- `currentUserProvider` 从 `mock_data.users` 切到登录会话\n- 「点头像切换用户」的**扮演式开关降级为管理员功能**\n- 概念澄清：`Party`（项目参与方档案，展示用）**≠** `User`（系统账号）。\n  责任单位/责任人应关联 `memberships`，否则「施工方只看自己的」无法成立\n\n---\n\n## 7. 数据库设计\n\n### 7.1 服务器落地\n\n| 项 | 方案 |\n|---|---|\n| 服务器 | **阿里云 ECS node0**（16 vCPU / 32 GiB，`47.106.123.210`，**华南1（深圳）**，2027-04-03 到期）——**复用现有实例，不新购** |\n| 数据盘 | 新增 **40 GB ESSD PL0 专供 PostgreSQL**。理由是**故障 / IO 隔离**（磁盘写满 → PG 无法写 WAL → 挂死，PG 最高频生产事故），**不是\"装不下\"** |\n| ⚠️ 形式 | **待定**（随部署方案）：\u003cbr\u003eA. 宝塔软件商店安装 PostgreSQL 16（推荐，图形化管理 + 计划任务备份）\u003cbr\u003eB. Docker Compose 起 `postgres:16-alpine`，数据卷 `pgdata` 持久化 |\n| 网络 | **不开公网端口，只监听 `127.0.0.1`**；共机环境不得改变现有业务配置 |\n| 字符集 | UTF8；**全部时间列 `timestamptz`** |\n| 扩展 | `pgcrypto`（`gen_random_uuid`）、`pg_trgm`（规范条款 / 缺陷文本模糊召回 Top20）；PostGIS 暂不装 |\n| 迁移 | 随 ORM 走（Prisma migrate / Alembic），**随部署执行**；每个 migration 必须向前兼容 |\n| 备份 | 每日 02:30 `pg_dump -Fc` 压缩 + 保留 7~14 天，产物**转存 OSS `blueprint-backup` 桶**（该桶 30 天自动删除） |\n| 规模预估 | 单机 PG 完全够（3 人团队 + 少量项目）；**照片等二进制一律不入库** |\n\n### 7.2 公共列约定（**建表即带，事后补极难**）\n\n```\nid                 uuid PK            gen_random_uuid()\nclient_uuid        uuid               客户端生成，唯一索引 → 幂等\nversion            int   default 1    每次写入 +1\ncreated_at         timestamptz\nupdated_at         timestamptz        客户端修改时间（不可信，仅展示）\nserver_updated_at  timestamptz        服务端写入时间（权威）\ndeleted_at         timestamptz        软删；NULL = 未删\ncreated_by         uuid → users.id\n```\n\n\u003e `client_uuid` / `server_updated_at` / `deleted_at` 是同步机制的命脉，理由见 §9。\n\n### 7.3 表结构（18 张，按模块）\n\n**账号与项目**\n\n| 表 | 关键字段 |\n|---|---|\n| `users` | username(uniq), display_name, password_hash, phone, email, avatar_key, status, last_login_at |\n| `roles` | code PK, name, description, **permissions jsonb**, sort, is_system |\n| `memberships` | user_id, project_id, role_code, uniq(user_id, project_id) |\n| `projects` | name, client, location, status, site_area, floor_area, beds, concept, **parties jsonb**, **milestones jsonb** |\n\n**图纸与文件**\n\n| 表 | 关键字段 |\n|---|---|\n| `drawings` | project_id, key(uniq per project), title, crumb, floor, building, variant, source(`asset`/`upload`), width, height, **hotspots jsonb**, base_file_id, thumb_file_id, sort |\n| `files` | project_id, owner_id, kind(`photo`/`drawing`/`report`/`reply_photo`/`thumb`), object_key, mime, size, **sha256**, width, height, **exif jsonb** |\n\n**缺陷（主链）**\n\n| 表 | 关键字段 |\n|---|---|\n| `defects` | project_id, drawing_id, part, type, category, severity, importance, status, anchor, floor, building, gps, lat, lng, world_x, world_y, reporter_id, resp_unit, resp_user_id, note, seed, suggestion, source_capture_id, photo_file_id, photo_hash, watermark_serial, reply, reply_by_id, reply_ts, reply_photo_file_id, close_note, completion, designer_action, designer_note, designer_by_id, designer_ts |\n| `defect_events` | defect_id, actor_id, **action**, payload jsonb, created_at |\n\n\u003e `defects` 上的 `reply*` / `designer*` 是**当前态**（便于列表查询与报告渲染）；\n\u003e `defect_events` 是**事件流**（审计 + 冲突解决）。两者由同一写路径同时更新。\n\u003e `action` ∈ `create/update/assign/reply/designer_fix/designer_confirm/onsite/reject/close/reopen`\n\n**巡场 / 量测 / 量房 / 验收**\n\n| 表 | 关键字段 |\n|---|---|\n| `patrol_plans` | project_id, drawing_id, name, floor, **points jsonb**, total_km |\n| `patrol_records` | plan_id, project_id, drawing_id, operator_id, name, started_at, finished_at, dist_km, point_count, issue_count, **track jsonb**, **checkins jsonb**, checkpoint_total |\n| `measure_sessions` | project_id, drawing_id, floor, tol_mm, tol_pct, **calib jsonb**, **items jsonb**, uniq(project_id, drawing_id) |\n| `room_scans` | project_id, name, room_use, source, scanned_at_ms, **walls jsonb**, closure_delta_mm, net_height_mm, drawing_id, **checks jsonb**, note |\n| `captures` | project_id, drawing_id, floor, anchor, photo_file_id, ai_call_id, **ai_result jsonb**, **confirmed_result jsonb**, reporter_id |\n\n\u003e `measure_sessions` / `room_scans` / `patrol_records` 的 `JSONB` 字段**直接存客户端 `toJson()` 结构**，\n\u003e 服务端不解析几何，只做检索与统计——**这是最低成本、零阻抗的落地方式**。\n\u003e `captures` 的 `ai_result` + `confirmed_result` 是「缺陷知识库反哺设计」的原始数据来源。\n\n**平台**\n\n| 表 | 关键字段 |\n|---|---|\n| `reports` | project_id, period, title, format, file_id, **share_token**, share_expires_at, generated_by, status |\n| `ai_calls` | project_id, user_id, task_type, model, prompt_version, **image_sha256**, request jsonb, response jsonb, input_tokens, output_tokens, latency_ms, cost, cache_hit, status, error |\n| `notifications` | user_id, project_id, type, title, body, ref_type, ref_id, read_at |\n| `audit_logs` | actor_id, project_id, action, entity, entity_id, before jsonb, after jsonb, ip, ua |\n| **`changes`** | **seq bigserial PK**, project_id, entity, entity_id, op(`upsert`/`delete`), changed_at —— 同步变更流，见 §9 |\n\n### 7.4 索引要点\n\n```sql\ndefects(project_id, status)\ndefects(project_id, server_updated_at)\ndefects(client_uuid)              -- 幂等\nchanges(project_id, seq)          -- 增量拉取（核心）\nfiles(sha256)                     -- 去重 / 证据链\nai_calls(image_sha256, prompt_version)   -- 结果复用\nroles(code) / memberships(user_id, project_id)\n```\n\n---\n\n## 8. 对象存储（阿里云 OSS）\n\n\u003e **本节已按定稿改写**（原 09-17 版为腾讯云 COS）。选型与单价明细见《蓝图落地_服务器与存储选型预算.md》§6。\n\n**地域：华南1（深圳）** —— 与 ECS node0 同地域，**内网读取流量免费**。\n\n| 项 | 方案 |\n|---|---|\n| 桶 | **2 个私有读桶**：`blueprint-prod`（全部业务文件，**绝不配自动删除** —— 取证数据）+ `blueprint-backup`（DB 备份，**30 天自动删除**，必须与业务数据物理隔离） |\n| 为什么业务只开一个桶 | 跨桶无法原子操作、权限与生命周期要维护多套；**前缀已能清晰分区** |\n| 目录规划 | `photos/{projectId}/{yyyy}/{MM}/{sha256}.jpg`\u003cbr\u003e`videos/{projectId}/{yyyy}/{MM}/{sha256}.mp4`\u003cbr\u003e`drawings/{projectId}/{drawingKey}/v{n}/{fileName}` + `preview.png`\u003cbr\u003e`exports/{projectId}/{yyyyMM}/report_xxx.xlsx` · `avatars/{userId}.png` |\n| 命名 | **文件名 = SHA-256** → 同一张照片重复上传**自动去重**（省存储也省流量）；**不存原始文件名**（含中文/emoji 易编码出错），原名记在 `files.file_name` 可选字段 |\n| 上传 | **客户端预签名直传**：`POST /files/presign` → **PUT 预签名 URL（10 min，限定 Content-Type 与大小）** → `POST /files/complete {ossKey, sha256, size}` → 服务端 **`HEAD` 校验实际大小 / ETag** → 登记 `files` 表并返回 `fileId`。\u003cbr\u003e**根治 base64 塞 body 撞网关体积限制的老坑** |\n| **⑥ 校验不可省** | 客户端可能伪造 sha256 或上传非法内容 → 服务端必须 `HEAD` 校验，必要时抽样下载校验哈希。**这是取证级证据链的必要一环** |\n| 权限 | **全私有读** + 短时预签名 URL：查看 **1 h**、外部分享 **15 min**（可带水印参数）。工地照片含人员/进度/可能涉密，**公共读一旦 URL 泄露即无法收回** |\n| 服务端读图（AI） | 用**内网 endpoint**（`oss-cn-shenzhen-internal`）签发 URL → **AI 识别读图流量归零** |\n| **缩图** | **走 OSS `x-oss-process`**：列表 `resize,w_400/quality,q_80`、详情 `resize,w_1600`、分享可叠加 `watermark`。\u003cbr\u003e**服务端不做图片处理** —— 免 sharp / imagemagick 依赖与大量 CPU，工地照片量大，自建缩图会成为第一个性能瓶颈 |\n| 服务端职责 | 抽 EXIF（时间/GPS，供水印存证）+ 计算 `sha256`（去重 + 证据链）。**不做缩图、不中转字节** |\n| 大文件 | 分片上传（\u003e 20 MB） |\n| 生命周期 | `photos/**`：**180 天**转低频（¥0.08/GB/月）→ **730 天**转归档（¥0.033）；`videos/**`：90 天转低频；`blueprint-backup/db/**`：30 天删除；**取证数据绝不自动删除** |\n| ⚠️ 最低存储时长陷阱 | 低频 30 天 / 归档 60 天 / 冷归档 180 天。**提前删除或转出会补收剩余天数费用** → 规则不要设得过激进（如\"7 天转归档\"会因反复转出更贵）；上传后直接进归档也是错的（取回要解冻，**取证调取会来不及**） |\n\n**降本要点（按 ROI 排序）**\n1. **客户端上传前压缩到长边 2048px** —— 存储、下行流量、AI 图片 tokens **三项同时降 ~80%**（客户端已实现 `image_compress.dart`）\n2. 列表页只加载 `x-oss-process` 缩略图（400px）→ 单次浏览流量降 ~70%\n3. AI 识别用**内网 endpoint** 读图 → 流量归零\n4. 不要过早转归档；下行流量 \u003e 300 GB/月且持续 2 个月，才考虑上 CDN\n5. 对象存储**按存量计费**（照片每年新增会堆积），采购方式（按量 / 存储包）见预算文档\n\n---\n\n## 9. 同步机制（离线优先的核心）\n\n### 9.1 问题\n\n后端上线后，两台设备（或手机 + 网页）如何看到同一份数据？\n\n| 做法 | 结果 |\n|---|---|\n| A. 每次读都请求后端 | 地下室无信号 = 没数据（**必须避免**） |\n| B. 只上传不下载 | 看不到别人提交的 |\n| **C. 本地为主 + 增量双向同步** | ✅ 采用 |\n\n### 9.2 三个动作\n\n```\n① 写：先写本地（立即返回），同时把\"我改了什么\"记入 outbox（本地表）\n② 推：有网时后台把 outbox 逐条发到  POST /api/v1/sync/push\n③ 拉：客户端记住游标，只取增量        GET  /api/v1/sync/pull?sinceSeq=\u0026projectId=\n```\n\n### 9.3 游标方案：**seq 变更流**（不用时间戳）\n\n服务端维护一张 `changes(seq bigserial, project_id, entity, entity_id, op, changed_at)`：\n**任何写操作在事务内同时插一条**。\n\n| 方案 | 问题 |\n|---|---|\n| 时间戳游标（各表 `server_updated_at \u003e since`） | **边界丢数据**：写入时间恰好等于游标值、且判据是 `\u003e` 时会被漏掉；且需多表多游标 |\n| **seq 变更流** | ✅ 客户端只需 1 个游标；\"什么可同步\"集中在一处定义 |\n\n\u003e ⚠️ **必读修正（v2.0 新增）**：`bigserial` 的**分配**严格递增，但**可见性由提交时间决定** ——\n\u003e 两个事务可能\"先分配、后提交\"：\n\u003e\n\u003e ```\n\u003e T1  事务 A nextval → seq=100（未提交）\n\u003e T2  事务 B nextval → seq=101，并在 T3 提交\n\u003e T4  客户端拉取，读到 max(seq)=101 → 游标推进到 101\n\u003e T5  事务 A 提交，seq=100 才变得可见\n\u003e T6  客户端从 101 继续拉 → 100 永远拉不到（静默丢一条变更，无任何报错）\n\u003e ```\n\u003e\n\u003e **解法（PG 下 1 行）**：写 `changes` 的同一事务开头取**事务级咨询锁**，使序号分配被串行化 ——\n\u003e 持锁事务提交后下一个才能分配，于是**分配顺序 ≡ 提交顺序**，`seq \u003e cursor` 恢复正确：\n\u003e\n\u003e ```sql\n\u003e SELECT pg_advisory_xact_lock(981001);   -- 事务结束自动释放，不会泄漏\n\u003e INSERT INTO changes(project_id, entity, entity_id, op) VALUES (...) RETURNING seq;\n\u003e ```\n\u003e\n\u003e **代价**：变更流写入被串行化。本项目写入 QPS 极低，**代价可忽略**；换来同步永不丢数据。\n\u003e **这也是\"数据库必须选 PG\"最硬的理由**（MySQL 只有会话级 `GET_LOCK`，连接池下配对释放不可靠）——\n\u003e 详见《蓝图落地_后端技术选型重新分析.md》§2.3。**建表即带上，事后补极难。**\n\n`pull` 响应：服务端按 seq 顺序取出变更，**连带返回当前记录内容**（已删除则返回 tombstone），\n一个来回完成；用 `limit` + `nextSeq` 分页。\n\n**游标过期**：`changes` 定期清理（保留 90 天）。客户端游标早于保留窗口时，服务端返回\n`resync_required`，客户端走**全量重同步**。\n\n### 9.4 幂等\n\n所有写接口带 `client_uuid`（客户端生成的 UUID）+ 可选 `Idempotency-Key`。\n服务端对 `client_uuid` 建唯一索引：**重发不会产生重复记录**。\n（不做的后果：网络超时重试必然造重复数据。）\n\n### 9.5 冲突策略\n\n| 数据类型 | 策略 | 理由 |\n|---|---|---|\n| **会话型**：量尺会话 / 量房 / 巡场记录 | 整份覆盖，`version` 递增，后写胜（LWW） | 这是\"一个人的一次作业成果\"，两人同时改同一条的概率 ≈ 0；字段级合并属过度设计 |\n| **流程型**：缺陷 | **事件流**：不\"修改记录\"，而是**追加动作**（指派/回复/销项/驳回） | **动作是事实，事实不会冲突**；最终状态由事件推导，附带审计轨迹（\"谁什么时候销的项\"） |\n\n缺陷的状态机校验在服务端：非法跃迁拒绝并返回权威状态。\n\n### 9.6 客户端改造：统一数据源边界（**必做**）\n\n现状是**不一致的**：\n\n| 走 `Repository` | **绕过 `Repository`，直接读本地 store** |\n|---|---|\n| 项目 / 楼层 / 图纸 / 锚点 / 缺陷 / 时间轴 / 量尺会话 | 巡场（`PatrolPlanStore`/`PatrolRecordStore`）、量房（`RoomScanStore`）、量尺（`MeasureStore`）、校准库 |\n\n重建时必须**全部纳入同步范围**，否则会出现「缺陷同步了、巡场没同步」的半吊子状态。\n\n### 9.7 触发时机\n\n启动时、网络恢复时、写操作后 debounce 数秒、下拉刷新、定时（每 N 分钟）。\n**页面完全无感**——同步只发生在 `SyncEngine` 内部。\n\n### 9.8 明确不做\n\nCRDT、实时协同编辑、图片走增量同步（图片单独走对象存储后只同步 `file_id`）。\n\n---\n\n## 10. AI 服务网关\n\n现状：单个 Express 路由把图片转发给千问，无鉴权、无限流、无缓存、无记账，\n结构化输出靠客户端截字符串兜底，超时 180s 硬扛。\n\n| 能力 | 目标设计 |\n|---|---|\n| 入口 | `/api/v1/ai/*`，Key 仅在服务端 |\n| **Prompt 归属** | **从客户端迁到服务端并版本化**。现有 4 套提示词在 `lib/data/vision_service.dart`（缺陷 / 锚物 / 网格 / 目标）→ 改 Prompt 不发版，支持 A/B |\n| 结构化输出 | 服务端 **schema 校验 + 失败自动重试一次** → 客户端只解析、不再兜底（客户端 `indexOf('{')` 截串逻辑可退休） |\n| 缓存 | `sha256(image) + prompt_version` 命中直接返回（同一张图重复上传很常见） |\n| 记账 | `ai_calls` 表：项目/用户/任务/模型/Prompt 版本/图片哈希/tokens/耗时/成本/是否命中缓存 |\n| 限流 | 按项目 + 按用户的令牌桶；服务端开关支持\"演示模式\"（替代客户端的 `_useMock` 开关） |\n| 同步 / 异步 | 缺陷识别保持**同步**（10~60s）；批量与长任务改为 `task_id` 轮询/回调 |\n| 失败处理 | **返回明确错误码**，不静默 mock、不静默降级 |\n| 知识库 | 识别结果 + **人工确认结果**（`captures.confirmed_result`）→ 结构化沉淀 → `/ai/suggest` 用 RAG 检索历史相似缺陷给出整改建议。**这是「沉淀缺陷知识库反哺设计」的后端本体** |\n| 模型 | OpenAI 兼容协议，换模型不动客户端 |\n\n---\n\n## 11. 报告与分享\n\n现状：HTML / PDF / DOCX / XLSX 四端**全部在客户端生成**（纯 Dart 手写 OOXML，零插件）。\n\n**结论：保留客户端导出不动。** 它有真实价值——离线可用、零后端成本、模板随 App 走。\n后端只新增客户端做不到的三件事：\n\n| 能力 | 接口 |\n|---|---|\n| 分享链接（施工方/甲方网页查看） | `POST /reports/{id}/share` → `/share/{token}` |\n| 定时 / 批量周报 | 后台任务按周期汇总并推送 |\n| 跨项目统计聚合（缺陷库、销项率、专业分布） | `GET /stats/*` |\n\n---\n\n## 12. 通知\n\n站内消息表 + 可插拔通道（APNs / FCM / 邮件 / 企业微信 / 钉钉机器人）。\n\n触发点：缺陷指派给施工方、设计师远程处置、整改回复提交、甲方催办、报告生成完成。\n\n推送通道**不是 P0 阻塞项**，可先做站内消息。\n\n---\n\n## 13. 接口清单（v1）\n\n统一响应：`{ ok, data, err: { code, msg } }`（与该 App 既有调用风格一致）。\n\n| 模块 | 接口 |\n|---|---|\n| 认证 | `POST /auth/login` · `/auth/refresh` · `/auth/logout` · `GET /auth/me` |\n| 项目 | `GET /projects` · `/projects/{id}` · `GET/POST/DELETE /projects/{id}/members` |\n| 图纸 | `GET /projects/{id}/drawings` · `/drawings/{id}` |\n| 文件 | `POST /files/presign` · `POST /files/complete` · `GET /files/{id}`（签名 URL） |\n| 缺陷 | `GET/POST /defects` · `PATCH /defects/{id}` · `POST /defects/{id}/events` · `GET /defects/{id}/events` |\n| 巡场 | `GET/POST /patrol/plans` · `GET/POST /patrol/records` |\n| 量测 | `GET/POST /measure-sessions` |\n| 量房 | `GET/POST /room-scans` |\n| 拍照验收 | `GET/POST /captures` |\n| 报告 | `POST /reports` · `GET /reports/{id}` · `POST /reports/{id}/share` |\n| **同步** | `POST /sync/push` · `GET /sync/pull?sinceSeq=\u0026projectId=\u0026limit=` |\n| AI | `POST /ai/vision`（缺陷/锚物/网格/目标，按 `task` 区分）· `POST /ai/suggest` |\n| 天气 | `GET /weather?lon=\u0026lat=\u0026name=`（从 `ocf_server.py` 拆出的能力） |\n| 通知 | `GET /notifications` · `POST /notifications/{id}/read` |\n| 分享 | `GET /share/{token}`（免登录网页） |\n| 运维 | `GET /health`（聚合 DB / Redis / OSS / AI 上游） |\n\n---\n\n## 14. 部署与运维（**留空，待确定**）\n\n\u003e 按指示**本节不写方案**。只记录**硬约束**（不可协商）与**候选路径**，供后续拍板。\n\u003e 关键：部署是**最后一层** —— 无论选哪条路径，都**不影响** §7 表结构、§9 同步协议、§13 接口清单。\n\n### 14.1 硬约束\n\n| # | 约束 | 来源 |\n|---|---|---|\n| 1 | **不碰 SSH / 命令行客户端**，运维走**宝塔面板可视化** | 长期工作方式 |\n| 2 | 与现有业务**共机**（node0），不得影响现有服务；**重启需协调停机窗口** | 服务器复用决策 |\n| 3 | PG / Redis **只监听 `127.0.0.1`**；安全组**不放行** 3000 / 3100 / 5432 / 6379 | 安全基线 |\n| 4 | 单入口 `https://\u003c域名\u003e/api/v1/**`（零 CORS、复用证书、原生端一致） | §5.1 |\n| 5 | 必须换**正式 CA 证书**（现有 `certificate.pem` 是自签，`CN=yangyuting.cloud`，**iOS ATS 会直接拒连、Android 7+ 拒用户证书**） | §5.1 |\n| 6 | 迁移期 `/api/vision` **保留转发**，客户端切换完成后下线 | §5.3 |\n| 7 | 环境 dev / staging / prod 三套；密钥全部走**环境变量 + `.env`**（**不入库、不进镜像**）；现有 DashScope Key 沿用服务器环境变量 | — |\n\n### 14.2 候选路径（**待你选**）\n\n| 路径 | 适配你的习惯 | 代价 |\n|---|---|---|\n| **A. 宝塔 + PM2 + Nginx**（09-10 原案，**推荐**） | ✅ 完全贴合：宝塔「Node 项目」图形化启停、**Git 拉取部署**、一键重启、计划任务做备份 —— **你正在用这条路径跑现有 AI 网关，已验证** | 环境依赖装在宿主机，与现有业务共享 Node / PG |\n| **B. Docker Compose**（09-17 原案） | ❌ **冲突**：发布需执行 `docker compose pull \u0026\u0026 up -d`，与\"不碰命令行\"直接矛盾（除非包装成宝塔计划任务 / 脚本按钮） | 环境隔离更干净，回滚更简单（镜像 tag 回退） |\n| **C. 混合** | 🟠 可行：PG / Redis 用宝塔装（图形化管理），只把 API 放进容器 | 两套运维模型并存，心智负担高 |\n\n\u003e **倾向 A**：若语言最终选 Node（见 §4），路径 A 阻力最小 —— 宝塔 Node 项目管理器就是 PM2 的图形化，是你**已在用**的路径。\n\u003e 选 A 时，§7.1 的 PG 安装方式同步改为「宝塔软件商店 → PostgreSQL 16」。\n\u003e 具体域名 / 证书 / 备案 / 目录与端口分配，统一见 §15。\n\n---\n\n## 15. 待定项（实施前需补齐）\n\n| # | 项 | 阻塞级别 | 备注 |\n|---|---|---|---|\n| 1 | **语言 / ORM** | **阻塞** | ⚠️ **待确认**。推荐 **Node 22 + TS + Express 5 + Prisma**，见 §4 与《蓝图落地_后端技术选型重新分析.md》§1 |\n| 2 | **部署方式** | **阻塞** | ⚠️ **待确认（本节留空）**。候选：A 宝塔+PM2（推荐）/ B Docker Compose / C 混合，见 §14.2 |\n| 3 | **域名 + 正式 TLS 证书** | **阻塞** | 现为自签证书（`CN=yangyuting.cloud`），**iOS 会直接拒连**；定了才能定客户端 `BASE_URL` |\n| 4 | 备案 | 阻塞（若换新域名） | 大陆 443 需备案 |\n| 5 | **OSS 桶** | **阻塞**（上传相关） | 桶名（`blueprint-prod` / `blueprint-backup`）· **深圳 region** · AccessKey/Secret · 确认**私有读** |\n| 6 | ~~服务器~~ | ✅ **已定** | 复用阿里云 **node0 `47.106.123.210`**（华南1 深圳，16C32G）；新增 **40 GB ESSD PL0** 数据盘专供 PG |\n| 7 | ~~对象存储~~ | ✅ **已定** | **阿里云 OSS**（华南1 深圳，与 ECS 同地域 → 内网读免费），见 §8 |\n| 8 | PostgreSQL | 可后补 | 安装方式随 §14 部署方案定；先跑可用默认值 |\n| 9 | **`120.24.240.129` 归属** | **⚠️ 迁移前必须查清** | 跑**现有 AI 网关**的机器，但**不在账号内这 2 台实例中** → 可能属另一账号或已释放 |\n| 10 | DashScope | 阻塞（AI 迁移时） | 只需告知服务器上的变量名 |\n| 11 | **和风天气 Key** | **⚠️ 尽早导出** | 只在部署机 `server/config.py`，**仓库里没有**；删 CAD 前必须备份 |\n| 12 | **业务角色名单** | 可后补 | 设计上不写死（§6.1），先用 admin/editor/viewer |\n| 13 | 首个管理员账号 | 可后补 | 建库时 seed |\n| 14 | 推送通道 | 可后补 | 可先只做站内消息 |\n| 15 | 后端代码位置 | 可后补 | 建议独立新仓库（如 `blueprint-server`），与「网页版 CAD 项目」平级 |\n| 16 | 数据合规 | 可后补 | 工地照片含人脸/项目信息，影响留存与权限策略 |\n\n---\n\n## 16. 实施路线\n\n| 阶段 | 周期 | 内容 | 验收 |\n|---|---|---|---|\n| **P0 骨架与收敛** | 1–2 周 | 新仓库 + **PostgreSQL 16 + Redis 7**（装法随 §14 部署方案）+ ORM 首版建表与迁移 + JWT 登录 + 统一入口 + `/api/v1/ai/vision` 接管（含 schema 校验、记账）+ 天气迁移 | 客户端改一个 `BASE_URL` 后，**现有 AI 识别与天气功能零回归**；旧 `/api/vision` 保留转发 |\n| **P1 主链上云** | 2–3 周 | 项目 / 图纸 / 成员 / 缺陷 CRUD + 缺陷事件状态机 + **OSS 上传（预签名直传）** + 客户端 Repository 本地化 + SyncEngine（缺陷先行） | 两台设备协作一条缺陷：A 记录 → B 处置 → 施工方回复，双方状态一致且离线可写 |\n| **P2 全量同步 + 分享** | 2–3 周 | 巡场 / 量测 / 量房 / 拍照验收上行 + 增量同步 + 报告分享链接 + 站内通知 | 施工方扫码打开分享链接逐条回复；报告在线可查 |\n| **P3 治理与增值** | 持续 | AI 缓存与成本看板、缺陷知识库 RAG（`/ai/suggest`）、跨项目统计、多项目/多租户、审计合规 | AI 成本可见；整改建议来自历史缺陷库 |\n\n---\n\n## 17. 风险与明确不做\n\n**风险**\n\n| 风险 | 对策 |\n|---|---|\n| 离线优先 + 多人协作的冲突复杂度 | 只对「缺陷」主链做事件溯源，其余实体 LWW；不引入 CRDT |\n| 「同步」是最容易出错的部分（丢数据/重复数据） | 幂等键（`client_uuid` 唯一索引）+ seq 游标 + **`pg_advisory_xact_lock` 串行化序号分配（§9.3，否则静默丢数据）** + 游标过期全量重同步；P1 先只做缺陷一条链打通 |\n| 团队 1–3 人，运维税是最大敌人 | 模块化单体 + 单机部署，不上 K8s / 微服务 |\n| 现有 3 个硬编码 host、自签证书 | P0 一次性收敛，**换正式 CA 证书** |\n| **OSS 外网下行（唯一大额成本）** | 上传前压缩到长边 2048px + 列表走 400px `x-oss-process` 缩略图 + **AI 识别走内网 endpoint 读图（流量归零）**；下行 \u003e 300 GB/月且连续 2 个月才评估 CDN |\n| ⚠️ 语言 / 部署方式未定 | 均**不阻塞**原型验证：数据模型（§7）、同步协议（§9）、接口（§13）与语言无关；但**定下来之前不要开始写业务代码** |\n| 与现有业务共机（node0） | PG/Redis 只监听 127.0.0.1；PM2 设 `max_memory_restart`；**重启需停机窗口** |\n\n**明确不做**：Kubernetes、微服务拆分、GraphQL、自建 IM、实时协同（CRDT/WebSocket 协同编辑）、\n自研对象存储、**任何 CAD 转换能力**（已剥离至独立项目，见 `CAD_MIGRATION_BACKUP.md`）。\n\n---\n\n## 18. 变更记录\n\n### v2.0 · 2026-09-18\n\n**定位**：本文档为**后端开发的唯一指导**（09-10 的 `蓝图落地_后端架构技术方案.md` 降级为 **OSS 存储与服务器的依据来源**，其技术栈部分不再适用）。\n\n| # | 项 | v1.0（09-17） | **v2.0** | 依据 |\n|---|---|---|---|---|\n| 1 | **对象存储** | 腾讯云 COS（ap-guangzhou） | **阿里云 OSS（华南1 深圳）** | 你的指令 |\n| 2 | **服务器** | 复用 `120.24.240.129` | **阿里云 node0 `47.106.123.210`**（华南1 深圳，16C32G）+ 40 GB ESSD PL0 数据盘 | 你的指令 |\n| 3 | **部署** | Docker Compose + Nginx | **留空待定**（§14 只记硬约束 + 候选路径） | 你的指令 |\n| 4 | **缩图** | 服务端生成缩略图 | **OSS `x-oss-process`**，服务端不做图、不中转字节 | 09-10 §6.5 |\n| 5 | **变更流** | 「`bigserial` 严格递增，`seq \u003e` 无边界问题」 | **补 `pg_advisory_xact_lock` 串行化序号分配** | 修正原文档技术漏洞，§9.3 |\n| 6 | ⚠️ 语言 / ORM | FastAPI + SQLAlchemy + Alembic | **待确认**：推荐 Node 22 + TS + Express 5 + Prisma | 分析文档 §1 |\n| 7 | 成本 | — | **不评估**（已确定） | 你的指令 |\n\n**v1.0 保留不改的部分（内容质量高，全部采纳）**：\n18 张表结构 · 公共列约定（`client_uuid` / `version` / `deleted_at`）· seq 变更流机制 ·\n缺陷事件溯源与 LWW 分级 · 权限点而非角色 · 离线优先原则 · 幂等设计 · §10 AI 网关治理 ·\n§11 报告保留在客户端 · P0–P3 路线图 · §17 明确不做清单。\n\n\u003e 语言与 ORM 的完整论证（含被否决选项、翻盘条件、MySQL 的具体缺陷）见\n\u003e **`../蓝图落地_后端技术选型重新分析.md`**。\n"},{"id":"server/DXF_CALIBRATION_README.md","path":"server/DXF_CALIBRATION_README.md","url":"c2VydmVyL0RYRl9DQUxJQlJBVElPTl9SRUFETUUubWQ=","base":"DXF_CALIBRATION_README.md","title":"DXF → 自动校准种子生成","group":"后端与配套服务","scope":"current","date":"2026-09-17","mtime":"2026-09-17","size":3663,"chars":2095,"lines":62,"nhead":6,"lead":"## 轴网交点自动套图校准（建筑工程标准做法）","text":"# DXF → 自动校准种子生成\n\n## 轴网交点自动套图校准（建筑工程标准做法）\n\n已实现 `lib/core/cad/axis_auto_calibration.dart`（算法 + 测试全部通过）：\n\n**原理**：底图（PDF 渲染）上的轴线交点与 CAD 中的轴网交点是**同一几何网格**，\n分处像素坐标系与毫米坐标系。算法自动做：\n1. 底图侧：`detectAxisLines` 识别横/竖轴线 → `axisIntersections` 求交点（像素）\n2. CAD 侧：从 DXF 轴网层提取交点（毫米）→ 打包 JSON 随 App 加载\n3. `matchAxisGridDeterministic`：利用轴网**行列结构**一维投票匹配（X/Y 方向独立\n   求 scale 与平移），组合行列对应 → 交点对\n4. `fitAffineRobust` 最小二乘仿射拟合 → 全自动 \u003c1mm 校准\n\n同时修复了一个重要 bug：`fitAffineLeastSquares` 的 Y 维 d/e 系数顺序与\n`CadCoordMapper.screenToWorld` 语义不符（无旋转时无影响，含旋转的完整仿射\n拟合会出错）——现已交换修正，手动多点校准与自动套图均受益。\n\n**数据需求**：CAD 侧轴网交点须从**含完整轴网的 DXF** 提取。天正 DWG 经 ODA\n直转会丢失天正自定义轴网对象（实测 D01 只剩竖线、B01 几何全在块内）。\n→ **需在装有天正的机器上用「文件布图 → 整图导出 → T3（2013）」** 导出\n`B01_T3.dxf`（组合平面轴网最完整），我再用 `extract_axis_intersections.py`\n提取交点 JSON 打包进 App，即可全自动套图校准。\n\n`extract_axis_intersections.py` 用法：\n```bat\ncd /d F:\\建筑验收工具\\site-patrol\\server\npython extract_axis_intersections.py server\\dwg_cache\\B01_T3.dxf server\\axis_data\\dy04_7_B01.json\n```\n\n## 最新状态（2026-08-26）\n\n- ✅ **ODA File Converter 已在本机安装**：`C:\\Program Files\\ODA\\ODAFileConverter 27.1.0\\OdaFileConverter.exe`\n- ✅ **D01 / D03 / B01 已成功转为 DXF**：`server/dwg_cache/D01.dxf`、`D03_D04.dxf`、`B01.dxf`\n- ✅ **三张图内置估算种子已写入** `drawing_viewer_page.dart` 的 `_builtinCalibrationFor`：\n  - B05：真实视口校准（\u003c2mm，已验证）\n  - D01 / D03：剖面图 1:150 估算初值，App 打开即近似自动校准\n  - B01：地下一层顶板组合平面图，天正组合平面（模型空间跨度异常 ~1.5e8mm），按 1:100+A1 估算初值\n- ⏳ **三张图的最终 c/f 偏移需精修**：天正模型空间大坐标 + 底图为局部渲染，无法自动锁定偏移。\n  **请在 App 内用「图上多点校准」录入 2~3 个已知坐标点，即可收敛到 \u003c2mm 并持久化**（内置种子作为初始值）。\n\n## 自动转换（已固化脚本）\n\n```bat\ncd /d F:\\建筑验收工具\\site-patrol\\server\npython dwg_to_dxf.py          # 转换 dwg_cache 下所有 .dwg\npython dwg_to_dxf.py B01.dwg  # 仅转换指定文件（B01 真实源到位后执行）\n```\n\n转换成功会生成同名 `.dxf`；失败会生成 `\u003cname\u003e.dxf.err` 占位，可据此判断源文件是否有效。\n\n## D01 / D03 已探测到的关键信息\n- 标注比例：**1:150**（剖面图）\n- D01 轴网层范围（模型空间）：X[-101940, -85331]，Y[875680, 896200]\n- D03 轴网层（AXIS）范围：   X[-41904, 39546]，  Y[685215, 890352]\n- 注意：天正图模型空间含多栋/参照，整体 extents 跨度极大，**不能**直接用整体范围推算 a/d，\n  故采用「1:150 + 标准图幅」估算初值，最终由 App 多点校准精修。\n\n## 老流程（参考）\n原 `derive_calib_from_dxf.py` 基于\"布局视口\"推算，适用于有 Paperspace 视口的图纸（如 B05）。\n对天正模型空间图不适用，已改用上述估算 + App 交互校准方案。\n"},{"id":"DESIGN_TOKENS.md","path":"DESIGN_TOKENS.md","url":"REVTSUdOX1RPS0VOUy5tZA==","base":"DESIGN_TOKENS.md","title":"site-patrol 设计规范（Design Tokens \u0026 UI 约定）","group":"设计规范","scope":"current","date":"2026-09-18","mtime":"2026-09-18","size":19888,"chars":12921,"lines":314,"nhead":33,"lead":"本项目是 Flutter 工地巡检 / 验收 App。本文件是全 App UI 的唯一权威规范——设计令牌、字号阶梯、组件形态、图标体系、常见陷阱都在这里。","text":"# site-patrol 设计规范（Design Tokens \u0026 UI 约定）\n\n\u003e 本项目是 Flutter 工地巡检 / 验收 App。本文件是**全 App UI 的唯一权威规范**——设计令牌、字号阶梯、组件形态、图标体系、常见陷阱都在这里。\n\u003e\n\u003e **最后校对：2026-09-10**（与 `lib/core/theme/design_tokens.dart`、`lib/core/theme/app_theme.dart` 逐值核对，token 值以代码为准；两者若不一致，改代码后必须回来同步本文）。\n\u003e\n\u003e ⚠️ **本文不是程序读取的配置文件**，只是编辑清单。改这里的值不会生效——必须同步改 `design_tokens.dart` / `app_theme.dart` 的常量，然后跑 `flutter analyze` + 重新构建。\n\n---\n\n## 一、文件位置\n\n| 内容 | 文件 | 说明 |\n|---|---|---|\n| 设计令牌（颜色 / 间距 / 圆角 / 阴影 / 尺寸 / 按钮档） | `lib/core/theme/design_tokens.dart` | `AppTokens` 类，全部 `static const` |\n| 主题（字体 / 字号阶梯 / 组件默认样式） | `lib/core/theme/app_theme.dart` | `lightTheme`（唯一主题，巡场页已统一为浅色） |\n| 通用组件 | `lib/shared/widgets/` | `AppCard` / `AppButton` / `AppBottomSheet` / `NavIconButton` / `StatusBadge` / `SectionTitle` / `AppBottomNav` |\n\n改 UI 前**先查这里**有没有现成组件/令牌；没有再考虑新建，并在本文补登记。\n\n---\n\n## 二、调色板总览\n\n```\n主色     accent = brand = #0395FF（品牌蓝，全局主操作色）  accentSoft = #E6F5FF\n语义色   success #34C759   warning #FF9500   danger #FF3B30   （各带 Soft 块面底 + Tint 标签底）\n标签浅底 brandTint / successTint / warningTint / dangerTint / yellowTint（= 原色 5% 透明度）\n背景     bg #F4F6F7   surface #FFFFFF   surface2 #F4F6F7   surface3 #E9EAEB\n文字     fg #202224   fg2 #60656B   muted #919499   note #B5B9BF\n边框     border #E9EAEB\n```\n\n\u003e ⚠️ **历史遗留已废弃**：早期版本用过浅金 `#FAE286` 作 accent、iOS 蓝 `#007AFF` 作 brand、黑色 `#222222` 作 fg、圆角统一 5。这些**全部已下线**，代码中不应再有残留；看到旧值一律按本表纠正。\n\n---\n\n## 三、完整令牌清单\n\n### 1. 主色\n\n| Token | 值 | 用途 |\n|---|---|---|\n| `accent` | `#0395FF` | **全局主操作色**（实色按钮底、描边按钮边框、文字按钮字色、选中态图标） |\n| `accentHover` | `#0284E6` | 悬停加深 |\n| `accentActive` | `#0273CC` | 按下 / 激活 |\n| `accentSoft` | `#E6F5FF` | 图标容器底、选中 chip 底（块面级浅底） |\n| `brand` | `#0395FF` | 与 `accent` 同值，语义上用于「品牌 / 图纸 / 链接」，两者可互换 |\n| `brandHover` | `#0273CC` | |\n| `brandSoft` | `#E6F5FF` | |\n\n\u003e 主色只有**一个蓝家族**，不再区分 accent（金）与 brand（蓝）。\n\n### 2. 语义色\n\n| Token | 值 | Soft（块面底，图标容器用） | Tint（标签底，= 原色 5%） |\n|---|---|---|---|\n| `success` 成功 / 已整改 | `#34C759` | `successSoft #E6F8ED` | `successTint` |\n| `warning` 警告 / 待整改 / 较重 | `#FF9500` | `warningSoft #FFF3E0` | `warningTint` |\n| `danger` 危险 / 严重缺陷 | `#FF3B30` | `dangerSoft #FFEBEA` | `dangerTint` |\n| — 一般（黄） | 用 `warningSoft` 系的黄 | — | `yellowTint #0DFADC19` |\n\n**Soft vs Tint 的区别**（容易用错）：\n- `Soft` = 实色浅底，用于**块面**（30–40px 图标容器、整块提示背景）。\n- `Tint` = 标签原色的 **5% 透明度**（`0x0D` 前缀），用于**小标签胶囊底**（`StatusBadge`）。\n- **例外**：灰标签（类型 / `#自定义标签` / 楼栋楼层）不用 tint，仍用 `surface2 #F4F6F7` 实色底——因为灰 tint 会透出背景差异。\n\n### 3. 背景与表面\n\n| Token | 值 | 用途 |\n|---|---|---|\n| `bg` | `#F4F6F7` | 页面全局背景 |\n| `surface` | `#FFFFFF` | 卡片 / 弹层表面 |\n| `surface2` | `#F4F6F7` | 次级填充：图标底、小标签底、内嵌子容器（与 `bg` 同值，靠 Hank 卡片白底区分） |\n| `surface3` | `#E9EAEB` | 输入框 / 禁用态灰底 / 未激活圆点 |\n\n### 4. 文字\n\n| Token | 值 | 用途 | 用量参考 |\n|---|---|---|---|\n| `fg` | `#202224` | 主文字 | — |\n| `fg2` | `#60656B` | 次级文字（副标题、说明、未选中态） | — |\n| `muted` | `#919499` | 辅助弱化（时间戳、计数、单位） | — |\n| `note` | `#B5B9BF` | 最弱一档：脚注 / 补充说明（当前 4 处引用） | 少用 |\n\n### 5. 边框 / 阴影 / 固定字色\n\n| Token | 值 | 用途 |\n|---|---|---|\n| `border` | `#E9EAEB` | 分割线、卡片细边框 |\n| `onAccent` / `onBrand` | `#FFFFFF` | 蓝底上的白字 |\n| `elevationRaised` / `elevationOverlay` / `elevationNone` | 全部返回空列表 `[]` | **全 App 扁平化：卡片无投影**。令牌保留仅为兼容旧引用 |\n\n\u003e **不要在卡片上加 `boxShadow`**。唯一允许投影的场景：`boxShadow` 浮动工具条（如悬浮缩放控件），其余一律扁平。\n\u003e **不要给纯展示型白卡加灰色描边**（白底置于 `#F4F6F7` 上已足够分离）。例外：输入框外壳（靠描边界定唯一边界）、分段胶囊每一片、带阴影的浮动条。\n\n### 6. 巡场主题令牌（已统一为浅色）\n\n`patrolBg`=`bg`、`patrolSurface`=`surface`、`patrolSurface2`=`surface3`、`patrolFg`=`fg`、`patrolMuted`=`muted`、`patrolBorder`=`border`。深色沉浸主题**已下线**，巡场页与其他页面视觉一致。\n\n### 7. 间距（4px 网格，7 档）\n\n| Token | 4 · 8 · 12 · 16 · 24 · 32 · 48 |\n|---|---|\n| 对应 | `space1` `space2` `space3` `space4` `space5` `space6` `space7` |\n\n只有这 7 档，**不再有 20 / 40**（写 20 就近取 24 或 16，写 40 取 48 或 32）。\n\n### 8. 圆角\n\n| Token | 值 | 用途 |\n|---|---|---|\n| `radiusLg` | **12** | 外层卡片（`AppCard` 默认）、Card 主题、ListTile 外层 |\n| `radiusSm` / `radiusMd` / `radiusXl` | **8** | 内层卡、小图标容器、输入框、小标签、SnackBar |\n| `radiusButton` | **12** | 主操作按钮（实色 / 描边 / 文字三形态统一） |\n| `radiusPill` | 999 | 胶囊：状态徽章、筛选 toggle、FAB、section 副标题胶囊 |\n\n\u003e **外层 12 / 内层 8** 是核心规律：白卡套嵌时，外圆角必须比内圆角大。\n\n### 9. 结构尺寸\n\n| Token | 值 | 用途 |\n|---|---|---|\n| `tabbarH` | 49 | 底部 Tab 栏（iOS 标准 49pt，不含底部安全区） |\n| `statusbarH` | 28 | 状态栏参考高度 |\n| **导航栏 `toolbarHeight`** | **48** | **全局统一**，见 §五 |\n\n\u003e 导航栏高度写死在 `appBarTheme.toolbarHeight: 48`，`home / capture / projects / drawing_viewer / defects(×2)` 亦显式写 48。**状态栏不写死**，交给 `AppBar` + `SafeArea` 自适应。\n\n---\n\n## 四、Typography\n\n### 字体\n\n**内置小米 MiSans**（家族名 `MiSans`，免费商用），常量 `AppTokens.fontFamily`。四档字重：\n\n| 权重槽 | 使用的官方文件 | pubspec weight | 实测笔画指数（Regular=1.00） |\n|---|---|---|---|\n| `w400` | MiSans-Regular | 400 | 1.00 |\n| `w500` | MiSans-Medium | 500 | 1.32 |\n| `w600` | MiSans-Demibold | 600 | 1.54 |\n| `w700` | MiSans-Semibold | 700 | 1.77 |\n\n\u003e ⚠️ **Semibold 文件的 OS/2 `usWeightClass` 也写成 600**（小米源字体元数据瑕疵）。Flutter 不读 TTF 元数据、只认 pubspec 声明，所以 App 内正常；但导出 PDF / Web CSS / Office 时工具会读 TTF，Semibold 会与 Demibold 撞成同一档导致加粗层级塌陷。**导出场景若需真 700，应换 `MiSans-Bold`**。\n\u003e 字体文件是子集（`tools/build_ui_font.py --all` 生成，约 5.3 MB/档），**保留 GSUB/GPOS**（kerning / 连字），只丢竖排表。UI 子集一定不能丢排版表。\n\u003e `fontFamilyFallback`：PingFang SC → Microsoft YaHei → Noto Sans CJK SC（仅兜底生僻字）。\n\u003e PDF 报告 / 服务端仍用 `assets/fonts/NotoSansSC-Regular.ttf`，与 UI 字体互相独立，**不要删**。\n\n### 字号阶梯（六档，只用偶数）\n\n`32 / 22 / 16 / 14 / 12 / 10`；字距统一 **0**；**行高 = 字号 + 8**（代码写成 `(字号+8)/字号` 的分数形式）。\n\n| 样式名 | 字号 | 行高 | 字重 | 用途 |\n|---|---|---|---|---|\n| `displaySmall` | 32 | 40 | w700 | 大标题（项目名） |\n| `headlineMedium` | 22 | 30 | w700 | 页面大标题 |\n| `titleLarge` | 16 | 24 | w700 | 卡名 / 强调标题 |\n| `titleMedium` | 16 | 24 | **w500** | 卡内次级标题 |\n| `bodyLarge` | 16 | 24 | w400 | 正文 |\n| `bodyMedium` | 14 | 22 | w400 | 正文次级 |\n| `bodySmall` | 12 | 20 | w400 | 辅助文字（`muted` 色） |\n| `labelLarge` | 16 | 跟随字体 | w700 | 按钮 / 强调 |\n| `labelMedium` | 12 | 跟随字体 | w700 | 次级按钮 |\n| `labelSmall` | 10 | 跟随字体 | w700 | 小标签 / 徽章 |\n\n### 字重使用原则\n\n代码实测用量：**w600（102 处）\u003e w400（66）\u003e w700（42）\u003e w500（39）**。\n\n- **w400** 正文 / 次要说明。\n- **w500** 次级标题、选中态文字、弹窗说明文本的值。\n- **w600 是主力强调档**——页面标题、区块标题、卡片标题、按钮外的关键数据。\n- **w700** 仅留给页面大标题（20–22px）与弹窗标题，避免满屏加粗。\n- 规则：**层级越高字越重**；一屏内重档 ≤ 2 个；能用字号 / 颜色解决的不要靠加粗。\n- `NumText` 数字组件固定 `height: 1`（单行大数字）并启用 tabular-nums。\n\n---\n\n## 五、组件规范\n\n### 1. 导航栏（AppBar）\n\n- 高度 **48dp**；标题样式写在 `appBarTheme.titleTextStyle`（16 / w700 / `#202224`）。\n- 各页面标题 `centerTitle`、次行信息等见下方页面约定表。\n- **返回箭头踩坑（已两次踩）**：\n  1. `IconButton` 默认 `padding: EdgeInsets.all(8)`，图标会比按钮边缘再缩进 8px。`NavIconButton` 已改为**水平完全贴边**（`padding: symmetric(vertical: 10)` + `minWidth: 24 / minHeight: 44`），**横向边距完全由调用处 Padding 控制**，全局统一 `Padding(left/right: 12)`。\n  2. `AppBar` 对 `leading` 会强制 `ConstrainedBox(tightFor(width: leadingWidth))`（默认 56），内层 Padding 会把剩余宽度紧约束给子组件 → 图标被居中、视觉偏移。**正解：显式设 `leadingWidth = 边距(12) + 图标宽`**（24 图标 → **36**，18 图标 → **30**），再配 `Padding(left: 12) + NavIconButton`。\n- 路由返回统一用 `context.pop()`（go_router）。\n\n**各页面导航栏约定**：\n\n| 页面 | 路由 | 标题 / 内容 | leadingWidth |\n|---|---|---|---|\n| 首页 | `/home` | `ProjectSwitcher`（项目名 16/w600/#202224 + `down_small_fill` 24）+ 次行**仅施工状态** 12/w400/#60656B；右侧 `UserSwitcher`(`menu_line`) | — |\n| 图纸 | `/projects` | 标题「图纸」20/w600/#202224（行高 28）+ `UserSwitcher`，gap 12，padding 8 12 | — |\n| 验收 | `/capture` | 同上结构 | — |\n| 巡场 | `/patrol` | — | — |\n| 工单 | `/defects` | 标题「工单」20/w600/#202224 + `UserSwitcher`，padding 8 12 | — |\n| 二级页（record_detail / patrol_editor / ar_measure×2 / measure_page / blueprint_viewer / timeline_compare） | — | 返回键 + 标题 | **36** |\n| defects 页「处置与回复」、capture_records 页「验收记录」（18 图标） | — | 返回键 + 标题 | **30** |\n\n\u003e 单标题页：48 = 28 标题行 + 10 上下内边距；双行页：48 = 24 + 20 紧贴。\n\n### 2. 底部导航（`AppBottomNav`）\n\n纯白底 `#FFFFFF`（**无顶部描边**），高 `tabbarH` 49，文字 **16 / w600**，选中 `AppTokens.brand`、未选中 `AppTokens.muted`。映射：\n\n`项目`→`/home` · `图纸`→`/projects` · `验收`→`/capture` · `巡场`→`/patrol` · `工单`→`/defects`\n\n### 3. 卡片（`AppCard`）\n\n`surface` 白底 + `radiusLg` 12 + **无阴影** + `elevationRaised`（空） + 内边距默认 `space4` 16。支持 `onTap`（自带 InkWell）。内层子容器用 `radiusSm` 8 + `surface2` 底做信息分组。\n\n### 4. 按钮（`AppButton`）\n\n三档 × 三形态。**高度为严格值**（`min==max` + `tapTargetSize.shrinkWrap`，否则 Material 默认会把 md/sm 撑到 48、lg 撑到 56）。\n\n| 档 | 高度 | 横向 padding 下限 | 字号 | 圆角 | 字重 | 行高 |\n|---|---|---|---|---|---|---|\n| `AppButtonSize.lg` | 48 | 24 | 16 | 12 | w700 | 24 |\n| `AppButtonSize.md`（默认） | 36 | 12 | 14 | 12 | w700 | 22 |\n| `AppButtonSize.sm` | 32 | 12 | 12 | 12 | w700 | 20 |\n\n- 形态：`filled`（实色 `accent` 底 + 白字）/ `outlined`（透明底 + `accent` 描边 + 蓝字）/ `text`（纯文字蓝）。\n- **纯文字、不带图标**；`AppButton` 已移除 icon 参数，大按钮禁止「图标 + 文字」组合。\n- 宽度自适应；满宽传 `width: double.infinity`。\n- 直接用 `OutlinedButton` / `FilledButton` 时，`AppTheme` 已把圆角设为 `radiusButton` 12 ——**不要再显式覆盖成 `radiusMd`(8)**（历史上 capture 页「添加量尺项」踩过）。\n\n### 5. 底部弹窗（`AppBottomSheet`）\n\n统一壳（设计稿 Frame 2147228008）：\n\n- 遮罩 `#000` 50%；sheet 背景 **`bg #F4F6F7`**；顶部圆角 **24**。\n- 头部 **高 48**：标题居中 16 / w600 / `#202224`，右上 **`closeMediumLine`** 24×24、`#09244B`。\n- 内容区 `EdgeInsets.fromLTRB(12, 0, 12, 24)`，头部与内容间距 12。\n- 选图 / 详细信息 / 修改名称等**一律走它**，不要自写 `showModalBottomSheet`。\n\n### 6. 小组件\n\n| 组件 | 规范 |\n|---|---|\n| `SectionTitle` | 主标题 16 / w600 / `fg`；副标题徽标 `surface2` 实色底灰字；右侧「查看全部」12 / w400 / `muted` + 16px 箭头 |\n| `StatusBadge` | 胶囊 999，`horizontal 10 / vertical 4`，12 号字；**底色默认 = 文字色 5% 透明**（灰标签显式传 `bg: surface2`）；字重默认兼容 w700，新代码按标签规范传 **w400** |\n| `NavIconButton` | 见 §五.1；默认 24 尺寸，无 hover / splash / focus 背景（web 桌面端不显示圆形高亮） |\n\n---\n\n## 六、图标体系\n\n- **全项目统一 MingCute**（`flutter_mingcute` 包），写法 `MingCuteIcons.xxx`，风格优先取 `xxxLine`（描边风，与整体扁平一致）。\n- 已无 Material `Icons.xxx` 与 lucide 引用。统计残留时要用词边界 `\\bIcons\\.`，否则会被 `MingCuteIcons.` 的子串严重误报。\n- 仅保留 3 张自定义 PNG：`assets/icons/capture.png`、`drawings.png`、`patrol.png`。\n- **图标 + 文字对齐**（用户反复强调，最容易漏，且**极易修反方向**）。\n  - **根因**：`Row` 的 `crossAxisAlignment: center` 居中对齐的是「子组件占的盒子」，不是盒子里的墨迹。`Text` 的盒子 = 字号 × 行高，而字形的墨迹中心并不在盒子几何中心上 → 光写 `center` 救不了，必须锁 `height`。\n  - **⚠️ 锁多少不是 1.0**（历史踩坑：曾把 `height: 1` / `1.1` 当正确答案批量写入 77 处，方向是反的）。`TextStyle.height` 是**对字体度量行高的等比缩放**，而 MiSans 的 `hhea` 度量严重不对称（ascent 1.044 / descent 0.282），于是：\n    - `height: 1.0` → 墨迹**偏上**约 0.10 字号（14px 字约偏 1.4px）\n    - `height: 22/14 ≈ 1.57` → 偏下约 0.07 字号\n    - **墨迹真正居中的校准值 ≈ 1.34**（四档字重实测 1.33~1.36，取 1.34 时偏差 \u003c 0.1px）\n  - 写法：`style: TextStyle(..., height: AppTokens.heightCalibrated)`（常量 = 1.34，定义在 `design_tokens.dart`）。**不要再写 `height: 1` / `1.1`**。\n  - **`StrutStyle(forceStrutHeight: true)` 会覆盖 `TextStyle.height`**：带 strut 的文字，行框与墨迹位置由 **strut 的 `height`** 决定。这类位置必须把 **strut 的 height 也改成校准值**，只改 `TextStyle.height` 无效。（已修点：首页「日期 | 查看全部」、`_person`、导航栏项目名。）\n  - 竖排：`Column(crossAxisAlignment: center, mainAxisSize: min, ...)`。\n  - **共享样式冲突**：`AppBottomSheet.helperStyle` 行高是 `22/14`，作纯段落说明没问题，但**与图标横排时必须 `.copyWith(height: AppTokens.heightCalibrated)` 局部覆盖**，不要改共享样式本身（会影响其他引用）。\n  - **回归检查**：改完 UI 跑 `python3 tools/scan_icon_text_align.py`（`--strict` 有命中则退出码 1）。它自动排除 `ElevatedButton.icon` / `Chip` / `ListTile` 等自管布局组件，并要求图标是 Row 的**直接子级**（嵌套子 Row 里的图标与本级文字不同层，不算横排）。脚本**校验的是值是否为校准值**，不只是「有没有写 height」。\n  - **一次性迁移**：`python3 tools/migrate_icon_text_height.py`（默认 dry-run，确认后加 `--apply`）。\n\n---\n\n## 七、布局 / 自适应硬规则\n\n1. **标签 / 胶囊流一律用 `Wrap`**（`spacing: 4`、`runSpacing: 4`），不用 `Row` 排一排。已整改点：首页待办卡标签、工单筛选文本组、图纸页楼层卡。\n2. `Row` 内可变长文本必须 `Expanded` / `Flexible` + `maxLines: 1` + `overflow: ellipsis`；两个并列名字各包一层 `Flexible`。\n3. **不写死设计稿宽度**；需要按稿缩放时用 `LayoutBuilder` 按可用宽度等比计算。\n4. 多行标题 / 状态文字加 `StrutStyle(forceStrutHeight: true)` 锁行高，防撑破固定高容器。\n5. 排查脚本（用于自查漏网）：扫「`Row(` 内无 `Expanded/Flexible/Spacer` + `width:\u003e=280` + Row 内 Text 无截断」，跳过 `report_pdf/docx/report_builder`（那是生成文档的代码，非屏幕 UI）。\n6. **黄黑溢出条纹只在 Debug 出现**，Release 不显示但错位照样存在——看见了必须真修，不能当作 Debug 专属现象忽略。\n\n---\n\n## 八、修改后如何生效\n\n```bash\n# 1. 同步改 design_tokens.dart / app_theme.dart 的常量\n# 2. 基线校验：flutter analyze 必须保持 \u003c= 212 条且零新增\nflutter analyze\npython3 tools/scan_icon_text_align.py   # 图标+文字横排对齐回归检查\n\n# 3. 构建 Web 预览（长命令放后台）\nflutter build web --release --no-source-maps --pwa-strategy=none\npython3 tools/post_build_web.py     # 必跑：删 sw + 注入自清理脚本\n\n# 4. 起预览服务（先清端口，否则绑不上、会一直服务过期副本）\npkill -f \"http.server 8080\"; pkill -f serve_web.py\npython3 tools/serve_web.py          # http://127.0.0.1:8080\n```\n\n\u003e **Flutter Web 的 service worker 会缓存旧资源**，不做第 3 步刷新永远是旧界面；用户用内置浏览器没有 DevTools，只能靠 `post_build_web.py` 根治。\n\u003e 排查「预览没变化」：先 `ls -la build/w
