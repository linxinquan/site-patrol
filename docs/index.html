eb/main.dart.js build/web/index.html` 核对时间戳，再判断是不是缓存。\n\n### iOS / 安卓真机\n\n- **本环境无法命令行构建 iOS**（`xcodebuild` / `flutter build ios` 内嵌 `sandbox-exec` 被宿主沙箱禁），只能走 **Xcode GUI** 用 `Runner.xcworkspace`，构建前 `pod install`。\n- 签名 Team `9G3493XTT5`（Automatic）；真机 **Yang**（UDID `00008120-0012284936B8201E`）。相机 / AR / 语音仅真机可用。\n- 免费账号 7 天有效期。**拔线使用**：Edit Scheme → Run → Info → Build Configuration 改 **Release** → ⌘R 重装（Debug 包拔线必触发 Flutter iOS 14+ JIT 限制）。调试时切回 Debug。\n\n---\n\n## 九、版本基线\n\n- `flutter analyze`：**212 条**（改动后须持平、零新增）。这 212 条是历史存量，非本次改动引入；其中 `test/capture_records_test.dart` 有若干 error（ProviderContainer 相关），也是历史遗留。\n- `tools/gen_b05_walls.dart` 内含 1 条预存 info，属预期。\n- 新增代码若导致 212→213，先定位到具体文件（`flutter analyze | grep \u003cfile\u003e`）修掉，不要整体放宽基线。\n- **比对基线要排除行号偏移**：加注释会让存量 lint 的行号整体后移，`comm` 对比时会显示一大批假「新增」。正确做法是比较 `file:line:col • rule` 且忽略行号，或用 `git stash` 前后各跑一次取差集后人工核对。\n"},{"id":"UI_PREFERENCES.md","path":"UI_PREFERENCES.md","url":"VUlfUFJFRkVSRU5DRVMubWQ=","base":"UI_PREFERENCES.md","title":"工地验收 App · UI 设计偏好记录","group":"设计规范","scope":"current","date":"2026-09-15","mtime":"2026-09-15","size":7148,"chars":3737,"lines":139,"nhead":18,"lead":"更新日期：2026-08-15 用途：记录用户在历次迭代中确认的 UI 设计偏好与决策，后续开发/修改 UI 时优先遵循本清单，避免重复沟通、节省积分。","text":"# 工地验收 App · UI 设计偏好记录\n\n\u003e 更新日期：2026-08-15\n\u003e 用途：记录用户在历次迭代中确认的 UI 设计偏好与决策，后续开发/修改 UI 时**优先遵循本清单**，避免重复沟通、节省积分。\n\n\u003e ⚠️ **2026-09-10 校对说明**：本文件是**历史偏好记录**。**凡涉及设计令牌 / 配色 / 字号 / 圆角 / 字体 / 组件形态，一律以 `DESIGN_TOKENS.md` 为准**（该文件已于 2026-09-10 与代码逐值校对）。\n\u003e 已知的过时条目：\n\u003e - §〇 第 2 条「`#F2F2F7` 浅灰底、SF 字体栈」→ 现为 `bg #F4F6F7` + 内置 **MiSans**（SF 概念已废弃）。\n\u003e - §二 颜色规则中的 `accent（橙）` / `brand（蓝）` 双主色 → 现已合并为**单一品牌蓝 `#0395FF`**，进度节点的当前/未来两色需向设计确认后再用语义色替换。\n\u003e - §三 中的分级色（红 `#DC2626` / 橙 `#EA580C` / 黄 `#CA8A04` / 绿 `#16A34A`）属**旧语义色**，现行语义色见 `DESIGN_TOKENS.md` §三.2。\n\u003e - §七 构建命令请改用 `DESIGN_TOKENS.md` §八（含 `post_build_web.py` service-worker 清理步骤，缺了会导致预览不更新）。\n\u003e **保留有效**的部分：布局优先级与模块顺序（§〇、§六）、节点尺寸与日期格式（§二）、自定义标签样式（§三）、Defect 模型字段（§四）、项目数据调研（§五）。\n\n---\n\n## 〇、总原则\n\n- 首页布局优先级：**快捷操作 → 今日待办 → 项目大事记** 是重点；项目卡片/指标条是弱化信息。\n- iOS 风格扁平化设计（`design_tokens.dart` 的 `#F2F2F7` 浅灰底、SF 字体栈）。\n- **避免信息重复**：同一个项目信息不要在顶部 AppBar 和内容区重复显示两遍。\n- 弱化非重点信息（如进度百分比、项目指标条），突出核心功能与动态内容。\n\n---\n\n## 一、顶部 AppBar / 项目信息区\n\n1. **不要显示「工地验收」标题**（App 名只在登录界面显示「工地巡检」）。\n2. 顶部 AppBar 放**项目信息**（蓝框区域）：\n   - 第 1 行：项目切换按钮（项目名 + chevron 箭头），复用 `ProjectSwitcher`\n   - 第 2 行：**当前时间（实时 HH:mm）· 天气（mock 占位）· 项目状态标签**\n3. 新增 `_ClockText` 实时时钟组件（30 秒刷新），`_StatusTag` 小标签。\n4. 项目信息结合进度：顶部可放项目进度摘要，但进度 % 要**弱化**（非重点）。\n\n---\n\n## 二、项目进度时间轴（首页核心模块）\n\n### 布局\n- **横向滚动**（ListView，可左右拖动），节点等宽排布，竖向：日期 → 圆点+连接线 → 名称。\n- 节点宽度 **82px**，节点高度 **80px**。\n- 首屏自动定位：让当前节点落在视口**左侧 1/3** 处，右侧留空间提示可滚动。\n\n### 颜色规则（关键，勿改错）\n| 节点状态 | 圆点/文字/连接线颜色 |\n|---|---|\n| 已结束 | **灰色淡显**（`muted`）|\n| 当前进行中 | **主题色 `accent`（橙）** + 橙色光环 + 加粗 |\n| 未来未发生 | **蓝色 `brand`** |\n\n- 连接线在节点内部绘制（左连接线 + 圆点 + 右连接线），首项省略左线、末项省略右线，形成连续视觉。\n- **不要用 Stack + CustomPainter 画贯穿线**（会拦截滚动，已踩坑）。\n\n### 日期显示\n- 时间轴显示 **`YY-MM-DD`**（如 `26-08-31`），日期字号 **9.5**、等宽数字（tabular figures）。\n- 只有月份的节点**统一取当月最后一天**（如 `2024-09` → `2024-09-30`）。\n- 完整日期（YYYY-MM-DD）在**点击节点弹出的底部 Sheet** 中显示。\n\n### 字号 / 节点尺寸（已确认）\n- 节点宽 82px、高 80px\n- 日期字号 9.5、节点名称字号 10.5（行高 1.3）\n- 进度条淡化：高度 4、填充色 `brand` 35% 透明、背景 `surface2`、百分比字号 12 灰色\n\n### 滚动\n- web 上横向 ListView **鼠标左键拖不动**是默认限制，需用自定义 `_MouseDragScrollBehavior`（`dragDevices` 加 `mouse`/`trackpad`）。\n- 节点点击（GestureDetector）→ 弹底部 Sheet 显示节点名称 + 完整日期 + 状态。\n\n---\n\n## 三、待办事项 / 缺陷列表项\n\n每个缺陷项展示（`_TodoItem`），按 2 行主体结构：\n\n1. **第 1 行**：类型分类标签（蓝底，`_categoryTag`）+ 缺陷名\n2. **第 2 行（Wrap 自动换行）**：紧急等级标签 + 具体类型 + 楼层 + **自定义标签（`_plainTag`）**\n3. **第 3 行**：记录人 👤 + 责任人/单位 🏢\n\n### 标签样式\n- **类型分类标签**（建筑/结构/装饰/给排水/暖通/电气/其他）：蓝底 `brandSoft` + 蓝色字\n- **紧急等级标签**（红区/橙区/黄区/绿区）：对应色 soft 底 + 对应色字（`_severityTag`）\n- **自定义标签**（结构安全、深基坑区域等）：**深灰色细边 + `#` 前缀**，低调不突兀（`_plainTag`），**无背景填充**\n\n### 紧急程度色（左侧色条 + 标签）\n| 等级 | 处置 | 颜色 |\n|---|---|---|\n| 红区 | 停工上报 | 红 `#DC2626` |\n| 橙区 | 限期整改 | 橙 `#EA580C` |\n| 黄区 | 即查即改 | 黄 `#CA8A04` |\n| 绿区 | 常规观察 | 绿 `#16A34A` |\n\n---\n\n## 四、Defect 模型字段约定\n\n`Defect` 已扩展以下字段（全部有 mock 数据）：\n- `category: DefectCategory`（7 类枚举）\n- `severity: DefectSeverity`（红/橙/黄/绿 4 级）\n- `tags: List\u003cString\u003e`（自定义标签，UI 最多取前 3 个）\n- `reporter`（记录人）\n- `respUnit`（责任单位）+ `resp`（责任人+单位）\n\n---\n\n## 五、项目数据（责任单位已联网核实）\n\n### 7栋（腾讯大铲湾 DY01-04 街坊）\n- 用地 12.62万㎡ ✅ / 总建面约 83万㎡\n- **机电/安装：中建四局**（DY01-04 街坊给排水/电气/暖通/消防）\n- **云楼幕墙：方大建科**（3.64 亿中标，2022-12-01）\n- 设计：MAD 建筑事务所 + 深圳建筑设计研究总院\n- ⚠️ 结构施工总包未查到独立公开名，缺陷责任单位用**中建四局**代指（勿写中建八局）\n\n### 南科大附属医院（校本部）\n- 建设单位：深圳市建筑工务署 ✅\n- 施工总承包：**深圳市建工集团股份有限公司**（定标 2023-06-21）\n- 精装修Ⅰ标：**深圳市建安（集团）股份有限公司**；Ⅱ标：深圳中壹建设集团\n- 用地 5.68万㎡ / 建面 16.76万㎡ / 床位 800 ✅\n- 方案设计：深圳华森建筑与工程设计\n\n---\n\n## 六、首页布局顺序（当前）\n\n1. 项目进度时间轴（横向滚动）\n2. 快捷操作（横向滑动 6 个：开始巡场/拍照验收/打开图纸等）\n3. 今日待办（标题用**具体日期**，如 `08-15 周五 待办`，不用\"今日\"）\n4. 项目大事记（实时，彩色实心圆）\n5. 项目指标条（底部弱化，横排）\n\n\u003e 已删除：项目详情大卡片（顶部 AppBar 已有项目信息，避免重复）。\n\n---\n\n## 七、构建与运行\n\n- Web 构建：`flutter build web --release`，产物 `build/web`\n- 本地预览：`serve_web.ps1` → http://localhost:8000/\n- CAD 服务：`server/ocf_server.py` → http://localhost:8800/\n- 验证：`flutter analyze` 应零问题（仅 2 个非阻断 INFO）\n"},{"id":"ANDROID_AR_RESEARCH.md","path":"ANDROID_AR_RESEARCH.md","url":"QU5EUk9JRF9BUl9SRVNFQVJDSC5tZA==","base":"ANDROID_AR_RESEARCH.md","title":"安卓 AR 量尺调研报告（0902 需求2）","group":"功能实现","scope":"current","date":"2026-09-15","mtime":"2026-09-15","size":6555,"chars":3362,"lines":99,"nhead":15,"lead":"日期：2026-09-03 · 范围：只调研不出功能代码 对应：REQUIREMENTS_0902_IMPL.md 任务6（需求2「安卓端 AR 量尺」） 相关现状：iOS 侧已实现 LiDAR 原生量尺（lib/features/measure/ar_measure_page.dart + iOS 原生插件，详见 A","text":"# 安卓 AR 量尺调研报告（0902 需求2）\n\n\u003e 日期：2026-09-03 · 范围：只调研不出功能代码\n\u003e 对应：REQUIREMENTS_0902_IMPL.md 任务6（需求2「安卓端 AR 量尺」）\n\u003e 相关现状：iOS 侧已实现 LiDAR 原生量尺（`lib/features/measure/ar_measure_page.dart` + iOS 原生插件，详见 `AR_LIDAR_MEASURE.md` / `AR_LIDAR_IMPL_DETAIL.md`）；安卓侧当前走「拍照标定量尺」（`measure_page.dart`）。\n\n---\n\n## 1. 结论先行（给决策的一句话）\n\n**安卓端不立项「系统级 AR 量尺」；主路径维持「拍照标定量尺」，AR 能力仅作为 iOS Pro（LiDAR）展示；若业务确需安卓真 AR 演示，用 ARCore POC（需一台 GMS 认证安卓实测，且仅覆盖认证机型）。**\n\n---\n\n## 2. ARCore 支持口径与国行现实\n\n### 2.1 ARCore 认证设备口径\n- 谷歌 ARCore 认证设备列表以「设备 + GMS（Google Play 服务）」为前提。无 GMS 的安卓设备**无法运行 ARCore**（服务依赖 Play Services for AR）。\n- 典型认证机型：Pixel 系列、三星（Galaxy S/A/Note 国际版）、小米国际版、一加部分机型、OPPO/realme 国际版等。\n\n### 2.2 国行无 GMS 现实（本项目工地场景）\n- 甲方/施工方现场多为**国行安卓**（华为、荣耀、小米/OPPO/vivo 国行、以及大量无 GMS 工程机），这些设备：\n  - 无 Google Play Services → ARCore **不可用**（占比高）；\n  - 华为/荣耀可走华为 **AR Engine（HMS）**，但无 Flutter 官方插件。\n- 结论：**ARCore 在工地安卓现场覆盖面低**；若用 ARCore，等于放弃华为/荣耀及国行主力机型，只能覆盖「恰好有 GMS 认证机」的少数。\n\n### 2.3 实测缺口（未完成项）\n- 需 1 台 **GMS 认证安卓**（建议 Pixel 或三星国际版）实跑 `ar_flutter_plugin_plus` 官方示例，验证：\n  1. 相机画面 + 水平面检测能否跑通；\n  2. 量两点距离的精度（对标 iOS LiDAR：近距离墙面 1~3 m 内可到 ±1~2%，长距衰减明显）；\n  3. 低光照/纯色墙面（工地常见白墙、模板面）平面检测失败率。\n- 在拿到实机数据前，量距精度结论只能引用 ARCore 官方口径（估算 ±厘米级，受平面检测与陀螺仪漂移影响）。\n\n---\n\n## 3. 华为 AR Engine（HMS）在 Flutter 的实现成本\n\n- 能力：华为系设备内嵌 AR Engine，提供平面检测/手部/人体/运动跟踪，**无需 GMS**，且华为商店可发布。\n- 现状：**无官方 Flutter 插件**；社区有零散封装（如 `huawei_ar_engine` 为华为官方 Flutter 插件，但覆盖与维护有限，量尺需自己画线 + 测距计算）。\n- 成本评估：≈ **iOS LiDAR 原生插件相当的工作量**（本项目 iOS 插件已实现过一次，可作工时参考）：\n  - MethodChannel + 原生相机预览桥接：0.5~1 周；\n  - 平面检测 / 命中点 / 画线 / 距离计算：1~1.5 周；\n  - 与「照片标定 + 打点定位」业务数据打通 + 联调：1 周。\n  - 合计约 **3~3.5 周**（单平台、单人）。\n- 风险：只能覆盖华为/荣耀；且工地投影面若以「单目 SLAM 弱纹理」为主，精度与稳定性不如 LiDAR。\n\n---\n\n## 4. 结论建议与立项排期\n\n### 4.1 建议路径（推荐序）\n| 方案 | 覆盖 | 成本 | 建议 |\n|---|---|---|---|\n| A. 安卓主路径=照片标定量尺（已有） | 全部机型 | 0 | **主线**，继续增强（打点精度/校对） |\n| B. AR 仅 iOS Pro（LiDAR）展示 | iOS Pro 机型 | 已投入 | 保持现状 |\n| C. ARCore POC（若要安卓真 AR） | 仅 GMS 认证机 | 2~3 周 POC | 先 POC 验证精度再立项，并在产品上注明「仅部分机型支持」 |\n| D. 华为 AR Engine 插件 | 华为/荣耀 | 3~3.5 周 | 除非目标用户集中华为且乙方明确要求，否则优先级低 |\n\n### 4.2 若立项 ARCore POC 的排期（估算）\n1. 第 1 周：GMS 实机跑通 `ar_flutter_plugin_plus` 示例 + 平面命中 + 双点测距；\n2. 第 2 周：接当前 `MeasureSession`/`measure_page` 数据模型，现场精度测试（墙距/板厚/门窗洞口）；\n3. 第 3 周（可选）：整理机型兼容表 + 降级策略（无 GMS/弱纹理自动回退「拍照标定」）。\n- 里程碑判定：实机 10 组距离误差 ≤ ±2%（1~3 m）且平面命中率 ≥ 80%，才进入产品化。\n\n---\n\n## 5. 需要决策方确认的输入\n1. 甲方/项目部是否持有「有 GMS 的安卓」用于验收演示？若无 → 直接否决 ARCore 立项；\n2. 「安卓 AR」是硬需求还是亮点展示？亮点 → 走 iOS 演示 + 安卓照片标定即可；\n3. 若必须华为演示，是否有华为测试机 + 华为开发者账号（应用内联调需要）。\n\n---\n\n## 6.【2026-09-08 更新】自动锚零输入量尺（P0 已实现）\n\n\u003e 需求演进：不做\"系统级 AR\"，改为**零输入的图像定标量尺**——拍照后自动识别画面里\n\u003e 的已知尺寸标准件，免手填参考物尺寸、免手点参考物两端，**全机型可用**。\n\n### 6.1 已落地（纯 Dart，无新增依赖）\n| 文件 | 内容 |\n|---|---|\n| `core/utils/anchor_objects.dart` | 标准件尺寸库：86面板 / A4 / 身份证·银行卡 / 标准砖 / 瓷砖 300·600·800 / 石膏板 |\n| `data/vision_service.dart` | `detectAnchor()`：复用 `/api/vision` + prompt 覆盖，返回最优锚物（外接框 + 框横纵对应真实尺寸 + 置信度） |\n| `features/measure/measure_page.dart` | 拍照后自动尝试识别（失败静默）；标定卡新增「自动标定」按钮；**手动标定保留为兜底** |\n\n关键实现：比例尺取锚物框横/纵两方向的**几何平均**（正对画面时精确、斜置 45° 时\n误差最小），避免旧版\"只看横向\"的缺陷；合成 `PhotoCalib` 承载比例尺，`models.dart`\n零改动。识别框过小 / 无标准件 / 远端不可用 → 自动回退手动。\n\n### 6.2 与 ARCore / SLAM 的关系\n- 本方案覆盖 **100% 机型**（能拍照 + 能联网识别即可），且用户零输入；\n- 真 AR（VIO / 平面检测 / 漫游测距）仍受 GMS 限制（§2/§3），若立项须先做\n  厂商 SLAM SDK（SenseAR / 虹软 / 华为 AREngine）选型与授权确认。\n\n### 6.3 精度与使用边界（必须向用户讲清）\n- 图像几何定标在近距离垂直拍摄下 ≈ **±0.5%~1%**，优于 VIO 的 ±1~3%；\n- **仍不能做 ±5mm 级验收判定**——定位是巡查快测/筛查，判定用卷尺或激光测距；\n- UI 已显示标定来源与置信度（「已用 XX 自动标定（置信度 N%）」）。\n"},{"id":"CAD_MIGRATION_BACKUP.md","path":"CAD_MIGRATION_BACKUP.md","url":"Q0FEX01JR1JBVElPTl9CQUNLVVAubWQ=","base":"CAD_MIGRATION_BACKUP.md","title":"CAD 迁移与清理清单","group":"功能实现","scope":"current","date":"2026-09-17","mtime":"2026-09-17","size":12655,"chars":8381,"lines":231,"nhead":16,"lead":"用途：把本项目（「蓝图落地」工地验收 App）里的 CAD 渲染/转换/看图 能力整体移交到 新建的网页版 CAD 项目，本仓库随后清除 CAD 相关内容。","text":"# CAD 迁移与清理清单\n\n\u003e 用途：把本项目（「蓝图落地」工地验收 App）里的 **CAD 渲染/转换/看图** 能力整体移交到\n\u003e 新建的**网页版 CAD 项目**，本仓库随后清除 CAD 相关内容。\n\u003e\n\u003e 决策前提（已确认）：\n\u003e 1. 本项目**不再需要 DWG 上传预览**；\n\u003e 2. 浩辰云图（OCF）链路是废案，随新项目一起走；\n\u003e 3. 「CAD 坐标系能力」（图纸打点定位 / 量尺图纸侧取值 / 巡场防穿墙）**保留**，不属迁移范围。\n\u003e\n\u003e 状态：待执行（本文档即备份交接清单）。最后更新 2026-09-17。\n\n---\n\n## 0. 一分钟摘要\n\n| 类别 | 数量（约） | 去向 |\n|---|---|---|\n| 服务端脚本 `server/` | 14 个 py + `apig_sdk/`(9) | 搬到新项目，**本目录最终整体消失** |\n| 客户端代码 | 3 个整文件 + 4 个文件的局部段落 | 搬到新项目，其余保留 |\n| Web 资源 | 3 个 html/js + 2 张 png | 搬到新项目 |\n| 文档 | 5 份 | 搬到新项目 |\n| **必须先备份的凭证** | **2 组**（浩辰 AK/SK、和风 Key） | ★ 只存在部署机 `server/config.py`，仓库里没有 |\n| 保留（别删） | 7 项 | 本项目 App 继续用 |\n\n---\n\n## 1. 前提：本项目里「CAD」有两种含义（**别混着删**）\n\n| 含义 | 内容 | 处置 |\n|---|---|---|\n| **A. CAD 渲染 / 转换 / 看图** | 浩辰 OCF、GStarSDK、本地 ODA+ezdxf、上传 DWG 预览 | ✅ 搬去新网页项目 |\n| **B. CAD 坐标系能力** | 屏幕像素 ↔ 图纸 mm 换算、图纸校准、轴网交点、墙线检测 | ❌ **保留**，见第 3 节 |\n\n\u003e 按字面把 A+B 一起删，会直接打断「图纸打点定位 + 量尺图纸侧数值 + 巡场防穿墙」三条主功能。\n\n---\n\n## 2. 搬运清单（→ 新网页版 CAD 项目）\n\n### 2.1 服务端脚本（`server/`）\n\n| 文件 | 说明 |\n|---|---|\n| `ocf_server.py` | 浩辰云图代理主服务（:8800）。**天气已拆出，可直接搬**（见第 4 节） |\n| `cad_local.py` | 本地零配额转换：DWG → ODA → DXF → ezdxf 渲染 PNG/SVG + 图层 JSON |\n| `cad_meta_server.py` | 元数据解析服务（`parse_dwg_to_meta`） |\n| `cad_meta_build.py` | 离线元数据批量构建 |\n| `quota_guard.py` | 浩辰扣次守卫 + 接口扣次清单（有价值，建议新项目保留） |\n| `apig_sdk/` | 华为云 APIG 签名 SDK（5 py + 4 pyc） |\n| `cos_upload.py` | 上传 DWG 到腾讯云 COS 拿公网 URL（供浩辰 `fileUrl` 方式） |\n| `dwg_to_dxf.py` | DWG → DXF 单独转换 |\n| `derive_calib_from_dxf.py` | 从 DXF 推导图纸校准系数 |\n| `extract_axis_intersections.py` | 从 DXF 提取轴网交点 → **轴网 JSON 的生成者** |\n| `_b01_detail.py` / `_b01_genjson.py` | B01 校准验证/生成（一次性脚本） |\n| `_compute_seed.py` / `_compute_seed_v2.py` | 校准种子推导（一次性） |\n| `_inspect_b01.py` / `_verify_seed.py` | 校准核查（一次性） |\n| `DXF_CALIBRATION_README.md` | 轴网校准推导说明 |\n| `.env.example` | 凭证模板（浩辰 + 和风） |\n| `cad_meta/` | 产物目录 |\n| `ocf_cache/` | 产物目录（10 张 7 栋图纸 OCF + PNG + `_meta.json`，体积可能较大） |\n| `.quota_state.json` | 浩辰配额本地记录（若存在） |\n\n**接口路由对照（便于新项目复刻）**\n\n| 路由 | 归属 |\n|---|---|\n| `POST /api/cad/dwgInfo`、`/api/cad/dwgToOcf` | 浩辰 |\n| `POST /api/cad/saveAsImage` | 浩辰（OCF→PNG） |\n| `GET /api/cad/taskStatus` | 浩辰（任务轮询） |\n| `POST /api/upload-dwg-local` | 本地 ODA+ezdxf |\n| `POST /api/convert` | 旧版兼容接口 |\n| `GET /api/ocf/{key}`（.ocf / .png / .svg） | 缓存静态分发 |\n| `GET /api/ocf-meta/{key}` | 元数据分发 |\n| `GET /health`、`/api/cad/health` | 健康检查 |\n\n### 2.2 客户端代码（Flutter）\n\n| 文件 | 搬走范围 |\n|---|---|\n| `lib/data/cad_service.dart` | **整个文件** |\n| `lib/shared/widgets/cad_info_panel.dart` | **整个文件**（图层/布局面板，数据来自 `getDwgInfo`） |\n| `lib/core/storage/uploaded_drawing_store.dart` | **整个文件**（上传图纸登记） |\n| `lib/features/projects/drawing_viewer_page.dart` | ⚠️ **只搬 OCF/GStar 渲染 + 坐标拾取那一段**，此文件同时管普通 PNG 图纸查看，不能整文件搬 |\n| `lib/core/di/providers.dart` | `cadServiceProvider` / `cadInfoProvider` / `cadAnnotationsProvider` / `cadPickModeProvider` / `_uploadedToFloor` / `_uploadedToDrawing` / `uploadedDrawingsProvider` |\n| `lib/shared/widgets/drawing_image.dart` | 仅「http 网络底图」这一分支（服务上传图纸）；assets 分支本项目仍需要 |\n| `lib/features/projects/projects_page.dart` | 「上传 DWG / 我的上传」入口段落 |\n| `lib/features/capture/capture_page.dart` | 对 `api/ocf` 的依赖段落 |\n| `lib/data/models.dart` | `UploadedDrawing` 类（可搬可删） |\n\n### 2.3 Web 资源\n\n| 文件 | 状态 |\n|---|---|\n| `web/GStarSDK.js` | 工作区已删除 → 从 git 历史恢复，或重新向浩辰索取 |\n| `web/cad_viewer.html` | 工作区已删除 → 从 git 历史恢复 |\n| `web/cad_viewer_hybrid.html` | 仓库中仍在 |\n| `web/dy04_7_B05_paper_filtered.png`、`dy04_7_B05_paper_hybrid.png` | 混合查看器试验产物，按需搬 |\n\n### 2.4 文档\n\n| 文件 | 备注 |\n|---|---|\n| `CAD_OCF_INTEGRATION.md` | ⚠️ **含未解决的 git 冲突标记**（`\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD` / `=======` / `\u003e\u003e\u003e\u003e\u003e\u003e\u003e`），搬之前先修或注明 |\n| `backend_api.txt` / `backend_api.pdf` | 浩辰云图后端 API 文档 |\n| `frontend_api.txt` / `frontend_api.pdf` | GStarSDK 前端 SDK 文档 |\n| `REQUIREMENTS_0902_IMPL.md` | 其中「任务 3：DWG 自助上传」段落 → 新项目参考 |\n\n### 2.5 ★ 凭证与密钥（**必须先导出，仓库里没有**）\n\n| 位置 | 内容 | 风险 |\n|---|---|---|\n| 部署机 `server/config.py` | 浩辰 `APP_CODE / APP_TOKEN / APP_KEY / APP_SECRET`、网关地址 | 删 `ocf_server.py` 会一并带走 |\n| 部署机 `server/config.py` | **和风天气 `QWEATHER_KEY` / `QWEATHER_HOST`** | ⚠️ 本项目天气功能也要用，**已拆到独立服务**（见第 4 节），key 必须导出 |\n| 部署机 `server/cos_config.py` | 腾讯云 COS `SECRET_ID / SECRET_KEY / BUCKET / REGION` | 新项目继续用 COS 则需要 |\n| 服务器环境变量 | DashScope Key（AI 视觉） | 本项目后端继续用，**不外迁** |\n\n\u003e `config.py` / `cos_config.py` 均被 gitignore，只在部署机上。**备份动作务必在删除任何文件之前完成。**\n\n---\n\n## 3. 保留清单（本项目 App 继续用，**不要删**）\n\n| 文件 / 资产 | 用途 |\n|---|---|\n| `lib/core/utils/cad_coord.dart` | `CadCoordMapper`：屏幕像素 ↔ CAD 世界坐标 mm。**图纸打点定位、缺陷坐标回溯的核心** |\n| `lib/core/cad/cad_calibration.dart` | 校准库（按图纸持久化校准系数） |\n| `lib/core/cad/axis_calibration.dart` | 轴网校准 |\n| `lib/core/cad/axis_auto_calibration.dart` | 轴网交点自动套图校准（精度来源） |\n| `assets/axis_data/dy04_7_{B01,D01,D03,D04}.json` | 轴网交点数据。**生成脚本搬走，产出必须留下** |\n| `lib/core/cad/wall_lines.dart` | 巡场墙线检测 / 防穿墙 |\n| `lib/utils/path_metrics.dart` | 巡场路径度量（沿墙走线） |\n| `lib/features/{measure,patrol,room,projects}/*` | 业务页面（**局部摘除** CAD 段落，不整删） |\n\n---\n\n## 4. 已完成的解耦（清理的前置动作，2026-09-17）\n\n| 动作 | 文件 | 说明 |\n|---|---|---|\n| ✅ 天气拆成独立服务 | **新增** `server/weather_server.py` | 从 `ocf_server.py` 的 `_handle_weather` / `_fetch_qweather` 拆出，端口 **8830**，接口 `GET /api/weather?lon=\u0026lat=\u0026name=`（响应结构与原来完全一致，前端无需改协议）。已剔除原实现里 `return` 之后的不可达死代码 |\n| ✅ 客户端天气解耦 | **新增** `lib/data/weather_service.dart` | `WeatherService.host` 由 `--dart-define=WEATHER_HOST` 控制，默认 `http://localhost:8830` |\n| ✅ 改引用 | `lib/core/di/providers.dart` | `weatherProvider` 的 host：`CadService.host` → `WeatherService.host`（原先天气挂在 CAD 服务上，删 CAD 会连带带崩天气） |\n\n**端口现状**\n\n| 端口 | 服务 | 去向 |\n|---|---|---|\n| 8800 | `ocf_server.py`（CAD） | 搬走，端口释放 |\n| 8820 | `measure_server.py`（量尺落库） | 已判定为开发期孤儿脚本，**删**（见 1.2 结论） |\n| **8830** | `weather_server.py`（天气） | **保留** |\n\n---\n\n## 5. 清理顺序（**按序执行，顺序不能错**）\n\n1. **导出凭证**：从部署机备份 `server/config.py`、`server/cos_config.py` 全部字段（★ 第 2.5 节）\n2. **备份产物**：`server/ocf_cache/`、`server/cad_meta/`（如需保留历史转换结果）\n3. **备份轴网 JSON**：确认 `assets/axis_data/*.json` 已入库（**留在本项目**）与 `extract_axis_intersections.py`（**搬走**）\n4. **搬服务端**：`server/` 全部 CAD 脚本 → 新项目（天气已独立，不受影响）\n5. **搬 Web 资源与文档**：第 2.3 / 2.4 节\n6. **摘客户端代码**：按第 2.2 节，特别注意 `drawing_viewer_page.dart` 是混合文件\n7. **清理上传图纸的连带**：`floorsProvider` / `drawingsProvider` 里的 `up_` 前缀合并逻辑要一起摘掉，**注意别弄坏预置图纸列表**（`floors` / `dy7Floors`）\n8. **删除**：按第 6 节\n9. **验证**：按第 7 节\n\n---\n\n## 6. 删除清单\n\n**服务端**\n- `server/` **整个目录**（第 4 步搬完后）：包含 `ocf_server.py`、`cad_local.py`、`cad_meta_server.py`、`cad_meta_build.py`、`quota_guard.py`、`cos_upload.py`、`dwg_to_dxf.py`、`derive_calib_from_dxf.py`、`extract_axis_intersections.py`、`_b01_*.py`、`_compute_seed*.py`、`_inspect_b01.py`、`_verify_seed.py`、`apig_sdk/`、`cad_meta/`、`ocf_cache/`、`DXF_CALIBRATION_README.md`、`.env.example`\n- `server/measure_server.py`、`server/measure_data/`、`_test_measure.ps1`（1.2 已判定为孤儿，与本迁移无关但一并清）\n\n**客户端**\n- `lib/data/cad_service.dart`\n- `lib/shared/widgets/cad_info_panel.dart`\n- `lib/core/storage/uploaded_drawing_store.dart`\n\n**Web**\n- `web/cad_viewer_hybrid.html`（搬走后）\n\n**文档**\n- `CAD_OCF_INTEGRATION.md`、`backend_api.txt/.pdf`、`frontend_api.txt/.pdf`（搬走后）\n\n**连带小尾巴**\n- `_serve_web.js`、`_rebuild_serve.ps1` 中的 `.ocf` MIME 类型条目\n- `.gitignore` 中的 CAD 专属条目：`web/cad_secret.txt`、`server/dwg_cache/`、`server/ocf_cache.zip`、`*.dxf`、`server/_local_work/`、`server/_local_out/`、`server/axis_data/`\n\n---\n\n## 7. 验证方法\n\n**天气服务（独立后）**\n\n```bash\npython server/weather_server.py 8830\ncurl http://localhost:8830/health\ncurl \"http://localhost:8830/api/weather?lon=113.9799\u0026lat=22.5936\"\n# 未配置 QWEATHER_KEY 时应返回 {\"source\":\"mock\", ...}，属正常\n```\n\n\u003e 过渡期若想让客户端零改动，可用 `python weather_server.py 8800` 顶上原端口。\n\n**清理后**\n\n```bash\ndart analyze lib                      # 期望 0 error\ngrep -rn \"ocf\\|GStar\\|dwgToOcf\\|uploadDwg\\|CadService\" lib/     # 期望无残留\n```\n\n**保留功能回归（重点，别被误伤）**\n\n- 图纸打点 → 缺陷带 `worldX/worldY` 坐标\n- 量尺页「图纸侧数值」正常读出（走 `CadCoordMapper`）\n- 巡场页墙线检测 / 防穿墙正常\n- 首页天气卡片正常（`source: mock` 或 `qweather` 均算通过）\n\n---\n\n## 8. 遗留与已知问题（一并交接给新项目）\n\n| # | 问题 | 说明 |\n|---|---|---|\n| 1 | `ocf_server.py` 中 `do_OPTIONS` **重复定义两次** | 后者覆盖前者（`Access-Control-Allow-Headers` 不一致），建议新项目只留一个 |\n| 2 | `_fetch_qweather` 末尾有 **不可达死代码** | `return` 之后残留的 read_body 片段，已在新 `weather_server.py` 中剔除 |\n| 3 | `CAD_OCF_INTEGRATION.md` **含未解决的 git 冲突标记** | 说明曾有一次合并被直接提交，搬之前需人工确认版本 |\n| 4 | 现有 `certificate.pem` 是**自签证书** | `subject=CN=yangyuting.cloud` / `issuer=CN=yangyuting.cloud`；iOS ATS 会拒绝、浏览器红锁。新项目若对外提供服务须换正式证书 |\n| 5 | 浩辰配额 | 已开通 50 次体验 + 已下单（订单号 `CS2608121457NG4KM`）；`quota_guard.py` 的扣次清单可复用 |\n| 6 | 40MB 级 SVG | `cad_local.py` 输出的文字层 SVG 在 Web 端渲染失败（已知），新项目需另想办法 |\n"},{"id":"CAD_OCF_INTEGRATION.md","path":"CAD_OCF_INTEGRATION.md","url":"Q0FEX09DRl9JTlRFR1JBVElPTi5tZA==","base":"CAD_OCF_INTEGRATION.md","title":"DWG/OCF 前端览图集成（第二步）上下文文档","group":"功能实现","scope":"current","date":"2026-09-17","mtime":"2026-09-17","size":10813,"chars":7275,"lines":193,"nhead":18,"lead":"本文档记录「CAD 转 OCF 轻量化 → 前端 JS SDK 渲染」第二步的完整进展、关键技术结论与待办，供后续续接时直接参考，避免重复调研与积分消耗。 \u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD 上次更新：2026-08-14（周五） ======= 上次更新：2026-08-15（周六） 6370f31da2db71c19c520","text":"# DWG/OCF 前端览图集成（第二步）上下文文档\n\n\u003e 本文档记录「CAD 转 OCF 轻量化 → 前端 JS SDK 渲染」第二步的完整进展、关键技术结论与待办，供后续续接时直接参考，避免重复调研与积分消耗。\n\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\n\u003e 上次更新：2026-08-14（周五）\n=======\n\u003e 上次更新：2026-08-15（周六）\n\u003e\u003e\u003e\u003e\u003e\u003e\u003e 6370f31da2db71c19c520854e93cae9c6807ac0e\n\n---\n\n## 0. 一句话现状\n\n\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\n- **第一步（后端转换）已完成**：DWG → OCF 轻量化已打通，能拿到 `ocfUrl` 和 `fileId`。\n- **第二步（前端 SDK 渲染）**：SDK 接入方式已从官方文档完全摸清（`GStarSDK`），**但 `GStarSDK.js` 脚本本体尚未拿到**，正在向服务商浩辰技术邮件索取中。\n- **核心卡点**：只差一个 `GStarSDK.js` 文件，其余技术方案已全部落地为可执行计划。\n=======\n- **第一步（后端转换）已完成**：DWG → OCF 轻量化已打通，10 张 7栋图纸 OCF **已本地缓存于 `server/ocf_cache/`**（转换一次，永久复用，前端渲染 0 消耗浩辰次数）。\n- **第二步（前端 SDK 渲染）已完成打通**：\n  - `web/GStarSDK.js`（2.54MB，浩辰提供）已就位 `web/` 与 `build/web/`。\n  - 独立页 `web/cad_viewer.html` 完成：加载 OCF 本地缓存 → GStarSDK 矢量渲染 → 坐标拾取（`screenToWorld` 真图纸坐标）→ postMessage 回传 Flutter。\n  - Flutter 端 `drawing_viewer_page.dart` 已加「专业看图」入口，`_Toolbar` 首个按钮跳转 `cad_viewer.html?key=xxx`。\n- **核心链路已全部跑通**：8000 静态服务 + 8800 OCF 服务，CORS 全放开，双服务联通。\n\u003e\u003e\u003e\u003e\u003e\u003e\u003e 6370f31da2db71c19c520854e93cae9c6807ac0e\n\n---\n\n## 1. 项目 \u0026 采购背景\n\n| 项 | 内容 |\n|---|---|\n| 项目 | 工地巡检智能化管理（Flutter Web 优先，后续拓展微信小程序） |\n| 商品 | 华为云市场 \"DWG FastView for Web\"（苏州浩辰软件股份，交付方式 API） |\n| 商品页 | https://marketplace.huaweicloud.com/contents/aeb4e164-dc5f-4c06-afe7-8e613abde8fb |\n| 订单号 | **CS2608121457NG4KM**（2026/08/12 下单） |\n| 免费额度 | 已开通 50 次体验 + 已正式下单 |\n| 采购人/技术对接 | 杨玉婷（天津大学管理与经济学部 2025 级硕士，工程管理） |\n| 服务商技术邮箱 | zhaoyy@gstarcad.com / penggw@gstarcad.com / support_app@gstarcad.com |\n| 服务热线 | 18151172040 / 010-57910609转6121（周一~周五 09:00-17:30） |\n\n---\n\n## 2. 官方文档（关键资产，已下载到项目根目录）\n\n\u003e ⚠️ 这两个 PDF 是本次调研最大收获，**请勿删除**，后续续接和 SDK 接入全靠它们。\n\n| 文件 | 内容 |\n|---|---|\n| `frontend_api.pdf` / `frontend_api.txt` | **前端 JS SDK（GStarSDK）完整 API 手册**（本文档第 3、4 节由此提取） |\n| `backend_api.pdf` / `backend_api.txt` | 后端转换 API 手册（dwgToOcf / getDwgInfo / getTaskStatus 等） |\n\n### 2.1 后端 API 网关域名（重要纠偏）\n- **文档明确：生产固定用** `https://gstarcadsdk.apistore.huaweicloud.com`\n- 商品页截图显示 `2dviewer.apistore.huaweicloud.com`——**两处不一致**，已在邮件中向服务商确认以哪个为准。\n\n### 2.2 核心后端接口（已确认形态，均 POST + JSON body）\n| 接口 | 路径 | 用途 |\n|---|---|---|\n| DWG转OCF | `/openapi/v1/dwgToOcf` | 返回 `requestId`，异步 |\n| 取图纸信息 | `/openapi/v1/getDwgInfo` | 图层/布局/图块/xref |\n| 取缩略图 | `/openapi/v1/getThumb` | 返回 `thumbUrl` |\n| OCF另存图 | `/openapi/v1/ocfSaveAsImage` | 支持 `layerfilter` 图层过滤 |\n| OCF另存PDF | `/openapi/v1/ocfSaveAsPdf` | 兜底路线用 |\n| 取任务结果 | `/openapi/v1/getTaskStatus` | 传 `requestId`，轮询 `status==2` 得结果 |\n\n**调用流程**：提交任务拿 `requestId` → 轮询 `getTaskStatus` → `status: 2` 且 `resultCode: 0` 时，从 `bizData` 取结果（`ocfUrl` / `fileId` / `thumbUrl` 等）。`ocfUrl` 形如 `https://oss.abc.com/openapi/v1/download?fileId=\u003cuuid\u003e`。\n\n---\n\n## 3. 前端 SDK：GStarSDK（第二步核心，接入方式已确认）\n\n### 3.1 引入\n```html\n\u003cscript src=\"GStarSDK.js\"\u003e\u003c/script\u003e   \u003c!-- 脚本本体待服务商提供 --\u003e\n```\n\n### 3.2 最小可用代码\n```js\n// 容器必须设宽高\n\u003cdiv id=\"GStarSDK-container\" style=\"width:100%;height:100vh;\"\u003e\u003c/div\u003e\n\nconst gstarSDK = new GStarSDK({\n  wrapId: 'GStarSDK-container',\n  switchLayoutCB: switchLayout,  // 布局切换回调\n  apiHost: 'https://gstarcadsdk.apistore.huaweicloud.com', // 另存/打印等需要\n  hideToolbar: true,             // 自建工具栏时隐藏默认的\n});\nawait gstarSDK.render('ocf', ocfData, fileId); // ocfData 是 ArrayBuffer，render 返回 Promise\n```\n\n### 3.3 功能 ↔ API 对照表（你要的功能都有对应）\n\n| 功能 | GStarSDK 对应 | 说明 |\n|---|---|---|\n| 2D/3D 览图 | `render('ocf', buffer, fileId)` + `enableZoom/disableZoom` + `enablePan/disablePan` | 核心 |\n| 图层 | 属性 `layers`；方法 `setLayer(layerId, true/false)` | 开关 |\n| 布局 | 属性 `layouts` / `layoutInfo`；事件 `switchLayout` | 列表/切换 |\n| 视图工具 | `zoom`、`enableMap()`（鸟瞰）、`func.viewport.*`（全图/窗口缩放/全屏） | 控制 |\n| 批注 | `notes.show()`/`notes.clear()`/`notes.data`；事件 `noteChange`；`func.notes.*` | 增删改 |\n| 测量 | `func.measures.*`（长度/面积/坐标/弧长/角度/比例）；`measures.accuracy` | 工具 |\n| 图纸对比 | 文档未单列 → 用**双容器双实例**并排，或 `setLayer` 差异对比 | 需自建 |\n| 获取图元信息 | 前端 `screenToWorld({x,y})` 转图纸坐标 + 后端 `getDwgInfo` 拿图层/布局/图块/xref | 图元信息 |\n\n### 3.4 自定义工具栏（隐藏默认 + 精确控制）\n```js\n// constructor 里 hideToolbar: true\ngstarSDK.func.layer.main() / .close()              // 图层\ngstarSDK.func.layout.main() / .close()             // 布局\ngstarSDK.func.measures.measureLength.main() / .close()\ngstarSDK.func.notes.noteWord.main() / .close()     // 批注\ngstarSDK.func.viewport.zoomE.main() / .close()     // 全图\n```\n\n### 3.5 生命周期 \u0026 关键方法\n- `destroy()`：销毁实例（切页时调用，防 FPS 泄漏）\n- `clearDraw()`：清空绘制\n- `screenToWorld({x,y})`：屏幕坐标 → 图纸坐标\n- `screenShot(p1, p2)`：按范围截图，返回 base64\n- 事件：`switchLayout` / `ocfSizeOverLimit` / `noteChange` / `markChange` / `functionTrigger`\n- 属性：`layers` / `layouts` / `layoutInfo` / `zoom` / `notes.data` / `marks.list`\n- 书签：`marks.create/apply/clear`\n- 大小限制：`pcSizeLimit`（默认 12M）/ `mobileSizeLimit`（默认 5M）\n\n---\n\n## 4. Flutter 集成方案（已确定，最小侵入）\n\n**推荐：独立 HTML 子页 + Flutter 跳转**（零 Dart web 桥接，最稳）\n\n1. 在 `web/` 新建 `cad_viewer.html`：加载 GStarSDK + 接收 URL 参数 `?fileId=xxx\u0026ocfUrl=xxx` + 调后端拿 ArrayBuffer → render + postMessage 通信\n2. 改 `lib/features/projects/drawing_viewer_page.dart` 工具条：加「专业看图」按钮，`launchUrlString('/cad_viewer.html?fileId=xxx')`\n3. 鉴权走后端代理（见第 5 节），**AppKey/AppSecret 永不进前端**\n\n### 现有可复用代码\n- `lib/features/projects/drawing_viewer_page.dart`：图纸查看器（InteractiveViewer + 热点跳转 + 锚定），在此加入口\n- `lib/features/projects/blueprint_viewer_page.dart`：多图纸切换原稿预览\n- `backend/server.js`：已有 Express 代理范式（可参照扩展 CAD 接口）\n- `serve_web.ps1`：Web 静态服务\n\n---\n\n## 5. 安全 \u0026 鉴权（必做）\n\n- **AppKey/AppSecret 只放服务端**，前端只拿短时效 token 或直接走后端代理。\n- 若 SDK 要求前端传 AppSecret，**立即撤回**，改为后端 `POST /api/cad/token` 换 token。\n- 参考项目现有范式：`AI_VISION_INTEGRATION.md` 中 VISION_HOST + backend 代理 + CORS 处理。\n\n---\n\n## 6. 兜底路线（不等 SDK 也能演示）\n\n如果服务商迟迟不给 GStarSDK.js，用后端现成 API + 自渲染：\n\n- 后端 `ocfSaveAsPdf` / `ocfSaveAsImage`（支持 `layerfilter`）→ 拿 PDF/PNG\n- 前端 `pdf.js` + Canvas overlay（测量/批注自写轻量版）\n- 缩略图 `getThumb` → 图纸列表\n\n缺点：非真矢量、测量刻度自写。但可保住项目演示进度。\n\n---\n\n## 7. 待办清单（下次续接）\n\n\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\n- [ ] **P0** 跟进服务商邮件回复，拿 `GStarSDK.js` + HTML demo（邮件已发，订单号 CS2608121457NG4KM）\n- [ ] **P1** 写后端 CAD 代理：`/api/cad/dwgToOcf` / `getDwgInfo` / `getTaskStatus`（AppKey 留服务端）\n- [ ] **P1** 写 `web/cad_viewer.html` 骨架（GStarSDK.js 路径占位 `gstar-sdk/GStarSDK.js`）\n- [ ] **P2** 改 `drawing_viewer_page.dart` 加「专业看图」入口\n- [ ] **P2** 确认网关域名 `gstarcadsdk` vs `2dviewer` 哪个为准（已邮件问）\n- [ ] **P3** 兜底路线（PDF/pdf.js）做 MVP，不等 SDK\n- [ ] **记录** 服务商回复后更新本文档，删除已完成的临时标记\n=======\n- [x] **P0** 拿到 `GStarSDK.js` + 样例包（已收彭工邮件回复 + 「二维行业版前装.zip」；`setDynamicPW` 密钥可用）\n- [x] **P0** 写 `web/cad_viewer.html`（GStarSDK 矢量渲染 + 坐标拾取 postMessage 回传）\n- [x] **P1** 改 `drawing_viewer_page.dart` 加「专业看图」入口（`_Toolbar` 首按钮 → `/cad_viewer.html?key=xxx`）\n- [x] **P1** 确认网关域名：`gstarcadsdk.apistore.huaweicloud.com` 免费（查任务/取文件），`2dviewer` 收费（转换）——本课题只走前者 `render()` 即可，不消耗转换次数\n- [x] **P1** OCF 本地缓存：10 张 7栋图纸已存 `server/ocf_cache/`，前端渲染读本地流 0 扣次\n- [ ] **P1** 后端 CAD 代理收尾：`/api/cad/dwgToOcf` / `getDwgInfo` / `getTaskStatus`（AppKey 留服务端，已部分实现于 `ocf_server.py`）\n- [ ] **P2** 坐标拾取回传 Flutter：`cad_viewer.html` 已 postMessage，Flutter 端监听 `cad-pick` 事件落库（为轨迹/巡检打点铺路）\n- [ ] **P2** `cad_viewer.html` 内嵌到 Flutter（HtmlElementView）或保持独立页跳转（当前为独立页跳转，最稳）\n- [ ] **P3** 兜底路线（PDF/pdf.js）做 MVP（当前矢量渲染已通，此路线降级备用）\n- [ ] **记录** 答辩前在 iPad/安卓平板实测移动端兼容性（GStarSDK pan/zoom/measure）\n\u003e\u003e\u003e\u003e\u003e\u003e\u003e 6370f31da2db71c19c520854e93cae9c6807ac0e\n\n---\n\n## 8. 临时文件说明\n\n- `_extract_pdf.py`：本次提取 PDF 文本的临时脚本，**可删除**（提取结果已存为 .txt）。\n- `backend_api.pdf/.txt`、`frontend_api.pdf/.txt`：**保留**，官方文档资产。\n- `huawei_product.html`：curl 未成功生成（市集是 SPA 动态渲染，curl 拿不到内容，改用 web_fetch 成功），无需保留。\n"},{"id":"ROOM_MEASURE_IMPL.md","path":"ROOM_MEASURE_IMPL.md","url":"Uk9PTV9NRUFTVVJFX0lNUEwubWQ=","base":"ROOM_MEASURE_IMPL.md","title":"量房功能（RoomPlan自动扫描 + 手动定点成图）— 全量实施文档（交付 CodeBuddy）","group":"功能实现","scope":"current","date":"2026-09-15","mtime":"2026-09-15","size":8761,"chars":5322,"lines":136,"nhead":13,"lead":"规格源：MEASURE_ROOM_PLAN.md（产品/路线/诚实边界）。本文=可执行实施。 双场景：①装修量房（净尺寸/门窗/完成面/户型记录）②工地房间核尺（LiDAR量房 vs 图纸对照超差判定）。 路线：A=RoomPlan 自动扫描（iOS16+/LiDAR，官方）＋B=手动定点/照片成图（跨平台，本机可验）","text":"# 量房功能（RoomPlan自动扫描 + 手动定点成图）— 全量实施文档（交付 CodeBuddy）\n\n\u003e 规格源：`MEASURE_ROOM_PLAN.md`（产品/路线/诚实边界）。本文=可执行实施。\n\u003e 双场景：①装修量房（净尺寸/门窗/完成面/户型记录）②工地房间核尺（LiDAR量房 vs 图纸对照超差判定）。\n\u003e 路线：A=RoomPlan 自动扫描（iOS16+/LiDAR，官方）＋B=手动定点/照片成图（跨平台，本机可验）。\n\u003e 平台现实：Windows 本机只能 `flutter analyze` + `flutter build web`；**iOS 原生(RoomPlan/AR扩展)只能写代码不可编译**，标 [原生-待真机]。\n\u003e 工作目录：`F:\\建筑验收工具\\site-patrol`。\n\n---\n\n## 0. 实施分层总览\n\n| 层 | 内容 | 本机可验 |\n|---|---|---|\n| P0 | 数据模型 + 几何/工程习惯纯函数引擎 + 手动/照片成图页 + 记录列表/详情 + 报告字段（四端） | ✅ Web 可演示 |\n| P1 | [原生-待真机] RoomPlan 封装 `RoomCaptureController` + AR 墙角定点模式扩展 + 自动扫描页接通 | ❌ 代码先写，真机联调 |\n| P2 | 图纸对照核尺联动（复用校准 + MeasureItem 判定） | ✅ 可做 |\n| P3 | 安卓 ARCore 实测评估（出文档，不写产品代码） | 调研 |\n\n**执行建议：P0+P2 现在写（全 Dart/Web 可验）；P1 把 iOS 代码与 MethodChannel 契约写好、标\"待联调\"，不阻塞 P0。**\n\n---\n\n## P0-1：数据模型（`lib/data/models.dart` 追加，不覆盖）\n\n```dart\n// ==================== 量房记录 ====================\n/// 墙段洞口（门/窗）：offsetFrom 为该段起点的偏移（mm）。\nclass WallOpening {\n  final String type;        // 'door' | 'window'\n  final double offsetFromMm;\n  final double widthMm;\n  final double? heightMm;   // 门高/窗台高（可空，人工补）\n  // copyWith/toJson/fromJson（默认值兜底）\n}\n\n/// 量房墙段：局部坐标系 2D 点（mm），长度可由几何自算或 RoomPlan 给。\nclass RoomWall {\n  final String id;\n  final double ax, ay, bx, by;   // 局部坐标 mm（首点=原点）\n  final double lengthMm;\n  final double? thicknessMm;      // 墙厚（人工/图纸补）\n  final List\u003cWallOpening\u003e openings;\n  // copyWith/toJson/fromJson\n}\n\n/// 一次量房记录（source: roomplan | manual | photo）。\nclass RoomScanRecord {\n  final String id;\n  final String projectKey;\n  final String name;            // 如 \"B座 精装样板间 主卧\"\n  final String source;\n  final int scannedAtMs;\n  final List\u003cRoomWall\u003e walls;   // 墙段（首尾相接的闭合多边形）\n  final double? closureDeltaMm; // 闭合差（自动算/扫描给）\n  final double? netHeightMm;    // 净高（可空）\n  final String? drawingKey;     // 关联图纸（核尺场景）\n  final String? rawJson;        // RoomPlan 原始输出/或本记录扩展（大字段可存文件路径）\n  final List\u003cMeasureItem\u003e checks; // 图纸对照判定项（复用现有 MeasureItem）\n  final String? note;\n  // copyWith/toJson/fromJson（全默认值兜底）；房间面积由几何实时算不入库\n}\n\nclass RoomScanArgs {  // 路由参数\n  final String? recordId; final String? projectKey; final String? drawingKey;\n  const RoomScanArgs({this.recordId, this.projectKey, this.drawingKey});\n}\n```\n\n存储：新增 `lib/core/storage/room_scan_store.dart`（照 `measure_store.dart`：key `room_scan_v1_\u003cprojectId\u003e`，List\u003cRoomScanRecord\u003e）。\n\n## P0-2：几何与工程习惯引擎（`lib/core/room/room_geometry.dart`，纯函数+可单测）\n\n1. `polygonClosureDelta(List\u003cOffset\u003e ptsMm)` → 首尾缺口 mm；`routeHintsForClosure(delta)` → 建议复核哪些段\n2. `orthoSnapPoints(List\u003cOffset\u003e pts, {double tolDeg = 5})` → 85~95°夹角吸附为 90°（返回修正后点集 + 被吸附角索引）\n3. `roomAreaM2(List\u003cOffset\u003e pts)` → 鞋带公式面积\n4. `dimensionLinesFor(walls, {bool net=true})` → 标注布局（每条墙段：中点垂直引出、线端箭头、文本参数），渲染层通用\n5. `openingSplit(wall, openings)` → 在墙段上标注洞口打断位置（供绘制）\n6. 单位/格式统一（mm / ㎡ / 双精度取舍）——建议直接复用现有 `mm_format.dart`/`fmtMm`\n\n验收：写 6~10 个 dart test（`test/room_geometry_test.dart`）：直角吸附（88°→90°）、闭合差计算、正方形面积、标注引出方向。\n\n## P0-3：成图编辑器（手动定点/照片成图，跨平台主路径）\n\n新增 `lib/features/room/room_draw_page.dart`（照 measure_page 交互经验）：\n- 输入两种底：①空白坐标系（装修量房：0.5m 网格纸感）②现场照片（拍照后标定→点墙角的 1px=mm 换算，复用 measure_page 的照片标定逻辑 `_applyRefCalib` 思路）\n- 交互：单击加墙角点 → 自动连墙段 → 双击=非正交转折提示 → 拖动点改 → 长按删 → 在墙段上点=加门/窗洞口（弹宽度表单）→ 撤销/清空\n- 实时：正交吸附开关（默认开）、显示每段长度mm、周长、面积㎡、闭合差\n- 校验条：闭合差 ≤15mm 绿 / \u003e15mm 红+\"复核第X段\"\n- 工程信息卡：名称、净高、墙厚默认（如 200）、房间用途下拉（卧室/客厅/厨房/卫浴…装修场景）\n- 保存 → RoomScanRecord(source:'manual') → 列表\n\n## P0-4：记录列表/详情 + 报告接入\n\n- `lib/features/room/room_records_page.dart`：按项目列表（缩略户型图 + 名称/时间/面积/闭合差状态）；详情=户型图 CustomPaint（墙/洞口/尺寸标注/面积文字）+ 工程信息 + 照片证据 + checks\n- 报告：`WeeklyReport` 加 `List\u003cRoomScanRecord\u003e`/概要字段（默认空，兼容）；`report_content.dart` 加 `RoomBlock`，**HTML/PDF/DOCX/XLSX 四端同步**渲染量房记录（户型图以 SVG/PNG 字节内嵌，缺失显占位）\n- 入口：图纸库/主页加\"量房\"入口（与\"拍照量尺\"平级）\n\n## P0-5：图纸对照核尺（场景2，复用校对逻辑）\n\n- 成图/详情页若有关联 `drawingKey`：调校准映射把户型多边形放到图纸坐标 → 与图纸标注关键尺寸逐条对比（或手动逐条对照测量）\n- 生成 `checks: List\u003cMeasureItem\u003e`（source:'roomplan'/'manual'）→ 复用现有判定（tolMm/tolPct）与清单展示；进报告\"尺寸校对\"区\n- v0 简化：每面墙一条对比（量得 vs 图纸输入），出偏差表即可\n\n## P1：[原生-待真机] RoomPlan 封装 + AR 墙角模式\n\n### 原生（`ios/Runner/`，只写代码不编译）\n- `RoomCaptureController.swift`：\n  - 封装 `RoomCaptureSession`/`RoomCaptureView`（RoomPlan，iOS16+）\n  - 代理回调：捕获房间墙段/洞口/房间 JSON（`capturedRoom` → `export(to:json)` / `usdz`)\n  - MethodChannel `room_capture`：`isRoomPlanSupported` / `start` / `stop` / `exportJson`（返回 JSON 字符串回 Flutter）\n  - 权限沿用相机；A11+ 与 LiDAR 判断：`RoomCaptureSession.isSupported`\n- 注册：`AppDelegate.swift` 加 view/通道注册（照 ArMeasureView 模式）\n- 手动墙角模式：`ArMeasureView.swift` 加\"连续角点\"模式（每点返回世界坐标，Flutter 侧接墙角序列成墙段）——改动小，仅模式枚举+回调\n\n### Dart 侧（可写可审）\n- `lib/core/room/room_capture_service.dart`：MethodChannel 封装（照 ar_measure_service）\n- `room_auto_scan_page.dart`：扫描 UI（提示绕房走一圈→骨架预览→跳 `room_draw_page` 修正补洞→工程信息→保存 source:'roomplan'）；`isRoomPlanSupported=false` → 提示并跳手动模式\n- **联调验证项全部标注 [待真机]**，交付时列清单\n\n## P2：安卓 ARCore 实测评估（出文档）\n\n`ANDROID_AR_RESEARCH.md`（若旧文件已出结论，追加\"量房场景\"节）：1 台有 GMS 安卓实测 `ar_flutter_plugin_plus` 量房场景可达性与精度；无 GMS → 结论维持\"安卓走照片/手动成图\"，不写产品代码。\n\n## 全局红线\n\n1. `models.dart` 追加不覆盖；fromJson 全默认值；不触碰现有 measure/ar/capture 已修逻辑\n2. 报告/统计四端同步；照片/户型图缺失显占位不阻断导出\n3. [原生-待真机] 代码交付时明确标注\"未编译未联调\"；不伪造验证结果\n4. 每阶段：`flutter analyze` 无 error + `flutter build web --release` 通过 + 改动清单\n5. 几何引擎要有测试；不引入未批准第三方依赖（绘制用 CustomPaint，不用图表库）\n\n## 给用户的演示路径（无 Mac/Pro 设备也能先跑）\n\nP0 完成后：Web 端 → \"量房\" → 手动模式 → 空白底图点 4 角（或选现场照片标定后点角）→ 出房间/尺寸标注/面积/闭合差 → 保存 → 列表/进报告。**演示词：手动成图已能用；自动扫描（RoomPlan）代码已备好，等 iPhone Pro 一到就接通，扫一圈自动出图。**\n"},{"id":"ROOM_MEASURE_IMPL_DETAIL.md","path":"ROOM_MEASURE_IMPL_DETAIL.md","url":"Uk9PTV9NRUFTVVJFX0lNUExfREVUQUlMLm1k","base":"ROOM_MEASURE_IMPL_DETAIL.md","title":"量房功能实施（超详细版，CodeBuddy 直接执行）","group":"功能实现","scope":"current","date":"2026-09-15","mtime":"2026-09-15","size":30500,"chars":24408,"lines":646,"nhead":24,"lead":"精简版见 ROOM_MEASURE_IMPL.md（分层/红线/演示路径）。本文是全量规格：纯逻辑给代码、UI 给规格、原生给骨架与契约。 铁律：先在工程内读一遍下列\"参照文件\"确认现状；models.dart 一律追加不覆盖；fromJson 全默认值；不引新第三方库（绘制用 CustomPaint）。","text":"# 量房功能实施（超详细版，CodeBuddy 直接执行）\n\u003e 精简版见 `ROOM_MEASURE_IMPL.md`（分层/红线/演示路径）。本文是全量规格：纯逻辑给代码、UI 给规格、原生给骨架与契约。\n\u003e 铁律：先在工程内读一遍下列\"参照文件\"确认现状；models.dart 一律追加不覆盖；fromJson 全默认值；不引新第三方库（绘制用 CustomPaint）。\n\u003e 参照文件：`lib/data/models.dart`、`lib/core/storage/measure_store.dart`、`lib/core/utils/measure_math.dart`、`lib/features/measure/measure_page.dart`、`lib/features/measure/ar_measure_page.dart`、`lib/app.dart`(路由)、`lib/data/repository/repository.dart`、`lib/features/defects/report_content.dart`、`report_builder.dart`/`report_pdf.dart`/`report_docx.dart`/`report_xlsx.dart`、`lib/core/di/providers.dart`、`ios/Runner/AppDelegate.swift`、`ios/Runner/ArMeasureView.swift`。\n\n---\n\n## 1. 数据模型（models.dart 文件末尾「量房」段，完整代码）\n\n```dart\n// ==================== 量房（Room）====================\n\n/// 墙段洞口（门/窗）\nclass WallOpening {\n  final String type;         // 'door' | 'window'\n  final double offsetFromMm; // 距该墙段起点\n  final double widthMm;\n  final double? heightMm;    // 门高 / 窗台高（人工补，可空）\n  const WallOpening({\n    required this.type,\n    required this.offsetFromMm,\n    required this.widthMm,\n    this.heightMm,\n  });\n\n  WallOpening copyWith({\n    String? type, double? offsetFromMm, double? widthMm, double? heightMm,\n  }) =\u003e WallOpening(\n        type: type ?? this.type,\n        offsetFromMm: offsetFromMm ?? this.offsetFromMm,\n        widthMm: widthMm ?? this.widthMm,\n        heightMm: heightMm ?? this.heightMm,\n      );\n\n  Map\u003cString, dynamic\u003e toJson() =\u003e {\n        'type': type, 'offsetFromMm': offsetFromMm,\n        'widthMm': widthMm, 'heightMm': heightMm,\n      };\n\n  factory WallOpening.fromJson(Map\u003cString, dynamic\u003e m) =\u003e WallOpening(\n        type: m['type']?.toString() ?? 'door',\n        offsetFromMm: (m['offsetFromMm'] as num? ?? 0).toDouble(),\n        widthMm: (m['widthMm'] as num? ?? 0).toDouble(),\n        heightMm: (m['heightMm'] as num?)?.toDouble(),\n      );\n}\n\n/// 量房墙段（局部坐标 mm；lenMm 存校正后长度，points 存原始角点）\nclass RoomWall {\n  final String id;\n  final double ax, ay, bx, by; // 角点（局部 mm，首点=原点）\n  final double lengthMm;       // 校正后长度（正交吸附后重算）\n  final double? thicknessMm;   // 墙厚（默认 200，人工可改）\n  final List\u003cWallOpening\u003e openings;\n  const RoomWall({\n    required this.id,\n    required this.ax, required this.ay, required this.bx, required this.by,\n    required this.lengthMm,\n    this.thicknessMm,\n    this.openings = const [],\n  });\n\n  RoomWall copyWith({\n    double? ax, double? ay, double? bx, double? by,\n    double? lengthMm, double? thicknessMm, List\u003cWallOpening\u003e? openings,\n  }) =\u003e RoomWall(\n        id: id,\n        ax: ax ?? this.ax, ay: ay ?? this.ay, bx: bx ?? this.bx, by: by ?? this.by,\n        lengthMm: lengthMm ?? this.lengthMm,\n        thicknessMm: thicknessMm ?? this.thicknessMm,\n        openings: openings ?? this.openings,\n      );\n\n  Map\u003cString, dynamic\u003e toJson() =\u003e {\n        'id': id, 'ax': ax, 'ay': ay, 'bx': bx, 'by': by,\n        'lengthMm': lengthMm, 'thicknessMm': thicknessMm,\n        'openings': openings.map((o) =\u003e o.toJson()).toList(),\n      };\n\n  factory RoomWall.fromJson(Map\u003cString, dynamic\u003e m) =\u003e RoomWall(\n        id: m['id']?.toString() ?? '',\n        ax: (m['ax'] as num? ?? 0).toDouble(),\n        ay: (m['ay'] as num? ?? 0).toDouble(),\n        bx: (m['bx'] as num? ?? 0).toDouble(),\n        by: (m['by'] as num? ?? 0).toDouble(),\n        lengthMm: (m['lengthMm'] as num? ?? 0).toDouble(),\n        thicknessMm: (m['thicknessMm'] as num?)?.toDouble(),\n        openings: (m['openings'] as List? ?? [])\n            .map((e) =\u003e WallOpening.fromJson(e as Map\u003cString, dynamic\u003e))\n            .toList(),\n      );\n}\n\n/// 量房记录\nclass RoomScanRecord {\n  final String id;\n  final String projectKey;\n  final String name;           // 房间名，如 \"主卧\"\n  final String roomUse;        // 用途：卧室/客厅/厨房/卫浴/其他（装修场景）\n  final String source;         // 'roomplan' | 'manual' | 'photo'\n  final int scannedAtMs;\n  final List\u003cRoomWall\u003e walls;  // 首尾相接（按顺序构成闭合多边形）\n  final double? closureDeltaMm;\n  final double? netHeightMm;   // 净高 mm\n  final String? drawingKey;    // 核尺场景关联图纸\n  final List\u003cMeasureItem\u003e checks; // 与图纸对照判定（复用 MeasureItem）\n  final String? note;\n  const RoomScanRecord({\n    required this.id,\n    required this.projectKey,\n    required this.name,\n    this.roomUse = '其他',\n    this.source = 'manual',\n    required this.scannedAtMs,\n    this.walls = const [],\n    this.closureDeltaMm,\n    this.netHeightMm,\n    this.drawingKey,\n    this.checks = const [],\n    this.note,\n  });\n\n  /// 几何派生的只读值（不入库）\n  List\u003cOffset\u003e get cornerPoints =\u003e [\n        for (final w in walls) Offset(w.ax, w.ay),\n        if (walls.isNotEmpty) Offset(walls.last.bx, walls.last.by),\n      ];\n\n  RoomScanRecord copyWith({\n    String? name, String? roomUse, String? source,\n    List\u003cRoomWall\u003e? walls, double? closureDeltaMm, double? netHeightMm,\n    String? drawingKey, List\u003cMeasureItem\u003e? checks, String? note,\n  }) =\u003e RoomScanRecord(\n        id: id, projectKey: projectKey,\n        name: name ?? this.name,\n        roomUse: roomUse ?? this.roomUse,\n        source: source ?? this.source,\n        scannedAtMs: scannedAtMs,\n        walls: walls ?? this.walls,\n        closureDeltaMm: closureDeltaMm ?? this.closureDeltaMm,\n        netHeightMm: netHeightMm ?? this.netHeightMm,\n        drawingKey: drawingKey ?? this.drawingKey,\n        checks: checks ?? this.checks,\n        note: note ?? this.note,\n      );\n\n  Map\u003cString, dynamic\u003e toJson() =\u003e {\n        'id': id, 'projectKey': projectKey, 'name': name,\n        'roomUse': roomUse, 'source': source, 'scannedAtMs': scannedAtMs,\n        'walls': walls.map((w) =\u003e w.toJson()).toList(),\n        'closureDeltaMm': closureDeltaMm,\n        'netHeightMm': netHeightMm, 'drawingKey': drawingKey,\n        'checks': checks.map((c) =\u003e c.toJson()).toList(),\n        'note': note,\n      };\n\n  factory RoomScanRecord.fromJson(Map\u003cString, dynamic\u003e m) =\u003e RoomScanRecord(\n        id: m['id']?.toString() ?? '',\n        projectKey: m['projectKey']?.toString() ?? '',\n        name: m['name']?.toString() ?? '',\n        roomUse: m['roomUse']?.toString() ?? '其他',\n        source: m['source']?.toString() ?? 'manual',\n        scannedAtMs: (m['scannedAtMs'] as num? ?? 0).toInt(),\n        walls: (m['walls'] as List? ?? [])\n            .map((e) =\u003e RoomWall.fromJson(e as Map\u003cString, dynamic\u003e))\n            .toList(),\n        closureDeltaMm: (m['closureDeltaMm'] as num?)?.toDouble(),\n        netHeightMm: (m['netHeightMm'] as num?)?.toDouble(),\n        drawingKey: m['drawingKey']?.toString(),\n        checks: (m['checks'] as List? ?? [])\n            .map((e) =\u003e MeasureItem.fromJson(e as Map\u003cString, dynamic\u003e))\n            .toList(),\n        note: m['note']?.toString(),\n      );\n}\n\n/// 路由参数\nclass RoomScanArgs {\n  final String? recordId;\n  final String? projectKey;\n  final String? drawingKey;\n  final String? drawingTitle;\n  const RoomScanArgs({this.recordId, this.projectKey, this.drawingKey, this.drawingTitle});\n}\n```\n\n\u003e 注意：`MeasureItem` 若还没有 `fromJson`，先读它的定义并补（toJson 已存在，见 measure_store）。`Offset` 来自 flutter/material（models.dart 已 import）。\n\n## 2. 存储（新增 `lib/core/storage/room_scan_store.dart`，照 measure_store 模式）\n\n```dart\nimport 'dart:convert';\nimport 'local_storage.dart';\nimport '../../data/models.dart';\n\n/// 量房记录持久化：key = room_scan_v1_\u003cprojectId\u003e → JSON List。\nclass RoomScanStore {\n  const RoomScanStore._();\n\n  static String _key(String projectId) =\u003e 'room_scan_v1_$projectId';\n\n  static Future\u003cList\u003cRoomScanRecord\u003e\u003e list(String projectId) async {\n    final raw = await LocalStorage.instance.readDoc(_key(projectId));\n    if (raw == null || raw.trim().isEmpty) return const [];\n    try {\n      final arr = jsonDecode(raw) as List\u003cdynamic\u003e;\n      return arr\n          .map((e) =\u003e RoomScanRecord.fromJson(e as Map\u003cString, dynamic\u003e))\n          .toList();\n    } catch (_) {\n      return const [];\n    }\n  }\n\n  static Future\u003cvoid\u003e save(String projectId, RoomScanRecord r) async {\n    final all = [...await list(projectId)];\n    final i = all.indexWhere((e) =\u003e e.id == r.id);\n    if (i \u003e= 0) { all[i] = r; } else { all.insert(0, r); }\n    await LocalStorage.instance\n        .writeDoc(_key(projectId), jsonEncode(all.map((e) =\u003e e.toJson()).toList()));\n  }\n\n  static Future\u003cvoid\u003e delete(String projectId, String id) async {\n    final all = await list(projectId);\n    await LocalStorage.instance.writeDoc(_key(projectId),\n        jsonEncode(all.where((e) =\u003e e.id != id).map((e) =\u003e e.toJson()).toList()));\n  }\n}\n```\n\n## 3. 几何/工程习惯引擎（新增 `lib/core/room/room_geometry.dart`，完整代码）\n\n```dart\nimport 'dart:math' as math;\nimport 'package:flutter/material.dart';\nimport '../../data/models.dart'; // WallOpening（openingCentersUnit 用到）\n\n/// 量房几何纯函数：正交吸附 / 闭合差 / 面积 / 标注布局 / 洞口分段。\n/// 约定：点坐标 mm；多边形点按走墙顺序（顺/逆时针均可）。\n\n/// 点到点距离\ndouble _dist(Offset a, Offset b) =\u003e (a - b).distance;\n\n/// 角 abc（b 为顶点）弧度 → 角度（度）\ndouble _angleDeg(Offset a, Offset b, Offset c) {\n  final v1 = a - b, v2 = c - b;\n  final d = v1.distance * v2.distance;\n  if (d == 0) return 0;\n  return math.acos((v1.dx * v2.dx + v1.dy * v2.dy) / d) * 180 / math.pi;\n}\n\n/// 1) 正交吸附：对每个顶点 b（邻点 a、c），若内角 ∈ [90-tol, 90+tol] 则把\n///    a→b、b→c 两向量强制正交（保持 b 位置与两段长度近似，旋转更短的一侧）。\n///    返回 {points: 修正后点集, snappedIdx: 被吸附的顶点下标集}。\n({List\u003cOffset\u003e points, Set\u003cint\u003e snappedIdx}) orthoSnap(\n  List\u003cOffset\u003e pts, {\n  double tolDeg = 5,\n}) {\n  if (pts.length \u003c 3) return (points: List.of(pts), snappedIdx: \u003cint\u003e{});\n  final out = List\u003cOffset\u003e.of(pts);\n  final snapped = \u003cint\u003e{};\n  for (var i = 0; i \u003c pts.length; i++) {\n    final a = pts[(i - 1 + pts.length) % pts.length];\n    final b = pts[i];\n    final c = pts[(i + 1) % pts.length];\n    final ang = _angleDeg(a, b, c);\n    if (ang \u003e 90 - tolDeg \u0026\u0026 ang \u003c 90 + tolDeg) {\n      // 把 c 沿 (b-a) 垂线投影，使 ab ⊥ bc：以 a 为不动点更稳，\n      // 简法：保持 ab 不变，把 c 投影到过 b 且垂直于 ab 的直线上。\n      final ab = b - a;\n      final len2 = ab.dx * ab.dx + ab.dy * ab.dy;\n      if (len2 \u003e 1e-6) {\n        final bc = c - b;\n        final proj = (bc.dx * ab.dx + bc.dy * ab.dy) / len2;\n        final foot = Offset(b.dx + proj * ab.dx, b.dy + proj * ab.dy); // c 在 ab 线上的投影（相对 b）\n        // 保持 c 到 b 距离：把 bc 旋转 90° 到 ab 垂直方向，长度不变\n        final lenBc = _dist(b, c);\n        final n = Offset(-ab.dy, ab.dx) / math.sqrt(len2);\n        final dir = (proj \u003e= 0 ? 1.0 : -1.0) * (proj.abs() \u003c 1e-3 ? 1.0 : 1.0);\n        // 简化实现：以 foot 为中心取垂直方向，取与旧 c 同侧\n        final oldSide = (bc.dx * n.dx + bc.dy * n.dy);\n        out[(i + 1) % pts.length] = b + n * (lenBc * (oldSide \u003e= 0 ? 1 : -1));\n        snapped.add(i);\n      }\n      // 注：若需更高保真可保留两版并选闭合差更小者，v1 用本实现即可\n    }\n  }\n  return (points: out, snappedIdx: snapped);\n}\n\n/// 2) 闭合差：多边形首尾缺口长度（mm）\ndouble closureDelta(List\u003cOffset\u003e pts) {\n  if (pts.length \u003c 3) return 0;\n  return _dist(pts.first, pts.last);\n}\n\n/// 3) 多边形面积（鞋带公式），㎡（输入 mm）\ndouble areaM2(List\u003cOffset\u003e pts) {\n  if (pts.length \u003c 3) return 0;\n  var s = 0.0;\n  for (var i = 0; i \u003c pts.length; i++) {\n    final p = pts[i], q = pts[(i + 1) % pts.length];\n    s += p.dx * q.dy - q.dx * p.dy;\n  }\n  return (s.abs() / 2) / 1e6; // mm² → ㎡\n}\n\n/// 4) 各墙段校正长度（正交吸附后重算，mm）\nList\u003cdouble\u003e wallLengthsMm(List\u003cOffset\u003e pts) =\u003e [\n      for (var i = 0; i \u003c pts.length; i++)\n        _dist(pts[i], pts[(i + 1) % pts.length]),\n    ];\n\n/// 标注布局参数：第 i 条墙段的标注引出点（墙段中点 + 外法线偏移 len）\n/// 返回 {mid, normalFromMid: 外法向单位向量方向的位置点}\n({Offset mid, Offset labelPos}) dimAnchorFor(\n  List\u003cOffset\u003e pts, int i, {\n  double offsetPx = 24,\n}) {\n  final a = pts[i], b = pts[(i + 1) % pts.length];\n  final mid = Offset((a.dx + b.dx) / 2, (a.dy + b.dy) / 2);\n  var n = Offset(-(b.dy - a.dy), b.dx - a.dx);\n  final len = n.distance;\n  if (len == 0) return (mid: mid, labelPos: mid);\n  n = n / len;\n  // 取\"外\"侧：指向多边形外（用质心判断）\n  final c = centroid(pts);\n  final outward = (mid.dx - c.dx) * n.dx + (mid.dy - c.dy) * n.dy \u003e= 0 ? 1.0 : -1.0;\n  return (mid: mid, labelPos: mid + n * outward * offsetPx);\n}\n\nOffset centroid(List\u003cOffset\u003e pts) {\n  if (pts.isEmpty) return Offset.zero;\n  var x = 0.0, y = 0.0;\n  for (final p in pts) { x += p.dx; y += p.dy; }\n  return Offset(x / pts.length, y / pts.length);\n}\n\n/// 5) 洞口在墙段上的打断：给定整墙段 a→b 与洞列表，返回洞口中心位置（局部坐标系归一化）\nList\u003cdouble\u003e openingCentersUnit(List\u003cOffset\u003e aB, List\u003cWallOpening\u003e ops, double wallLenMm) {\n  if (wallLenMm \u003c= 0) return const [];\n  return [\n    for (final o in ops)\n      ((o.offsetFromMm + o.widthMm / 2) / wallLenMm).clamp(0.0, 1.0),\n  ];\n}\n```\n\n\u003e 正交吸附 v1 实现较简（保长近似）。若闭合差测试不稳，允许在测试内标注\"吸附为启发式\"，验收以「吸附后仍闭合可复核」为准，不做非线性全局优化。\n\n## 4. 测试（新增 `test/room_geometry_test.dart`，完整用例）\n\n```dart\nimport 'package:flutter_test/flutter_test.dart';\nimport 'package:flutter/material.dart';\nimport 'package:gongdi_app/core/room/room_geometry.dart'; // 包名以 pubspec.yaml name: 为准（实际 gongdi_app）\nimport 'package:gongdi_app/data/models.dart'; // WallOpening\n\nvoid main() {\n  test('开多边形闭合差=首尾缺口(底边长 3000)、面积正确', () {\n    final pts = [\n      const Offset(0, 0), const Offset(0, 4000),\n      const Offset(3000, 4000), const Offset(3000, 0),\n    ];\n    // closureDelta = dist(首,尾)；此 4 点未闭合（缺\"回起点\"边）→ 缺口=底边 3000\n    expect(closureDelta(pts), closeTo(3000, 1e-6));\n    expect(areaM2(pts), closeTo(12.0, 1e-6)); // 3m×4m = 12㎡\n    expect(wallLengthsMm(pts), [4000, 3000, 4000, 3000]);\n  });\n\n  test('闭合多边形（末点=首点）闭合差 0', () {\n    final closed = [\n      const Offset(0, 0), const Offset(0, 4000),\n      const Offset(3000, 4000), const Offset(3000, 0), const Offset(0, 0),\n    ];\n    expect(closureDelta(closed), closeTo(0, 1e-6));\n    expect(wallLengthsMm(closed).length, 4);\n  });\n\n  test('88° 角被吸附为 90°', () {\n    final pts = [\n      const Offset(0, 0), const Offset(0, 4000),\n      const Offset(3010, 4010), // 应被吸附到 3000? 方向近似垂直\n      const Offset(3000, 0),\n    ];\n    final r = orthoSnap(pts);\n    expect(r.snappedIdx, isNotEmpty);\n    // 吸附后相邻段夹角近似 90°\n    // 复核第2点与第3点间夹角\n  });\n\n  test('面积 ㎡ 输出（旋转房间不依赖方向）', () {\n    final r = [\n      const Offset(0, 0), const Offset(2000, 0),\n      const Offset(2000, 1500), const Offset(0, 1500),\n    ];\n    expect(areaM2(r), closeTo(3.0, 1e-6));\n  });\n\n  test('标注外法向与质心方向一致（向外）', () {\n    final pts = [\n      const Offset(0, 0), const Offset(0, 4000),\n      const Offset(3000, 4000), const Offset(3000, 0),\n    ];\n    final anchor = dimAnchorFor(pts, 0); // 左墙\n    // labelPos.x 应 \u003c mid.x（朝外侧 x 负向）\n    expect(anchor.labelPos.dx, lessThan(anchor.mid.dx));\n  });\n\n  test('洞口中心归一化', () {\n    const w = [\n      WallOpening(type: 'door', offsetFromMm: 100, widthMm: 900),\n    ];\n    final units = openingCentersUnit([Offset.zero, const Offset(0, 4000)], w, 4000);\n    expect(units.single, closeTo((100 + 450) / 4000, 1e-9));\n  });\n}\n```\n\n## 5. Providers / 存储注册（providers.dart 追加）\n\n```dart\nfinal roomScansProvider =\n    FutureProvider.family\u003cList\u003cRoomScanRecord\u003e, String\u003e(\n        (ref, projectId) =\u003e RoomScanStore.list(projectId));\n\nFuture\u003cvoid\u003e refreshRoomScans(Ref ref, String projectId) =\u003e\n    ref.invalidate(roomScansProvider(projectId));\n```\n\n## 6. 路由（app.dart）\n\n新增 4 条（照现有 MeasurePage 路由的 extra 模式）：`/room-records`、`/room-draw`、`/room-detail`、`/room-scan`，extra 用 `RoomScanArgs`。入口按钮加在：主页快捷操作（`home_page.dart` 现有入口旁）与 capture_page 的\"量尺\"按钮区（照其现有图标按钮写法），文案「量房」。\n\n## 7. 页面规格\n\n### 7.1 记录列表 `lib/features/room/room_records_page.dart`\n- 顶栏：AppBar「量房记录」+ 右上 `+`（跳 /room-draw 新建，source:manual）\n- Body：从 `roomScansProvider(currentProjectId)` 读；空态文案\"还没有量房记录，点 + 开始量房\"\n- 卡片每项：CustomPaint 缩略户型图（复用 7.4 painter，小尺寸）+ 名称/用途/日期/面积㎡/闭合差状态（≤15 绿· 超 红\"需复核\"）\n- 点卡片 → /room-detail；长按 → 删除确认（RoomScanStore.delete + refresh）\n\n### 7.2 核心成图页 `lib/features/room/room_draw_page.dart`\n状态机：`empty → drawing → saved`；本地状态：`List\u003cOffset\u003e _ptsMm`（局部 mm）、`List\u003cRoomWall\u003e _walls`、`bool _orthoOn=true`、`_selectedWallIdx`、开洞对话框状态、工程信息字段 controllers。\n坐标空间：屏幕 = InteractiveViewer 缩放的 0.5m 网格画布（画布逻辑尺寸取 max(5m, 房间包围盒) 或直接 1px=1mm 大画布 + 初始 fit）。**简化方案：固定画布 8000×8000mm，1px=1mm 会超屏 → 用 `CustomPaint` 接受 transform（InteractiveViewer child 用 SizedBox(8000×8000)），点选坐标用 `TransformationController.toScene` 取毫米**（ArMeasure/measure 页已有同款先例）。\n工具栏与交互（从左到右一排，照 AppTokens/图标风格）：\n\n| 按钮/手势 | 行为 |\n|---|---|\n| 顶栏「拍照成图」 | 复用照片标定：拍照/相册 → 参照物标定 → 点墙角（1px:mm 换算后进 _ptsMm）；无照片=网格手绘模式 |\n| 单击画布 | 加角点（自动连墙段） |\n| 拖动已有点 | 改点 |\n| 长按点 | 删点 |\n| 双击墙段 | 选中墙段 → 底部弹「添加洞口」：类型(门/窗) + 距起端 mm + 宽度 mm |\n| 正交开关 | 每次改点后 `_pts = orthoSnap(...).points`（显示被吸附下标） |\n| 底部状态条 | 实时：周长 m · 面积 ㎡ · 闭合差 mm（色标）· 墙段数 |\n| 工程信息卡 | 名称/房间用途下拉/净高 mm/默认墙厚 mm（底部展开） |\n| 保存 | 校验：角点 ≥3、闭合差\u003e50mm 弹\"闭合差偏大，仍保存？\"→ 组 RoomWall（长度=吸附后 wallLengthsMm）+ 写 store → pop 回列表 |\n\n### 7.3 详情页 `lib/features/room/room_detail_page.dart`\n户型图（大）+ 尺寸标注（7.4 painter 开标注层）+ 工程信息 + 墙段表（编号/长度/墙厚/洞口，行可删改存）+ checks 区（核尺结果，见 7.5）+ 右上「导出进报告」（报告组件已含量房块后自动纳入）。\n\n### 7.4 户型 painter（新增 `lib/features/room/room_plan_painter.dart`）\n`CustomPainter` 参数：`walls/record, bool showDims, double area, ColorScheme-ish 色板（AppTokens）`。绘制顺序：\n1. 房间填充（surface）\n2. 外墙双线（厚 thicknessMm→ 缩放后描双线，或 v1 单线+填充示意）：内边线粗 2、外扩 4 半透明\n3. 洞口：在墙段上画门弧（quarter arc 90°方向）+ 窗双线（按 offset/width 换算）\n4. 尺寸标注层（showDims）：每墙 dimAnchorFor → 引线+两端短竖线+文字（`fmtMm`，墙体字 12 深灰；被吸附段绿色小勾）\n5. 面积文字：质心处 \"房间名 · xx.xx ㎡\"（W700）\n缩放：统一 `scale = painterSize / 包围盒`，所有 mm → px 后绘制（视图 widget 用 LayoutBuilder + FittedBox 或 AspectRatio 居中；列表缩略用同一 painter 小尺寸）。\n\n### 7.5 图纸核尺对照（P0-5，场景2）\n详情页「对照图纸」按钮（当 drawingKey 存在 / 或选图）：\n1. 调校准映射 `loadCadCalibration(ref, drawingKey)`；无则提示先校准\n2. 进入对照模式：户型图与图纸并排/叠放，逐墙选择\"图纸上对应两点\"（复用 measure_page 图纸点两点量距），自动生成 `MeasureItem(name:'墙N', drawingMm:图纸量, photoMm:本墙lengthMm, source:'roomplan'/'manual')`\n3. 判定复用 MeasureItem.pass(tolMm,tolPct)（默认 15/2 可调）→ 列表绿/红 + 记录.checks 保存 → 进报告\"尺寸校对\"区\n\n## 8. 报告四端接入（四端必须同步改）\n\n- `WeeklyReport`：追加 `final List\u003cRoomScanRecord\u003e roomScans;`（默认 `const []`）+ copyWith/构建处补（读取处给默认）\n- `report_content.dart`：新增 `final class RoomBlock extends ReportBlock`（字段：record + 户型PNG字节 path 或占位标志）；在 `buildReportBlocks` 的板块序里插到 DefectsBlock 之后；`ReportStats` 不必加（量房为独立区，标题\"量房记录\"）\n- HTML `report_builder.dart` / PDF `report_pdf.dart` / DOCX `report_docx.dart` / XLSX `report_xlsx.dart`：各自在 switch(block) 加 `RoomBlock` 分支——HTML 用 `\u003cimg src=data:png\u003e` 内嵌户型图（缺字节显\"量房记录未配图\"）；PDF 用 `pw.MemoryImage`；DOCX 插段落+文本尺寸表；XLSX 加\"量房记录\"sheet（名称/用途/时间/面积/闭合差/墙段数）。照片字节来源照 defects_page `_loadPhotoBytes` 同法。\n- 导出入口 `defects_page.dart` 的 `_loadPhotoBytes` 一并加载量房户型图字节（缺则占位）。\n\n## 9. P1：[原生-待真机] RoomPlan\n\n### 9.1 原生骨架 `ios/Runner/RoomCaptureController.swift`\n```swift\nimport ARKit\nimport RoomPlan\nimport Flutter\nimport UIKit\n\n/// RoomPlan 量房封装：绕房扫描 → 回调 capturedRoom JSON。\n/// 仅 iOS16+ 且支持 LiDAR 的设备可用（RoomCaptureSession.isSupported）。\nclass RoomCaptureController: NSObject {\n    private let channel: FlutterMethodChannel\n    private var session: RoomCaptureSession?\n    private var roomBuilder: RoomBuilder?\n    private var finalRoom: CapturedRoom?\n    private let sessionConfig = RoomCaptureSession.Configuration()\n    private var isScanning = false\n\n    init(channel: FlutterMethodChannel) {\n        self.channel = channel\n        super.init()\n        channel.setMethodCallHandler { [weak self] call, result in\n            self?.handle(call, result: result)\n        }\n    }\n\n    private func handle(_ call: FlutterMethodCall, result: @escaping FlutterResult) {\n        switch call.method {\n        case \"isSupported\":\n            result(RoomCaptureSession.isSupported)\n        case \"start\":\n            guard RoomCaptureSession.isSupported else {\n                result(FlutterError(code: \"UNSUPPORTED\", message: \"需 iPhone 12 Pro+ / iPad Pro 2020+ 且 iOS16+\", details: nil)); return\n            }\n            startSession(); result(true)\n        case \"stop\":\n            stopSession(); result(true)\n        case \"exportJson\":\n            exportJson(result: result)\n        default:\n            result(FlutterMethodNotImplemented)\n        }\n    }\n\n    private func startSession() {\n        if isScanning { return }\n        let session = RoomCaptureSession()\n        self.session = session\n        roomBuilder = RoomBuilder(options: [.beautifyObjects])\n        let view = RoomCaptureView(frame: .zero, session: session)\n        // 展示层由 Flutter 通过 platform view 承载（照 ArMeasureView 方式注册）\n        session.delegate = self\n        session.run(configuration: sessionConfig)\n        isScanning = true\n    }\n\n    private func stopSession() {\n        guard isScanning else { return }\n        session?.stop()\n        isScanning = false\n    }\n\n    private func exportJson(result: @escaping FlutterResult) {\n        guard let room = finalRoom else {\n            result(FlutterError(code: \"NO_ROOM\", message: \"扫描尚未完成\", details: nil)); return\n        }\n        do {\n            let data = try room.export(to: URL(fileURLWithPath: NSTemporaryDirectory()))\n                // export(to:) 产 USDZ + JSON；改用手动构 JSON 更稳：\n            // 此处直接由 capturedRoom 属性构造精简 JSON（walls/doors/windows/objects + 尺寸）\n            let json = buildJson(from: room)\n            result(json)\n        } catch {\n            result(FlutterError(code: \"EXPORT_FAIL\", message: error.localizedDescription, details: nil))\n        }\n    }\n\n    private func buildJson(from room: CapturedRoom) -\u003e String {\n        // walls: room.walls.map { start/end + dimensions }; doors/windows 同理；\n        // 输出 {walls:[{start:{x,y,z},end:{...},lengthMm}], doors:[...], windows:[...], objects:[...]}\n        // z 忽略，x/y 用 mm（CapturedRoom 单位为米 → ×1000）\n        // 交付时给出完整实现（见下方契约字段）\n        return \"{}\"\n    }\n}\n\nextension RoomCaptureController: RoomCaptureSessionDelegate {\n    func captureSession(_ session: RoomCaptureSession, didUpdate room: CapturedRoom) {\n        // 实时预览可回调 onUpdate（骨架数）\n    }\n    func captureSession(_ session: RoomCaptureSession, didEndWith room: CapturedRoom, error: Error?) {\n        finalRoom = room\n        channel.invokeMethod(\"onScanned\", arguments: buildJson(from: room))\n    }\n    func captureSession(_ session: RoomCaptureSession, didStartWith configuration: RoomCaptureSession.Configuration) {}\n    func captureSession(_ session: RoomCaptureSession, didFailWithError error: Error) {\n        channel.invokeMethod(\"onError\", arguments: error.localizedDescription)\n    }\n}\n```\n\n### 9.2 MethodChannel 契约（写入本文件，交付时作为原生-待联调依据）\n通道名 `room_capture`；方法/参数/返回/回调：\n| 方法 | 参数 | 返回 | 说明 |\n|---|---|---|---|\n| isSupported | - | bool | RoomCaptureSession.isSupported |\n| start | - | bool | 启动扫描（需先经 isSupported） |\n| stop | - | bool | 结束并进入处理 |\n| exportJson | - | String | 精简 JSON（字段见 9.3） |\n| 回调 onScanned | json:String | - | didEndWith 后回调一次 |\n| 回调 onError | msg:String | - | 会话错误/权限拒绝 |\n\n### 9.3 JSON 契约（Flutter 侧解析）\n```json\n{\n  \"walls\":  [{\"start\":{\"x\":0,\"y\":0,\"z\":0},\"end\":{\"x\":3000,\"y\":0,\"z\":0},\"lengthMm\":3000}],\n  \"doors\":  [{\"position\":{\"x\":..},\"widthMm\":900,\"heightMm\":2100}],\n  \"windows\":[{\"position\":{\"x\":..},\"widthMm\":1500,\"heightMm\":1500,\"offsetFromFloorMm\":900}],\n  \"objects\":[{\"category\":\"table\",\"dimensions\":{\"x\":..}}]\n}\n```\nFlutter `room_auto_scan_page` 收 JSON → 生成墙段序列（取首尾相接的墙端点集合）→ 转 `RoomWall`（含 openings=doors/windows）→ 跳 7.2 成图页确认修正（source:'roomplan'）。\n\n### 9.4 Dart 侧服务与页面\n- `lib/core/room/room_capture_service.dart`（MethodChannel 封装，照 ar_measure_service）：isSupported/start/stop/exportJson + onScanned/onError 回调注册\n- `lib/features/room/room_auto_scan_page.dart`：非 iOS / 不支持 → 提示 + 「用手动成图」按钮跳 /room-draw；支持 → 全屏 RoomCaptureView(platform view 需原生侧再建 `RoomCapturePlatformView`，照 ArMeasureViewFactory 模式) + 顶部引导文案（\"从门口开始，绕房间缓慢走一圈，角角落落扫到，别遮挡镜头\"）+ 底部「完成扫描」。收 onScanned → 骨架页 → 跳成图页补正。\n- ⚠️ 本文件全部 iOS 项标注 **[待真机]**，交付清单列明未验证点。\n\n### 9.5 AppDelegate.swift 注册\n照 ArMeasureView 注册范式新增：`RoomCapturePlatformViewFactory`（viewType `room_capture_view`）与通道 `room_capture`（每 viewId 后缀或全局单例——用单例全局通道 + 单 view，实现取简单路径）。\n\n## 10. P3 安卓调研（文档任务）\n在既有 `ANDROID_AR_RESEARCH.md` 追加「量房成图」节：有 GMS 安卓实测 `ar_flutter_plugin_plus` 的 plane 命中能否用于墙角打点序列；无 GMS → 结论\"安卓主路径=手动/照片成图（本方案 P0）\"，不写产品代码。\n\n## 11. 验收清单（交付逐项勾选）\n\nP0：\n- [ ] `flutter analyze` 无 error；`flutter build web --release` 通过\n- [ ] `flutter test test/room_geometry_test.dart` 全绿\n- [ ] Web 手绘模式：点4角→吸附→面积/周长/闭合差正确→加门洞→保存→列表出现→详情户型图带尺寸标注\n- [ ] 照片成图：选图→标定→点墙角→长度量级正确\n- [ ] 报告导出（4格式）含\"量房记录\"区；无图占位不崩\n- [ ] 旧数据兼容：无 room_scan key 时列表空不报错\nP1（代码交付，[待真机]）：\n- [ ] RoomCaptureController.swift + 契约文档 + room_capture_service + auto_scan 页代码齐全\n- [ ] 未验证项清单明确（isSupported/扫描/exportJson/onScanned 全需真机）\nP2：\n- [ ] 图纸对照：B05 校准后逐墙对照出 checks + 判定 + 进报告\nP3：\n- [ ] ANDROID_AR_RESEARCH.md 追加量房结论\n\n## 12. 演示路径与话术（无 Pro 设备版）\n\nWeb 端量房入口 → 手动成图：网格底图点四角（或现场照片标定后点墙角）→ 实时出墙长/面积/闭合差 → 加一扇门 → 保存 → 报告导出含户型图与尺寸。\n话术：\"现在手动成图已经能用了——房间多大、墙多长、有没有闭合误差，一眼看出。等 iPhone Pro 到位，RoomPlan 扫一圈就自动出图，这部分代码已经写好了，就差真机联调。\"\n\n## 13. 给 CodeBuddy 的执行顺序与红线\n\n顺序：§1模型 → §2存储 → §3引擎 → §4测试(先绿) → §5 provider → §6路由 → §7页面(7.1→7.2→7.3→7.4→7.5) → §8报告四端 → §9 P1 代码与契约 → §10 P3 文档 → 按 §11 自查。\n红线：追加不覆盖；fromJson 默认值；引擎有测试；四端同步；[待真机]不伪造验证；不引新依赖；每阶段输出改动清单+analyze/构建结果。\n"},{"id":"docs/specs/CAPTURE_DEFECT_MAPPING.md","path":"docs/specs/CAPTURE_DEFECT_MAPPING.md","url":"ZG9jcy9zcGVjcy9DQVBUVVJFX0RFRkVDVF9NQVBQSU5HLm1k","base":"CAPTURE_DEFECT_MAPPING.md","title":"拍照验收 → 问题记录 · 数据流转与字段对照（MAPPING）","group":"流程规格","scope":"spec","date":"2026-09-18","mtime":"2026-09-18","size":16299,"chars":10105,"lines":178,"nhead":12,"lead":"用途：审计「拍照验收」到「问题清单」这条链路的数据阻塞与字段一致性，作为两侧改动时的契约基线。 维护规则：任一侧字段/口径变更，必须同步本表；每处结论可在源码复核。 代码基线：commit 5361996 之后的提交 + 未提交工作区改动｜核实日期：2026-09-18","text":"# 拍照验收 → 问题记录 · 数据流转与字段对照（MAPPING）\n\n\u003e **用途**：审计「拍照验收」到「问题清单」这条链路的**数据阻塞**与**字段一致性**，作为两侧改动时的契约基线。\n\u003e **维护规则**：任一侧字段/口径变更，必须同步本表；每处结论可在源码复核。\n\u003e **代码基线**：commit `5361996` 之后的提交 + 未提交工作区改动｜**核实日期**：2026-09-18\n\u003e **关联**：`docs/specs/CAPTURE_FLOW.md`、`docs/specs/DEFECTS_FLOW.md`、`FEATURE_INVENTORY.md`\n\n---\n\n## 0. 结论速览\n\n\u003e ✅ **2026-09-18 已实施**：**A1 / A2 / A3 / A4 / B7 已修复**（并附带消除报告「楼层重复显示」）。\n\u003e ⏳ **仍待处理**：C 类（4 项全部）、D 类（3 项全部）、B1~B6 / B8 / B9。\n\u003e 下文 §2 保留**审计发现时**的原貌，实施记录见 §4，变更见 §6。\n\n**有阻塞，且不是一处。** 共 4 类 **22 项**：\n\n| 类别 | 数量 | 性质 |\n|---|---|---|\n| **A 到不了下游** | 4 | 照片、时间轴、GPS、记录人 在\"转入\"路径上丢失（数据在，但没传） |\n| **B 传递中语义丢失/写死** | 9 | 专业分类、AI 建议、置信度、标签、责任人… 或写死或未写 |\n| **C 口径不一致** | 4 | 同一来源的两条记录用两套规则；项目隔离用两套判据；id 三套格式 |\n| **D 回不了上游** | 3 | 下游的整改/销项状态无法回到验收记录（纯单向） |\n\n**字段对得上的**：部位、楼层、发现时间、图纸坐标（4 项）。\n**字段对不上的**：部位命名、严重程度、状态语义、记录人、责任人、GPS/海拔、照片、备注、标签、专业分类、AI 建议、置信度（12 项）。\n**字段根本没有落库的**：置信度、水印凭证、专业分类、重要性、楼栋（5 项）。\n\n\u003e ⚠️ 根因只有一条：**验收记录的 entry JSON 只存了\"看图说话\"所需的最少字段**（`:857-869`），而「转入」是从 entry 重新构造 Defect 的。**entry 里没有的，转入后一定没有**——除非在构造时补写（现在只补了图纸坐标和照片列表）。\n\n---\n\n## 1. 链路全图\n\n```\n拍照（内存态：_shotPhoto / _originalPhoto / _location / _noteController / _defects / _drawPointWorld*）\n  │\n  ├─[出口 A·保存]─────────────────────────────────────────────┐\n  │   capture_page.dart:846-976                              │\n  │   ① 写照片文件 photos/\u003cts\u003e.jpg                            │\n  │   ② entry JSON  → LocalStorage『stored_vision_results』   │\n  │   ③ 聚合 Defect(1 条) → repo.addDefect → 『added_defects_v1』\n  │\n  └─[出口 B·转入]─────────────────────────────────────────────┐\n      读 entry（stored_vision_results）\n      capture_records_controller.dart:279-319\n      ④ 逐条 Defect(N 条) → repo.addDefect → 『added_defects_v1』\n\n『added_defects_v1』(+ 项目种子 defects/dy7Defects)\n  → defectsProvider\n  → 清单页 / 处置回复页 / 记录详情页 / 时间轴\n  → 导出报告（唯一入口在清单页）→ 归档『report_records_v1_\u003cprojectId\u003e』\n```\n\n**三套存储互不引用**：`stored_vision_results`（验收记录）、`added_defects_v1`（缺陷）、`report_records_v1_\u003cprojectId\u003e`（报告归档）。\n\n---\n\n## 2. 阻塞清单\n\n### A 类 · 数据到不了下游（数据存在但没传）\n\n| # | 阻塞 | 证据 | 后果 |\n|---|---|---|---|\n| **A1** | **照片断链**：转入的 Defect 只写 `photos:[photo]`，**没写 `photoPath`**；报告四端只读 `photoPath` | `capture_records_controller.dart:316` vs `report_builder.dart:516, 536`、`report_pdf.dart:754`、`report_docx.dart:557`、`defects_page.dart:178` | 转入的缺陷在报告里**连照片区块都不渲染**（`_photoBlock` 对 null 返回空串，静默省略）。`Defect.photos` 全库无消费方 |\n| **A2** | **时间轴永远取不到转入条的照片**：时间轴按 `d.anchor == anchor` **精确匹配**，而两条路径的 anchor 命名不同 | 匹配：`mock_repository.dart:145`；聚合条 `anchor='部位 · 楼层'`（`capture_page.dart:905, 938`）；转入条 `anchor='部位'`（`controller:303`） | ① 同一部位的两组记录**互相匹配不到**；② 只有聚合条有照片 → 转入条**永不出现在时间轴**；③ 详情页传 `d.anchor`（`record_detail_page.dart:305`），转入条查不到任何照片时**回落到写死 anchor**，页面显示\"西楼1F-左病房翼\"的 demo 数据（`mock_repository.dart:205`） |\n| **A3** | **GPS/海拔**：entry **不存** gps/alt（`capture_page.dart:857-869` 无该字段） | 聚合条有（`:941-942`）；转入条固定空（`controller:306-307`） | 报告出现空值行「GPS / 海拔： · 」——`report_content.dart:469` 拼成 `' · '`，`.trim()` 后是 `'·'` 非空，逃过 `where` 过滤 |\n| **A4** | **记录人**：entry 不存记录人 | 聚合条 `reporter=_currentUser`（`:944`）；转入条写死 `'验收记录'`（`controller:309`） | 报告「记录人」显示\"验收记录\"而非真实拍摄人 |\n\n### B 类 · 传递中语义丢失 / 写死\n\n| # | 字段 | 现状 | 证据 |\n|---|---|---|---|\n| **B1** | 专业分类 `category` | 两条路径**都写死 `other`** → 报告「专业分类」永远是\"其他\" | `capture_page.dart:935`、`controller:300` |\n| **B2** | 严重程度 | 聚合条**取最高**（1 个）；转入条**逐条**（N 个）→ 同一照片在报告里严重度分布不同 | `capture_page.dart:910-915` vs `controller:301` |\n| **B3** | 部位命名 `part` | 聚合条 `部位·楼层·首缺陷等N项`；转入条 `部位` → 清单页同一拍照出现两种标题，看起来像两件事 | `capture_page.dart:931-933` vs `controller:298` |\n| **B4** | 标签 `tags` | 聚合 `['拍照记录', 各缺陷名]`；转入 `['验收转工单','验收#\u003cid\u003e']` → 两套标签体系 | `capture_page.dart:945` vs `controller:310` |\n| **B5** | 备注/巡场意见 `note` | 聚合条 = 无缺陷说明 + 未落盘说明 + 各 desc + 用户描述（多行拼接）；转入条 = `用户描述｜该条 desc` → 同一条缺陷在两处文字不同 | `capture_page.dart:917-922` vs `controller:311` |\n| **B6** | 责任人 `resp` | 聚合条 `'待指派'`；转入条 `''` → 报告「责任人」一处显示\"待指派\"、一处是空行 | `capture_page.dart:943` vs `controller:308` |\n| **B7** | AI 建议 `suggestion` | 聚合条**写**；转入条**未写** → 报告「AI整改建议（施工单位）」在转入条上整体缺失 | `capture_page.dart:952` vs `controller:296-318`（无该字段） |\n| **B8** | 水印凭证 | 水印 burn 进图片，`photoHash` / `watermarkSerial` **从未落库** → 详情页\"已效验\"只能用 status 推导（`DEFECTS_FLOW` D3，触及红线） | `record_detail_page.dart:390`；模型 `models.dart:448, 451` |\n| **B9** | 置信度 `conf` | entry 的 `defects[].conf` **未映射进 Defect**（Defect 也无该字段）→ 报告无法标注\"低置信需人工复核\" | entry `capture_page.dart:867` vs `controller:296-318` |\n\n### C 类 · 口径不一致\n\n| # | 不一致 | 证据 | 后果 |\n|---|---|---|---|\n| **C1** | **项目隔离两套判据**：验收记录按 `drawingsProvider` 的 drawingKey 集合过滤（drawingKey 空则保留）；缺陷按 `is7` 布尔过滤 | `capture_records_controller.dart:205-218` vs `mock_repository.dart:90` + `providers.dart:306` | 两侧可见范围可能不一致：验收记录里看不到、缺陷里却在（或反之） |\n| **C2** | **id 三套格式**：entry `id` = 纯微秒数字串；聚合 Defect `id` = `cap_\u003c微秒\u003e`；转入 Defect `id` = `\u003centryId\u003e#\u003cidx\u003e`。且 Defect 有 `sourceCaptureId` 但**无任何读取方** | `capture_page.dart:858, 930`、`controller:297, 317` | 从 Defect 无法回到 entry（除手工拼 id）；「验收↔问题」双向追溯实际是单向 |\n| **C3** | **\"待整改\"两个数字**：验收记录页数 entry 里 `status != converted` 的 AI 缺陷；问题清单数 `Defect.status == draft` | `capture_records_page.dart:288-296` vs `report_content.dart:306-309` | 同一批问题两个口径，且因聚合条也计入清单而**永不相等** |\n| **C4** | **删除不联动**：删验收记录只动 `stored_vision_results`（不删已转入的 Defect）；Defect 侧**无删除入口** | `controller:69-115` | 产生\"孤儿缺陷\"，其 `sourceCaptureId` 指向已不存在的 entry |\n\n### D 类 · 回不了上游（纯单向）\n\n| # | 缺失的回流 | 证据 | 后果 |\n|---|---|---|---|\n| **D1** | entry 的 `defects[].status` 只有 `pending` / `converted` 两态，**不随 Defect 的整改/销项变化** | `capture_page.dart:867`、`controller:120-157` | 验收记录里永远看不到\"已整改/已销项\"，现场照片沉在验收记录里成为信息孤岛 |\n| **D2** | 无「按 `sourceCaptureId` 反查」的实现 | 全库 `sourceCaptureId` 仅 `controller:317` 一处写入 | 无法在验收记录上标注\"该问题已销项\" |\n| **D3** | **重复计数**：保存已生成 1 条聚合缺陷，转入又生成 N 条；报告 `stats.defects` 与 `open` 把 1+N 全部计入 | `report_content.dart:298-315`（`defects: defects.length`、`open: draft\\|\\|doing`） | **报告\"问题总数\"与\"未闭合\"虚高**；同一张照片在报告里出现 1+N 次 |\n\n---\n\n## 3. 字段对照表\n\n图例：✅ 对齐｜⚠️ 口径不一致｜❌ 丢失/写死｜— 不适用\n\n| 业务字段 | ① entry（验收记录存储） | ② 聚合 Defect（保存路径 A） | ③ 转入 Defect（路径 B） | ④ 清单卡/详情页 | ⑤ 报告 | 判定 |\n|---|---|---|---|---|---|---|\n| 部位 | `anchor`（纯部位名） | `part`=`部位·楼层·首缺陷…`；`anchor`=`部位 · 楼层` | `part`=`anchor`=`部位` | 清单显示 `part`；详情显示 `part` | `part` + 「缺陷位置」=`anchor` | ⚠️ B3 |\n| 缺陷类型 | `defects[].name`（多条） | `type`=首缺陷名 | `type`=该条 name | 清单「问题缺陷」 | 「缺陷类型」 | ⚠️ 聚合为合并名 |\n| 专业分类 | 无 | `other`（写死） | `other`（写死） | 不显示 | 「专业分类」=其他 | ❌ B1 |\n| 严重程度 | `defects[].severity` | **取最高** | **逐条** | 清单带色文字；详情**恒橙** | 分组/统计/排序基准 | ⚠️ B2 |\n| 状态 | `defects[].status`∈{pending,converted} | `status`=draft | `status`=draft | `StatusPill` | `closed`/`open` 统计 | ⚠️ C3 / D1 |\n| 楼层 | ✓ | ✓ | ✓ | 参数卡「楼层部位」 | 「楼层部位」 | ✅ |\n| 发现时间 | `ts` | `ts` | `ts` | 清单「发现时间」/参数卡 | 「发现时间」 | ✅ |\n| 记录人 | **无** | 当前用户 | 写死 `验收记录` | 清单「记录人」 | 「记录人」 | ❌ A4 |\n| 责任人 | **无** | `待指派` | `''`（空） | 清单「责任人」/详情 | 「责任人」（空行） | ⚠️ B6 |\n| GPS / 海拔 | **无** | 有 | 空 | 详情参数卡 | 「GPS / 海拔」（空值行） | ❌ A3 |\n| 图纸坐标 | `worldX/worldY` | 透传 | 透传 | 详情不显示 | 「图纸坐标」（`coordText`） | ✅ |\n| 照片 | `photo`（相对路径） | **`photoPath` ✓** | `photos:[…]` 但 **`photoPath` 空** | 两页都不显示照片 | 靠 `photoPath` | ❌ A1 |\n| 备注/描述 | `note` | 合并长文本 | `note｜desc` | 清单**显示** / 详情**不显示** | 「巡场意见」 | ⚠️ B5 |\n| AI 建议 | `defects[].suggestion` | 写（聚合） | **未写** | 两页都不显示 | 「AI整改建议」 | ❌ B7 |\n| 标签 | 无 | `['拍照记录',…]` | `['验收转工单',…]` | 不显示 | 「标签」 | ⚠️ B4 |\n| 置信度 | `defects[].conf` | — | **未映射** | 不显示 | 无字段可用 | ❌ B9 |\n| 水印凭证 | 无（burn 在图里） | 未写 | 未写 | 详情用 status 推导\"已效验\" | — | ❌ B8 |\n| 完成状态 | 无 | 详情页写 | 详情页写 | 底部操作栏 | 「闭合确认」 | ✅（仅下游） |\n| 重要性 | 无 | 无 | 无 | 不显示 | 靠 `effectiveImportance` 推导 | ❌ |\n| 楼栋 | 无 | 无 | 无 | 不显示 | 分组回退到「严重程度」 | ❌ |\n\n---\n\n## 4. 修复建议（按投入产出排序）\n\n| 优先级 | 动作 | 成本 | 收益 |\n|---|---|---|---|\n| 1 | 转入时补 `photoPath: capture['photo']` | **1 行** | ✅ **已修**（2026-09-18）→ 修复 A1，报告照片恢复 |\n| 2 | 转入时补 `suggestion: vlDefect['suggestion']` | **1 行** | ✅ **已修** → 修复 B7，报告「AI整改建议」恢复 |\n| 3 | 统一 `anchor` 口径 | 2 行 | ✅ **已修** → 修复 A2 主体（两条路径 anchor 均为「部位」，时间轴可跨路径聚合）。**附带修复**：报告 PDF/DOCX/HTML 渲染 `'${d.anchor} · ${d.floor}'`，而聚合条 anchor 原本已含楼层 → **楼层重复显示**，一并消除 |\n| 4 | entry 增记 `gps` / `alt` / `reporter` 并透传 | ~10 行 | ✅ **已修** → 修复 A3、A4（旧 entry 缺字段时回落空串 / `验收记录`，向后兼容）。**注**：B6（责任人 `resp` 仍为空）不在本次范围 |\n| 5 | 修报告 GPS 空值行 | 1 行 | ✅ **已修** → 两值皆空时整行不再输出 |\n| 6 | 明确「聚合条 vs 转入条」分工（是否都要入清单） | 需产品决策 | 修复 D3 重复计数、报告虚高 |\n| 7 | 专业分类接 AI 分类或人工选择；否则报告撤列或改「未分类」 | 需决策+开发 | 修复 B1 |\n| 8 | 下游状态回流验收记录（或明确不做） | 需决策 | 修复 D1/D2 |\n| 9 | 项目隔离统一为 `projectId`（替代 `is7` 布尔与 drawingKey 集合两套） | 较大 | 修复 C1，也是接后端的前置 |\n| 10 | 删除联动（删 entry 时处理其已转入 Defect） | 需决策 | 修复 C4 |\n\n**验证**：`dart analyze lib` → **0 error**；改动文件 `read_lints` 干净。\n**改动文件**：`lib/features/capture/capture_page.dart`、`lib/features/capture_records/capture_records_controller.dart`、`lib/features/defects/report_content.dart`\n\n---\n\n## 5. 溯源索引\n\n\u003e ⚠️ **行号漂移**：本表行号为 2026-09-18 实施修复**之前**的基线。修复后 `capture_page.dart` 第 869 行之后整体 **+9**；`capture_records_controller.dart` 第 283 行之后为 **+8~+10**（新增透传字段）。**引用时优先看「环节」对应的函数名与字段名。**\n\n| 环节 | 文件:行 |\n|---|---|\n| entry 写入 | `lib/features/capture/capture_page.dart:846-976`（结构 `:857-869`，照片 `:875-885`） |\n| 聚合 Defect 写入 | `lib/features/capture/capture_page.dart:929-953` |\n| 转入 Defect 构造 | `lib/features/capture_records/capture_records_controller.dart:279-319` |\n| 转入副作用序列 | `lib/features/capture_records/capture_records_page.dart:236-270` |\n| 缺陷合并/隔离/持久化 | `lib/data/repository/mock_repository.dart:82-97, 117-134`（`added_defects_v1` `:22`） |\n| 时间轴构造与匹配 | `lib/data/repository/mock_repository.dart:137-206` |\n| 报告照片 | `lib/features/defects/report_builder.dart:508-519, 536, 547` |\n| 报告字段集 | `lib/features/defects/report_content.dart:461-487` |\n| 报告统计 | `lib/features/defects/report_content.dart:298-323` |\n| 报告数据源与周期过滤 | `lib/features/defects/defects_page.dart:119-162, 199-211` |\n| 验收记录统计/删除 | `lib/features/capture_records/capture_records_page.dart:274-299`、`capture_records_controller.dart:69-115` |\n\n---\n\n## 6. 变更记录\n\n| 日期 | 变更 |\n|---|---|\n| 2026-09-18 | 首版：审计 4 类 22 项阻塞；订正 `CAPTURE_FLOW.md` D1（报告照片是\"静默省略\"而非\"显示占位\"）与 `DEFECTS_FLOW.md` D4（详情页照片在报告中也仅聚合条可见） |\n| 2026-09-18 | **实施 §4 第 1~5 项**：转入补 `photoPath`/`suggestion`、统一 anchor 口径、entry 增记 `gps/alt/reporter` 并透传、报告 GPS 空值行条件化。修复 A1/A2/A3/A4/B7，附带消除报告「楼层重复」；`dart analyze lib` 0 error |\n"},{"id":"docs/specs/CAPTURE_FLOW.md","path":"docs/specs/CAPTURE_FLOW.md","url":"ZG9jcy9zcGVjcy9DQVBUVVJFX0ZMT1cubWQ=","base":"CAPTURE_FLOW.md","title":"拍照验收 · 功能流程规格（CAPTURE FLOW SPEC）","group":"流程规格","scope":"spec","date":"2026-09-18","mtime":"2026-09-18","size":26837,"chars":16794,"lines":381,"nhead":29,"lead":"用途：拍照验收是本项目的主链源头。本文固化它的流程、数据契约、判定口径与已知偏离， 供后续开发溯源（每个结论都带 文件:行号）与矫正偏离（§7 偏离清单 + §8 有意设计）。 维护规则：只改与代码不符的行；每处引用行号必须能在源码复核。 代码基线：commit 5361996 + 未提交工作区改动｜核实日期：2026","text":"# 拍照验收 · 功能流程规格（CAPTURE FLOW SPEC）\n\n\u003e **用途**：拍照验收是本项目的主链源头。本文固化它的**流程、数据契约、判定口径与已知偏离**，\n\u003e 供后续开发**溯源**（每个结论都带 `文件:行号`）与**矫正偏离**（§7 偏离清单 + §8 有意设计）。\n\u003e **维护规则**：只改与代码不符的行；每处引用行号必须能在源码复核。\n\u003e **代码基线**：commit `5361996` + 未提交工作区改动｜**核实日期**：2026-09-18\n\u003e ⚠️ **行号漂移**：2026-09-18 实施「立即修复」（D1/D13）后，`capture_page.dart` 第 869 行之后整体 **+9**、`capture_records_controller.dart` 第 283 行之后为 **+8~+10**；本文件行号未逐条同步，**引用时以方法名/字段名为准**。\n\u003e **关联文档**：`FEATURE_INVENTORY.md`（M3 拍照验收 / M4 问题清单 / M5 报告）\n\n---\n\n## 0. 一句话定义\n\n**拍照验收 = 在图纸上定位部位 → 现场拍照（烧录防篡改水印）→ AI 识别缺陷 → 落一条「验收记录」→ 可转入「问题清单」→ 进入报告。**\n\n它是现场取证的**唯一入口**，有两条下游出口：\n- **出口 A（保存时自动）**：生成 1 条**聚合缺陷**（带照片）进入问题清单 → 报告靠它渲染现场照片；\n- **出口 B（人工触发）**：在验收记录里**逐条/批量「转入问题清单」**，生成 N 条待整改缺陷。\n\n---\n\n## 1. 范围与角色\n\n**在范围内**：图纸选点、取图与相机、水印、AI 识别、量尺校对（轻量）、问题描述、保存留痕、验收记录工作台、转入问题清单。\n\n**不在范围内**（属别的模块，本文只写接口）：问题清单的处置/回复/销项（见 M4）、报告生成与四端导出（见 M5）、照片量尺的完整流程（见 M7）。\n\n| 角色 | 在本流程中的动作 |\n|---|---|\n| 验收人（现场） | 选部位 → 拍照 → AI 识别 → 补描述 → 保存；事后在验收记录里转入问题清单 |\n| 复核人（问题清单侧） | 接收转入的缺陷，指派责任、回复、销项（不在本文范围） |\n\n---\n\n## 2. 页面与路由地图\n\n| 路由 | 页面 | 阶段 | 说明 |\n|---|---|---|---|\n| `/capture` | `CapturePage(stage: select)` | 选图纸与部位（可拍照） | 首页快捷操作「拍照验收」、底部导航中间按钮进入 |\n| `/capture/select` | `CapturePage(stage: select)` | 同上 | 与 `/capture` 同页同阶段 |\n| `/capture/photo` | `CapturePage(stage: operate)` | 拍照 / 识别 / 保存 | select 阶段拍完自动 push 到这里 |\n| `/capture-records` | `CaptureRecordsPage` | 验收记录工作台 | 首页「验收记录」进入 |\n\n依据：`lib/app.dart:152-201`\n\n### ⚠️ 孤儿页（必须知道）\n\n**`CaptureEntryPage`（`lib/features/capture/capture_entry_page.dart`）全项目仅定义、无任何路由或引用**（全库搜索 `CaptureEntryPage` 仅 1 处命中，即其自身定义 `:10`）。\n它渲染的「按步骤完成验收」三步说明卡与「开始验收」按钮**实际不可达**；`/capture/select` 渲染的是 `CapturePage`。\n→ 处置建议见 §7-D4。\n\n---\n\n## 3. 主流程\n\n### 3.1 概念上的三步（入口页文案口径）\n\n1. 选择图纸和部位 → 2. 现场拍照 → 3. 识别并保存（`capture_entry_page.dart:115-119`）\n\n### 3.2 实际状态机\n\n两个枚举：`CapturePageStage { select, operate }`（`capture_page.dart:65`，由路由参数固定，页内不变）\n与 `_CaptureStep { selectFloor, selectPoint, capture }`（`capture_page.dart:68`）。\n\n| 触发 | 行号 | 迁移 |\n|---|---|---|\n| 进入 `select` 且带 `drawingKey`/`floor` | `:184-187` | → `selectPoint`（并吸附最近锚点） |\n| 进入 `select` 无参数 | `:188-191` | → 选第一张图纸 → `selectPoint` |\n| 进入 `operate` 且带参数 | `:194-196` | → `capture`（并吸附） |\n| 进入 `operate` 无参数 | `:197-213` | → `selectPoint`（解析默认图纸世界坐标） |\n| `operate` 首帧后 | `:215-219, 297-302` | **自动拉起相机**（`_didAutoOpenCamera` 去重） |\n| 点图纸选点（`select` 阶段） | `:490-506` | 停留在 `selectPoint`，更新 `_x/_y/_drawPointWorld*` |\n| 点图纸选点（`operate` 阶段） | `:503` | → `capture` |\n| 点「重选部位」 | `:1975` | → `selectPoint` |\n| `select` 阶段拍完（`_commitPhoto`） | `:727-742` | `push('/capture/photo')` → 进入 `operate` 页 |\n| 保存成功后「继续验收」 | `:1008-1043` | 重置草稿 → `selectPoint` |\n\n\u003e **死枚举值**：`_CaptureStep.selectFloor` **从未被赋值**（全文件只出现在判断/渲染分支），`_buildFloorSelector`（`:1892`）不可达。→ §7-D6\n\n### 3.3 端到端时序（文字泳道）\n\n```\n[选图纸/部位]  点图纸 → 夹取 0.02~0.98 → 吸附最近锚点(阈值0.12) → 换算世界坐标(mm)\n      │\n      ├─(select 阶段直接拍)─→ _doCapture → _commitPhoto → push('/capture/photo')\n      │\n[现场拍照]     自动拉相机 → pickPhotoRobust(移动端)/相册(Web) → _pendingShot\n      │        → 压缩(compressImageAsync) → 烧录水印(applyPhotoWatermark, UI isolate 300~800ms)\n      │        → 一次性 setState(_shotPhoto/_originalPhoto, 清空 _defects) → 提示\n      │\n[AI 识别]      手动点「AI 分析」→ 800ms 扫描动画 → mock(vlPreset) 或 VisionService.recognizeDefects\n      │        → _defects / _scanError\n      │\n[量尺校对]     结果区第 2 段：容差 ±10mm/±5%（可改）→ 依赖图纸标定 mm/px → 逐项判定\n      │\n[问题描述]     手打 + 语音追加（VoiceInputButton）\n      │\n[保存]         校验 _shotPhoto 非空 → 写 entry(JSON) + 照片落盘 + 生成 1 条聚合 Defect → 刷新问题清单\n      │\n[验收记录]     /capture-records → 筛选/分组/详情 → 「转入问题清单」(单条/批量) → N 条 Defect\n      │\n[报告]         报告只读问题清单(Defect)，不读验收记录\n```\n\n---\n\n## 4. 分步功能规格\n\n### S1 选图纸与部位\n\n| 项 | 规格 | 依据 |\n|---|---|---|\n| 图纸列表 | 7 栋项目用 `dy7Floors`，否则 `floors` | `:340-342` |\n| 默认图纸 | 项目映射表决定 | `:344-352` |\n| 默认态 | 验收默认直接落到第一张图纸，不停在「选择图纸」步骤 | `:188-189` 注释 |\n| 选点 | 点击图纸 → 相对坐标夹取在 `0.02~0.98` | `:490-506` |\n| 锚点吸附 | 距最近锚点 \u003c `0.12` 或 `force` 时吸附，部位名自动带出 | `:509` |\n| 世界坐标 | 由 `CadCoordMapper` 换算 mm；**未校准时返回 null 并静默降级**（页面仍可用） | `:463-486`；注释 `:469` |\n| 锚点历史照片 | 点图钉可看该锚点历史照片；无则提示「「X」暂无历史照片」 | `:2043-2045` |\n| 底图 | 本地 PNG；无 PNG 但有 `cadOcfKey` 时调 CAD 服务生成远程 PNG | `:430-455` |\n| 远程 PNG 异常态 | 占位文案「正在生成 PNG 底图…」/「该图纸暂无 PNG 底图」 | `:1652` |\n\n### S2 现场拍照\n\n| 项 | 规格 | 依据 |\n|---|---|---|\n| 自动拉相机 | `operate` 页首帧后自动调用，`_didAutoOpenCamera` 防重复 | `:215-219, 297-302` |\n| 取图分流 | Web → `ImagePicker.gallery`（1280/82）；Android/iOS → `pickPhotoRobust`（1920/88，权限引导 + 相册兜底） | `:532-552` |\n| 权限被拒 | 弹「需要相机/相册权限」+「稍后」/「去设置」(`AppSettings.openAppSettings`) | `:555-571` |\n| 取消拍摄 | 提示「已取消拍摄」，保持原状态 | `:648-651` |\n| 压缩 | `compressImageAsync`（VM isolate；Web 回落主线程） | `:688` |\n| 水印元信息 | `WatermarkMeta{ project, anchor, time, gps, altitude, reporter, serial, worldCoord }`；`project` 取**定位点名称** `_location.name`；`worldCoord` 仅在有图纸坐标时带 | `:690-705` |\n| 水印烧录 | `applyPhotoWatermark`，**必须 UI isolate，阻塞主线程 300~800ms** | `:707-714`；注释 `:105-110` |\n| 水印失败降级 | 用未烧录的压缩图，提示「已拍摄（水印烧录失败，已保留原图）」(danger) | `:711-715, 745-747` |\n| 成功提示 | 「已拍摄并烧录防篡改水印」(success) | `:745` |\n| 竞态保护 | 仅当 `_pendingShot == shot` 才应用结果，避免取消后「复活」 | `:718-720` |\n| 重拍 | `_retake` 只重拍，图纸/部位不变；取消则保留当前照片 | `:978-983` |\n| 拍照后副作用 | **清空 `_defects`**（AI 结果随新照片重置） | `:724` |\n| 不再自动识别 | 注释明确：不再自动触发 AI，由用户手动点 | 注释 `:757` |\n\n### S3 AI 识别（结果区第 1 段）\n\n| 项 | 规格 | 依据 |\n|---|---|---|\n| 触发 | 手动点「AI 分析」按钮 | `:2844-2851` |\n| 扫描动画 | 固定 800ms（避免一闪而过） | `:790` |\n| mock 分流 | `_useMock = kIsWeb` → `vlPreset(anchor, replayReal:true)` | `:147-149, 796` |\n| 真实调用 | 非 mock 且有照片 → `VisionService().recognizeDefects(_originalPhoto ?? _shotPhoto)`（用无水印图避免水印文字干扰） | `:797-828` |\n| 超时 | 180s（`vision_service.dart:120`）；超时文案「识别超时（Ns）：模型响应过慢，可重试」 | `:820` |\n| 其他失败 | 「识别失败：$e」 | `:825` |\n| 建议兜底 | 模型未返回 `suggestion` 时走本地建议库 `suggestionFor` | `:813` |\n| 未识别到缺陷 | 空态文案「尚未识别到缺陷…」；**保存时仍留痕**（不阻断） | `:2185-2189`；注释 `:894` |\n| 严重程度 | **模型未返回 severity，统一默认 `orange`**（待后端补） | 注释 `:805-806` |\n| 置信度 | 传真实 conf，低置信在卡片与清单提示人工复核 | 注释 `:807-808` |\n\n### S4 量尺校对（结果区第 2 段，轻量）\n\n| 项 | 规格 | 依据 |\n|---|---|---|\n| 容差默认 | ±`10`mm 且 ±`5`%（常量 `_defaultTolMm/_defaultTolPct`） | `:38-39, 158-159` |\n| 标定来源 | `cadCalibrationMapProvider[drawingKey]` → `_scaleMmPerPx`；**无标定时静默降级**（隐藏标定比例 chip） | `:162, 2312` |\n| 交互 | 可改容差、增删校对项、逐项显示图纸值/实测值/偏差/判定 | `:2384-2564` |\n| 与 S6 的关系 | 校对项**不进** entry JSON，也不进问题清单（仅页面内参考） | `:857-869` |\n\n\u003e ⚠️ 判定门槛：本页用页面内 `_tolMm/_tolPct`，**未接项目级 `MeasureThresholdStore`**（拍照量尺页已接）。→ §7-D8\n\n### S5 问题描述（结果区第 3 段）\n\n- 手打：`_noteController`（`:123`）。\n- 语音：`VoiceInputButton`，识别结果**追加**到文本框（`:3098-3113`）。\n- 归一化：保存时 `trim()`（`:856`）。\n\n### S6 保存（关键：一次拍照 = 一条验收记录 + 一条聚合缺陷）\n\n**前置校验**（`_saveRecord`，`:989-991`）：`_scanning` 中直接 return；已保存（`_saved`）直接 return。\n\n**第一次校验**（`_saveRecordToStorage`，`:846-852`）：`_shotPhoto == null` → 提示「请先拍照或选择照片」(danger)，返回 `false`（**不锁定按钮**，允许补拍后再存，注释 `:988`）。\n\n**写入内容 —— 验收记录 entry（JSON，唯一事实源）**：\n\n| 字段 | 类型 | 说明 | 行号 |\n|---|---|---|---|\n| `id` | String | `now.microsecondsSinceEpoch` | `:858` |\n| `drawingKey` | String | 当前图纸 key（空串表示未关联） | `:859` |\n| `worldX` / `worldY` | double? | 图纸世界坐标 mm（未选点/未校准为 null） | `:860-861` |\n| `ts` | String | `YYYY-MM-DD HH:mm:ss` | `:854-855, 862` |\n| `anchor` | String | 部位（锚点名 / 已选点(…) / 待选点） | `:863` |\n| `floor` | String | 楼层 | `:864` |\n| `count` | int | AI 缺陷条数 | `:865` |\n| `defects` | List | `VlDefect.toJson()` **+ `status:'pending'`** | `:866-867` |\n| `note` | String | 用户问题描述 | `:868` |\n| `photo` | String? | 相对路径 `photos/xxx.jpg`；**落盘失败则不写该字段** | `:875-885` |\n\n`defects[i]` = `{name, severity, conf, desc, suggestion, status}`，`status ∈ {pending, converted}`。\n\n**照片落盘**：`photos/\u003cts 的 `:` 与空格替换为 `-`\u003e.jpg`，写失败**不阻断**结构化结果（`:877-884`）。\n\n**同时生成「聚合缺陷」（出口 A）** —— 一条拍照只生成 1 条 `Defect`：\n\n| Defect 字段 | 取值 | 行号 |\n|---|---|---|\n| `id` | `cap_\u003cmicrosecondsSinceEpoch\u003e` | `:930` |\n| `part` | `\"部位·楼层·首个缺陷名\"`，多项时加 `等N项` | `:931-933` |\n| `type` | 首个缺陷名，无则 `现场拍照记录` | `:916, 934` |\n| `category` | 固定 `other` | `:935` |\n| `severity` | **取最高**（rank 越小越严重）；无识别结果 → `green` | `:910-915, 936` |\n| `status` | `draft` | `:937` |\n| `gps` / `alt` | 定位点 GPS / `海拔 X.Xm` | `:903-904, 941-942` |\n| `resp` | 固定 `待指派` | `:943` |\n| `reporter` | 当前用户 | `:944` |\n| `tags` | `['拍照记录', ...各缺陷名]` | `:945` |\n| `note` | 拼接：无缺陷说明 + 未落盘说明 + 各缺陷 desc + 用户描述（`\\n` 连接） | `:917-922, 946` |\n| `seed` | `capture` | `:947` |\n| `photoPath` | **照片相对路径（报告照片靠这个字段）** | `:951` |\n| `suggestion` | 各缺陷建议聚合，多条时 `缺陷名：建议` | `:923-928, 952` |\n\n**保存后动作**：`invalidate(defectsProvider)`（`:955`）→ 入 `_storedResults` 头部（`:958`）→ `writeDoc('stored_vision_results')`（`:961-965`，`unawaited`）→ Snack。\n\n**保存成功文案**（`:966-973`）：\n- 巡场入口：`巡场标记已保存（未分析）` / `巡场标记已保存`\n- 普通：`记录已保存（未分析）` / `记录已保存`\n\n**保存后的按钮态**（`:3128-3195`）：`canSave = _shotPhoto != null \u0026\u0026 _pendingShot == null \u0026\u0026 !_scanning \u0026\u0026 !_saved`；已保存后变双按钮 —— 巡场入口「返回巡场继续 / 继续标记下一个问题」，普通「查看验收记录 / 继续验收」。\n\n### S7 拍照记录（留痕，非结果区分段）\n\n\u003e **现状**：`_resultTab` 注释按 4 段设计（`:90-94`），但分段控件实际只有 **3 段**（`:1533-1536`）；「拍照记录」被移到 AppBar 相册图标 → 底部弹窗 `_showStoredSheet`（`:3215`）。→ §7-D5\n\n- 列表：`_filteredStoredResults` 按当前 `_drawingKey` 过滤（`:3209`）。\n- 支持：看缩略图、打开详情、删除（二次确认「删除暂存记录 / 将同时删除该记录及关联照片，确定？」`:3324-3328`）。\n- 删除副作用：从 `_storedResults` 移除 + 重写文档 + 删照片文件。\n\n---\n\n## 5. 验收记录工作台（`/capture-records`）\n\n数据源：`captureRecordsProvider`，底层为 `LocalStorage` 文档 `stored_vision_results`（`capture_records_contr
