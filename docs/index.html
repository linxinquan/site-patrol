sion_service 默认 localhost:3000 / RemoteRepository 默认 120.24.240.129:3000）。**做本表涉及\"发送给施工方/网页链接\"的需求前，必须先确认后端部署位置与接口现状。**\n\n---\n\n## 需求1：拍照识别问题后输出整改意见（AI 生成整改方案）\n\n**现状**：识别只输出 `VlDefect{name,severity,conf,desc}`，无整改建议；`Defect` 无 remedy 字段。\n\n**方案：两段式 AI（识别→整改）**\n1. 复用 `/api/vision`（或新增文本端点）：识别完成后，对每条缺陷调用生成整改建议\n   - prompt 模板：给「缺陷名称+部位+严重度+专业」，要求输出：`整改措施` / `验收标准` / `关联规范条文` / `施工注意点`，JSON 返回\n2. 数据：`Defect` 新增字段 `String? remedy;`（序列化兼容默认 null）；`VlDefect` 增 `String? remedy`\n3. UI：拍照记录页识别结果卡下方显示\"整改建议\"；缺陷详情页展示；后续报告引用\n4. 红线：输出标注\"AI 建议，请工程师复核\"；不写规范条文号（避免编造，让模型只给方向）或提示人工核对条文\n\n**任务量**：0.5~1 天（后端端点 + 模型字段 + UI）\n\n## 需求2：安卓 AR 量尺调研（非苹果手机）\n\n**现状**：AR 仅 iOS Pro LiDAR；Android/Web 引导照片量尺（假估算已删除）。\n\n**调研结论（先给方向，CodeBuddy 出验证报告）**：\n| 路线 | 覆盖 | 精度 | Flutter 生态 | 建议 |\n|---|---|---|---|---|\n| ARCore（需 GMS） | 有谷歌服务的安卓 | ±1~2% | `ar_flutter_plugin_plus` 可用 | 可 POC，但国行安卓多数无 GMS，**覆盖有限** |\n| 华为 AR Engine（HMS） | 华为/荣耀 | 一般 | 无官方 Flutter 插件，需自写原生 | 成本高，暂缓 |\n| **照片标定量尺（已有）** | 全平台 | ±1~3%（垂直拍摄） | ✅ 已实现 | **安卓主路径** |\n\n**CodeBuddy 任务**：只出**调研验证报告**（不写代码）——实测 1~2 台安卓（有/无 GMS 各一）确认：能否装 ARCore、`ar_flutter_plugin_plus` 示例能否跑通、实测精度；结论建议：安卓继续以照片量尺为主，AR 仅 iOS Pro 展示。\n\n## 需求3：无信号场地（地下室）记录巡场点位\n\n**现状**：巡场总纲规划了 GPS 轨迹；地下室无 GPS 信号 → GPS 失效。\n\n**方案：检查点打卡制（不依赖 GPS）**\n1. `PatrolRecord` 增 `checkins: List\u003cCheckIn\u003e`，`CheckIn{checkpointIdx, ts, photoRef?}`\n2. 巡场运行中：走到检查点 → 用户点\"到达打卡\"（底部新增按钮，或检查点近旁浮出）→ 记录时间，可顺手拍照\n3. 轨迹判定 = 打卡序列（x/y 点已到达），不依赖信号；GPS 有信号时自动叠加真实轨迹，二者并存\n4. 巡场完成报告含\"打卡达成率 已到 n/m\"；逾期/漏检检查点标红\n5. 存储照 LocalStorage 离线模式（已有）\n\n**任务量**：0.5~1 天（模型 + 打卡 UI + 记录）\n**二期**：蓝牙 Beacon / UWB 自动到点检测。\n\n## 需求4：手机直接查看 CAD（替代\"导 PDF\"）\n\n**现状**：DWG→OCF→手机查看的管线**已通**（浩辰云图 + `drawing_viewer_page` + dy7 已转 10 张 OCF），但图纸是**预转换后进库**，设计师无法自行传图。\n\n**方案：补\"图纸自助导入\"链路**\n1. 项目图纸库加\"上传 DWG\"入口（App 内选文件 / Web 上传）\n2. 上传 → 调浩辰转换服务（华为云 API：`dwgToOcf` + 轮询 `getTaskStatus`，SDK 能力文档在 `backend_api.txt`）→ OCF 落 `ocf_cache` → 图纸库即时出现，手机可看（图层开关/测量已具备）\n3. 转换失败给出可读错误；大图走 `getPixelImage` 分片\n4. 确认浩辰商用授权与转换配额（商用前必须）\n\n**任务量**：1~1.5 天（上传 UI + 转换任务队列 + 进度展示）\n\n## 需求5：巡场报告自动生成 + 归档 / 发施工方整改\n\n**现状**：PatrolRecord（总纲已规划）只有历史列表，无报告。\n\n**方案：巡场报告生成器**\n1. 数据源：PatrolRecord（路线/打卡/轨迹/里程/时长）+ 巡场期间关联的 Defect（按时间与部位关联）\n2. 生成 HTML 报告：路线图（底图+轨迹+打卡点）、打卡达成率、问题清单（照片+缺陷类型+整改建议 remedy）、统计摘要\n3. 分享：生成**网页链接**（报告只读页面）→ 微信/短信发给施工方/甲方；可导出 PDF 存档\n4. ⚠️ 依赖后端：需要确认/重建后端（报告页面 + 链接存储）。后端未定时先在 App 内预览 + 本地\"分享文本/截图\"过渡\n\n**任务量**：1~2 天（含后端）\n\n## 需求6：巡场路线与项目进度由施工方提供（网页链接给施工方填写）\n\n**现状**：无此链路；路线只能在 App 内编辑。\n\n**方案：施工方协作链接（一个链接多种用途，MVP 先做报告+反馈）**\n1. 后端生成带 token 的协作链接：施工方打开网页 → 查看巡场报告 → 逐条填\"整改反馈（照片+文字+状态）\"\n2. 反馈写回 Defect（status 流转：draft→doing→done，resp 填施工方）→ App 缺陷列表同步\n3. 二期：链接支持\"填报进度（里程碑）+ 上传路线草图（DWG/照片）\"\n4. ⚠️ 依赖后端（同需求5）；**先与需求5合并设计一个\"报告+反馈\"网页**\n\n**任务量**：与需求5合并 2~3 天\n\n## 需求7：AI 取信甲方 + 设计师远程解决小问题\n\n**现状**：Defect 有状态机（draft/doing/done/reject）与责任人，但无\"设计师远程处置\"动作与\"证据链\"展示。\n\n**方案**\n1. **证据链增强**：缺陷记录已含照片/部位/坐标/时间（`Defect` 字段齐全）——识别结果展示时附「部位+照片+置信度+AI判定」，让甲方看到\"有据可依\"\n2. **设计师远程处置**：缺陷详情页加\"设计师处置\"区：\n   - 动作：`远程确认（已答复，附说明）` / `远程可解决（直接销项）` / `需到场`\n   - 选\"远程可解决\"→ 填远程处理说明 → 状态直接 done，附 `resolveBy=设计师XX`\n   - 报告与清单展示\"设计师远程解决 N 条\"→ 甲方看到小问题即时闭环\n3. 数据：`Defect` 增 `String? resolveNote; bool remoteResolved;`（兼容默认）\n4. 推送提醒二期（无需实时 IM，App 内\"待我处置\"角标即可）\n\n**任务量**：0.5~1 天\n\n---\n\n## 执行优先级建议（本阶段 ~1 周）\n\n| 优先级 | 需求 | 理由 |\n|---|---|---|\n| P0 | 需求1（整改意见）+ 需求3（打卡制） | 纯增量、不依赖后端、演示价值高 |\n| P0 | 需求4（CAD上传查看） | 直接回应\"导PDF不方便\"，管线已通只补上传 |\n| P1 | 需求7（设计师远程处置） | 增量字段+UI，取信甲方的故事 |\n| P1 | 需求5+6（报告+施工方链接） | 依赖后端，先确认部署现状再排 |\n| 调研 | 需求2（安卓AR） | 只出报告不写代码 |\n\n## 全局红线\n\n1. AI 整改建议/远程处置都标注\"AI 辅助，人工复核\"，规范条文不编造\n2. 新增模型字段全部向后兼容（默认 null/false）\n3. 依赖后端的需求（5/6）先确认后端位置与接口，未确认前只做 App 内过渡方案\n4. 分模块交付，每模块 `flutter analyze` + Web 构建通过\n"},{"id":"docs/archive/CODEBUDDY_HANDOFF.md","path":"docs/archive/CODEBUDDY_HANDOFF.md","url":"ZG9jcy9hcmNoaXZlL0NPREVCVUREWV9IQU5ET0ZGLm1k","base":"CODEBUDDY_HANDOFF.md","title":"交给 CodeBuddy 的任务交代（分轮执行）","group":"归档 · 任务交接与上下文","scope":"archive","date":"2026-08-26","mtime":"2026-08-26","size":5512,"chars":3337,"lines":92,"nhead":9,"lead":"","text":"# 交给 CodeBuddy 的任务交代（分轮执行）\n\n---\n\n## 项目背景（先读）\n\n- 工作目录：`F:\\建筑验收工具\\site-patrol` —— Flutter App「蓝图落地」（设计院工地数据工具），iOS/Android/Web 三端\n- 后端：Express `backend/server.js`（:3000，视觉模型 qwen3.8-max）+ Python `server/measure_server.py`（:8820，量尺落库）\n- 三大任务线：①量尺修复 ②巡场改造 ③AR量尺（暂缓）\n\n---\n\n## 任务线① 量尺修复\n\n### 先读这些文件（按顺序）\n\n1. `MEASURE_FIX_PLAN.md` —— 全部待改项清单（P0/P1/P2，含每项的行号与验证方法）\n2. `PHOTOCALIB_2D_FIX.md` —— P0-1 的完整替换代码（4 个文件 6 处，直接照抄）\n3. 现有实现（要改的对象）：\n   - `lib/features/measure/measure_page.dart`\n   - `lib/core/utils/measure_math.dart`\n   - `lib/core/storage/measure_store.dart`\n   - `lib/data/models.dart`\n4. 风格参照（不要违背现有模式）：\n   - `lib/features/capture/capture_page.dart`（取图、kIsWeb 分流、AppSnack 用法）\n   - `lib/core/utils/cad_coord.dart`（坐标换算）\n   - `lib/utils/path_metrics.dart`（CustomPainter 风格）\n   - `AI_VISION_INTEGRATION.md`（后端/联调约定）\n\n### 第一轮：只做 P0 两个修复\n\n**P0-1：PhotoCalib 2D 修复**\n- **严格按 `PHOTOCALIB_2D_FIX.md` 的 ①~⑥ 执行**（4 个文件 6 处替换，代码已写好，照搬）\n- 硬性要求：旧会话 JSON（只有 pixA/pixB）必须兼容——`fromJson` 读到旧格式时 ay=by=0，不抛异常\n- 改完自查：`flutter analyze` 无新增 error；逻辑上竖线标定（两点 dy 差大、dx≈0）的 mm/px 必须为合理值\n\n**P0-2：标记错位修复**\n- 问题：`measure_page.dart` 的 `_pickDot` 把原图像素坐标直接当 `Positioned(left/top)`，但图片按 `BoxFit.contain` 缩放显示，标记错位\n- 方案：新增 `imageToDisplay(Offset imgPx, Size box, Size imgSize)`（BoxFit.contain 逆变换），三处标记（图纸蓝点、照片橙点/红点）渲染前换算成显示坐标再定位\n- 自查：点击处与标记重合；浏览器窗口缩放后仍对齐\n\n**第一轮约束**\n- 只动 `models.dart`、`measure_store.dart`、`measure_page.dart` 与量尺相关部分，不碰其他功能\n- 改完输出：改动文件清单 + 每处一行说明\n- 不要跑 iOS/Android 构建（本机是 Windows）；可跑 `flutter build web --release` 验证编译\n\n### 第二轮：P1 + P2\n\n按 `MEASURE_FIX_PLAN.md` 的 §P1-1~P1-5、§P2-1~P2-3 执行：\n- P1-1 图纸尺寸手填降级（图纸未校准时能手填加项）\n- P1-2 默认容差改为 ±15mm / 2%（models.dart 约 579~580 行 + measure_page 约 54~55、103~104 行）\n- P1-3 照片参考线 + 像素跨度显示（CustomPaint，照 path_metrics.dart 风格）\n- P1-4 「清除标定」按钮（copyWith 已预留 clearPhotoCalib 参数）\n- P1-5 `remote_repository.dart` 默认 host 端口核对（:3000 vs :8820）——**先不要自己改，把现状结论告诉我们再定**\n- P2-1 `_test_measure.ps1` 路径改 `$PSScriptRoot`\n- P2-2 `_onDrawTap` 的 `_imageSize==null` 回退分支改为提示并 return\n- P2-3 提示文案按标定状态显示\n\n---\n\n## 任务线② 巡场改造（按总纲执行）\n\n\u003e 唯一执行入口：`PATROL_MASTER_PLAN.md`。先完整读完总纲，再按总纲 §1 的顺序读三份详细规格：\n\u003e `PATROL_OPTIMIZE.md`（7项改造细则）、`PATROL_ZOOM_WALL.md`（缩放+穿墙检测）、`PATROL_SEED_ROUTE.md`（编辑器增强+推荐路线），\n\u003e 以及现有代码（`patrol_page.dart`、`path_metrics.dart`、`mock_data.dart`、`models.dart`、`providers.dart`、`cad_meta_server.py`、`cad_meta_build.py`）。\n\n**按总纲 §2 的 4 个阶段顺序执行**，每阶段完成验收清单后才进下一阶段，每阶段结束跑 `flutter analyze` + `flutter build web --release`，输出改动文件清单+验收自查结果。\n\n关键点：\n1. 阶段1 一次性建齐 `PatrolPlan/PatrolPoint/PatrolRecord/PatrolArgs` 模型，**PatrolPlan 直接带 `isRecommended` 字段**（默认false），避免阶段3回改模型\n2. 阶段3 的 `cad_meta_build.py` 必须把 `dy04_7_B05` 加进 `OCF_KEYS` 并本机跑通，生成 `assets/walls/dy04_7_B05_walls.json`\n3. 阶段5（A*自动寻路）**只读不实现**\n4. 总纲 §4 的推荐路线坐标校准是**人工步骤**，代码侧只保证\"校验穿墙\"等工具可用\n5. 与量尺修复的文件隔离：巡场改造不要碰 `measure_*`、`capture_page.dart`、AR 相关文件；两线都会改 `models.dart`（量尺在 PhotoCalib/MeasureItem 区域，巡场新增 Patrol* 类在文件别处）——**改动前先读最新 models.dart，在各自区域叠加，不要互相覆盖**\n\n---\n\n## 暂不执行：AR 量尺\n\n- 文档已有：`AR_LIDAR_IMPL_DETAIL.md`（主实现）+ `AR_UX_SMOOTH.md`（交互补丁，冲突处以补丁为准）\n- **现在不要动**：iOS 代码无法在本机（Windows）编译，需 Mac + iPhone 12 Pro 及以上真机；等设备到位后再安排实现，避免改一半烂尾\n\n---\n\n## 全局约束（所有任务线通用）\n\n1. 所有改动保持旧数据兼容（读旧字段给默认值，不抛异常）\n2. 每完成一项/一阶段：`flutter analyze` 无新增 error，Web 构建可过\n3. 不要跑 iOS/Android 构建（Windows 环境）\n4. 删除常量/文件前先 grep 确认无引用\n5. 量尺修复完成后对照 `TEST_PLAN_MEASURE.md` 第 0~4 节自查（尤其 1.1 竖线标定、2.x 标记对齐、4.x 全流程）\n"},{"id":"docs/archive/CODEBUDDY_SWITCH_FIX.md","path":"docs/archive/CODEBUDDY_SWITCH_FIX.md","url":"ZG9jcy9hcmNoaXZlL0NPREVCVUREWV9TV0lUQ0hfRklYLm1k","base":"CODEBUDDY_SWITCH_FIX.md","title":"换账号交接执行手册 — 给当前 CodeBuddy（完整版）","group":"归档 · 任务交接与上下文","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":7565,"chars":4245,"lines":112,"nhead":13,"lead":"背景：开发账号已切换。你是新账号、无历史记忆，而代码库已完成大量功能且未提交的改动混杂其中。 本文是唯一执行依据：按「第二节执行步骤」顺序做，做完按「第六节」输出报告。禁止按自己的猜测重写已存在的功能。","text":"# 换账号交接执行手册 — 给当前 CodeBuddy（完整版）\n\n\u003e 背景：开发账号已切换。**你是新账号、无历史记忆**，而代码库已完成大量功能且未提交的改动混杂其中。\n\u003e 本文是**唯一执行依据**：按「第二节执行步骤」顺序做，做完按「第六节」输出报告。**禁止**按自己的猜测重写已存在的功能。\n\n---\n\n## 一、先读（恢复记忆，动手前必须）\n\n按顺序读：\n1. `SESSION_CONTEXT.md` —— 记忆压缩包\n2. `ARCHIVE_2026-09-08.md` —— **归档基线**（切换账号前固化的正确状态，含✅/❌/⏸清单）\n3. `TASK_DASHBOARD.md` —— 文档地图与执行记录\n\n---\n\n## 二、剩余任务线真实状态（已核实，勿重复开发）\n\n| 任务线 | 真实状态 | 依据 | 你能做什么 |\n|---|---|---|---|\n| AR 第2轮（AR_CAPTURE_BUGFIX.md） | ✅ **Dart侧已实现并提交**（假估算页已删、`_measurements`多点+`_saveAll`、`pickPhotoRobust`、`imageToDisplay`、`_buildPickPin`；`ios/Runner/ArMeasureView.swift` 在仓库） | ARCHIVE ✅清单 + 代码核实 | **没有可写的Dart缺口**；iOS原生本机不能编 → 只做代码走查（见任务2） |\n| 量尺 P1/P2（MEASURE_FIX_PLAN.md） | ✅ P1-1手填降级/P1-2容差15/P1-3参考线/P1-4清除标定、P2-1脚本路径/P2-2坐标统一/P2-3文案 均已实现 | ARCHIVE ✅清单 | 唯一缺口 **P1-5（云端host端口）＝冻结**，等部署确认，**不要自己改 host** |\n| 文档对齐 | ⚠️ 未提交：`TASK_DASHBOARD.md`、`ARCHIVE_2026-09-08.md` 已 M 改 | git status | 任务6 提交固化 |\n| 巡场 GPS | ✅ **代码已实现**（geolocator+权限声明+轨迹写 `PatrolRecord.track`） | ARCHIVE ✅清单 | 只差真机验证；说\"GPS未做\"是**误读归档** |\n| 巡场墙线检测 | ✅ 已实现（`wall_lines.dart`/`geo.dart` 接入巡场页与编辑器） | ARCHIVE ✅清单 | 无缺口 |\n| 第3轮回归（TEST_PLAN_MEASURE.md） | ❌ **真·剩余**，但需真机/真实照片 | — | **Web端部分本机可跑**（任务5） |\n\n**结论：不存在\"待开发的新功能线\"。** 实际工作是：固化→验证→回归→文档对齐→输出报告。若你觉得需要\"新功能\"，先列出理由，不要直接写代码。\n\n---\n\n## 三、工作区当前状态（git 已核实）\n\n- HEAD = `4b075bd`（归档提交，第1/2轮完成状态已提交）\n- **19 个文件未提交 + 2 个新文件**（`lib/core/utils/anchor_objects.dart`、`mm_format.dart`）\n- 未提交内容多为**新功能\"量尺自动标定·零输入\"**（measure_page `_autoCalib`/`detectAnchor`/`_tryAutoCalibOnce`、vision_service `detectAnchor`+`AnchorDetection`、`isReachable` 联网预检、mm 格式化、打卡扩展等）——**该功能不在任何规划文档里**，属于开发中的半成品\n\n---\n\n## 四、执行步骤（按顺序，每步完成才进下一步）\n\n### 任务1：处理未提交 WIP（先问用户，再执行）\n1. `git status` 展示给用户 → 问：**保留（提交）还是丢弃？**\n2. 保留：`git add -A \u0026\u0026 git commit -m \"wip: 量尺自动标定/格式化工具等（账号交接前固化）\"`\n3. 丢弃：`git checkout -- lib/data/models.dart lib/data/vision_service.dart ...`（逐文件列出，**不执行全盘 `checkout .`**，保留想要的如文档改动；2个新文件用 `git clean` 前先确认）\n4. 输出：commit hash 或恢复清单\n\n### 任务2：编译验证（上次失败，必须重试）\n1. `flutter analyze` —— 上次 analysis server 崩溃（exit 255，环境问题非代码问题）；重试；若再崩，试 `flutter clean` 后再跑，或分文件 `dart analyze lib/features/measure/` 缩小范围\n2. 若有 error：修复（**只修编译错误，不重构**）\n3. `flutter build web --release` 通过\n4. 输出：analyze 与构建结果\n\n### 任务3：回归核查表（13项，逐项输出 在/不在/可疑+行号）\n对照 ARCHIVE「已完成✅」逐项验证：\n1. `PhotoCalib` 2D（ax/ay/bx/by，mmPerPx 用2D距离）\n2. `measure_page.imageToDisplay` 存在且图纸蓝点/照片橙点/红点渲染前换算\n3. 量尺手填降级（`_drawingMmCtl`，未校准时能加项）\n4. `MeasureSession.tolMm` 默认15/2（含旧数据兜底15）\n5. 清除标定（`_clearRefCalib`）\n6. `core/utils/camera_pick.dart` + capture/measure/ar 三处用 `pickPhotoRobust`\n7. ar_measure_page **无** `estMm=drw` 假结果逻辑\n8. AR `_measurements` 列表 + `_saveAll` 批量保存\n9. capture_page 选点图钉 + label「已选点(x%, y%)」，无「待选点」阻塞\n10. `VlDefect/Defect.suggestion` + `defect_suggestions.dart` + 报告含建议\n11. `CheckIn` + `PatrolRecord.checkins` + 巡场页打卡\n12. 报告四端同步（`report_content.dart` 中间层改动 → HTML/PDF/DOCX/XLSX 都渲染；本次若涉及新字段要四端验证）\n13. `flutter analyze` 无 error\n\n**任何「不在/可疑」→ 疑似回归**：`git log --oneline -- \u003cfile\u003e` + `git show \u003ccommit\u003e:\u003cfile\u003e` 找回对比，修复后记录。\n\n### 任务4：AR iOS 原生代码走查（只读不改）\n`ios/Runner/ArMeasureView.swift` + `AppDelegate.swift` 注册、`Info.plist` 相机权限——**只做走查**，确认与 ARCHIVE 描述一致（权限检查/多点/占位），输出走查结论。**不编译不改代码**（Windows 不能编 iOS）。\n\n### 任务5：量尺 Web 端回归（第3轮中本机可跑的部分）\n按 `TEST_PLAN_MEASURE.md` 在 Web 上执行**不依赖真机相机**的项（用「素材照片/相册选图」替代现场拍照）：\n- 测试前准备：选择一张已校准图纸（如 dy04_7_B05）；准备 2 张已知尺寸照片（如 A4 纸/门宽照片）\n- 必测项：\n  1. 竖线标定数值合理（P0-1 回归）\n  2. 标记与点击位置重合（P0-2 回归，不同窗口宽度）\n  3. 全流程：图纸点两点→拍/选照片→标定→照片点两点→加入校对→判定→保存→重进恢复\n  4. **旧会话兼容**：用旧格式 JSON（仅 pixA/pixB）验证 load 不崩\n  5. 量 A4 纸宽 210mm：实测 210±10mm\n  6. 合格/超差两种判定\n- 输出：逐项通过/失败 + 截图说明\n\n### 任务6：文档对齐并提交\n1. 更新 `TASK_DASHBOARD.md`：「执行记录」追加本轮（WIP固化、analyze结果、核查表结论、回归结果）\n2. 更新 `ARCHIVE_2026-09-08.md`：仅追加「账号交接后的新进展」小节（不要改动原正文快照）\n3. `git add` 全部 + `git commit -m \"fix: 账号交接核查与回归（WIP固化/核查表/Web回归）\"`（若用户授权推送，推送远端 main）\n\n---\n\n## 五、禁止事项（红线，不可违背）\n\n1. **不重写已存在功能**——ARCHIVE ✅清单里的内容只核验不重做\n2. 不改 `remote_repository.dart` 的 host（P1-5 冻结）；不改 iOS 原生（不编译不验证）；不做网页/云同步（后端不在工程）；不做安卓 AR\n3. `models.dart` 追加不覆盖；`fromJson` 新字段给默认值\n4. 报告/统计改动四端同步\n5. 删常量/文件前先 grep；不改范围外文件\n6. 每步输出改动清单；不悄悄静默失败\n\n## 六、输出报告（本手册结束时交付）\n\n1. 任务1：WIP 处理结果（commit hash 或恢复清单）\n2. 任务2：flutter analyze / web build 结果（成功或错误列表）\n3. 任务3：13 项核查表逐项「在/不在/可疑+行号」+ 修复记录\n4. 任务4：AR iOS 走查结论\n5. 任务5：Web 回归逐项通过/失败\n6. 任务6：文档更新与提交信息\n7. 剩余风险（真机项：iOS AR/照片精度/GPS 需设备验证）\n"},{"id":"docs/archive/PASTE_MASTER.md","path":"docs/archive/PASTE_MASTER.md","url":"ZG9jcy9hcmNoaXZlL1BBU1RFX01BU1RFUi5tZA==","base":"PASTE_MASTER.md","title":"开始本次开发任务。工作目录 F:\\建筑验收工具\\site-patrol。","group":"归档 · 任务交接与上下文","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":2053,"chars":994,"lines":29,"nhead":0,"lead":"开始本次开发任务。工作目录 F:\\建筑验收工具\\site-patrol。","text":"开始本次开发任务。工作目录 `F:\\建筑验收工具\\site-patrol`。\n\n【背景】你接手一个迭代中的 Flutter 工程（蓝图落地）。重要：**你之前可能换过登录账号，没有本会话的历史记忆**——所有\"哪些已完成、文档在哪\"都以本机文件为准，不要凭记忆猜测或重写已有功能。\n\n【动手前必读（按顺序）】\n1. `SESSION_CONTEXT.md` —— 项目记忆压缩包（团队/产品/技术/红线）\n2. `TASK_DASHBOARD.md` —— 任务看板（文档地图 + 各任务状态 + 三段式排期）\n3. 当前任务文档（见下方\"本次任务\"指向的文件）\n\n【总纪律（每轮通用，不可违背）】\n1. 改动前先读最新文件；`lib/data/models.dart` 多线共用——**只追加不覆盖**，fromJson 新字段给默认值，旧数据不崩\n2. 报告/统计改动必须 HTML/PDF/DOCX/XLSX 四端同步\n3. 不新增第三方依赖（除非任务文档明确允许）\n4. 本机是 Windows：**不能编译 iOS**；验证用 `flutter analyze`（若 analysis server 崩 exit 255，改用 `dart analyze \u003c改动目录\u003e`）+ `flutter test` + `flutter build web --release`\n5. [原生-待真机] 的代码写好即可，**不伪造验证结果**，交付时列\"未验证清单\"\n6. 每项完成输出：改动文件清单 + 验证结果 + 验收自查\n7. 超出任务范围的改动：先停下说明，不要顺手做\n\n【本次任务】\n执行量房功能 · 段1（数据模型+存储+几何引擎+测试）。\n细节与代码全部在 `PASTE_ROOM_P1.md`（直接照做）+ `ROOM_MEASURE_IMPL_DETAIL.md` §1~§4（代码源）。\n只做段1（§1~§4），**禁止**实现 §5 及以后的页面/路由/provider（段2）。\n完成后按 `PASTE_ROOM_P1.md` 第五步格式输出。\n\n【遇到问题】\n1. 编译/测试报错：先自己读报错定位修复，修不了再报告（给出错行+你的分析）\n2. 文档与代码冲突：以**最新代码**为准，报告中说明差异\n3. 本机环境限制：如实报告\"无法验证项\"，不要假装通过\n"},{"id":"docs/archive/PASTE_ROOM_P1.md","path":"docs/archive/PASTE_ROOM_P1.md","url":"ZG9jcy9hcmNoaXZlL1BBU1RFX1JPT01fUDEubWQ=","base":"PASTE_ROOM_P1.md","title":"任务：量房功能 · 段1（地基：数据模型 + 存储 + 几何引擎 + 测试）","group":"归档 · 任务交接与上下文","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":4217,"chars":2468,"lines":42,"nhead":0,"lead":"任务：量房功能 · 段1（地基：数据模型 + 存储 + 几何引擎 + 测试）","text":"任务：量房功能 · 段1（地基：数据模型 + 存储 + 几何引擎 + 测试）\n\n范围：只做 `ROOM_MEASURE_IMPL_DETAIL.md` 的 §1~§4。**禁止**实现 §5 及以后的页面/路由/provider（那是段2）。\n\n工作目录：F:\\建筑验收工具\\site-patrol（Flutter 工程，Windows，不能编 iOS）\n\n──────── 第一步 · 准备工作（先读再动手，不许跳过） ────────\n1. 完整读 `ROOM_MEASURE_IMPL_DETAIL.md` 的 §1 模型 / §2 存储 / §3 几何引擎 / §4 测试——四段都给了完整代码，直接采用。\n2. 读当前 `lib/data/models.dart`：\n   a. 找到 `MeasureItem` 定义。确认它**有没有自带 `toJson` / `fromJson`**（搜 `'drawingMm'`，看它主要在 `measure_store.dart` / `MeasureSession` 里怎么序列化）：\n      - 有 → `RoomScanRecord` 序列化直接复用 `MeasureItem.toJson/fromJson`；\n      - 没有 → 给 `MeasureItem` **追加** `toJson/fromJson`（放在该类内部，不新建文件；字段名沿用现有序列化写法：`'name'`、`'drawingMm'`、`'photoMm'`、`'source'`——以最新代码实际存在的字段为准，禁止改名或增删现有存储 key）。\n   b. 确认文件头已 `import 'package:flutter/material.dart';`（`Offset` 可用）。models.dart 现在若没有 material import 就补，有则不动。\n3. 读 `pubspec.yaml` 的 `name:` 字段（决定测试文件的包导入路径），并确认 `test/` 目录存在（不存在则创建）。\n4. 读 `pubspec.yaml` 的 dev_dependencies 确认含 `flutter_test`（含则跳过，缺则报告，不擅自加）。\n\n──────── 第二步 · 按序新增 4 处 ────────\n1. `lib/data/models.dart` —— 文件**末尾**追加 §1「量房（Room）」段：`WallOpening` → `RoomWall` → `RoomScanRecord` → `RoomScanArgs`（含 copyWith/toJson/fromJson；`fromJson` 所有读取给默认值，任何缺失字段不抛异常）。**只追加，不改不动现有任何行。** `MeasureItem` 序列化按第一步 a 的结论处理。\n2. 新建 `lib/core/storage/room_scan_store.dart` —— 用 §2 完整代码；import 相对路径核对：同目录 `local_storage.dart`、模型 `../../data/models.dart`。\n3. 新建 `lib/core/room/room_geometry.dart` —— 用 §3 完整代码（含注释），保持纯函数、无 UI 依赖。\n4. 新建 `test/room_geometry_test.dart` —— 用 §4 用例；`import 'package:\u003cpubspec的name\u003e/core/room/room_geometry.dart';` 与 `package:flutter/material.dart`、`flutter_test`。\n\n──────── 第三步 · 验证（全绿才算段1完成） ────────\n1. `flutter test test/room_geometry_test.dart` → 全绿。\n   - 例外容差：`orthoSnap` 是启发式（保长近似）。若\"88° 吸附\"断言因实现细节不稳，允许把该用例断言放宽为「`snappedIdx` 非空 且 吸附后相邻段夹角≈90°（容差±2°）」；**必须在用例注释里说明原因，不许删用例、不许整用例 skip**。\n2. 静态检查：优先 `flutter analyze`。若遇到本机已知的 analysis server 崩溃（exit 255，中文路径环境问题）→ 改用缩小范围 `dart analyze lib/core/room lib/core/storage/room_scan_store.dart lib/data/models.dart`，目标 **0 error**（warning/info 可保留并列出）。\n3. `flutter build web --release` 通过（确认新增不破坏整体编译）。\n\n──────── 第四步 · 红线 ────────\n- `models.dart` 只追加；不删除/改动任何现有字段与存储 key；`fromJson` 全默认值（null/0/[]/false）\n- 不新增任何第三方依赖\n- 不实现 §5~§8（页面/路由/provider/报告）与 §9（RoomPlan）的任何代码\n- 不调用网络 / 远端服务；不写 iOS/Android 原生\n- 不伪造测试结果\n\n──────── 第五步 · 输出（段1结束时交付） ────────\n1. 新增/修改文件清单（含行数）\n2. `flutter test` 逐用例结果\n3. analyze 结果（0 error 确认或错误清单）\n4. `MeasureItem` 序列化处理结论：自带 toJson/fromJson？（若没有：你追加了什么，字段名是否与现有存储一致）\n5. 遗留风险（如有）\n"},{"id":"docs/archive/PASTE_ROOM_P2.md","path":"docs/archive/PASTE_ROOM_P2.md","url":"ZG9jcy9hcmNoaXZlL1BBU1RFX1JPT01fUDIubWQ=","base":"PASTE_ROOM_P2.md","title":"任务：量房功能 · 段2（Provider → 路由/入口 → 页面 → 报告四端）","group":"归档 · 任务交接与上下文","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":6560,"chars":3920,"lines":56,"nhead":0,"lead":"任务：量房功能 · 段2（Provider → 路由/入口 → 页面 → 报告四端）","text":"任务：量房功能 · 段2（Provider → 路由/入口 → 页面 → 报告四端）\n\n范围：只做 `ROOM_MEASURE_IMPL_DETAIL.md` 的 §5~§8。**禁止**实现 §9（RoomPlan 原生）与 §10（调研）。\n前提：段1 已完成并验收（`WallOpening/RoomWall/RoomScanRecord/RoomScanArgs` 在 models.dart；`room_scan_store.dart`；`room_geometry.dart`；`test/room_geometry_test.dart` 全绿）。**不要重复添加段1任何内容。**\n\n工作目录：F:\\建筑验收工具\\site-patrol（Windows，不能编 iOS；报告导出验证走 Web）\n\n──────── 第一步 · 前置检查（读文件确认现状，迭代快，以最新代码为准） ────────\n1. `lib/core/di/providers.dart`：读 `currentProjectIdProvider / projectProvider / defectsProvider` 的写法 → §5 的 `roomScansProvider` 照同款（family by projectId）。\n2. `lib/app.dart`：读 MeasurePage / PatrolPage 的路由注册与 extra 传参模式 → §6 加 4 条路由（/room-records、/room-draw、/room-detail、/room-scan，extra=`RoomScanArgs`）。\n3. 入口：读 `lib/features/home/home_page.dart` 的快捷操作区 与 `lib/features/measure/measure_page.dart` 顶部/底部是否有\"量尺/AR\"入口按钮 → 在同类位置加「量房」入口（图标+文案照现有风格）。\n4. `lib/data/models.dart`：\n   a. 确认段1 的量房模型已存在（有则跳过）；\n   b. **`MeasureItem` 的 `toJson/fromJson` 现在有没有？**（段1 若已给 RoomScanRecord 补过则应有）——有则 §8/§7.5 直接复用；没有则按段1交代的口径补齐（不改现有存储 key）。\n5. 报告现状（改动最多，务必逐个读）：\n   - `lib/data/weekly_report.dart`：看现有字段（`patrolSummary` 等）与构建/读取处 → 追加 `final List\u003cRoomScanRecord\u003e roomScans;`（默认 `const []`），copyWith/默认构造/fromJson（若有）同步，缺读给默认。\n   - `lib/features/defects/report_content.dart`：读 `ReportBlock` sealed 类与 `buildReportBlocks` 板块顺序 → 新增 `final class RoomBlock extends ReportBlock`（字段：`record` + 户型图 PNG 字节或空），插到 DefectsBlock 之后。\n   - `report_builder.dart`(HTML) / `report_pdf.dart` / `report_docx.dart` / `report_xlsx.dart`：读各自对 block 的 switch/分发 → 各加 `RoomBlock` 分支（详见 §8 说明；四端同步）。\n   - `lib/features/defects/defects_page.dart`：读 `_loadPhotoBytes` 与导出入口 → 量房户型图字节并入加载（缺失给占位）。\n6. 绘制参考：`lib/features/measure/measure_page.dart`（照片标定换算）、`lib/utils/path_metrics.dart`/巡场 painter（CustomPaint 风格）、`lib/core/theme/design_tokens.dart`（色板）。\n\n──────── 第二步 · 实现顺序（每小步可验证） ────────\nA. §5：providers.dart 追加 `roomScansProvider`（family）+ `refreshRoomScans`；`flutter analyze` 过\nB. §6：app.dart 4 条路由 + 入口「量房」按钮（home 或 measure 入口区）；`flutter build web` 过（能进空列表页）\nC. §7.1 `room_records_page.dart`：列表（读 provider；空态\"还没有量房记录，点 + 开始量房\"；卡片=缩略户型图+名称/日期/面积/闭合差色标；点进详情；长按删除确认）\nD. §7.2 `room_draw_page.dart`（核心，工作量大，分 4 子步）：\n   D1 画布与网格：InteractiveViewer + 8000×8000mm 逻辑画布（SizedBox），网格线 500mm/1m 两档灰阶；坐标取点用 TransformationController\n   D2 打点编辑：单击加点 / 拖动移点 / 长按删点 / 双击选中墙段→底部弹\"添加洞口\"(类型门/窗+距起端mm+宽mm)；正交吸附开关（默认开，改点后应用 room_geometry.orthoSnap，被吸附下标高亮）\n   D3 底部状态条：周长 m · 面积 ㎡（areaM2）· 闭合差 mm（≤15 绿 / \u003e15 红\"需复核\"）· 墙段数\n   D4 工程信息卡 + 保存：名称/房间用途下拉/净高mm/墙厚mm；保存校验（角点≥3；闭合差\u003e50mm 弹确认）→ 组 `RoomWall`（长度=wallLengthsMm 吸附后）→ `RoomScanStore.save` → pop 回列表（记录 source='manual'）\n   E. §7.4 `room_plan_painter.dart`：户型 painter（填充/双线墙/洞口门弧窗线/尺寸标注层/面积文字），缩略与详情复用\n   F. §7.3 `room_detail_page.dart`：详情（大户型图+标注开）+ 工程信息 + 墙段表（可删改存）+ 入口到 G\n   G. §7.5 图纸核尺对照：详情页\"对照图纸\"→ 选/关联 drawingKey → 校准（loadCadCalibration；无则提示先校准）→ 逐墙\"在图纸上点对应两点\"（复用 measure_page 图纸量距交互）→ 生成 `MeasureItem(name:'墙N', drawingMm, photoMm=墙长, source:'manual')` → checks 存记录 → 判定列表\n   H. §8 报告四端：WeeklyReport.roomScans + RoomBlock + HTML/PDF/DOCX/XLSX 四端 + defects_page 照片字节加载 → 导出验证\n\n──────── 第三步 · 验证（段2完成标准） ────────\n1. `flutter test test/room_geometry_test.dart` 仍全绿（未回退段1）\n2. 静态：`flutter analyze`（崩溃则 `dart analyze lib/features/room lib/core/room lib/data/weekly_report.dart lib/features/defects/report_content.dart` 等改动目录）→ 0 error\n3. `flutter build web --release` 通过\n4. **Web 手动流程验收（必须自己点一遍截图留证）**：\n   量房入口 → 手动模式 → 网格画布点 4 角 → 吸附 → 周长/面积/闭合差正确 → 加一扇门 → 保存 → 列表出现 → 详情户型图带尺寸标注 → 报告导出(HTML 至少；PDF/DOCX/XLSX 若 Web 限制则如实标注未验)含量房区\n5. 旧数据兼容：无 room_scan key 时列表空、导出无房记录不崩\n\n──────── 第四步 · 红线 ────────\n- models.dart 只追加；不改段1已合入内容；fromJson 全默认值\n- 报告四端同步（改一处必须四处）；无户型图字节时显占位不阻断导出\n- 不实现 §9/§10；不新增第三方依赖；不调网络（图纸校准走本地校准库）\n- Web 无法验证的导出格式：如实标注，不伪造\n\n──────── 第五步 · 输出（段2结束时交付） ────────\n1. 新增/修改文件清单（含行数）\n2. flutter test 结果；analyze 结果；Web 构建结果\n3. Web 手动流程验收截图或逐项说明（面积/闭合差/门洞/保存/报告）\n4. 报告四端各自验证状态（HTML 验过？PDF/DOCX/XLSX 是否受限）\n5. 遗留风险与[待真机]项\n"},{"id":"docs/archive/PASTE_ROOM_P2_CLOSE.md","path":"docs/archive/PASTE_ROOM_P2_CLOSE.md","url":"ZG9jcy9hcmNoaXZlL1BBU1RFX1JPT01fUDJfQ0xPU0UubWQ=","base":"PASTE_ROOM_P2_CLOSE.md","title":"任务：量房段2 收口（widget 测试替代截图 + 2 条审计打磨项 + 文档入库）","group":"归档 · 任务交接与上下文","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":3499,"chars":1986,"lines":35,"nhead":0,"lead":"任务：量房段2 收口（widget 测试替代截图 + 2 条审计打磨项 + 文档入库）","text":"任务：量房段2 收口（widget 测试替代截图 + 2 条审计打磨项 + 文档入库）\n\n前置（先读，以最新代码为准）：\n- `WIDGET_TEST_ROOM_P2.md`（widget 测试目标与口径）\n- `test/room_export_compat_test.dart`（**已有测试夹具范式**：`TestWidgetsFlutterBinding.ensureInitialized()`、纯数据构造、无 store 依赖 → 新测试照它的写法组织）\n- `lib/features/room/room_draw_page.dart`（交互与 painter，注意最新已加 `viewScale` 与\"点回起点闭合\"）\n- `lib/core/storage/local_storage.dart`（判断测试环境能否注入存储）\n\n──────── A. 新增 `test/room_draw_flow_test.dart`（覆盖原人工截图清单） ────────\n按 `WIDGET_TEST_ROOM_P2.md` 的 T1~T5 实现，**至少完成 T1/T4/T5**：\n- T1 记录列表空态：pump `RoomRecordsPage`（ProviderScope override `currentProjectIdProvider='p1'`）→ 断言空态文案、无异常\n- T4 洞口超出范围提示：直接对 `RoomDrawPage` 构造/或对洞口校验逻辑做等价断言（若手势驱动成本高，可抽验证函数并对其断言，**在测试注释里说明替代理由**）\n- T5 记录卡渲染：构造一条 `RoomScanRecord`（含 1 个门洞）→ 断言卡片出现 名称/'㎡'/闭合差文案\n- T2/T3（点角保存、闭合差确认）若手势+存储注入可行则做；**不可行就如实列出\"仍待人工/待真机\"**，不伪造、不 skip 假绿\n- 断言须带期望/实际信息；文件头注释写明\"替代人工截图验收（用户无电脑）\"\n\n──────── B. 修 2 条审计打磨项 ────────\n1. **painter 重绘**：`room_draw_page.dart` 的 `_RoomGridPainter.shouldRepaint`（≈570 行）用 `old.pts != pts` 等**同一性比较**，而 `_pts/_openings` 是就地修改（`_openings.add(...)`）→ 加洞口后可能不重绘。\n   修法（二选一，优先①）：① 变更时换新实例：`_openings = [..._openings, entry]`（同理 pts 变更处保持新列表）；② `shouldRepaint` 改内容比较（`listEquals` + 洞口逐项比）。\n   验收：加洞口后立即显示，无需再点/缩放。\n2. **尺寸标注引线偏移**：`room_plan_painter.dart` 的 `dimAnchorFor(pts, i, offsetPx: 26)` 传入的是**mm**，详情大图缩放下贴墙。\n   修法：改为\"先 map 到屏幕坐标再加屏幕像素偏移（如 26px）\"，或把 mm 偏移放大到 ≥300mm 并加端线刻度。验收：详情页标注数字离开墙面、可读。\n\n──────── C. 文档入库 ────────\n工作区有未跟踪/改动文档，请一并 `git add` 并提交（信息示例：`docs: 量房段2 交接与测试方案（PASTE_*/WIDGET_TEST）+ 看板/上下文更新`）：\n`PASTE_MASTER.md`、`PASTE_ROOM_P1.md`、`PASTE_ROOM_P2.md`、`PASTE_ROOM_P3.md`、`WIDGET_TEST_ROOM_P2.md`、`SESSION_CONTEXT.md`、`TASK_DASHBOARD.md`、`ROOM_MEASURE_IMPL_DETAIL.md`\n\n──────── 验证与输出 ────────\n1. `flutter test` 全量（含既有 room_geometry/room_export_compat）→ 全绿\n2. `flutter analyze` 0 error（崩溃则 `dart analyze \u003c改动目录\u003e`）\n3. `flutter build web --release` 通过\n4. 输出：①新增测试与断言清单 ②两条打磨项修复前后对比（一句话+关键行）③无法自动化的项如实列出 ④commit hash\n\n红线：不伪造/不 skip 假绿；不改段1已合入的几何语义；不动量尺与 AR 代码；新增测试不引第三方依赖。\n"},{"id":"docs/archive/PASTE_ROOM_P3.md","path":"docs/archive/PASTE_ROOM_P3.md","url":"ZG9jcy9hcmNoaXZlL1BBU1RFX1JPT01fUDMubWQ=","base":"PASTE_ROOM_P3.md","title":"任务：量房功能 · 段3（RoomPlan 原生封装 + MethodChannel 契约 + 安卓调研文档）","group":"归档 · 任务交接与上下文","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":4821,"chars":3059,"lines":49,"nhead":0,"lead":"任务：量房功能 · 段3（RoomPlan 原生封装 + MethodChannel 契约 + 安卓调研文档）","text":"任务：量房功能 · 段3（RoomPlan 原生封装 + MethodChannel 契约 + 安卓调研文档）\n\n范围：只做 `ROOM_MEASURE_IMPL_DETAIL.md` 的 §9~§10。前提：段1/段2 已完成并验收（模型/引擎/存储/页面/报告四端都在）。\n⚠️ 本段 iOS 原生部分 **Windows 本机不可编译**——交付物是\"代码+契约+未验证清单\"，**禁止伪造任何验证结果**。\n\n工作目录：F:\\建筑验收工具\\site-patrol\n\n──────── 第一步 · 前置检查（读文件确认现状，以最新代码为准） ────────\n1. `ios/Runner/ArMeasureView.swift` + `ArMeasureViewFactory.swift` + `AppDelegate.swift`：读现有 platform view 注册范式（viewType、channel 命名、messenger 传递）→ §9.5 照同款新增 RoomPlan 的 view/factory/channel。\n2. `ios/Runner/Info.plist`：确认已有 NSCameraUsageDescription（RoomPlan 扫描需相机）。\n3. `lib/core/ar/ar_measure_service.dart`（或同目录服务）：读 MethodChannel 封装写法 → §9.4 `room_capture_service.dart` 照同款。\n4. `lib/app.dart`：段2已加 4 条量房路由 → 本段需把 `/room-scan`（自动扫描页）从占位接真（若段2留了占位）；若路由未含则补。\n5. `ROOM_MEASURE_IMPL_DETAIL.md` §9 的骨架/契约、§10 说明为唯一规格源，照做。\n6. RoomPlan 是 iOS16+ 系统框架（ARKit 家族），**无需新增 Pod**；确认 pubspec 不加任何新依赖。\n\n──────── 第二步 · 实现顺序（代码按序产出，全部标注 [待真机]） ────────\nA. `ios/Runner/RoomCaptureController.swift`（按 DETAIL §9.1 骨架补全）：\n   - RoomCaptureSession 生命周期 start/stop、RoomBuilder、delegate 回调（didUpdate/didEndWith/didStartWith/didFailWithError）\n   - `buildJson(from room:)` 按 §9.3 JSON 契约输出（walls/doors/windows/objects，米→毫米 ×1000，字段名与契约一致）\n   - channel：`room_capture`；方法 isSupported/start/stop/exportJson；回调 onScanned(json)/onError(msg)\n   - 权限：AVCaptureDevice 相机授权检查，拒绝走 onError（照 ArMeasureView 的处理）\nB. `ios/Runner/RoomCapturePlatformView.swift` + `RoomCapturePlatformViewFactory.swift`：承载 RoomCaptureView 的 platform view（照 ArMeasureViewFactory 模式），viewType `room_capture_view`\nC. `AppDelegate.swift`：注册 RoomCapture view factory + 通道（照 ArMeasure 注册追加，勿覆盖现有）\nD. `lib/core/room/room_capture_service.dart`（Dart 封装，照 ar_measure_service 模式）：isSupported/start/stop/exportJson + onScanned/onError 处理\nE. `lib/features/room/room_auto_scan_page.dart`（Dart，可写可 Web 审）：\n   - `isRoomPlanSupported==false`（Web/安卓/非 Pro）→ 提示页 + 「用手动成图」按钮 → 跳 /room-draw（source:'manual'）\n   - 支持 → 全屏 UiKitView(viewType room_capture_view) + 顶部引导文案（\"从门口开始，绕房间缓慢走一圈…\"）+ 底部「完成扫描」\n   - 收 onScanned(json) → 解析 §9.3 JSON → 组装墙段序列（首尾相接）→ 转 RoomWall（doors/windows→openings）→ 跳 room_draw_page 确认修正（source:'roomplan'）\nF. §10：`ANDROID_AR_RESEARCH.md` **追加**「量房成图」节：有 GMS 安卓实测 `ar_flutter_plugin_plus` 墙角打点可行性（若已实测过记录数据；未实测如实写\"待实测\"）；无 GMS → 结论\"安卓主路径=手动/照片成图（P0 已实现）\"；**只写文档，不写产品代码**\n\n──────── 第三步 · 验证（本段能验的） ────────\n1. `flutter analyze`（崩溃则 `dart analyze lib/core/room lib/features/room/room_auto_scan_page.dart`）→ 0 error（Dart 侧）\n2. `flutter build web --release` 通过（auto_scan 页在 Web 走 isSupported=false 分支不报错）\n3. iOS/Swift：**本机不编译**；交付时逐文件标注\"未编译未联调\"\n4. 走查：RoomCaptureController 与 ArMeasureView 的通道/view 命名不冲突；AppDelegate 注册无重复\n\n──────── 第四步 · 红线 ────────\n- 不新增 Pod/第三方依赖；不改 ArMeasure 现有 iOS 文件（只新增文件 + AppDelegate 追加注册）\n- [待真机] 项（isSupported/扫描/exportJson/onScanned/权限）全部列入\"未验证清单\"，**不伪造**\n- models 不新增字段（JSON 解析直接映射段1的 WallOpening/RoomWall 等已有模型）\n- §10 调研不写产品代码\n\n──────── 第五步 · 输出 ────────\n1. 新增文件清单（Dart/Swift 各列出，标 [待真机]）\n2. Dart analyze / Web 构建结果\n3. MethodChannel 契约表（方法/参数/返回/回调）确认与 §9.2 一致\n4. \"未验证清单\"（真机必测项）\n5. ANDROID_AR_RESEARCH.md 追加节的结论\n"},{"id":"docs/archive/SESSION_CONTEXT.md","path":"docs/archive/SESSION_CONTEXT.md","url":"ZG9jcy9hcmNoaXZlL1NFU1NJT05fQ09OVEVYVC5tZA==","base":"SESSION_CONTEXT.md","title":"会话上下文（SESSION CONTEXT）— 快速恢复用","group":"归档 · 任务交接与上下文","scope":"archive","date":"2026-09-15","mtime":"2026-09-15","size":8311,"chars":4859,"lines":94,"nhead":13,"lead":"用途：项目\"蓝图落地\"的记忆压缩包。新会话/换模型/CodeBuddy 接手前先读本文件恢复上下文；细节查对应文档。更新时间：2026-09-09。","text":"# 会话上下文（SESSION CONTEXT）— 快速恢复用\n\u003e 用途：项目\"蓝图落地\"的记忆压缩包。新会话/换模型/CodeBuddy 接手前**先读本文件**恢复上下文；细节查对应文档。更新时间：2026-09-09。\n\n## 1. 团队与处境\n- 深圳市建筑设计研究总院（SZAD）环境院 **AI中心** 3 人小组（中心共10人）；部门曾有解散压力→以\"快速出货+让老板看到钱\"为导向\n- 已有产品：地库AI大师（AI自动画地库图）\n- 技术栈：Flutter App（site-patrol）+ Python 服务（ocf/cad_meta/measure）+ 浩辰云图API（DWG→OCF）+ qwen 视觉模型（远端 120.24.240.129:3000）\n- 工作目录：`F:\\建筑验收工具\\site-patrol`；远端 git：`github.com/linxinquan/site-patrol`（main）\n- 本机 **Windows**：不能编 iOS；验证 = flutter test / flutter analyze / flutter build web；**已知：analysis server 因中文路径崩溃(exit 255)→ 回退 `dart analyze \u003c目录\u003e`**\n\n## 2. 产品定位（对外口径）\n- 产品名：**蓝图落地** = 设计院视角现场数据闭环工具（拍照识别→AI整改建议→巡场打卡→报告四格式→施工方整改回复→知识回流）\n- 核心差异化：设计院出身懂\"设计缺陷\"；万翼做审图(查错)，我们做\"画图+现场+报告\"\n- 当前热点方向：**量房成图**（AR/LiDAR→户型图带尺寸标注，装修+工地核尺双场景）\n\n## 3. 代码库关键事实\n- Flutter + riverpod + go_router；models.dart **约 1450+ 行**，多线共用 → **只追加不覆盖**；fromJson 新字段给默认值\n- 关键模型：`Defect`(含 importance/reply/replyBy/replyTs/completion/closeNote/suggestion/designerAction 等)；`PhotoCalib`(ax/ay/bx/by ✅)；`MeasureItem`(含 source/errorMm)；`MeasureSession`(tolMm 15/2)；`PatrolPlan/PatrolRecord/CheckIn`；量房模型 `WallOpening/RoomWall/RoomScanRecord` **待加（段1）**\n- 报告四格式：`weekly_report.dart` + `report_content.dart`(中间层) + HTML/PDF/DOCX/XLSX → **stats/字段改动四端同步**\n- 视觉：`vision_service.dart`（qwen；`detectAnchor` 锚物识别已用于\"自动锚零输入量尺\"）；本地建议库 `defect_suggestions.dart`（35条）\n- 相机：`core/utils/camera_pick.dart` 的 `pickPhotoRobust`（capture/measure/ar 三处接入）\n- AR：Dart 侧完成（多点/批量保存/权限引导/无假估算）；`ios/Runner/ArMeasureView.swift` 原生代码在仓库 **[待真机]**\n- 巡场：建模+编辑器+墙线检测(`wall_lines.dart`/`geo.dart`)+GPS(geolocator)+打卡(CheckIn) 均已实现\n- ⚠️ 后端 Express 不在工程内（代码走远端）→ 网页链接/云同步冻结；P1-5 云端端口(:3000 vs :8820)冻结等部署确认\n- 最近 WIP 已固化 commit `fa7d9e0`（2026-09-09 账号交接轮）\n\n## 4. 文档地图（site-patrol\\ 下；状态=最近核实）\n| 文档 | 内容 | 状态 |\n|---|---|---|\n| SESSION_CONTEXT.md | 本文件 | 常读 |\n| TASK_DASHBOARD.md | 文档地图+轮次计划+执行记录 | 每轮更新 |\n| ARCHIVE_2026-09-08.md | 归档基线快照（切换账号前） | 基线 |\n| CODEBUDDY_SWITCH_FIX.md | 换账号执行手册（WIP处置/13项核查表/Web回归） | 已执行完 |\n| CODEBUDDY_HANDOFF.md | 三条任务线总交代 | 背景 |\n| REQUIREMENTS_0902_IMPL.md / _SOLUTIONS.md | 0902 需求差距任务 | ✅ 全部合入 |\n| MEASURE_FIX_PLAN.md / PHOTOCALIB_2D_FIX.md | 量尺修复 | ✅ 除 P1-5 冻结 |\n| AR_LIDAR_IMPL_DETAIL.md / AR_UX_SMOOTH.md / AR_CAPTURE_BUGFIX.md | AR 实现+整修 | ✅ Dart 合入，iOS 待真机 |\n| PATROL_MASTER_PLAN / PATROL_ZOOM_WALL / PATROL_SEED_ROUTE.md | 巡场 | ✅ 主体完成 |\n| TEST_PLAN_MEASURE.md | 量尺回归 | 实测待真机 |\n| REPLY_TO_LEADER_0902.md / PPT_OUTLINE_0902.md | 给领导汇报 | 已交付 |\n| **MEASURE_ROOM_PLAN.md** | 量房产品+路线(A RoomPlan/B 手动) | 设计定稿 |\n| **ROOM_MEASURE_IMPL.md** | 量房实施分层 | ⏳ 待执行 |\n| **ROOM_MEASURE_IMPL_DETAIL.md** | 量房超详细规格（§1~§13 全代码/契约） | ⏳ **当前主任务** |\n| **PASTE_MASTER.md** | CodeBuddy 开场总指令（纪律+必读） | 每轮粘贴① |\n| **PASTE_ROOM_P1.md** | 量房段1交代（§1~§4 检查/验证/红线/输出） | ⏳ 待粘贴② |\n| ANDROID_AR_RESEARCH.md | 安卓 AR 调研（含量房节待补） | 已有，量房节 P3 |\n\n## 5. 功能现状（2026-09-09 核实）\n- ✅ 已有：AI整改建议(35条库+进报告)、报告四格式导出(LDI三段式)、缺陷证据链+设计师远程处置、施工方回复、打卡制、DWG本地转换(cad_local.py)、手机看CAD、巡场建模/编辑器/墙线防穿墙/GPS、AR多点测量(Dart)、自动锚零输入量尺、量尺P0/P1/P2(除P1-5)、误差带判定(MeasureItem.errorMm/canJudge)\n- ❌ 待做：**量房三段式（段1模型/引擎/测试→段2页面/报告→段3 RoomPlan原生）**；量尺/AR/GPS 真机实测与录像（需设备）\n- ⏸ 冻结：网页链接/云同步（后端）、P1-5（端口）、安卓 AR（调研维持\"安卓走照片/手动量房\"）\n\n## 6. 当前执行计划（量房 = 当前主线，三段式）\n- **段1**（§1~§4：模型+存储+几何引擎+测试）→ 先做，验收（flutter test 全绿）后放段2\n- **段2**（§5~§8：页面+painter+核尺对照+报告四端）→ Web 可演示\n- **段3**（§9~§10：RoomPlan 原生代码+契约+安卓调研）→ [待真机]\n- 收尾另排：真机回归（TEST_PLAN_MEASURE）+ iOS AR/量房联调\n\n## 7. 关键技术事实\n- OCF=浩辰私有网页格式；识别/解析回 DWG，OCF 只展示\n- 照片量尺：参照物标定 mm/px=refMm/2D像素距，±1~3%；\"快速校对\"非精密计量\n- AR LiDAR：iPhone 12 Pro+；**≥2m 手机读数达不到 GB 验收精度→UI 已标注\"需复核\"**；同边重复采样+误差带判定\n- RoomPlan：ARKit 官方量房（iOS16+/LiDAR），自动出墙/门/窗/房间+尺寸；黑盒成图→需标注层补工程信息\n- CadCoordMapper：屏幕像素↔CAD 世界坐标 mm；B05 有演示校准\n- 浩辰 API：华为云网关；dwgToOcf 异步任务；配额商用待确认\n\n## 8. 待领导拍板\n1. 安卓 AR 值不值得投（倾向不投）\n2. 网页协作链接后端归属/预算（后端不在工程）\n3. 浩辰转换授权/配额\n\n## 9. 红线口径\n- AI/远程处置标\"AI辅助，人工复核\"；不编造规范条文号\n- 判定精度诚实（手机测量达不到验收精度就说\"需复核\"）；**不伪造验证结果（[待真机]=不假装通过）**\n- models 追加不覆盖、fromJson 默认值；报告四端同步；不引新依赖；删前 grep；不碰范围外\n\n## 10. CodeBuddy 每轮必带\n先读 `PASTE_MASTER.md`（纪律）→ 任务 `PASTE_xxx.md`（细节）→ 规格文档；先读文档与最新代码；标✅不重写；每步 analyze/test/构建+改动清单输出；Windows 不能编 iOS\n\n## 11. 任务交付规范（2026-09-09 起执行）\n1. **任务分解产出 4 件套**，全部落盘 site-patrol\\：\n   ① 详细规格文档 `XXX_IMPL_DETAIL.md`（纯逻辑给完整代码，UI 给精确规格，原生给契约/骨架）\n   ② 交代文本 `PASTE_XXX.md`（范围/前置检查/按序步骤/验证命令/红线/输出格式，自包含）\n   ③ 看板登记：`TASK_DASHBOARD.md`（文档地图行 + 排期/分段 const BY_ID = {}; DOCS.forEach(d=>BY_ID[d.id]=d);
const BY_BASE = {}; DOCS.forEach(d=>{ (BY_BASE[d.base]=BY_BASE[d.base]||[]).push(d); });

function resolveDoc(ref){
  if(!ref) return null;
  ref = ref.trim().replace(/^\.\//,'');
  if(BY_ID[ref]) return BY_ID[ref];
  const one = BY_BASE[ref.split('/').pop()];
  if(one && one.length===1) return one[0];
  if(one && one.length>1){ // 同名取路径后缀最匹配的
    const hit = one.find(d=>d.path.endsWith(ref)) || one[0];
    return hit;
  }
  const suf = DOCS.filter(d=>d.path.endsWith('/'+ref)||d.path===ref);
  return suf.length===1?suf[0]:null;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){
  let t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('on'),1500);
}
function fmtSize(n){ return n<1024 ? n+' B' : (n/1024).toFixed(n<10240?1:0)+' KB'; }
function fmtChars(n){ return n<10000 ? n.toLocaleString() : (n/10000).toFixed(1)+' 万'; }
function copy(text,label){
  const done=()=>toast(label||'已复制');
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(()=>fallback()); }
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('复制失败');}
    document.body.removeChild(ta);
  }
}

/* ======================= Markdown 渲染 ======================= */
const RE_BULLET = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
function isListLine(s){ return RE_BULLET.test(s); }
function isSepRow(s){ return /^\s*\|?[\s:\-|]+\|[\s:\-|]*$/.test(s) && s.indexOf('-')>=0; }
function isTableStart(lines,i){
  return lines[i]!=null && lines[i].indexOf('|')>=0 && isSepRow(lines[i+1]||'');
}
function isBlockStart(lines, i){
  const s = lines[i];
  if(!s || !s.trim()) return true;
  if(/^\s*(```|~~~)/.test(s)) return true;
  if(/^#{1,6}\s/.test(s)) return true;
  if(/^\s*>/.test(s)) return true;
  if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(s)) return true;
  if(isListLine(s)) return true;
  if(isTableStart(lines, i)) return true;
  if(/^ {0,3}(<[a-zA-Z\/!])/.test(s)) return true;
  return false;
}

function inline(s){
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m,c)=>{ codes.push(c); return '\u0001'+(codes.length-1)+'\u0001'; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m,a,u)=>'<img alt="'+a+'" src="'+u+'" style="max-width:100%">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m,t,u)=>{
    const ext = /^[a-z]+:\/\//i.test(u);
    return '<a href="'+u+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+t+'</a>';
  });
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[\s(\u3000])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m,i)=> codeHtml(codes[+i]));
  return s;
}
function codeHtml(c){
  if(/\.(md|markdown)$/i.test(c)){
    const d = resolveDoc(c);
    if(d) return '<a class="doclink" href="#/doc/'+d.id+'" data-doc="'+d.id+'">'+c+'</a>';
  }
  return '<code class="ic" title="点击复制">'+c+'</code>';
}

function slug(s){ return String(s).toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'').slice(0,48); }

function renderMarkdown(src){
  const lines = String(src).replace(/\r\n?/g,'\n').split('\n');
  const out = [];
  const toc = [];
  let i = 0, hIdx = 0;
  const usedSlug = {};

  while(i < lines.length){
    const line = lines[i];

    // 围栏代码块
    const fence = line.match(/^\s*(```+|~~~+)\s*([\w+#-]*)\s*$/);
    if(fence){
      const mark = fence[1][0].repeat(3), lang = fence[2]||'';
      i++;
      const buf = [];
      while(i < lines.length && !new RegExp('^\\s*'+mark+'\\s*$').test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      const code = buf.join('\n');
      out.push('<pre class="code"><div class="cbar2"><span>'+(lang||'text')+'</span>'+
        '<span class="cp" data-copy="'+esc(code)+'" title="复制代码">复制</span></div>'+
        '<code>'+esc(code)+'</code></pre>');
      continue;
    }

    // 空行
    if(!line.trim()){ i++; continue; }

    // 标题
    const h = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(h){
      const lv = h[1].length, txt = h[2];
      let s = slug(txt) || ('h'+hIdx);
      usedSlug[s] = (usedSlug[s]||0)+1;
      if(usedSlug[s]>1) s = s+'-'+usedSlug[s];
      const id = 'h'+(hIdx++)+'-'+s;
      if(lv<=4) toc.push({id:id, lv:lv, text:txt.replace(/[*`]/g,'')});
      out.push('<h'+lv+' id="'+id+'" class="h-anchor">'+inline(txt)+
        '<a class="headmark" href="#'+id+'" title="锚点">#</a></h'+lv+'>');
      i++;
      continue;
    }

    // 分隔线
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    // 引用块
    if(/^\s*>/.test(line)){
      const buf = [];
      while(i < lines.length && (/^\s*>/.test(lines[i]) || (lines[i].trim()==='' && /^\s*>/.test(lines[i+1]||'')))){
        buf.push(lines[i].replace(/^\s*>\s?/,'')); i++;
      }
      out.push('<blockquote>'+renderMarkdown(buf.join('\n')).html+'</blockquote>');
      continue;
    }

    // 表格
    if(isTableStart(lines, i)){
      const head = splitRow(lines[i]);
      i += 2;
      const rows = [];
      while(i < lines.length && lines[i].indexOf('|')>=0 && lines[i].trim()){ rows.push(splitRow(lines[i])); i++; }
      let t = '<table><thead><tr>';
      head.forEach(c=> t += '<th>'+inline(c)+'</th>');
      t += '</tr></thead><tbody>';
      rows.forEach(r=>{
        t += '<tr>';
        for(let k=0;k<head.length;k++) t += '<td>'+inline(r[k]||'')+'</td>';
        t += '</tr>';
      });
      out.push(t+'</tbody></table>');
      continue;
    }

    // 列表
    if(isListLine(line)){
      const r = parseList(lines, i);
      out.push(r.html); i = r.next; continue;
    }

    // 段落
    const buf = [];
    while(i < lines.length && !isBlockStart(lines, i)){ buf.push(lines[i]); i++; }
    if(!buf.length){ buf.push(lines[i]); i++; }   // 兜底：保证指针一定前进
    out.push('<p>'+buf.map(l=>inline(l.trim())).join('<br>')+'</p>');
  }
  return {html: out.join('\n'), toc: toc};
}

function splitRow(line){
  let s = line.trim();
  if(s.startsWith('|')) s = s.slice(1);
  if(s.endsWith('|')) s = s.slice(0,-1);
  const cells = []; let cur = '';
  // 逐字符切分，保留被转义的 \|
  for(let k=0;k<s.length;k++){
    if(s[k]==='\\' && s[k+1]==='|'){ cur += '|'; k++; continue; }
    if(s[k]==='|'){ cells.push(cur.trim()); cur=''; continue; }
    cur += s[k];
  }
  cells.push(cur.trim());
  return cells;
}

function parseList(lines, start){
  const first = RE_BULLET.exec(lines[start]);
  const indent = first[1].length;
  const ordered = /\d/.test(first[2]);
  const items = [];
  let i = start;
  const out = [];
  while(i < lines.length){
    const m = RE_BULLET.exec(lines[i]);
    if(m && m[1].length === indent){
      const isOrd = /\d/.test(m[2]);
      if(isOrd !== ordered && items.length) break;
      items.push({raw:[m[3]], sub:[]});
      i++;
      continue;
    }
    if(m && m[1].length > indent){
      const r = parseList(lines, i);
      if(items.length) items[items.length-1].sub.push(r.html);
      i = r.next;
      continue;
    }
    if(!lines[i].trim()){
      let j = i;
      while(j < lines.length && !lines[j].trim()) j++;
      const nm = RE_BULLET.exec(lines[j]||'');
      if(nm && nm[1].length >= indent){ i = j; continue; }
      break;
    }
    if(m && m[1].length < indent) break;
    if(/^ {2,}/.test(lines[i]) && items.length){
      items[items.length-1].raw.push(lines[i].trim()); i++; continue;
    }
    break;
  }
  const tag = ordered ? 'ol' : 'ul';
  items.forEach(it=>{
    const txt = it.raw.join('\n');
    const task = txt.match(/^\[([ xX])\]\s*([\s\S]*)$/);
    let body;
    if(task){
      body = '<input type="checkbox" disabled'+(task[1].toLowerCase()==='x'?' checked':'')+'> '+inline(task[2]);
    } else {
      body = inline(txt).replace(/\n/g,'<br>');
    }
    out.push('<li>'+body+it.sub.join('')+'</li>');
  });
  const cls = items.some(it=>/^\[[ xX]\]/.test(it.raw.join('')))?' class="task"':'';
  return {html:'<'+tag+cls+'>'+out.join('')+'</'+tag+'>', next:i};
}

/* ============================ 状态 ============================ */
const S = {
  view:'home', id:null, q:'', filter:'all',
  closed:{}, done:{}
};
try{
  const saved = JSON.parse(localStorage.getItem('bp-docs')||'{}');
  if(saved.closed) S.closed = saved.closed;
  if(saved.fs) document.documentElement.style.setProperty('--fs', saved.fs+'px');
  S.fs = saved.fs||15;
  S.last = saved.last;
}catch(e){ S.fs = 15; }
function persist(){
  try{ localStorage.setItem('bp-docs', JSON.stringify({closed:S.closed, fs:S.fs, last:S.last})); }catch(e){}
}

/* ============================ 侧栏 ============================ */
function passFilter(d){
  if(S.filter==='all') return true;
  return d.scope === S.filter;
}
function buildSidebar(){
  const tree = $('#tree');
  const q = S.q.trim().toLowerCase();
  const groups = [];
  DOCS.forEach(d=>{
    if(!passFilter(d)) return;
    if(q && !(d.title.toLowerCase().includes(q) || d.path.toLowerCase().includes(q) || d.text.toLowerCase().includes(q))) return;
    let g = groups.find(x=>x.name===d.group);
    if(!g){ g = {name:d.group, items:[]}; groups.push(g); }
    g.items.push(d);
  });
  if(!groups.length){ tree.innerHTML = '<div class="empty-tip">没有匹配的文档。<br>试试清空搜索或切换筛选。</div>'; return; }
  let html = '';
  if(q){
    const n = groups.reduce((a,g)=>a+g.items.length,0);
    html += '<div class="empty-tip" style="padding:6px 10px 2px">目录已按搜索过滤：命中 <b>'+n+'</b> 篇，清空搜索可恢复完整分类。</div>';
  }
  groups.forEach(g=>{
    const closed = S.closed[g.name] ? ' closed' : '';
    html += '<div class="grp'+closed+'" data-grp="'+esc(g.name)+'">'+
      '<div class="gh"><span class="cv">▼</span><span>'+esc(g.name)+'</span><span class="cnt">'+g.items.length+'</span></div>';
    g.items.forEach(d=>{
      const on = (S.view==='doc' && S.id===d.id) ? ' on' : '';
      html += '<div class="gi'+on+'" data-doc="'+d.id+'" title="'+esc(d.lead||d.path)+'">'+
        esc(d.title)+'<span class="meta">'+d.date+' · '+fmtSize(d.size)+'</span></div>';
    });
    html += '</div>';
  });
  tree.innerHTML = html;
}

    '<div class="cards">'+
      '<div class="card accent"><div class="n">'+cur.length+'</div><div class="l">现行文档（根目录）</div></div>'+

      '<div class="card"><div class="n">'+arc.length+'</div><div class="l">已归档</div></div>'+
      '<div class="card"><div class="n">'+fmtChars(chars)+'</div><div class="l">总字数（字符）</div></div>'+
    '</div>';
  /* 刷新命令：文档一变这个页面就该重新生成，命令放在最显眼处 */
  h += '<div class="cmdbar">'+
    '<div class="cb-t">📌 文档更新后，重新生成本页只需一条命令</div>'+
    '<div class="cb-line">'+
      '<code class="ic cmd" title="点击复制">python flutter_app/docs/_build_docs_browser.py</code>'+
      '<button class="cp" data-copy="python flutter_app/docs/_build_docs_browser.py">复制命令</button>'+
    '</div>'+
    '<div class="cb-n">在仓库根目录 <code>D:/code/gongdi</code> 下运行；也可以先 <code>cd flutter_app</code>，再跑 <code>python docs/_build_docs_browser.py</code>。'+
    '脚本会重扫 <code>flutter_app/</code> 根目录 + <code>docs/</code> 里的全部 Markdown，重新生成 <code>docs/index.html</code>，并打印分类统计与异常项。'+
    '新增、改名、删除文档后都跑一次，本页的分类树、搜索索引和跨文档链接会自动跟着更新。</div>'+
    '</div>';
  h += '<h2 class="sec">'+title+'</h2><ul class="recents">';
  if(!recent.length) h += '<li><div class="d">当前筛选下没有文档</div></li>';
  recent.forEach(d=>{
    h += '<li data-doc="'+d.id+'"><div class="r1"><span class="t">'+esc(d.title)+'</span>'+
      '<span class="dt">'+d.date+'</span></div>'+
      '<div class="d">'+esc(d.lead||'')+'</div></li>';
  });
  h += '</ul>';
  if(S.filter !== 'archive'){
    h += '<h2 class="sec">关键入口</h2><ul class="recents">';
    ['FEATURE_INVENTORY.md','BACKEND_ARCHITECTURE.md','docs/specs/CAPTURE_FLOW.md','docs/specs/DEFECTS_FLOW.md','docs/specs/CAPTURE_DEFECT_MAPPING.md','DESIGN_TOKENS.md']
      .forEach(p=>{
        const d = resolveDoc(p); if(!d) return;
        h += '<li data-doc="'+d.id+'"><div class="r1"><span class="t">'+esc(d.title)+'</span>'+
          '<span class="dt">'+d.path+'</span></div><div class="d">'+esc(d.lead||'')+'</div></li>';
      });

  }
  h += '<div class="hints"><b>快捷键</b>　<kbd>/</kbd> 聚焦搜索　<kbd>Esc</kbd> 清空/返回　<kbd>←</kbd> <kbd>→</kbd> 上一篇/下一篇<br>'+
    '<b>小技巧</b>　正文里的 <code class="ic">行内代码</code> 点击即复制；写法为 <code class="ic">xxx.md</code> 的跨文档引用会变成可点击跳转。<br>'+
    '<b>数据来源</b>　本页内嵌了 '+DOCS.length+' 篇 Markdown 快照（'+META.built+' 生成），双击即可离线打开；文档更新后按上方那条命令重新生成即可刷新本页。</div>';
  h += '<div class="note">⚠️ 归档文档仅作历史溯源，结论可能已过期 —— 与本页「现行文档」冲突时，以 <b>FEATURE_INVENTORY.md</b> 与 <b>BACKEND_ARCHITECTURE.md</b> 为准。</div>';
  h += '</div>';
  return h;
}

/* 去掉正文开头的一级标题：标题已在页头展示，避免重复 */
function stripLeadingH1(text){
  return String(text).replace(/^[\s\uFEFF]*#\s+[^\n]*\n?/, '');
}

function docView(){
  const d = BY_ID[S.id];
  if(!d) return '<div class="sres"><div class="sh">文档不存在，可能已被移动或改名。</div></div>';
  const r = renderMarkdown(stripLeadingH1(d.text));
  d._toc = r.toc;
  const badge = d.scope==='archive' ? '<span style="color:#b45309">归档</span>' : (d.scope==='spec'?'<span style="color:#2c6bed">规格</span>':'<span style="color:#1a7f4b">现行</span>');
  const mins = Math.max(1, Math.round(d.chars/550));
  return '<div class="progress"><i></i></div>'+
    '<div class="doc-h"><h1 class="doc-title">'+esc(d.title)+'</h1>'+
    '<div class="doc-sub"><span>'+d.path+'</span><span>'+badge+'</span><span>'+d.date+'</span>'+
    '<span>'+fmtSize(d.size)+'</span><span>'+d.chars.toLocaleString()+' 字符</span><span>约 '+mins+' 分钟</span>'+
    '<span>'+d.nhead+' 个小节</span></div></div>'+
    '<div class="md" id="md">'+r.html+'</div>';
}

function searchView(){
  const q = S.q.trim().toLowerCase();
  if(!q) return '<div class="sres"><div class="sh">输入关键词开始全文搜索</div></div>';
  const res = [];
  DOCS.forEach(d=>{
    if(!passFilter(d)) return;
    const cl = d.text.toLowerCase(), inT = d.title.toLowerCase().includes(q),
          inP = d.path.toLowerCase().includes(q);
    const idx = cl.indexOf(q);
    if(idx < 0 && !inT && !inP) return;
    let cnt = 0, p = idx;
    while(p >= 0){ cnt++; p = cl.indexOf(q, p+q.length); }
    res.push({d:d, score:cnt+(inT?50:0)+(inP?20:0), pos:Math.max(idx,0)});
  });
  res.sort((a,b)=> b.score-a.score);
  let h = '<div class="sres"><div class="sh">关键词 <b>'+esc(S.q)+'</b> 命中 <b>'+res.length+'</b> 篇文档</div>';
  if(!res.length) h += '<div class="hit">没有命中。换个词试试，或把筛选切到「全部」。</div>';
  const re = new RegExp('('+S.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  res.slice(0,60).forEach(x=>{
    const d = x.d, txt = d.text, p = x.pos;
    const start = Math.max(0, p-70), end = Math.min(txt.length, p+130);
    let snip = (start>0?'…':'') + txt.slice(start,end).replace(/[#>*`]/g,' ') + (end<txt.length?'…':'');
    snip = esc(snip).replace(re,'<mark>$1</mark>');
    h += '<div class="hit" data-doc="'+d.id+'"><div class="ht">'+esc(d.title)+'</div>'+
      '<div class="hp">'+d.path+' · '+d.date+' · 命中 '+x.score+' 次</div>'+
      '<div class="hs">'+snip+'</div></div>';
  });
  h += '</div>';
  return h;
}

const TOC_IDLE = '<div class="th">目录</div><div class="none">打开一篇文档后显示</div>';

function tocView(){
  const d = BY_ID[S.id];
  if(!d || !d._toc || !d._toc.length) return '<div class="th">目录</div><div class="none">本文没有小节标题</div>';
  let h = '<div class="th">目录 · '+d._toc.length+' 节</div>';
  d._toc.forEach(t=>{
    h += '<a class="lv'+Math.min(t.lv,4)+'" href="#'+t.id+'" data-anchor="'+t.id+'">'+esc(t.text)+'</a>';
  });
  return h;
}

function render(){
  const c = $('#content');
  if(S.view==='doc'){ c.innerHTML = docView(); }
  else if(S.view==='search'){ c.innerHTML = searchView(); }
  else { c.innerHTML = homeView(); }
  c.scrollTop = 0;
  $('#tocwrap').innerHTML = (S.view==='doc') ? tocView() : TOC_IDLE;
  buildSidebar();
  updateBar();
  bindContent();
  updateSpy();
}

function updateBar(){
  const c = $('#cbar');
  const cur = (S.view==='doc'&&BY_ID[S.id]) ? BY_ID[S.id] : null;
  c.innerHTML = '<button class="menubtn" id="menubtn">☰</button>'+
    '<span class="path">'+ (cur ? esc(cur.path) : (S.view==='search' ? '搜索：'+esc(S.q) : '首页')) +'</span>'+
    '<span class="sp"></span>'+
    (cur ? '<button class="btn" id="bcopy">复制 Markdown</button>'+
           '<button class="btn" id="bpath">复制路径</button>' : '')+
    '<button class="btn" id="bfont-dec">A-</button><button class="btn" id="bfont-inc">A+</button>';
  const mb = $('#menubtn'); if(mb) mb.onclick = ()=>document.body.classList.toggle('menu');
  const bcopy = $('#bcopy'); if(bcopy) bcopy.onclick = ()=>copy(BY_ID[S.id].text, '已复制全文 Markdown');
  const bpath = $('#bpath'); if(bpath) bpath.onclick = ()=>copy('flutter_app/'+BY_ID[S.id].path, '已复制文件路径');
  $('#bfont-dec').onclick = ()=>{ S.fs=Math.max(13,S.fs-1); document.documentElement.style.setProperty('--fs',S.fs+'px'); persist(); };
  $('#bfont-inc').onclick = ()=>{ S.fs=Math.min(19,S.fs+1); document.documentElement.style.setProperty('--fs',S.fs+'px'); persist(); };
}

function bindContent(){
  document.querySelectorAll('#content [data-doc]').forEach(el=>{
    el.addEventListener('click', ev=>{
      if(ev.target.closest('a[href^="http"]')) return;
      ev.preventDefault();
      go(el.getAttribute('data-doc'));
    });
  });
  document.querySelectorAll('#content code.ic').forEach(el=>{
    el.addEventListener('click', ()=>copy(el.textContent,'已复制：'+el.textContent.slice(0,26)));
  });
  document.querySelectorAll('#content .cp').forEach(el=>{
    el.addEventListener('click', ()=>copy(el.getAttribute('data-copy'),'代码已复制'));
  });
  /* 目录 / 标题锚点：只滚动，不污染 URL（否则会被当成路由跳转） */
  document.querySelectorAll('#tocwrap a[data-anchor], #content a.headmark').forEach(a=>{
    a.addEventListener('click', ev=>{
      const id = a.getAttribute('data-anchor') || (a.getAttribute('href')||'').slice(1);
      const target = id && document.getElementById(id);
      if(!target) return;
      ev.preventDefault();
      target.scrollIntoView({block:'start', behavior:'smooth'});
      updateSpy();
    });
  });
  document.querySelectorAll('#content table').forEach(t=>{
    t.querySelectorAll('td').forEach(td=>{
      if(td.textContent.trim()==='—'||td.textContent.trim()==='-') td.style.color='#b9c0c9';
    });
  });
}

/* 滚动高亮 + 阅读进度 */
function updateSpy(){
  const links = [].slice.call(document.querySelectorAll('#tocwrap a[data-anchor]'));
  if(!links.length) return;
  const y = $('#content').scrollTop + 96;
  let cur = links[0];
  links.forEach(l=>{
    const h = document.getElementById(l.getAttribute('data-anchor'));
    if(h && h.offsetTop <= y) cur = l;
  });
  links.forEach(l=>l.classList.toggle('on', l===cur));
}
$('#content').addEventListener('scroll', ()=>{
  const el = $('#content');
  const bar = el.querySelector('.progress i');
  if(bar){
    const max = el.scrollHeight - el.clientHeight;
    bar.style.width = (max>0 ? (el.scrollTop/max*100) : 0) + '%';
  }
  if(S.view === 'doc') updateSpy();
}, true);

/* ============================ 路由 ============================ */
const HASH_DOC = '#/doc/';
function go(id){
  S.id = id; S.view = 'doc'; S.last = id; persist();
  document.body.classList.remove('menu');
  try{ if(location.hash !== HASH_DOC+id) history.replaceState(null, '', HASH_DOC+id); }
  catch(e){ location.hash = HASH_DOC+id; }
  render();
}
function route(){
  const h = location.hash || '#/home';
  if(h.indexOf(HASH_DOC) === 0){
    const id = decodeURIComponent(h.slice(HASH_DOC.length));
    if(BY_ID[id]){ S.id = id; S.view = 'doc'; S.last = id; persist(); render(); return true; }
    S.id = id; S.view = 'doc'; render(); return true;
  }
  if(S.q.trim()){ S.view = 'search'; render(); return true; }
  S.view = 'home'; S.id = null; render();
  return false;
}
/* 浏览器前进/后退：只有 hash 与当前状态不一致时才重绘；页内锚点不当作路由 */
window.addEventListener('hashchange', ()=>{
  const h = location.hash || '';
  if(h && h.indexOf('#/') !== 0) return;
  if(S.view === 'doc' && h === HASH_DOC + S.id) return;
  if(S.view === 'home' && h === '#/home') return;
  route();
});

/* ============================ 事件 ============================ */
const qi = $('#q');
qi.addEventListener('input', ()=>{
  S.q = qi.value;
  $('#qclr').style.display = S.q ? 'block':'none';
  if(S.q.trim()){ S.view='search'; render(); }
  else if(location.hash.startsWith('#/doc/')) { route(); }
  else { S.view='home'; render(); }
});
qi.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const first = document.querySelector('.hit');
    if(first) go(first.getAttribute('data-doc'));
  }
});
$('#qclr').addEventListener('click', ()=>{ qi.value=''; S.q=''; $('#qclr').style.display='none'; route(); qi.focus(); });
document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    S.filter = c.getAttribute('data-f');
    render();
  });
});
$('#tree').addEventListener('click', e=>{
  const gh = e.target.closest('.gh');
  if(gh){
    const grp = gh.parentElement, name = grp.getAttribute('data-grp');
    grp.classList.toggle('closed');
    S.closed[name] = grp.classList.contains('closed');
    persist(); return;
  }
  const gi = e.target.closest('.gi');
  if(gi) go(gi.getAttribute('data-doc'));
});
document.addEventListener('keydown', e=>{
  if(e.key==='/' && !/input|textarea/i.test((e.target.tagName||''))){
    e.preventDefault(); qi.focus(); qi.select(); return;
  }
  if(e.key==='Escape'){
    if(document.activeElement===qi){ qi.value=''; S.q=''; $('#qclr').style.display='none'; qi.blur(); route(); }
    else document.body.classList.remove('menu');
  }
  if((e.key==='ArrowRight'||e.key==='ArrowLeft') && S.view==='doc' && !/input|textarea/i.test(e.target.tagName||'')){
    const list = DOCS.filter(passFilter);
    const k = list.findIndex(d=>d.id===S.id);
    if(k>=0){
      const n = e.key==='ArrowRight' ? Math.min(list.length-1,k+1) : Math.max(0,k-1);
      if(n!==k) go(list[n].id);
    }
  }
});

/* 启动 */
if(location.hash){ route(); }
else if(S.last && BY_ID[S.last]){
  S.id = S.last; S.view = 'doc';
  try{ history.replaceState(null, '', HASH_DOC + S.last); }catch(e){}
  render();
}
else { render(); }

</script>
