oller.dart:61`，与 `capture_page.dart:145` 同 key）。\n\n### 5.1 统计条口径（`capture_records_page.dart:274-299`）\n\n| 指标 | 口径 |\n|---|---|\n| 累计记录 | 当前项目过滤后的 `all.length` |\n| 今日新增 | `ts \u003e= 今日 00:00` 的记录数 |\n| 待整改 | **所有记录中 `defects[].status != 'converted'` 的缺陷总数**（与当前筛选无关） |\n\n\u003e ⚠️ `_calcStats(all, filtered)` 的第二个参数 `filtered` **完全未被使用**（死参数）。\n\n### 5.2 筛选与分组\n\n- 时间：全部 / 今日 / 本周（本周 = 最近 7 天含今日，`controller:237, 246-248`）。\n- 楼层：由当前数据去重生成选项（`page:301-310`）。\n- 仅看 AI 缺陷：`defects` 非空即保留（`controller:256-259`）。\n- 分组：今日 / 昨日 / 更早，空组剔除，组头可折叠（`widgets/grouped_grid.dart:53-83`）。\n- 栅格：≥520 四列 / ≥400 三列 / 否则两列（`grouped_grid.dart:154-158`）。\n\n### 5.3 卡片与详情\n\n- 卡片：1:1 缩略图（Web 无图显示占位）+ 待转缺陷角标（或「无缺陷」绿勾）+ `部位` + `楼层 · MM-DD HH:mm`（`widgets/thumbnail_card.dart`）。\n- 详情弹层 `StoredDetailSheet`（`capture_page.dart:3590`）：照片大图、「AI 识别结果」逐条（名称/描述/置信度 + 单条「转入问题清单」或「已转入」徽标）、问题描述、**批量转入问题清单（N）**、删除该记录。\n\n### 5.4 「转入问题清单」（出口 B）\n\n- 单条与批量**落点相同**：`onConvert(idxs)` → `capture_records_page._onConvert`（`page:236-270`）。\n- 副作用序列（**无事务**）：\n  1. 循环 `repo.addDefect(buildDefectFromCaptureDefect(...))`（`page:245-253`）\n  2. `ref.invalidate(defectsProvider)`（`page:254`）\n  3. 循环 `markDefectConverted(captureId, idx)`（`page:255-259`）—— **返回值被忽略**\n  4. Snack「已生成 N 条问题记录」+「去问题清单」（`page:260-268`）\n  5. 最终**无条件 `return true`**（`page:269`），无 try/catch\n- 幂等保护：`markDefectConverted` 内部对已 `converted` 或未命中返回 `false`（`controller:140, 145`）。\n\n**Defect 字段映射表**（`buildDefectFromCaptureDefect`，`controller:279-319`）：\n\n| Defect 字段 | 来源 | 默认 |\n|---|---|---|\n| `id` | — | `\"$captureId#$idx\"`（`:297`） |\n| `part` | `capture.anchor` | `验收点`（`:298`） |\n| `type` | `vlDefect.name` | `未分类`（`:299`） |\n| `category` | — | 固定 `other`（`:300`） |\n| `severity` | `vlDefect.severity` 字符串解析 | 失败回落 `orange`（`:301, 322-328`） |\n| `status` | — | 固定 `draft`（`:302`） |\n| `anchor` / `floor` / `ts` | 透传 | `''` |\n| `gps` / `alt` / `resp` | — | 固定 `''`（`:306-308`） |\n| `reporter` | — | 固定 `验收记录`（`:309`） |\n| `tags` | — | `['验收转工单', '验收#$captureId']`（`:310`，历史文案） |\n| `note` | `capture.note` + `vlDefect.desc` | `\"$note｜$desc\"`（`:311`） |\n| `seed` | — | `capture_convert`（`:312`） |\n| `drawingKey/worldX/worldY` | 透传 | null |\n| `photos` | `[capture.photo]` | `[]`（`:316`） |\n| `photoPath` | **未赋值** | null ← **报告照片断链根因** |\n\n### 5.5 删除\n\n顺序保证：**先写回文档成功，才删照片文件**；写失败则中止且不删照片（`controller:99-112`）。写回时按 id 精确移除，保留其他项目/记录（`:95-97`）。\n\n### 5.6 项目隔离\n\n`_applyProjectFilter` 用 `drawingsProvider` 的 key 集合过滤；`drawingKey` 为空的记录保留（兼容历史）；drawings 未就绪时不过滤（`controller:205-218`）。切换项目通过 `ref.listen(is7DongProjectProvider)` 自动重载（`controller:54`）。\n\n---\n\n## 6. 与下游的接口\n\n| 下游 | 是否读验收记录 | 说明 |\n|---|---|---|\n| 问题清单 `/defects` | **间接** | 只读 `Defect`；验收数据是经「保存」或「转入」进入的 |\n| 报告导出 | **不读** | 数据源是 `defectsProvider`（`defects_page.dart:44, 119-124, 753-756`）；全库在 `features/defects` 内搜索 `capture/stored_vision/sourceCaptureId` **0 命中** |\n| 报告照片 | 仅靠 `Defect.photoPath` | 四个导出端都只读 `photoPath`/`replyPhotoPath`（`report_builder.dart:536`、`report_pdf.dart:754`、`report_docx.dart:557`、`defects_page.dart:178`） |\n| 报告归档 | 不读 | 归档只存元数据（见 M5） |\n\n\u003e `Defect.photos` 列表除赋值外**无任何消费方**。\n\n---\n\n## 7. 偏离清单（按严重度）\n\n| # | 严重度 | 问题 | 证据 | 影响 | 建议 |\n|---|---|---|---|---|---|\n| D1 | ✅ **已修**\u003cbr\u003e（2026-09-18） | **报告照片断链**：转入生成的 Defect 未写 `photoPath`，而报告只读 `photoPath` | `buildDefectFromCaptureDefect` 现补 `photoPath`；`report_builder.dart:516` 对 null 静默省略的行为保留（有路径才渲染照片区） | 原影响：转入的缺陷在报告里**连照片区块都不渲染**；`capture_page` 原注释称\"显示占位\"与实现不符，注释已同步修正 | 已完成 |\n| D2 | 🔴 高 | **同一次拍照在问题清单留 1+N 条**：保存时生成 1 条聚合缺陷（`seed:'capture'`），转入又生成 N 条（`seed:'capture_convert'`） | `capture_page.dart:929-953` + `controller:296-318` | 同一照片/部位重复出现，报告与清单噪声 | 明确二者分工（留痕 vs 整改项），或转入时合并/去重 |\n| D3 | 🔴 高 | **转入无事务、失败静默**：先写 N 条 Defect → 刷新 → 再逐个回写 `converted`；返回值忽略、无 try/catch、最终无条件 `return true` | `capture_records_page.dart:245-269` | 部分成功时验收记录仍显示未转入，可重复点击（Defect id 相同故清单不重复，但状态不一致） | 检查返回值 + 失败提示 + 重试；或改为「先建后标」的可回滚顺序 |\n| D4 | 🟠 中 | **`CaptureEntryPage` 是孤儿页**：仅定义、无路由引用 | 全库仅 `capture_entry_page.dart:10` 命中 | 三步说明卡与「开始验收」不可达，维护成本白付 | 接管 `/capture` 或删除 |\n| D5 | 🟠 中 | **结果区分段 3 段 vs 注释 4 段**：「拍照记录」实为 AppBar 弹窗 | `capture_page.dart:90-94` vs `:1533-1536, 3215` | 注释误导 | 改注释或把入口纳入分段 |\n| D6 | 🟠 中 | **`_CaptureStep.selectFloor` 死枚举值**，从未赋值；`_buildFloorSelector` 不可达 | `:68, 1892` | 死代码 | 删除 |\n| D7 | 🟠 中 | **`_scanTimer` 死字段**：只被 `cancel()`，从未赋值 | `:127, 322, 787, 981, 1023` | 死代码 | 删除 |\n| D8 | 🟠 中 | **量尺校对判定门槛未接项目级配置**（本页用 `_tolMm/_tolPct`，拍照量尺页已接 `MeasureThresholdStore`） | `:158-159` vs `measure_threshold_store.dart` | 同一报告内两种判定口径 | 统一到项目级门槛 |\n| D9 | 🟠 中 | **统计死参数**：`_calcStats` 的 `filtered` 完全未使用 | `capture_records_page.dart:274-277` | 「待整改」与当前筛选无关，易被误读 | 明确口径或启用 |\n| D10 | 🟠 中 | **Web 端照片不落盘**（内存 Map，刷新即丢） | `capture_page.dart:870-874`、`app_storage_web.dart:26-27` | Web 演示会话刷新后记录与照片全丢 | 已在 FEATURE_INVENTORY 记为 Web 特性；如需持久需改存储 |\n| D11 | 🟡 低 | **注释与实现不一致**：`models.dart:456-458` 称 `sourceCaptureId` 填 `\"${captureId}#${idx}\"`，实际填 `captureId` | `controller:317` | 误导 | 修注释 |\n| D12 | 🟡 低 | **`sourceCaptureId` 只写不读**：无「问题清单 → 验收记录」反向同步 | `controller:317`；全库无读取 | 注释所称「双向」名不副实 | 要么补反向读，要么改注释 |\n| D13 | 🟡 低\u003cbr\u003e（部分已修） | 转入生成的 Defect 曾写死 `reporter='验收记录'`、`gps/alt/resp` 全空、`tags` 含历史文案「验收转工单」 | `buildDefectFromCaptureDefect` | **已修**：`reporter` 改用 entry 的真实拍摄人（旧数据回落 `验收记录`）、`gps/alt` 由 entry 透传。**未修**：`resp` 仍为空、`tags` 仍含历史文案 | 剩余项待处理 |\n| D14 | 🟡 低 | AI 严重程度统一默认 `orange`（模型未返回） | `:805-806` | 报告严重度分布失真 | 后端补返回后映射 |\n| D15 | 🟡 低 | Web 默认走 mock（`_useMock = kIsWeb`），结果为 `vlPreset` 预置数据 | `:147-149, 796` | Web 端识别结果非真实 | 演示特性，需在验收标准写明 |\n| D16 | 🟡 低 | 水印「项目」字段取**定位点名称** `_location.name`，非项目名 | `:693` | 水印信息语义待确认 | 确认是否有意 |\n| D17 | 🟡 低 | 类头注释称「真实相机已注释、走模拟拍照」，与实现（真机相机）不符 | 注释 `:46-48` vs `:532-552` | 误导（曾被当作未完成项） | 修注释 |\n| D18 | 🟡 低 | 控制器内注释与缩进异常：顶层私有函数被写成「内部使用：Notifier 私有」 | `controller:264-265` | 可读性 | 整理 |\n\n---\n\n## 8. 有意设计（**不要当 bug 盲改**）\n\n以下行为是**注释明确写下的设计决策**，改之前必须先确认产品意图：\n\n1. **一次拍照聚合为一条 Defect** —— VL 常对同一张照片返回多条观察，但「现场一次观察即一次整改」，拆多条会在报告/列表重复（`capture_page.dart:889-892`）。\n2. **没有识别结果也入问题清单** —— 保证拍照留痕可追溯，「避免拍了看不到」（`:894`）。\n3. **照片落盘失败也入列表** —— 照片缺失只影响报告配图，记录必须同步（`:895-896`）。\n4. **水印必须在 UI isolate** —— 已知阻塞 300~800ms，为将来 isolate 化保留了 UI 分支（`:105-110, 3134-3135`）。\n5. **不再自动触发 AI** —— 由用户手动点「AI 分析」（`:757`）。\n6. **保存按钮首次误触不锁定** —— 未拍照时可补拍后再存（`:988`）。\n7. **`tags` 保留「验收转工单」文案** —— 历史数据标识，改名会造成新旧数据对不上（`controller:273-274`）。\n8. **删除先写文档后删照片** —— 保证数据完整性优先（`controller:99-105`）。\n\n---\n\n## 9. 溯源索引\n\n| 文件 | 职责 |\n|---|---|\n| `lib/features/capture/capture_page.dart` | 主页面：选图纸/选点/拍照/水印/AI/量尺校对/描述/保存/拍照记录弹窗 |\n| `lib/features/capture/capture_entry_page.dart` | 验收入口说明页（**孤儿**，见 D4） |\n| `lib/features/capture_records/capture_records_page.dart` | 验收记录工作台：统计/筛选/分组/详情/转入 |\n| `lib/features/capture_records/capture_records_controller.dart` | 数据源、删除、`converted` 回写、`buildDefectFromCaptureDefect` |\n| `lib/features/capture_records/widgets/*.dart` | `stats_strip` / `filter_tabs` / `filter_sheet` / `grouped_grid` / `thumbnail_card` |\n| `lib/data/models.dart` | `Defect`（`:407-718`）、`VlDefect`/`VisionResult`（`vision_service.dart:8-79`）、`CaptureArgs`、`SiteLocation` |\n| `lib/data/vision_service.dart` | `recognizeDefects`（`:107`）、host 配置（`:84-87`） |\n| `lib/core/utils/photo_watermark.dart` | 水印烧录与哈希 |\n| `lib/core/utils/image_compress.dart` | 压缩（isolate） |\n| `lib/core/utils/camera_pick.dart` | `pickPhotoRobust`（权限引导 + 相册兜底） |\n| `lib/core/storage/local_storage.dart` | KV / Doc / File 抽象（IO 与 Web 分流） |\n| `lib/data/repository/mock_repository.dart` | `addDefect` 落 `added_defects_v1`（`:118-122`） |\n| `lib/features/defects/report_builder.dart` 等四端 | 报告渲染，只读 `Defect.photoPath` |\n\n---\n\n## 10. 变更记录\n\n| 日期 | 变更 |\n|---|---|\n| 2026-09-18 | 首版：从代码逐文件核实建立（基线 `5361996` + 未提交改动）；输出 18 条偏离、8 条有意设计 |\n"},{"id":"docs/specs/DEFECTS_FLOW.md","path":"docs/specs/DEFECTS_FLOW.md","url":"ZG9jcy9zcGVjcy9ERUZFQ1RTX0ZMT1cubWQ=","base":"DEFECTS_FLOW.md","title":"问题清单 · 功能流程规格（DEFECTS FLOW SPEC）","group":"流程规格","scope":"spec","date":"2026-09-18","mtime":"2026-09-18","size":32073,"chars":19715,"lines":401,"nhead":24,"lead":"用途：问题清单是缺陷闭环的唯一工作台（拍照验收的下游、报告导出的上游）。 本文固化它的流程、数据契约、状态机与已知偏离，供后续开发溯源与矫正偏离。 维护规则：只改与代码不符的行；每处引用行号必须能在源码复核。 代码基线：commit 5361996 + 未提交工作区改动｜核实日期：2026-09-18","text":"# 问题清单 · 功能流程规格（DEFECTS FLOW SPEC）\n\n\u003e **用途**：问题清单是缺陷闭环的**唯一工作台**（拍照验收的下游、报告导出的上游）。\n\u003e 本文固化它的流程、数据契约、状态机与已知偏离，供后续开发**溯源**与**矫正偏离**。\n\u003e **维护规则**：只改与代码不符的行；每处引用行号必须能在源码复核。\n\u003e **代码基线**：commit `5361996` + 未提交工作区改动｜**核实日期**：2026-09-18\n\u003e **关联文档**：`FEATURE_INVENTORY.md`（M4 问题清单 / M5 报告）、`docs/specs/CAPTURE_FLOW.md`（上游）\n\u003e **本文不含**：报告四端渲染细节（属 M5，另出规格）\n\n---\n\n## 0. 一句话定义\n\n**问题清单 = 缺陷从「产生」到「闭合」的全生命周期工作台**：\n状态分段浏览 → 打开详情 → 设计师处置 / 施工方回复 → 销项 → 导出报告。\n\n它是**三条写入路径的汇聚点**：拍照验收保存（1 条聚合）、验收转入（N 条）、图纸打点（1 条）。\n\n---\n\n## 1. 范围与角色\n\n**在范围内**：清单页（状态分段/操作卡/缺陷卡）、处置与回复二级页、记录详情页（设计师处置 / 整改回复 / 销项）、时间轴对比、导出入口与其归档副作用、缺陷状态机与数据契约。\n\n**不在范围内**：报告四端渲染（M5）、拍照验收与验收记录（见 `CAPTURE_FLOW.md`）、巡场记录（M6）。\n\n| 角色 | 在本流程中的动作 |\n|---|---|\n| 设计管理/设计院 | 看清单 → 打开详情 → 「设计师处置」三选一（远程已解决 / 远程已答复 / 需要到现场） |\n| 施工方 | 看清单 → 打开详情 → 填「整改回复」→ 仅保存待复核 或 提交并销项 |\n| 验收人 | 上游产出缺陷（本文只写入口，见 `CAPTURE_FLOW.md`） |\n| 复核人 | 用状态分段盯「待整改 / 整改中」，用导出报告对外交付 |\n\n\u003e ⚠️ **角色是\"扮演式\"的**：右上角「切换身份」只切换展示用的当前用户（`currentUserIdProvider`），**不影响任何权限与数据可见性**。\n\n---\n\n## 2. 页面与路由地图\n\n| 路由 | 页面 | 说明 |\n|---|---|---|\n| `/defects` | `DefectsPage` | 清单主页（底部导航「问题」tab） |\n| `/defects/disposal/:kind` | `DisposalReplyPage(kind)` | `kind ∈ {designer, reply}`；待设计师处置 / 待施工方回复 |\n| `/defects/record/:id` | `RecordDetailPage(defectId)` | 记录详情（处置 + 回复 + 销项） |\n| `/timeline` | `TimelineComparePage(anchor)` | 同部位多时点照片对比；`extra` 传部位字符串 |\n\n依据：`lib/app.dart:134-149, 218-228`\n\n### ⚠️ 入口重复与死链\n\n- 清单主页有 **3 个入口**：底部导航「问题」tab、首页「今日待办 → 查看全部」、验收记录「转入」后的 Snack 动作；首页快捷操作里的「问题清单」卡**已删除**（见 FEATURE_INVENTORY §4-10）。\n- **`defectSpecialFilterProvider`（`providers.dart:331`）定义后从未被任何页面使用** → 死 provider；处置与回复页用的是自己的本地 `_kind` 状态（`defects_page.dart:998-1003`）。\n\n---\n\n## 3. 状态机\n\n`DefectStatus { draft, doing, done, reject }` → 文案「待整改 / 整改中 / 已销项 / 已拒绝」（`models.dart:8-22`）\n\n| 状态 | 文案 | 颜色（规范） | **有写入路径吗** |\n|---|---|---|---|\n| `draft` | 待整改 | 橙 `#FF9500` | ✅ 三条产生路径全部写 draft |\n| `doing` | 整改中 | 蓝 `#0395FF` | ❌ **无任何代码写入**（仅 mock 种子有） |\n| `done` | 已销项 | 绿 `#34C759` | ✅ 详情页两处写 done |\n| `reject` | 已拒绝 | 红 `#FF3B30` | ❌ **无任何代码写入**（仅 mock 种子有） |\n\n**结论：`doing` / `reject` 是\"只能看、不能产生\"的状态**。它们出现在状态分段（`defects_page.dart:1151, 1153`）、首页待办口径（`home_page.dart:976`：draft **或 doing** 都算待办）、报告未闭合统计（`report_content.dart:308`、`report_builder.dart:213`：draft **或 doing** 计为未闭合）与图例中，但 UI 没有任何入口能把缺陷推进到这两个状态。\n→ 影响：报告「整改中」统计永远来自种子数据；用户无法表达\"已开始整改\"或\"拒绝整改\"。见 §7-D1。\n\n**唯一的两处 status 写入**（都在记录详情页）：\n1. 底部「提交并销项」→ `done` + `completion='已完成（整改销项）'`（`record_detail_page.dart:146-147`）\n2. 设计师「远程已解决」→ `done` + `completion='已完成（设计师远程销项）'`（`record_detail_page.dart:595-596`）\n\n---\n\n## 4. 主流程\n\n### 4.1 三条产生路径（写入 `Defect`）\n\n| 路径 | 触发 | 产出 | 关键字段 | 证据 |\n|---|---|---|---|---|\n| A 拍照验收保存 | 验收页「保存记录」 | **1 条聚合缺陷** | `seed:'capture'`、带 `photoPath`、`tags:['拍照记录',…]` | `capture_page.dart:929-953` |\n| B 验收转入 | 验收记录「转入问题清单」 | **N 条**（逐条） | `seed:'capture_convert'`、`id:'\u003ccaptureId\u003e#\u003cidx\u003e'`、**无 photoPath** | `capture_records_controller.dart:296-318` |\n| C 图纸打点 | 图纸页长按/点选创建 | 1 条 | `status: draft` | `drawing_viewer_page.dart:858` |\n\n\u003e 路径 A 与 B 的关系问题（同一次拍照留 1+N 条）见 `CAPTURE_FLOW.md` §7-D2。\n\n### 4.2 闭环时序\n\n```\n产生(draft)\n   │\n   ├─ 设计师 → /defects/record/:id →「远程已解决」+必填说明 ────→ done（\"设计师远程销项\"）\n   ├─ 设计师 → 「远程已答复」(+选填说明) ────────────────────→ status 不变，只写 designer*\n   ├─ 设计师 → 「需要到现场」(+选填说明) ────────────────────→ status 不变，只写 designer*\n   │\n   └─ 施工方 → /defects/record/:id →「填写回复」────────────────→ 只写 reply*\n                   ├─「仅保存，待复核」────────────────────────→ status 不变\n                   └─「提交并销项」───────────────────────────→ done（\"整改销项\"）\n   │\n导出报告（清单页右上角）→ 生成四格式 → 归档 ReportRecord\n```\n\n**注意：没有任何\"撤销 / 重处置 / 删除缺陷\"的入口。** 处置后 `_DesignerCard` 只读、按钮区隐藏（`record_detail_page.dart:615-729`）。\n\n---\n\n## 5. 分步功能规格\n\n### S1 清单主页 `/defects`（`defects_page.dart`，1917 行）\n\n**骨架**：AppBar（标题「问题清单」24/w600；右侧导出图标 + `UserSwitcher`，间距 16、右边距 12）→ `AsyncState(defectsProvider)` → `ListView.separated`（padding 12、间距 12）。\n\n列表采用**索引契约**（`:87-111`）：\n- `headerCount = 2`（状态分段 + 操作卡）\n- 空：`[状态分段, 操作卡, 空态, OfflineBar]`\n- 非空：`[状态分段, 操作卡, ...缺陷卡, OfflineBar]`\n- 过滤在 build 内完成：`ds.where((d) =\u003e filter == null || d.status == filter)`（`:85-86`）\n\n**状态分段**（`_StatusSegmented`，`:1145-1187`）：\n\n| 段 | 过滤 |\n|---|---|\n| 全部（`null`） | 不筛 |\n| 待整改（`draft`） | `d.status == draft` |\n| 整改中（`doing`） | `d.status == doing`（**无数据源，见 §3**） |\n| 已销项（`done`） | `d.status == done` |\n| 已拒绝（`reject`） | `d.status == reject`（**无数据源，见 §3**） |\n\n- 交互：点选切换；**再点已选项回到「全部」**（`:1160`）。\n- **无搜索框、无时间筛选、无排序控件**；列表顺序 = `defectsProvider` 返回顺序（页面不做排序）。\n\n**操作卡**（`_ActionCard`，`:1261-1454`）：\n- 身份区：头像 + 姓名 + 角色标签（`role` 为空时**兜底写死「设计管理」**，`:1282`）；角色配色：含\"业主\"红 / 含\"咨询|PMO\"绿 / 其它蓝。\n- 「切换身份」按钮 → `showUserSwitchSheet`（`:1421`）。\n- 两个行动按钮（`:1323, 1329`，横向，窄屏 `\u003c340` 转纵向）：\n  - 「待设计师处置」→ `/defects/disposal/designer`\n  - 「待施工方回复」→ `/defects/disposal/reply`\n- **切换身份只影响**：本卡头像/姓名/角色、导出报告的 `reporter`、归档的 `reporter`；**不影响列表数据**。\n\n**缺陷卡**（`_DefectCard`，`:1523-1862`，整卡点击 → `/defects/record/:id`）：\n- 标题行：`part` + `StatusPill(status)`\n- 字段区（6 行，名称列 56 宽）：\n\n| 标签 | 取值 |\n|---|---|\n| 问题缺陷 | `d.type` |\n| 严重程度 | `d.severity.label`（带色，见 §7-D2） |\n| 缺陷位置 | `d.anchor` |\n| 记录人 | `d.reporter` |\n| 发现时间 | `d.ts` |\n| 责任人 | `d.resp` |\n\n- 展示块（4 个中实际存在 3 个）：\n  1. **备注块**：**无条件渲染** `d.note`（`:1630-1642`）\n  2. **设计师处置块**：`designerAction != null` 时显示（处置标签 + 说明 + 处置人 + 时间）\n  3. **整改回复块**：`(reply ?? '').isNotEmpty` 时显示（回复人 + 正文 + 时间，绿底）\n  4. **AI 建议块：不存在** —— `Defect.suggestion` 在卡片与详情页**均未渲染**（只在报告里用）\n- **卡片无照片缩略图**（纯文本）。\n- `StatusPill`：52×22 圆角 6，底色见 §7-D2。\n\n**所有提示文案**：`暂无可导出的缺陷记录`(muted)、`暂无可导出的数据`(muted×2)、`当前平台暂不支持导出，请在 Web 端使用该功能`(muted)、`所选周期内暂无缺陷记录，请调整汇报周期`(muted)、`报告已导出：…（已收录到巡场报告）`(success)、`导出失败：$e`(danger)。\n**空态**：`暂无问题`。\n\n### S2 处置与回复页 `/defects/disposal/:kind`（`DisposalReplyPage`，`:989-1067`）\n\n- 仅 2 个 kind：`designer`（默认）/ `reply`。\n- 匹配口径（`:1006-1007`）：\n  - `designer` → `d.pendingDesignerDisposal`，即 `designerAction == null \u0026\u0026 status != done`（`models.dart:641-642`）\n  - `reply` → `(d.reply ?? '').isEmpty`\n- 结构：AppBar（返回 + 居中标题「处置与回复」）→ 本地二段分段控件 → 列表（**复用同一个 `_DefectCard`**）→ 空态 `暂无待设计师处置的问题` / `暂无待施工方回复的问题`。\n- **本页无任何写操作按钮**，唯一交互是点卡片进详情页。\n\n### S3 记录详情页 `/defects/record/:id`（`record_detail_page.dart`，1262 行）\n\n\u003e 文件头注释自陈：`/// 记录详情页（静态版）。数据来源：当前巡场清单 mock（按 defectId 取）。待 P3 接真实后端后改为 record 资源。`（`:14-16`）\n\n**数据**：`ref.watch(defectsProvider)` → 按 `id` 线性查找（`:55`）；查不到 → 居中灰字 **`未找到该记录`**（`:56-63`）。\n\n分区（自上而下）：\n\n| # | 卡片 | 内容 | 显隐 |\n|---|---|---|---|\n| ① | 水印照片卡 `_WatermarkPhoto`（`:384-484`） | **渐变占位块**（色相由 `d.seed` 派生）+ 中央斜向大字水印 + 底部 3 行（时间/GPS·海拔/楼层·部位）+ 右上校验胶囊 | 常显 |\n| ② | 缺陷信息卡 `_InfoCard`（`:201-294`） | `part` + StatusPill + 红框 `type · anchor` + 严重程度 + 责任人 | 常显 |\n| ③ | 时间轴入口 `_TimelineCard`（`:297-325`） | 「查看同部位时间轴对比」→ `/timeline`，`extra = d.anchor` | 常显 |\n| ④ | 参数卡 `_ParamsCard`（`:329-349`） | 拍摄时间 / 海拔 / GPS坐标 / 楼层部位 | 常显 |\n| ⑤ | 设计师处置卡 `_DesignerCard`（`:532-781`） | 未处置：3 个按钮；已处置：只读结果 | 依 `designerAction` 分叉 |\n| ⑥ | 整改回复卡 `_ReplyCard`（`:972-1120`） | 空：「填写回复」按钮；非空：正文+回复人+时间 | 依 `reply` 是否为空 |\n| ⑦ | 底部操作栏 `_RecordActionBar`（`:1217-1258`） | 「仅保存，待复核」+「提交并销项」 | 常显 |\n\n**① 水印照片卡（重要）**：\n- **完全不读取 `d.photoPath` / `d.photos`**，永远是渐变占位（注释 `:398` `// 渐变背景（占位真实照片）`；`:382-383` 说明\"真实场景应渲染真实照片 + 服务端水印\"）。\n- **校验胶囊不是校验**：`verified = d.status != DefectStatus.draft`（`:390`）→ 显示「已效验」/「待回网校验」；**未使用 `photoHash` / `watermarkSerial`，无任何哈希比对**。→ §7-D3（触及产品红线\"不伪造验证结果\"）\n\n**⑤ 设计师处置三动作**（`_actionMeta`，`:543-574`）：\n\n| action | 按钮 | 说明必填 | 写入 |\n|---|---|---|---|\n| `remoteFix` | 远程已解决（绿） | **必填** | `designerAction/designerNote/designerBy/designerTs` + **`status=done`** + `completion='已完成（设计师远程销项）'` |\n| `remoteConfirm` | 远程已答复（红） | 选填 | 同上四项，**不改 status** |\n| `onsite`（默认分支） | 需要到现场（橙） | 选填 | 同上四项，**不改 status** |\n\n- 弹窗（`_DesignerActionSheet`）：必填未填 → `请先填写处置说明`（muted，`:914`）；确认按钮 `确认提交`。\n- **无二次确认**；**处置后无法撤销或重新处置**。\n\n**⑥ 整改回复**（`_editReply`，`:111-133`）：\n- 表单**只有\"回复内容\"一个字段**（`maxLines:4`）：**没有回复照片上传入口**、**没有回复人输入**（自动取当前用户名）。\n- 写入：`reply` / `replyBy` / `replyTs`；**不改 status、不写 completion**。\n- 校验：空 → `请先填写整改回复内容`（muted）。\n- 模型有 `replyPhotoPath`（`models.dart:480`），本页**从不写**。\n\n**⑦ 底部操作栏**：\n\n| 按钮 | 前置校验 | 写入 | 成功后 |\n|---|---|---|---|\n| 仅保存，待复核 | 回复非空（`:136-140`） | `reply/replyBy/replyTs`；**status 不变** | `updateDefect` → `invalidate(defectsProvider)` → Toast `已保存更新`(success)；**不 pop** |\n| 提交并销项 | 同上 | 上述 + **`status=done`** + `completion='已完成（整改销项）'` | 同上；**不 pop** |\n\n- 「待复核」**只是按钮文案，代码层没有任何对应状态位**（不写任何字段）。\n- `_busy` 期间按钮与回复入口全禁用；**`updateDefect` 无 try/catch**，失败无提示、无回滚（`:68`）。\n- **本页从不写 `closeNote`**（模型 `models.dart:483` 存在）。\n\n**详情页不展示的模型字段**：`note`（备注）、`category`、`tags`、`suggestion`、`photos`、`closeNote`、`photoHash`、`watermarkSerial`、`importance`、`building`、`reporter`、CAD 坐标。\n→ 其中 **`note` 在清单卡显示、在详情页不显示**，信息不一致（§7-D7）。\n\n### S4 时间轴对比 `/timeline`（`timeline_compare_page.dart`，809+ 行）\n\n- 入口：详情页 `_TimelineCard`，`extra = d.anchor`；页面默认 anchor 写死 `'西楼1F-左病房翼'`（`:26`）。\n- 数据：`repositoryProvider.getTimeline(anchor)`（`:42`），dev 走 Mock。\n- 交互：缩略图选择左/右两张（默认自动选首、末）→ 滑块对比（上层左图按 `_slider` 裁切，`_LeftPhotoClipper :727-740`）+ 「交换照片」→ 底部两块时点摘要（date + caption）。\n- 时点标签：`before→前期` / `mid→中期` / `after→后期`（`:434-439`），由数据层按索引重标。\n- **照片是真图**（`Image.asset` 或读本地文件 `Image.memory`，`:566-609`），**不是 CustomPainter 占位**（文件头注释 `:15` 已过时；`FEATURE_INVENTORY.md` 原有描述同步订正）。\n\n### S5 导出报告（入口在清单页，详规属 M5）\n\n**入口**：AppBar 右侧 `fileExportLine` → `_export`（`:119-162`）。\n**数据源（关键）**：`defectsProvider` **全集**，**不受状态分段过滤影响**（对比 body 内 `:85-86` 的 `list`）；仅在弹层内按日期范围二次过滤（`_filterByPeriod`，`:199-211`，取 `ts` 前 10 位比较，**解析失败的记录一律纳入**）。\n\n**弹层**（`_showExportSheet`，`:218-376`）：标题「导出现场工作汇报」→ 描述段 → 日期范围卡（`firstDate` 写死 `2024-01-01`）→ 过滤提示「已按周期过滤：全部 N 条中筛出 M 条」→ 导出小结（选填，手填，`:534-575`）→ 4 个格式卡（Excel/PDF/Word/网页链接）→「下载 HTML 报告」→ 平台降级文案。\n\n**`_runExport`**（`:733-797`）：\n1. 平台门控 → 2. 空数据拦截 → 3. `weeklyReportProvider.copyWithDefects(filtered, patrolSummary, roomScans, checks)` → 4. 收集照片字节（`report.photos[].file` 走 `rootBundle`；`report.defects[].photoPath` 走 LocalStorage）→ 5. 生成（xlsx/pdf/docx/html）→ 6. `exportReportFile` → 7. `_archiveReport` → 8. Snack「报告已导出：…（已收录到巡场报告）」/「报告已保存：…（已收录到巡场报告）」。\n\n**归档**（`_archiveReport`，`:804-844`）：`ReportRecordStore.upsert(projectId, ReportRecord{ id:'rep_$now', …, formats:[格式], defectCount/openCount/doneCount/urgentCount, note: patrolSummary })` → `refreshReportRecords`。\n- 存储键 `report_records_v1_\u003cprojectId\u003e`；`upsert` 按 **`title + period`** 合并，同次汇报多格式只留一张卡并合并 `formats`。\n- **只存元数据，正文不入库**；归档整体 `try/catch` 静默（注释：失败不阻断导出）。\n\n---\n\n## 6. 数据契约\n\n### 6.1 `Defect` 字段（`models.dart:407-719`）\n\n| 字段 | 类型 | 含义 | 谁写 |\n|---|---|---|---|\n| `id` | String | 唯一 id（`cap_\u003cts\u003e` / `\u003ccaptureId\u003e#\u003cidx\u003e` / 种子 id） | 各产生路径 |\n| `part` | String | 部位（卡片标题） | 产生路径 |\n| `type` | String | 缺陷类型（卡片「问题缺陷」） | 产生路径 |\n| `category` | DefectCategory | 专业分类 7 类 | **恒 `other`**（两条产生路径都写死） |\n| `severity` | DefectSeverity | 严重程度 | 产生路径 |\n| `status` | DefectStatus | 状态 | 见 §3 |\n| `anchor` | String | 图纸锚点 | 产生路径 |\n| `floor` | String | 楼层 | 产生路径 |\n| `ts` | String | 发现时间 | 产生路径 |\n| `gps` / `alt` | String | GPS / 海拔 | 仅路径 A 写（路径 B/C 空） |\n| `resp` | String | 责任人 | 路径 A 写 `待指派` |\n| `respUnit` | String? | 责任单位 | **无写入路径** |\n| `reporter` | String | 记录人 | 路径 A=当前用户；路径 B 写死 `验收记录` |\n| `tags` | List | 标签 | 路径 A `['拍照记录',…]`；路径 B `['验收转工单',…]` |\n| `note` | String | 备注（清单卡显示） | 产生路径 |\n| `seed` | String | 来源标记 | `capture` / `capture_convert` |\n| `drawingKey` / `worldX` / `worldY` | — | 图纸回溯坐标 | 产生路径 |\n| `photoPath` | String? | **报告现场照片唯一来源** | 仅路径 A 写（路径 B 未写 → CAPTURE D1） |\n| `photos` | List | 照片列表 | 路径 B 写，**无消费方** |\n| `photoHash` / `watermarkSerial` | String? | 防篡改凭证 | **无写入路径**（水印 burned 进图片，字段未落） |\n| `importance` | DefectImportance? | 重要等级 | **无写入路径**（靠 `effectiveImportance` 推导） |\n| `building` | String? | 楼栋分组 | **无写入路径** |\n| `suggestion` | String? | AI 整改建议 | 路径 A 写；**清单/详情页都不显示，仅报告用** |\n| `sourceCaptureId` | String? | 来源验收记录 id | 路径 B 写，**无读取方**（CAPTURE D12） |\n| `reply` / `replyBy` / `replyTs` | — | 整改回复 | 详情页 `_editReply` / 底部栏 |\n| `replyPhotoPath` | String? | 回复照片 | **无写入路径**（详情页无上传入口） |\n| `closeNote` | String? | 未闭合说明 | **无写入路径** |\n| `completion` | String? | 完成说明 | 两处销项写死文案 |\n| `designerAction` / `designerNote` / `designerBy` / `designerTs` | — | 设计师处置四件套 | 详情页 `_DesignerCard` |\n\n**几乎一半字段没有写入路径**——这是\"模型先行、功能未跟上\"的典型痕迹。\n\n### 6.2 枚举与派生 getter（跨页/报告共用口径）\n\n| 名称 | 行号 | 口径 |\n|---|---|---|\n| `DefectStatus.label/color/soft` | `models.dart:11-48` | 待整改/整改中/已销项/已拒绝 |\n| `DefectCategory.label` | `:63-80` | 建筑/结构/装饰/给排水/暖通/电气/其他 |\n| `DefectImportance.label` | `:99-110` | 重要紧急/重要不紧急/紧急不重要/普通 |\n| `DefectSeverity.label/action` | `:117-…` | 严重/较重/一般/轻微 → 停工上报/限期整改/即查即改/常规观察 |\n| `effectiveImportance` | `:628-635` | 显式重要性优先，否则由 severity 推导（红→重要紧急、橙→重要不紧急、黄→紧急不重要、绿→普通）。**报告排序与统计的基准** |\n| `closed` | `:638` | `status == done` |\n| `pendingDesignerDisposal` | `:641-642` | `designerAction == null \u0026\u0026 status != done`（处置页 `designer` 筛选口径） |\n| `designerActionLabel` | `:645-650` | remoteFix→远程已解决；remoteConfirm→远程已答复；onsite→需到场；其它空串 |\n| `buildingOrEmpty` | `:709` | 空则报告端归「其他」 |\n| `hasCadCoord` / `coordText` | `:712-718` | 三项坐标齐备才输出 `X=… Y=…`（1 位小数） |\n\n\u003e `copyWith`（`:653-706`）**只支持** `status/resp/building/reply*/closeNote/completion/suggestion/designer*` 的局部更新——即处置与回复链路；其余字段不可改。\n\n### 6.3 存储与合并算法（`mock_repository.dart`）\n\n- 落库键：`added_defects_v1`（`:22`）；内存 `_added: List\u003c(Defect, bool is7)\u003e`（`:19`）。\n- 持久化结构：`[{is7: bool, defect: {...}}]`（`:45-56`）。\n- **合并去重**（`getDefects`，`:82-97`）：\n  ```\n  byId = {每个种子: defect}\n  再遍历 _added 中 is7 匹配当前项目的 → byId[id] = 该条   // 新增/更新覆盖种子\n  顺序 = 种子顺序 + 新增追加（无显式排序）\n  ```\n- **项目隔离**：靠 `is7` 布尔标记（非 projectId）。`defectsProvider`（`providers.dart:302-308`）通过副作用 `repo.currentIs7 = is7` 把当前项目灌进 mock。\n- `updateDefect`（`:124-134`）：**只在 `_added` 里按 id 查**（不查种子）→ 种子缺陷的**首次更新会被当作新增追加**；`is7` 取的是**更新时刻**的项目标记。\n- `_restoreAdded` / `_persistAdded` 异常**静默吞掉**（`:40-42, 53-55`）。\n- 假延迟 350ms（`:58-59`）。\n\n### 6.4 上游接口\n\n| 方法 | 签名 | 实现状态 |\n|---|---|---|\n| `getDefects({DefectStatus? status})` | `repository.dart:12` | Mock ✅ / Remote ❌ `UnimplementedError` |\n| `addDefect(Defect)` | `:14` | Mock ✅ / Remote ❌ |\n| `updateDefect(Defect)` | `:17` | Mock ✅ / Remote ❌ |\n| `getTimeline(String anchor)` | `:18` | Mock ✅ / Remote ❌ |\n\n`Repository` 抽象见 `repository.dart:5-24`；`repositoryProvider = Env.isProd ? RemoteRepository() : MockRepository()`（`providers.dart:26-28`）。\n\n---\n\n## 7. 偏离清单（按严重度）\n\n| # | 严重度 | 问题 | 证据 | 影响 | 建议 |\n|---|---|---|---|---|---|\n| D1 | 🔴 高 | **`doing` / `reject` 两个状态无任何写入路径**，只能来自 mock 种子 | 全库写入点仅 `capture_page.dart:937`、`capture_records_controller.dart:302`、`drawing_viewer_page.dart:858` 全为 `draft`；`record_detail_page.dart:146-147, 595-596` 写 `done`；`DefectStatus.doing/reject` 仅出现在 `mock_data.dart:584,608,1044,1112,1135` | 用户无法表达\"已开始整改\"或\"拒绝整改\"；报告「整改中」统计永远是种子数据 | 明确产品语义：是否需要\"开始整改/拒绝\"动作 |\n| D2 | 🔴 高 | **`Color(0xFF4444)` 缺两位十六进制**（应为 `0xFFFF4444`），该值 alpha=0x00 → **完全透明** | `defects_page.dart:1544`（严重程度文字色）与 `:1885`（「待整改」胶囊底色） | 「严重」严重程度值**看不见**；「待整改」胶囊变透明底 + 白字 → 视觉上消失 | 改 `0xFFFF4444` |\n| D3 | 🔴 高 | **\"已效验\"胶囊是状态推导，不是校验**：`verified = status != draft`，未用 `photoHash`/`watermarkSerial`、无哈希比对 | `record_detail_page.dart:390, 436-447` | 显示「已效验」但系统实际未校验任何东西 —— **触及红线\"不伪造验证结果\"** | 接真实哈希比对，或改文案为\"已提交/未提交\" |\n| D4 | 🟠 中 | **水印照片卡永远是渐变占位**，不读 `d.photoPath`/`d.photos` | `record_detail_page.dart:384-484`（注释 `:382-383, 398`） | 详情页看不到现场照片（清单卡也无缩略图）；照片**只在报告里可见**（转入条的报告照片已于 2026-09-18 修复，见 `CAPTURE_DEFECT_MAPPING.md` §4） | 接真实照片 |\n| D5 | 🟠 中 | **详情页不显示备注 `note`**，但清单卡无条件显示 | 详情页未渲染 `note` vs `defects_page.dart:1630-1642` | 同一记录两处信息不一致（验收描述只在清单页可见） | 详情页补备注块 |\n| D6 | 🟠 中 | **回复照片入口缺失**：模型有 `replyPhotoPath`，详情页只有单字段文本框 | `record_detail_page.dart:1123-1214` vs `models.dart:480` | 报告「整改后照片」永远空 → `report_builder.dart:541-547` 显示占位 | 补照片上传 |\n| D7 | 🟠 中 | **`updateDefect` 只查 `_added` 不查种子**；`is7` 取更新时刻的标记 | `mock_repository.dart:124-134` | 种子缺陷首次更新被当新增追加；跨项目场景可能归属错项目 | 改为在全量集合中查找；用 projectId 而非布尔 |\n| D8 | 🟠 中 | **`updateDefect` 无错误处理**：无 try/catch、无失败提示、无回滚 | `record_detail_page.dart:68` | 写入失败时用户以为已保存 | 加 try/catch + 失败 Toast |\n| D9 | 🟠 中 | **导出报告不受状态分段影响**（用全集而非当前筛选） | `defects_page.dart:121-124` vs `:85-86` | 用户选了「已销项」再导出，仍导出全部；易误判 | 明确是否应跟随筛选 |\n| D10 | 🟠 中 | **处置与回复页无写操作**，只是\"筛选后的清单\"，所有操作都要再进详情页 | `defects_page.dart:989-1067` | 与「待设计师处置/待施工方回复」的按钮语义不符，多一次跳转 | 或在页内直接处置 |\n| D11 | 🟡 低 | **`closeNote` 有模型无写入**：无\"未闭合说明\"入口 | `models.dart:483` | 「已销项」缺说明；报告无未闭合原因 | 需要则补入口 |\n| D12 | 🟡 低 | **`sourceCaptureId` 只写不读**；`photos` 无消费方；`photoHash`/`watermarkSerial`/`importance`/`building`/`respUnit`/`replyPhotoPath` 均无写入路径 | 见 §6.1 | 模型与实现脱节，字段名存实亡 | 逐字段决定补实现或删 |\n| D13 | 🟡 低 | **`category` 恒为 `other`**：两条产生路径都写死 | `capture_page.dart:935`、`capture_records_controller.dart:300` | 专业分类筛选/统计无法成立（报告也不按 category 分组） | 接 AI 分类或人工选择 |\n| D14 | 🟡 低 | **`defectSpecialFilterProvider` 定义后无人使用** | `providers.dart:331` | 死代码 | 删除或接线 |\n| D15 | 🟡 低 | **「待复核」无状态位**：只是按钮文案 | `record_detail_page.dart:1239` | \"待复核\"语义无处查询/统计 | 需状态位则补 |\n| D16 | 🟡 低 | 「切换身份」是扮演式开关，**不影响任何权限与数据可见性** | `user_switch_sheet.dart:27`；`defectsProvider` 与用户无关 | 与后端权限设计（`BACKEND_ARCHITECTURE` §6）冲突，需要时降级为管理员功能 | 已在后端方案中列为改造项 |\n| D17 | 🟡 低 | 详情页严重程度**恒用橙色**，未按 severity 变色 | `record_detail_page.dart:262-266`（`severity.color` 未用） | 与清单页不一致 | 统一 |\n| D18 | 🟡 低 | 角色为空时**兜底写死「设计管理」** | `defects_page.dart:1282` | 展示不实 | 兜底为「未设置」 |\n| D19 | 🟡 低 | `_StatusSegmented` 注释称选中色品牌蓝 `#0395FF`，实现为 `#202224` | `defects_page.dart:1143-1144` vs `:1216` | 注释误导 | 修注释 |\n| D20 | 🟡 低 | 时间轴默认 anchor 写死 `'西楼1F-左病房翼'`；mock 兜底也写死同一 anchor | `timeline_compare_page.dart:26`、`mock_repository.dart:205` | 无数据时展示无关部位 | 改为空态 |\n| D21 | 🟡 低 | 时间轴页头注释称\"照片：CustomPainter 模拟\"，实际是真图 | `timeline_compare_page.dart:15` vs `:566-609` | 误导（`FEATURE_INVENTORY` 已同步订正） | 修注释 |\n| D22 | 🟡 低 | 导出弹窗日期下界写死 `2024-01-01`；项目名兜底写死 `建筑验收项目` | `defects_page.dart:269, 135` | — | 按项目起始日期 |\n| D23 | 🟡 低 | `_filterByPeriod` 对**时间戳无法解析的记录一律纳入** | `defects_page.dart:207` | 脏数据进入报告 | 显式排除或提示 |\n\n---\n\n## 8. 有意设计（**不要当 bug 盲改**）\n\n1. **状态分段点选可反选**（再点回到「全部」）——省一个\"全部\"段的点击路径（`defects_page.dart:1160`）。\n2. **导出用全集而非当前筛选**——报告是\"对外交付\"，不应受浏览筛选影响（`:121-124`）。\n3. **归档按 `title + period` 合并**——同一次汇报导出多种格式只留一张卡并合并 `formats`（`report_record_store.dart:32-45`）。\n4. **归档失败不阻断导出**——报告正文已交付，元数据留痕可事后补（`defects_page.dart:799-802, 841-843`）。\n5. **照片缺失只影响配图**——报告端显示\"照片未加载\"占位，不阻断导出（`:173, 184`）。\n6. **`upsert` 只存元数据**——报告正文字节不入本地归档（`report_record.dart:3-5`）。\n7. **处置后卡片只读**——避免误改已提交的处置结论（`record_detail_page.dart:615-729`）。\n8. **详情页按 id 线性查找**——数据量小，简单优先（`:55`）。\n\n---\n\n## 9. 溯源索引\n\n| 文件 | 职责 |\n|---|---|\n| `lib/features/defects/defects_page.dart` | 清单主页 + 处置与回复页 + 导出弹窗/生成/归档（1917 行） |\n| `lib/features/defects/record_detail_page.dart` | 记录详情：水印占位卡 / 设计师处置 / 整改回复 / 销项（1262 行） |\n| `lib/features/defects/timeline_compare_page.dart` | 同部位多时点照片滑块对比 |\n| `lib/features/defects/report_content.dart` | 报告中间层：章节顺序、空板块剔除、`ReportStats` |\n| `lib/features/defects/report_builder.dart` / `report_pdf` / `report_docx` / `report_xlsx` | 四端渲染（M5 详规另写） |\n| `lib/core/utils/defect_suggestions.dart` | 本地建议库 **35 条**（**不映射 `DefectCategory`**）；`suggestionFor` 按 `_rules` 声明顺序做**子串包含**匹配，首个命中即返回，未命中给通用兜底（`:233-241`） |\n| `lib/core/di/providers.dart` | `defectsProvider`(`:302-308`)、`refreshDefects`(`:311-313`)、`defectFilterProvider`(`:316`)、`defectSpecialFilterProvider`(`:331`，死) |\n| `lib/data/repository/mock_repository.dart` | 合并去重(`:82-97`)、新增(`:117-122`)、更新(`:124-134`)、时间轴构造(`:137-206`)、`added_defects_v1` |\n| `lib/data/repository/remote_repository.dart` | prod 路径 **4 个方法全 `UnimplementedError`**（`:76-90`） |\n| `lib/data/models.dart` | `Defect`(`:407-719`)、四个枚举与扩展(`:8-135`)、派生 getter(`:628-718`) |\n| `lib/data/mock/mock_data.dart` | 种子 `defects`(`:530`)、`dy7Defects`(`:1015`)、`timeline`(仅 1 个 key，`:676-703`) |\n| `lib/core/storage/report_record_store.dart` | 报告归档 `report_records_v1_\u003cprojectId\u003e` |\n\n---\n\n## 10. 变更记录\n\n| 日期 | 变更 |\n|---|---|\n| 2026-09-18 | 首版：从代码逐文件核实建立（基线 `5361996` + 未提交改动）；输出 23 条偏离、8 条有意设计；订正 FEATURE_INVENTORY 中\"时间轴照片为 CustomPainter 占位\"的过时描述 |\n"},{"id":"docs/archive/ARCHIVE_2026-09-08.md","path":"docs/archive/ARCHIVE_2026-09-08.md","url":"ZG9jcy9hcmNoaXZlL0FSQ0hJVkVfMjAyNi0wOS0wOC5tZA==","base":"ARCHIVE_2026-09-08.md","title":"项目归档总结 — 2026-09-08","group":"归档 · 开发日志","scope":"archive","date":"2026-09-08","mtime":"2026-09-15","size":11644,"chars":6774,"lines":171,"nhead":19,"lead":"归档原因：即将切换登录账号，先把当前状态、在办事项、下一步动作固化下来。 新会话/换账号后：先读 SESSION_CONTEXT.md → 再读本文件 → 再看 TASK_DASHBOARD.md。","text":"# 项目归档总结 — 2026-09-08\n\n\u003e 归档原因：即将切换登录账号，先把当前状态、在办事项、下一步动作固化下来。\n\u003e 新会话/换账号后：**先读 `SESSION_CONTEXT.md` → 再读本文件 → 再看 `TASK_DASHBOARD.md`**。\n\n---\n\n## 一、项目速览\n\n| 项 | 内容 |\n|---|---|\n| 工程目录 | `F:\\建筑验收工具\\site-patrol` |\n| 产品名 | **蓝图落地**（设计院视角的现场数据闭环工具） |\n| 团队 | 深圳市建筑设计研究总院（SZAD）环境院 AI 中心 3 人小组 |\n| 技术栈 | Flutter（iOS/Android/Web）+ riverpod + go_router；Python 服务（ocf / cad_meta / measure）；浩辰云图 API（DWG→OCF）；qwen 视觉模型（远端） |\n| 远端仓库 | `https://github.com/linxinquan/site-patrol.git`（分支 `main`） |\n| 本机限制 | **Windows** → 不能编译 iOS；只能 `flutter analyze` + `flutter build web --release` |\n\n---\n\n## 二、代码库现状（2026-09-08 核实）\n\n### 已完成 ✅\n- **量尺 P0-1**：`PhotoCalib` 2D 标定（`models.dart` 已含 ax/ay/bx/by），旧数据兼容\n- **报告生成器全套**：`weekly_report.dart` + `report_content.dart` + HTML/PDF/DOCX/XLSX 四端渲染\n- **AI 整改建议**：`vision_service.dart`（qwen）+ 本地库 `defect_suggestions.dart`；建议进报告\n- **巡场建模 + 编辑器**：`PatrolPlan` / `PatrolRecord` / `PatrolPlanStore` / `patrol_editor_page`\n- **CAD/OCF**：10 张真实图纸已转 OCF，手机端可看管线\n- **缺陷整改回复字段**：reply / replyBy / replyTs / completion / closeNote\n- **AR 页面 + iOS 原生**：`ar_measure_page` + `ArMeasureView.swift`（LiDAR + sceneDepth）\n- **CAD 天正图纸**：本地转换失败与底图加载失败已修复（bf6083a）\n- **0902 需求差距实施**（`979a8b4`）：建议库 35 条 / 检查点打卡制（`CheckIn` + 达成率）/ DWG 自助上传（`cad_local.py` 浩辰本地零配额）/ 设计师远程处置（`designerAction` + 四端统计）/ 施工方回复 UI / 安卓 AR 调研文档\n\n- **AR 整修**（第2轮）：多点测量+批量保存（`_measurements` + `_saveAll` + 单条删除）、**删除假估算页**（`estMm=drw` 假结果已移除）、`onCameraDenied` 权限引导 + LiDAR 占位页、`camera_pick.dart`（`pickPhotoRobust` 权限预检/重试/相册兜底）、拍照选点图钉（`_buildPickPin`）+「已选点(x%, y%)」label\n- **量尺 P0-2 标记错位**：`measure_page.imageToDisplay`（BoxFit.contain 逆变换），图纸蓝点/照片橙点/红点三处标记已换算\n- **巡场数据进报告**（0902 任务5b）：`WeeklyReport.patrolSummary` 字段（默认 `''`，向后兼容）+ 导出弹窗「巡场小结（选填）」输入 + HTML/PDF/DOCX/XLSX 四端渲染\n\n- **量尺 P1/P2**：P1-1 手填图纸尺寸降级（`_drawingMmCtl`，未校准不再瘫痪）、P1-2 默认容差 ±15mm/2%、P1-3 照片参考线+跨度/实测标注（`_MeasureLinePainter`）、P1-4「清除标定」、P2-1 测试脚本改相对路径、P2-2 图纸未加载不存点（坐标系统一）、P2-3 状态化提示\n- **巡场墙线检测**：`core/cad/wall_lines.dart` + `utils/geo.dart`（线段相交→穿墙段），已接入巡场页与编辑器\n- **巡场 GPS 轨迹采集**：新增 `geolocator` 依赖 + Android/iOS 权限声明；轨迹写入 `PatrolRecord.track`（字段本就存在），里程 GPS 实测优先、无信号回退图纸估算\n\n### 未完成 ❌\n- `MEASURE_FIX_PLAN.md` 的 **P1-5**（云端同步默认 `:3000` 与 `measure_server.py` 默认 `8820` 不一致，需部署方确认是否反代，**未改**）\n- 量尺实测回归（竖线标定/标记对齐/1m·3m 精度/90 秒演示录像）——需真机与真实照片\n- ⚠️ **AR 修复需真机验证**：代码已合入，但 iOS 原生 `ArMeasureView.swift` 与 AR 页在 Windows 环境不可编译验证，需 iPhone Pro 实测\n\n### 冻结 ⏸\n- 网页协作链接 / 云同步（**后端 Express 目录不在本工程**，代码走远端 120.24.240.129:3000）\n- 安卓 AR（无 GMS 跑不了 ARCore → 安卓主路径 = 照片量尺）\n\n---\n\n## 三、最近提交（main）\n\n```\n4b075bd docs: 2026-09-08 项目归档总结（切换账号前固化现状与下一步计划）\n979a8b4 feat: 0902 需求差距实施(任务1/2/4/5/6) + DWG 本地零配额转换链路\na2c86d1 fix: 验收记录页图标 lucide→mingcute，修复 main 编译\n3b66bb9 docs: 建筑漫游视频制作手册（A/B 两版图生视频分镜+Prompt+素材清单）\n9351951 docs: 更正 git 推送代理说明（7897 实测可用）\n712a0b1 docs: 添加 2026-09-07 开发日志（建筑漫游视频方案 + 两项目造型联网核实）\nbf6083a fix(cad): 修复天正图纸本地转换失败与底图加载失败\n153037e refactor(ui) 构建通过（64.4s），待 iPhone 真机验证。\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-14.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-14.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTE0Lm1k","base":"DEVELOPMENT_LOG_2026-08-14.md","title":"工地验收 App · 开发上下文与今日工作记录","group":"归档 · 开发日志","scope":"archive","date":"2026-08-14","mtime":"2026-08-17","size":10617,"chars":7175,"lines":198,"nhead":15,"lead":"更新日期：2026-08-14（周五） 用途：换电脑交接用上下文文档。此前在公司电脑开发，现转至家里电脑继续。","text":"# 工地验收 App · 开发上下文与今日工作记录\n\n\u003e 更新日期：2026-08-14（周五）\n\u003e 用途：换电脑交接用上下文文档。此前在公司电脑开发，现转至家里电脑继续。\n\n---\n\n## 〇、项目功能结构（通读全项目梳理）\n\nFlutter App（`lib/`），Riverpod + GoRouter + Hive：\n\n```\nlib/\n├── app.dart              # 路由表（登录守卫 + ShellRoute 底部导航）\n├── main.dart             # Hive 初始化 + AuthBootstrap\n├── core/\n│   ├── theme/            # 主题、design_tokens.dart（色板/间距）\n│   ├── di/providers.dart # 全部 Provider（含 CAD 相关）\n│   ├── env/env.dart      # dev/prod 切换\n│   ├── storage/          # LocalStorage（Hive，图纸 seed）\n│   └── utils/            # image_compress、web_storage、cad_coord\n├── data/\n│   ├── models.dart       # 全部数据模型（含 CAD 模型）\n│   ├── vision_service.dart  # AI 视觉（调云端 120.24.240.129:3000）\n│   ├── cad_service.dart     # CAD 接入（调本地 8800）\n│   ├── mock/             # mock_data.dart（南科大项目数据）\n│   └── repository/       # Repository 模式（Mock/Remote）\n├── features/\n│   ├── auth/             # 登录（Hive 会话）\n│   ├── home/             # 首页：项目概览/快捷操作/今日待办\n│   ├── projects/         # 项目图纸列表 + 图纸查看器 + PDF蓝图\n│   ├── patrol/           # 巡场（轨迹动画状态机）\n│   ├── capture/          # 拍照验收（AI 识别）\n│   └── defects/          # 缺陷列表/详情/时间线对比\n└── shared/widgets/       # 通用组件（含 cad_info_panel）\n```\n\n**图纸查看页 `drawing_viewer_page.dart` 已增强**（今日）：图层/布局面板 + 坐标标注。\n**图纸数据当前是南科大 PNG**（`mock_data.dart` 的 `nkf_*`），7栋真实 CAD 尚未接入图纸列表。\n\n---\n\n## 一、项目是什么\n\n**工地巡检智能化管理 Flutter App**（iOS / Android / Web 三端）。\n\n- 技术栈：Flutter 3.47 + Dart 3.13、Riverpod、GoRouter、Hive、`http`\n- 功能模块：登录、首页、项目图纸、巡场、缺陷记录、拍照验收（AI 视觉识别）、图纸浏览\n- 项目有两个演示项目：**南科大附属医院（`nkf`，PNG 假图纸）** 与 **腾讯大铲湾 DY04·7栋（`tencent-dy04-7`，真实 CAD）**\n- `allProjects = [tencentProject, project]`，**默认选中第一个 = 7栋**\n\n## 二、核心业务：浩辰云图 CAD 接入（当前主线）\n\n目标：把 7栋真实 DWG 图纸解析、浏览、标注（巡场精度要求高——图纸坐标标注）。\n\n### 1. 华为云市场商品\n- 商品页：https://marketplace.huaweicloud.com/contents/aeb4e164-dc5f-4c06-afe7-8e613abde8fb\n- **额度**：按次套餐 50 次，**当前已用 11+ 次，剩余不多，务必精打细算**\n\n### 2. 关键凭证\n| 凭证 | 值 | 存放 |\n|---|---|---|\n| 浩辰 AppKey | `38f55d60d4a04e2790b5d1fac8359fe8` | `server/config.py` |\n| 浩辰 AppSecret | `69e0a835a24f4094bee5f6a4dddcadf0` | 同上 |\n| 浩辰 AppCode | `ed74a030b50e428597c5e16cdf58fbf68aa57a27c42e435aad3bd4869b6d843b` | 同上 |\n| **COS 桶** | `site-inspection-1322296918`（region ap-guangzhou） | `server/cos_config.py` |\n| COS SecretId | `\u003c已脱敏，见本地server/cos_config.py\u003e` | 同上 |\n| COS SecretKey | `\u003c已脱敏，见本地server/cos_config.py\u003e` | 同上 |\n\n⚠️ 以上 `config.py`、`cos_config.py` 均已 `server/.gitignore` 排除，**不会提交**。\n\n### 3. 浩辰 API 关键接口（后端文档 `backend_api.txt`）\n| 接口 | 路径 | 网关 | 鉴权 | 扣次 |\n|---|---|---|---|---|\n| getDwgInfo | `/openapi/v1/getDwgInfo` | **2dviewer** | AppCode | ❌ 不扣 |\n| getTaskStatus | `/openapi/v1/getTaskStatus` | **gstarcadsdk**（写死）| AK/SK 签名 | ❌ 不扣 |\n| dwgToOcf | `/openapi/v1/dwgToOcf` | 2dviewer | AppCode/签名 | ✅ 扣 1 |\n| ocfSaveAsImage | `/openapi/v1/ocfSaveAsImage` | 2dviewer | AppCode/签名 | ✅ 扣 1 |\n| ocfSaveAsPdf | `/openapi/v1/ocfSaveAsPdf` | 2dviewer | AppCode/签名 | ✅ 扣 1 |\n| getPixelImage | `/openapi/v1/getPixelImage` | 2dviewer | AppCode/签名 | ✅ 扣 1（含 viewsize，坐标换算关键）|\n\n**网关双地址**：提交/转换走 `https://2dviewer.apistore.huaweicloud.com`；查状态固定走 `https://gstarcadsdk.apistore.huaweicloud.com`。\n\n**关键参数**：\n- `dwgToOcf`/`getDwgInfo`：POST + JSON body（`fileName` + `fileUrl`/`fileBase64`）\n- `getTaskStatus`：POST + query 参数（`?requestId=xxx`）+ AK/SK 签名 + 空 body\n- 大文件（\u003e~9MB DWG，base64\u003e12MB）会触发 **APIG 413 body 限制**，必须用 **fileUrl（COS 公网 URL）** 绕过，或 zlib 压缩 base64\n\n### 4. 已部署的后端\n- **AI 视觉识别后端**：已上云 `http://120.24.240.129:3000`，模型 qwen3.8-max，`/health` 正常。前端 `vision_service.dart` 默认指向它，**不依赖本地 backend/server.js**（该文件已丢失，但无需重建）。\n- **CAD Python 服务端**：本地 `server/ocf_server.py`，端口 **8800**，封装浩辰全部 CAD 接口 + OCF 缓存省次。\n\n## 三、本机 CAD Python 服务端（`server/`）\n\n```\nserver/\n├── config.py          # 浩辰凭证（gitignore）\n├── cos_config.py      # COS 凭证（gitignore）\n├── cos_upload.py      # COS 上传（官方 cos-python-sdk-v5）\n├── ocf_server.py      # 主服务（端口 8800）\n├── quota_guard.py     # 扣次防误触\n├── apig_sdk/          # 华为云 AK/SK 签名 SDK（复用下午验证）\n├── .env.example\n├── ocf_cache/         # OCF 缓存（省次核心）\n└── .gitignore\n```\n\n**服务端接口**（Flutter `CadService` 对接）：\n- `GET /api/cad/health`：健康检查\n- `POST /api/cad/dwgInfo`：提交 getDwgInfo，返回 requestId（不扣次）\n- `GET /api/cad/taskStatus?requestId=`：查状态（不扣次）\n- `POST /api/cad/dwgToOcf`：转换，含省次缓存（扣 1）\n- `POST /api/cad/saveAsImage`：OCF→PNG（扣 1，含 PNG 缓存）\n- `GET /api/ocf/\u003ckey\u003e.ocf|.png`：分发 OCF/PNG\n\n**省次策略**：同图只转 1 次，OCF 缓存到 `ocf_cache/`，前端永远从本地服务拉取，不重复扣次。\n\n**启动**：`cd server \u0026\u0026 python ocf_server.py 8800`\n（扣次接口需环境变量 `GCAD_ALLOW_CHARGE=1`）\n\n## 四、7栋图纸转换成果（今日完成）\n\n第一轮测试 10 张 7栋 CAD 已全部转成 OCF，缓存于 `server/ocf_cache/`：\n\n| OCF key | 图纸 | 大小 |\n|---|---|---|\n| dy04_7_B01 | 地下一层顶板组合平面图 | 9.31MB |\n| dy04_7_B02 | 地下一层顶板分区平面图(一) | 9.31MB |\n| dy04_7_D01 | A座1-1剖面图 | 1.26MB |\n| dy04_7_D03 | 剖面图绑定版 | 1.48MB |\n| dy04_7_K01 | 墙身详图（一）| 0.55MB |\n| dy04_7_K02 | 墙身详图（二）| 0.45MB |\n| dy04_7_E01 | A座楼梯详图 | 0.34MB |\n| dy04_7_F01 | B座楼梯剖面图 | 2.25MB |\n| dy04_7_J01 | A座门窗详图（一）| 0.20MB |\n| dy04_7_J04 | 门窗详图绑定版 | 0.81MB |\n\n**转换方式**：DWG 上传腾讯云 COS（生成公网 URL）→ 调浩辰 `dwgToOcf`（fileUrl）→ OCF 落盘缓存。**共消耗 8 次额度**（B01/K01 是下午转换的，复用缓存未再扣次）。\n\n**COS 已上传的 DWG**（供浩辰 fileUrl 下载）：\n`B1pingmian.dwg`、`B1qiangshen.dwg`、`B02.dwg`、`D01.dwg`、`D03_D04.dwg`、`K02.dwg`、`E01.dwg`、`F01_F08.dwg`、`J01.dwg`、`J04_J05.dwg`\n公网域名：`https://site-inspection-1322296918.cos.ap-guangzhou.myqcloud.com/\u003c文件名\u003e`\n\n## 五、Flutter 端 CAD 接入（已实现）\n\n| 文件 | 作用 |\n|---|---|\n| `lib/data/cad_service.dart` | `CadService` 封装，调本地代理 `http://localhost:8800`（`CAD_HOST` 可覆盖）|\n| `lib/data/models.dart` | `CadLayer`/`CadLayout`/`DwgInfo`/`CadTaskStatus`/`CadAnnotation` 模型 |\n| `lib/core/utils/cad_coord.dart` | `CadCoordMapper`：viewsize 坐标换算（screenToWorld/worldToScreen）|\n| `lib/shared/widgets/cad_info_panel.dart` | 图层开关 + 布局切换面板 |\n| `lib/core/di/providers.dart` | `cadServiceProvider`、`cadInfoProvider`、`cadAnnotationsProvider`、`cadPickModeProvider` |\n\n**图纸查看页 `drawing_viewer_page.dart` 已加**：\n- 「图层」按钮 → 打开 CAD 面板（图层开关 / 布局切换）\n- 「坐标」按钮 → 拾取模式，点击图纸打点 → 换算图纸坐标 → 红色图钉标记\n\n**已验证**：`getDwgInfo` 真实调用成功拿到 23 个图层、3 个布局（Model/布局1/布局2），全程不扣次。\n\n## 六、当前未完成 / 待办\n\n1. **7栋 10 张图接入项目图纸列表**：当前 `floors`/`drawings` 还是南科大 PNG，未按项目区分。需让 7栋项目显示 7栋图纸。\n2. **图纸展示方式未定**：OCF 需 **GStarSDK.js** 矢量渲染（**尚未拿到**，正等浩辰 `zhaoyy@gstarcad.com` 邮件，订单 `CS2608121457NG4KM`）。可选：转 PNG（扣次）/ 等 SDK / 占位。\n3. **坐标标注落地**：`CadCoordMapper` 框架已建，真实渲染需 GStarSDK。\n4. **额度精打细算**：已用 11+ 次，剩余每次调用都需用户确认。\n\n## 七、本地资料路径\n\n| 内容 | 路径 |\n|---|---|\n| 项目资料（7栋施工图） | `F:\\建筑验收工具\\大铲湾DY04_资料` |\n| 原始资料（全项目 1859 DWG） | `F:\\设计院工作\\SZAD\\2020-腾讯大铲湾DY04` |\n| 浩辰 API PDF 文档 | `F:\\建筑验收工具\\浩辰云图网页版软件` |\n| 下午 web-demo（batch_convert 参考） | `F:\\建筑验收工具\\web-demo` |\n\n## 八、环境清单（家里电脑）\n\n| 组件 | 版本 | 位置 |\n|---|---|---|\n| Flutter | 3.47.0 (Dart 3.13) | `D:\\flutter` |\n| JDK | 17.0.20 | `D:\\java\\jdk-17.0.20+8` |\n| Android SDK | API 36 | `D:\\Android` |\n| Chrome | 最新 | `C:\\Program Files\\Google\\Chrome` |\n| Node.js | v24.19.0 | `C:\\Program Files\\nodejs` |\n| Python | 3.14.3 | 系统 |\n| Web 预览 | `http://localhost:8000`（serve_web.ps1）| — |\n| CAD 服务 | `http://localhost:8800`（ocf_server.py）| — |\n\n**构建命令**：`flutter build web`；本地 serve 用 `serve_web.ps1`。\n**验证**：`flutter analyze` 应零问题。\n\n## 九、安全与操作偏好（用户要求）\n\n1. **文件列表里的文件全部保留**，不删除、不再询问。\n2. **危险命令 / 高危操作默认直接运行**，不需要用户再点击确认。\n3. ⚠️ **例外**：浩辰 API 按次计费，**每次消耗额度的调用仍需用户明确同意**（额度珍贵）。\n4. COS 密钥等敏感信息已配置于 `server/*.py`（gitignore），勿提交。\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-16.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-16.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTE2Lm1k","base":"DEVELOPMENT_LOG_2026-08-16.md","title":"开发日志 2026-08-16（CAD 查看器截图模式 + 图层白名单方案）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-16","mtime":"2026-08-17","size":7245,"chars":4309,"lines":103,"nhead":12,"lead":"本文档为上下文记录，供后续（换电脑/新会话）继续开发使用。 生成时间：2026-08-16（周六） 项目：工地巡检智能化管理（腾讯大铲湾 DY04 / 7 栋 B05 图纸验证）","text":"# 开发日志 2026-08-16（CAD 查看器截图模式 + 图层白名单方案）\n\n\u003e 本文档为上下文记录，供后续（换电脑/新会话）继续开发使用。\n\u003e 生成时间：2026-08-16（周六）\n\u003e 项目：工地巡检智能化管理（腾讯大铲湾 DY04 / 7 栋 B05 图纸验证）\n\n---\n\n## 一、今日已完成\n\n### 1. 图层白名单/冻结图层方案（矢量 OCF 方向，已放弃为主方案）\n- 安装 **ODA File Converter 27.1**（`C:\\Program Files\\ODA\\ODAFileConverter 27.1.0\\`，免费工具，DWG→DXF）\n- 将 `F:\\建筑验收工具\\大铲湾DY04_资料\\第一轮测试CAD\\01_平面图\\建施_AW-7-B05_V1.0_地下室夹层组合平面图_t3.dwg` 转成 DXF（280MB，因天正自定义对象 `TCH_PIPEWIRE` 转换时实体段截断，但 TABLES 段完整）\n- 用 ezdxf.recover 读取截断 DXF，提取出**全部 1847 个图层的真实 isoff/isfrozen 状态**（297 冻结 + 13 关闭 = 310 隐藏层）\n- 结果输出到 `server/cad_meta/dy04_7_B05_dxf_layers.json`\n- 把 310 个真实图层名写入 `web/cad_viewer.html` 的 `FROZEN_LAYERS`，并加**归一化匹配**（全角/半角、去空格）\n- **结论**：即使精确关闭 310 层，模型空间仍\"炸\"（大量 hatch/标注层未冻结），布局空间仍有紫色填充残留。**此方案被否，改用截图模式。**\n\n### 2. PDF 整理（已完成）\n- 从 `F:\\设计院工作\\SZAD\\2020-腾讯大铲湾DY04\\14-总院归档文件\\09-施工图\\01-建筑\\7栋\\PDF` 复制 **167 个 PDF** 到 `F:\\建筑验收工具\\大铲湾DY04_资料\\第一轮测试CAD\\`，按编号分类到 01~10 目录 + 目录与封面\n- 按\"DWG 编号匹配\"删除无对应 DWG 的 PDF（06 楼梯详图删了 F17、F28 两张）\n\n### 3. 截图嵌入 + 矢量定位混合方案（**当前主方案**）\n- 新建 `web/cad_viewer_hybrid.html`（截图模式查看器）\n- 底图：`web/dy04_7_B05_paper_hybrid.png`（4500×2551，B05 PDF 转 PNG，已确认效果=AutoCAD 布局空间，干净无炸线）\n- 功能：\n  - 单点 / 两点 / 预设三种坐标校准\n  - 校准参数 localStorage 持久化（key 当前为 `cad_calib_v3_`）\n  - 捕捉最近点（canvas Harris 角点检测）\n  - 缩放：顶栏 +/−/↻ + Ctrl+滚轮\n  - 定位结果 postMessage 回 Flutter（`{type:'cad-pick', worldX, worldY, text}`）\n- UI：Ins 风扁平化（白底、圆角、segmented control），顶栏 60px、标题 16px、按钮 14px（已调至用户认可的大小）\n\n---\n\n## 二、未完成/待解决（明天继续）\n\n### ⚠️ 核心问题：单点校准 Y 轴偏差大（X 基本准）\n- **现象**：校准点填 `X=-295.2308, Y=95.0095`（AutoCAD ID 查得），应用后点同一特征点，返回 `X≈-258.7, Y≈851.7`，**Y 偏差 ~750mm**，X 误差 ~2mm\n- **已确认的事实**：\n  - PDF 物理页 = **1489.07 × 843.84 mm**（已实测）\n  - 底图 PNG = 4500 × 2551 px，宽高比 1.764 = PDF 物理比例，**图片未被拉伸**\n  - `scale = 4500/1489 = 3.022 px/mm`，算法 `a=1/scale, c=-imgW/2*a, e=-1/scale, f=imgH/2/scale` 数学上正确\n  - X 准 Y 错 → 疑似 Y 方向某处乘了约 1.88 或 5 倍系数\n- **待验证/候选原因**：\n  1. `screenToImagePx` 用 `imgEl.getBoundingClientRect()` 换算，可能因 `#viewer` 的 flex + `align-self:center` 或浏览器 zoom 导致 **rect.height ≠ 真实显示高度**（Y 像素→图像像素放大）\n  2. **建议优先做**：在定位点击时用 `debugPoint()`（已内置，输出像素坐标+算法坐标）打印 PY 像素值，和截图里实际红点位置对比，确认换算是否准确\n  3. 若确认是 rect 问题 → `screenToImagePx` 改用 **CSS 尺寸比例**或**SVG overlay 的坐标**（SVG 与图片等大）\n- **下一个调试方向（省积分，不扣浩辰次数）**：\n  ```\n  F12 → Console:\n  debugPoint(px, py)  // 手动输入像素验证算法\n  ```\n  或临时在 `svg.addEventListener('click')` 里 console.log 原始 `e.clientX/clientY`、`svg.getBoundingClientRect()`、`imgEl.getBoundingClientRect()` 三者对比\n\n### 待办列表（按优先级）\n1. [ ] **修复单点校准 Y 偏差**（先用 debugPoint 定位 rect 问题，再修 screenToImagePx）\n2. [ ] 校验修复后重新做一次完整校准，确认 X、Y 均 \u003c 1mm 误差\n3. [ ] 将校准参数从 localStorage 升级为\"可导出/导入\"（方便多设备/工地无 CAD 环境），或接入 Flutter 端保存\n4. [ ] Flutter 端接入 `cad_viewer_hybrid.html`（确认 postMessage 的 cad-pick 事件被正确接收并写入巡查记录）\n5. [ ] 多图纸支持：7 栋其他楼层 PDF → PNG 底图批量生成，按 key 切换\n6. [ ] （可选）截图模式下标注功能（测量距离、画点、标签），需与 Flutter 数据模型对接\n\n---\n\n## 三、关键文件清单\n\n| 文件 | 说明 |\n|------|------|\n| `web/cad_viewer_hybrid.html` | **主交付物**，截图模式查看器（所有校准/定位/缩放逻辑在此） |\n| `web/dy04_7_B05_paper_hybrid.png` | B05 底图（PDF 转 PNG，4500×2551） |\n| `web/cad_viewer.html` | 旧的矢量 OCF 渲染页（GStarSDK 方向，已不再主推） |\n| `server/dwg_cache/*.dxf` | ODA 转出的 DXF（280MB，已加 .gitignore） |\n| `server/cad_meta/dy04_7_B05_dxf_layers.json` | DXF 图层解析结果（310 冻结层，已写入 cad_viewer.html 用） |\n| `server/cad_meta/dy04_7_B05_vpdetail.json` | 布局视口解析（4 个视口，VP freeze 全 0——天正图数据缺失） |\n| `F:\\建筑验收工具\\...\\01_平面图\\` | B05 PDF/DWG 源文件（AutoCAD 可打开） |\n| `F:\\设计院工作\\...\\7栋\\PDF\\` | 7 栋全部 PDF 源（167 张） |\n\n---\n\n## 四、重要约束与经验（避免重复踩坑）\n\n- **浩辰 API 配额仅剩 11 次**：任何扣次接口调用必须先征得用户同意\n- **浩辰 `getDwgInfo` 不返回 `vpfreeze`**（视口冻结），无法据此还原布局空间显示\n- **ODA 转天正图 DXF 实体段被截断**（`AcDbDictionary can't be cast to AcDbBlockTableRecord`），但 TABLES 段可用 ezdxf.recover 读取\n- **ezdxf 不能直接读 DWG**（只能读 DXF）\n- **图纸空间 OCF 不含视口裁剪**（浩辰转 OCF 时布局视口数据丢失）→ 这是放弃矢量方案的根本原因\n- **用户拒绝 PNG 替代矢量**用于最终展示，但**接受\"截图底图 + 坐标映射\"混合方案**（截图只做视觉，坐标来自映射计算，仍属\"可定位\"）\n- **PDF → PNG 渲染**：用 `pypdfium2`（已 pip 安装），`page.render(scale=dpi/72)` 可指定分辨率；`get_size()` 返回 pt 单位，物理 mm = pt/72*25.4\n\n## 五、UI 偏好（用户已确认）\n- Ins 极简 / ISO 扁平化：白底 `#F5F6F8`、卡片白 `#FFFFFF`、描边 `#E5E7EB`、主文字 `#111827`、次级 `#6B7280`、强调 `#111827`/`#2563EB`/成功绿 `#16A34A`\n- 顶栏：60px 高、标题 16-17px、按钮 14px、圆角 10-12px\n- 查看/定位/校准用 segmented control（iOS 风格）\n- 缩放按钮 + 百分比在顶栏左侧\n- 底图初始**自动适配窗口**（整图可见），Ctrl+滚轮缩放，放大后可滚动平移\n\n---\n\n## 六、Git 提交记录\n- 本次提交包含：混合方案 HTML、B05 底图、DXF 解析结果（meta json）、PDF 整理辅助、`DEVELOPMENT_LOG_2026-08-16.md`\n- DXF 大文件已 .gitignore（不推送）\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-17.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-17.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTE3Lm1k","base":"DEVELOPMENT_LOG_2026-08-17.md","title":"开发日志 2026-08-17（Y 轴校准 Bug 修复 + 周末续接）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-17","mtime":"2026-08-19","size":9975,"chars":6039,"lines":148,"nhead":15,"lead":"本文档为上下文记录，供后续（换电脑/新会话）继续开发使用。 生成时间：2026-08-17（周日，在家电脑） 项目：工地巡检智能化管理（腾讯大铲湾 DY04 / 7 栋 B05 图纸验证） 续接自：DEVELOPMENT_LOG_2026-08-16.md（git pull 已同步，本地与远端一致，HEAD=6c61d","text":"# 开发日志 2026-08-17（Y 轴校准 Bug 修复 + 周末续接）\n\n\u003e 本文档为上下文记录，供后续（换电脑/新会话）继续开发使用。\n\u003e 生成时间：2026-08-17（周日，在家电脑）\n\u003e 项目：工地巡检智能化管理（腾讯大铲湾 DY04 / 7 栋 B05 图纸验证）\n\u003e 续接自：`DEVELOPMENT_LOG_2026-08-16.md`（git pull 已同步，本地与远端一致，HEAD=6c61d0d）\n\n---\n\n## 一、今日完成\n\n### ✅ 核心问题修复：单点校准 Y 轴偏差大\n\n**根因**：`web/cad_viewer_hybrid.html` 的 `applySinglePoint()` 里 Y 系数写错字段。\n\n- 单点校准生成 MAP 时把 **Y 系数存到了 `MAP.e`**：\n  ```js\n  MAP = { a: a, b: 0, c: ..., d: 0, e: e, f: ... };  // 错误：Y 系数在 e\n  ```\n- 但 `imagePxToWorld()` 读取 Y 时用的是 **`MAP.d`**：\n  ```js\n  return { x: MAP.a*px + MAP.c, y: MAP.d*py + MAP.f };  // 读 d\n  ```\n- 由于 `MAP.d = 0`，导致 Y 输出恒等于常数 `MAP.f = wy + py/scale`（随点击像素点偏大），\n  表现即为\"Y 偏差 ~750mm、X 准\"。**X 用对了 `a/c` 所以准；Y 系数存错字段所以炸。**\n\n**修复**：把 Y 系数存到 `MAP.d`（与 `imagePxToWorld` 一致）：\n```js\nMAP = { a: a, b: 0, c: c + (wx - calcX), d: e, e: 0, f: f + (wy - calcY) };\n```\n- 验证数学：点击点处 `x = a*px + c + (wx-calcX) = wx`，`y = e*py + f + (wy-calcY) = wy`，X、Y 均精确等于输入真实坐标 ✓\n- 顺带说明：**两点校准**（`applyCalibration`）本来就把 Y 系数存 `MAP.d`，与读取一致，所以两点校准一直是好的；只有单点校准字段写错。\n\n### ✅ 静态服务器支持自定义端口 + 修正启动脚本\n- 系统进程（PID 4，HTTP.sys）占用了 **8000 端口**，`_start_server.py` 无法绑定 8000。\n- 已改 `_start_server.py` 支持命令行端口参数：`python _start_server.py \u003cport\u003e`（默认仍 8000）。\n- 已在 **8010** 端口启动验证：`http://localhost:8010/cad_viewer_hybrid.html` 返回 200。\n- 修正 `_start_static.bat`：原来写死 `cd /d \"f:\\GitHub\\site-patrol\"`（旧电脑路径），改为 `cd /d \"%~dp0\"`（脚本自身目录）。\n\n### ✅ 多位置精度验证（浏览器实测，已通过）\n对单点校准后整图做了 3 个不同位置的特征点验证（左下 / 中部），对比前端返回坐标 vs AutoCAD `ID` 命令查得的真实坐标：\n\n| 位置 | CAD 真实坐标 (X,Y) mm | 前端返回 (X,Y) mm | X 误差 | Y 误差 |\n|------|----------------------|-------------------|--------|--------|\n| 特征点1（左下/安全出口） | 175.1692, 800.6095 | 174.7, 802.2 | 0.5mm | 1.6mm |\n| 特征点2（中部） | 175.1692, 162.2095 | 174.7, 163.8 | 0.5mm | 1.6mm |\n\n**结论**：\n- 整图 1489×844mm 范围内，X、Y 误差稳定在 **\u003c 2mm**，两个相距 ~640mm 的测试点误差几乎一致（X 恒偏 0.5、Y 恒偏 1.6），说明**比例尺正确**（非随位置漂移），字段修复已生效，剩余为**系统性恒定偏移**。\n- 偏移来源：人眼选校准点时像素级定位误差（1px ≈ 0.33mm，~3-5px 即 1-2mm），属于人眼选点极限，非算法缺陷。\n- 已满足工地验收实际需求（验收规范一般 ±5-10mm）。**单点校准方案验证通过。**\n\n### ⚠️ 浏览器加载慢问题的定位（已解决）\n- 现象：浏览器打开页面长时间\"加载中\"。\n- 原因：后台静态服务器**多个进程抢同一个 8010 端口**（3 个 python 进程，大量 CLOSE_WAIT 残留连接），浏览器连接被卡死。\n- 处理：杀掉多余进程，只保留一个单实例服务器（pid 5560），清理后用原生 socket 验证 html 与 5.61MB 底图均返回 200。已确认可用。\n- 教训：多次启动静态服务器前先 `netstat -ano | findstr \"\u003cport\u003e\"` 检查端口占用，避免重复起进程。\n\n---\n\n## 二、待办（按优先级，承接 8-16 日志）\n\n1. [x] **修复单点校准 Y 偏差**（今日完成：字段 d/e 不一致）\n2. [x] **完整校准验证**：多位置实测 X、Y 均 \u003c 2mm（2026-08-17 已通过，见上文表格）\n3. [x] **校准参数跨设备传递**：3 种携带方式（链接 / 离线文件 / JSON）已实现\n4. [x] **Flutter 端原生移植**：截图底图 + 真实矢量坐标 + 打点写入 Defect（明日继续排查精度）\n5. [ ] 多图纸支持：7 栋其他楼层 PDF → PNG 底图批量生成，按 key 切换\n6. [ ] （可选）截图模式下标注功能（测量距离、画点、标签），需与 Flutter 数据模型对接\n\n---\n\n## 三、今日完成（下午续：Flutter 端原生移植）\n\n回应\"工地无网 + 内嵌 APP + 真矢量精准可跟踪 + 打通巡查记录\"诉求。\n\n### ✅ 路线选型决策\n放弃 GStarSDK 矢量渲染（被否：模型空间炸线 + 离线授权未知 + 移动端兼容未知），\n改走「**截图底图作视觉 + 真实 mm 级矢量坐标 + Flutter 原生渲染**」。\n坐标是真实矢量坐标（mm，可打点、可跟踪、可写入缺陷），视觉用干净 PDF 截图底图。\n**离线设计**：底图打包进 `assets/`，校准存 Flutter 本地（Hive），完全无网可用。\n\n### ✅ 核心改动\n- `lib/core/utils/cad_coord.dart`：新增仿射校准 `{a,b,c,d,e,f}`（与浏览器 `cad_calib` 格式一致），`screenToWorld` 用 `X = a*px + c; Y = d*py + f`，工厂 `fromCalibrationMap` / `toCalibrationMap`。\n- `lib/core/cad/cad_calibration.dart`（新）：校准参数本地存储（LocalStorage JSON）。\n- `lib/core/utils/open_web{,_stub,_web}.dart`（新）：条件导入替换 `dart:html`，解决移动端编译问题。\n- `lib/core/di/providers.dart`：新增 `cadCalibrationStoreProvider`、`cadCalibrationMapProvider`、`loadCadCalibration`、`saveCadCalibration`、`deleteCadCalibration`、`refreshDefects`。\n- `lib/data/models.dart`：`Defect` 加 `drawingKey` / `worldX` / `worldY` / `hasCadCoord` / `coordText`。\n- `lib/data/mock/mock_data.dart`：B05 `src='assets/drawings/dy04_7_B05_paper_hybrid.png'`，`w=4500, h=2551`。\n- `lib/data/repository/mock_repository.dart`：维护全量 `_defects`，新增 `currentIs7` 控制按项目返回。\n- `lib/features/projects/drawing_viewer_page.dart`：7栋 CAD 改渲染底图；新增「校准」按钮（粘贴 JSON / 应用内置B05）；工具栏横向滚动（8 按钮）；打点用真实坐标 + 写 Defect；图钉带序号 + 坐标胶囊 + 点击弹窗。\n- `assets/drawings/dy04_7_B05_paper_hybrid.png`（新）：B05 底图打包进 assets，离线可用。\n- `pubspec.yaml`/`pubspec.lock`：自动添加字体声明。\n\n### ⚠️ 当前未解决问题（明日继续）\n**Flutter 端打点坐标不准**：校准后点击图纸上特征点，返回 worldX/worldY 与 CAD `ID` 命令真实坐标仍有偏差。\n可能原因（待排查）：\n- (a) `InteractiveViewer` 变换影响 `localPos`（建议\"复位\"后再打点）；\n- (b) Flutter `_pickAnnotation` 与浏览器 `screenToImagePx` 推导差异；\n- (c) 校准参数是否真应用（已用 `_coordMapper` 读取 `cadCalibrationMapProvider`）；\n- (d) 浏览器端校准用 PDF 物理页 1489×844mm，Flutter 端图 4500×2551px → 比例 1px=0.33mm，需现场再核对。\n\n已加诊断辅助：图钉带坐标胶囊、点击弹窗显示完整坐标 + 校准状态、SnackBar 明确显示\"已校准/未校准\"。\n\n### 📋 明日接手任务\n1. **首要**：排查 Flutter 端打点坐标不准。先在浏览器端用 `debugPoint` 记特征点像素，与 CAD `ID` 坐标一一对应成基准表；再在 Flutter 端点同位置对比，按 (a)→(d) 逐项排查；必要时用 `worldToScreen` 反向校验。\n2. 图钉视觉优化（大小/字体/配色）。\n3. Flutter 端真机/平板构建验证（Android/iOS）。\n4. 「应用内置B05」改为读取浏览器端上次保存的参数（当前硬编码中心映射，可能与真实校准不一致）。\n\n---\n\n## 三、关键文件\n\n| 文件 | 说明 |\n|------|------|\n| `web/cad_viewer_hybrid.html` | 主交付物（今日修 Y 轴字段 bug） |\n| `web/dy04_7_B05_paper_hybrid.png` | B05 底图（4500×2551） |\n| `_start_server.py` | 静态服务器，**新增端口参数支持** |\n| `_start_static.bat` | 启动脚本，修正旧路径 |\n| `DEVELOPMENT_LOG_2026-08-16.md` | 昨天的上下文（Y 轴问题来源） |\n\n---\n\n## 四、重要环境差异（在家电脑 vs 办公室电脑）\n\n- **8000 端口被系统进程（PID 4 / HTTP.sys）占用**：在家电脑不能直接 `python _start_server.py` 用 8000，需 `python _start_server.py 8010`（或改默认端口）。办公室电脑若 8000 空闲则可直接用。\n- 中文路径传参坑：PowerShell 把 `F:\\建筑验收工具\\site-patrol` 的中文转码成乱码（`寤虹瓚楠屾敹宸ュ叿`），导致 `cd`/`WorkingDirectory` 报错。**规避方法**：execute_command 的默认工作目录就是仓库根目录，直接运行命令即可，不要手动 `cd` 中文路径；如需后台起服务器用 Python `subprocess.Popen`。\n\n---\n\n## 五、Git 提交记录（已提交，见 git log）\n本次提交分两部分：\n1. **上午部分**（Y 轴 bug 修复 + 携带方式 + 静态服务器）：\n   - `web/cad_viewer_hybrid.html`（Y 轴字段修复 + 3 种携带方式 UI/逻辑）\n   - `_start_server.py`（端口参数）、`_start_static.bat`（路径修正）\n2. **下午部分**（Flutter 端原生移植）：\n   - `lib/core/utils/cad_coord.dart`（仿射校准）\n   - `lib/core/cad/cad_calibration.dart`（新）\n   - `lib/core/utils/open_web*.dart`（新，条件导入）\n   - `lib/core/di/providers.dart`（校准 provider）\n   - `lib/data/models.dart`（Defect 加坐标字段）\n   - `lib/data/mock/mock_data.dart`（B05 底图 src/w/h）\n   - `lib/data/repository/mock_repository.dart`（按项目返回缺陷）\n   - `lib/features/projects/drawing_viewer_page.dart`（图纸页改造）\n   - `assets/drawings/dy04_7_B05_paper_hybrid.png`（新）\n   - `pubspec.yaml`、`pubspec.lock`（字体声明）\n   - `DEVELOPMENT_LOG_2026-08-17.md`（本日志）\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-18.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-18.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTE4Lm1k","base":"DEVELOPMENT_LOG_2026-08-18.md","title":"开发日志 2026-08-18（坐标换算根因定位 + 修复 + Android 构建验证）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-18","mtime":"2026-08-19","size":5988,"chars":3520,"lines":101,"nhead":11,"lead":"本文档为上下文记录，供后续（换电脑/新会话）继续开发使用。 项目：工地巡检智能化管理（腾讯大铲湾 DY04 / 7 栋 B05 图纸验证） 续接自：DEVELOPMENT_LOG_2026-08-17.md","text":"# 开发日志 2026-08-18（坐标换算根因定位 + 修复 + Android 构建验证）\n\n\u003e 本文档为上下文记录，供后续（换电脑/新会话）继续开发使用。\n\u003e 项目：工地巡检智能化管理（腾讯大铲湾 DY04 / 7 栋 B05 图纸验证）\n\u003e 续接自：`DEVELOPMENT_LOG_2026-08-17.md`\n\n---\n\n## 一、今日完成\n\n### ✅ 首要：Flutter 端打点坐标不准 —— 根因定位并修复（已单元测试验证）\n\n**排查结论（重要）**：\n\n1. **★ 真正的 root cause：仿射系数 Y 位置语义不一致**（与 8-17 浏览器端字段错位 bug 同源）：\n   - 浏览器端 `imagePxToWorld`：`X = a*px + c；Y = MAP.d * py + MAP.f`（**Y 系数在 d，乘 py**）。\n   - Flutter 端原 `screenToWorld`：`X = a*px + b*py + c；Y = d*px + e*py + f`（**d 乘 px**）。\n   - 用户从浏览器「复制参数」得到 `{a, b:0, c, d, e:0, f}`，Flutter 导入后把 `d` 错误用于 px\n     → **Y 坐标系统性错误**（实测偏差 300+mm）。\n   - **修复**：`screenToWorld` 仿射模式改为 `Y = d*py + e*px + f`（b=e=0 时 = `d*py + f`，\n     与浏览器 `imagePxToWorld` 完全一致）；`worldToScreen` 逆变换（`py=(wy-f)/d`）本就一致。\n   - 新增 `test/cad_coord_test.dart`（6 用例）验证：校准点精确、比例尺正确、正逆变换互逆、\n     `fromCalibrationMap` 解析浏览器 JSON —— **全部通过**。\n\n2. **次要：`InteractiveViewer` 坐标行为**：\n   - `InteractiveViewer` 内部用 `Transform`（默认 `transformHitTests=true`）包裹 child，\n     因此 child 内 `GestureDetector` 的 `localPosition` **已被自动反变换**为「未缩放局部坐标」。\n   - 17 日疑点 (a) 的修正方向曾做反：`localToViewPixel` 再用矩阵二次反算 = 双重反变换（错误）。\n   - **正确算法**：localPos 已是盒子坐标，减去图片居中偏移 → 归一化 → 整图像素 → `screenToWorld`，\n     与浏览器 `screenToImagePx` 数学等价。\n\n3. **内置 B05 校准系数是「演示值」，不能用于精度验证**：\n   - `applyBuiltinB05` 用 `a=1/3.022, d=-1/3.022, c=-w/2*a, f=h/2*a`，\n     隐含假设「图片中心 = CAD 原点 (0,0)」。\n   - 真实 CAD 原点不在图中心 → 除中心点外**全图系统偏移**。\n   - **必须**用浏览器端「复制参数」导出的真实校准（含单点偏移修正 c/f）才准。\n   - 待办：内置 B05 应改为读取浏览器端上次保存的参数（见下方待办 4）。\n\n**修改**：\n- `lib/core/utils/cad_coord.dart`：`screenToWorld` 仿射分支 Y 系数位置修正（d 乘 py）。\n- `lib/features/projects/drawing_viewer_page.dart`：\n  - `_pickAnnotation` 移除 `localToViewPixel` 二次反变换，改为\n    「盒子坐标 - 居中偏移 → 归一化 → 整图像素 → screenToWorld」；\n  - 打点/锚定 `GestureDetector` 放回盒子层（覆盖整盒），注释说明 transformHitTests 行为。\n- `test/cad_coord_test.dart`（新增）：坐标换算单元测试。\n\n### ✅ 顺手修复：首页 `_QuickCard` 溢出 12px\n- `lib/features/home/home_page.dart`：卡片加固定 `height: 84`，解决 `RenderFlex overflowed by 12px`。\n\n### ✅ Android 构建验证（进行中）\n- `flutter build apk --debug` 首次构建需下载 Android SDK Platform 34/35 组件。\n- 日志：`C:\\temp\\_apk.log`（后台运行）。\n\n---\n\n## 二、下午续：图钉→拍照联动 + 坐标诊断增强\n\n### ✅ 图钉 → 拍照记录（新功能）\n- `CaptureArgs` 增加 `drawingKey / drawPointWorldX / drawPointWorldY`（`lib/data/models.dart`）。\n- 图钉详情弹窗新增「拍照记录」按钮 → `context.push('/capture')` 带上图纸坐标。\n- 打点 SnackBar 右侧新增「拍照」快捷按钮。\n- `CapturePage` 生成缺陷工单时自动继承图纸坐标（`drawingKey/worldX/worldY`），\n  实现「图纸打点 → 拍照 → 缺陷带坐标」闭环。\n\n### ✅ 坐标诊断增强（应对\"打点后仍不准\"）\n- 打点时 `debugPrint('[CAD PICK] ...')` 输出完整换算链路：\n  `local → box → disp → origin → img(px,py) → world → a/d/c/f 系数`。\n- 打点 SnackBar 显示校准参数摘要（a/d/c/f），让用户一眼看出用的是内置演示值还是真实参数。\n- 图钉详情弹窗新增「整图像素」「校准参数」行，便于与浏览器端对照。\n\n### ⚠️ 坐标精度仍未实测通过\n- 用户截图反馈：打点坐标 (-681.5, -332.5) 仍不准（疑似用了内置B05演示值，或真实比例非 1/3.022）。\n- 已加诊断输出，需用户打点后反馈 SnackBar/Console 的 a/d/c/f 参数才能最终定位。\n\n---\n\n## 三、待办（承接 8-17 日志）\n\n1. [ ] **验证坐标修复**：粘贴浏览器端真实校准参数 → 打点对比 CAD `ID` 坐标（预期 \u003c2mm，需实测）。\n2. [ ] 「应用内置B05」改为读取浏览器端上次保存的参数（当前硬编码中心映射不可用于精度验证）。\n3. [x] 图钉视觉优化（大头针样式 + 底部尖端对准 + 白描边数字）。\n4. [ ] Android 构建完成后真机/平板验证（Android/iOS）。\n5. [ ] 多图纸支持：7 栋其他楼层 PDF → PNG 底图批量生成。\n\n---\n\n## 三、关键技术备忘\n\n- **Flutter 坐标换算正确姿势**（InteractiveViewer + 手势打点）：\n  ```\n  InteractiveViewer.transformHitTests = true（默认）\n  → GestureDetector.localPosition 已是未缩放局部坐标（勿再乘变换矩阵）\n  → 盒子坐标 - 居中偏移 = 图片显示坐标\n  → /dispW、/dispH = 归一化比例\n  → × imgW、× imgH = 整图像素坐标\n  → CadCoordMapper.screenToWorld(px, py) = 真实图纸坐标\n  ```\n- **浏览器端校准参数格式**：`{a,b,c,d,e,f,imgW,imgH}`，`imagePxToWorld` 用 `X=a*px+c, Y=d*py+f`。\n  单点校准：`scale=imgW/1489`，Y 系数存 `MAP.d`（8-17 已修字段错位 bug）。\n- **内置 B05 ≠ 真实校准**：仅为离线演示，中心对齐；精度验证请用浏览器「复制参数」。\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-20.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-20.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTIwLm1k","base":"DEVELOPMENT_LOG_2026-08-20.md","title":"开发日志 2026-08-20（坐标验证闭环 + 校准持久化 + 校准库方案 B）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-20","mtime":"2026-08-25","size":13470,"chars":8134,"lines":186,"nhead":23,"lead":"本文档为上下文记录，供后续（换电脑/新会话）继续开发使用。 项目：工地巡检智能化管理（腾讯大铲湾 DY04 / 7 栋 B05 图纸验证） 续接自：DEVELOPMENT_LOG_2026-08-18.md 目的：固化\"CAD 坐标验证→持久化→免重复校准\"的完整结论，减少重复探索的积分消耗。","text":"# 开发日志 2026-08-20（坐标验证闭环 + 校准持久化 + 校准库方案 B）\n\n\u003e 本文档为上下文记录，供后续（换电脑/新会话）继续开发使用。\n\u003e 项目：工地巡检智能化管理（腾讯大铲湾 DY04 / 7 栋 B05 图纸验证）\n\u003e 续接自：`DEVELOPMENT_LOG_2026-08-18.md`\n\u003e 目的：固化\"CAD 坐标验证→持久化→免重复校准\"的完整结论，减少重复探索的积分消耗。\n\n---\n\n## 一、今日完成（三阶段）\n\n### 阶段 1：坐标验证闭环（浏览器 vs Flutter vs CAD 真实值）\n\n**结论：两端算法一致，实测偏差压线 \u003c 2mm，精度达标（接受现状）。**\n\n- 单位：mm。验证点取图纸同一位置，三方坐标如下：\n\n| 来源 | X (mm) | Y (mm) |\n|------|--------|--------|\n| 浏览器端 (localhost:8002) | 107.9 | 109.8 |\n| CAD 真实值 | 107.9692 | 107.8095 |\n| Flutter 端 (localhost:8085) | 107.0 | 109.5 |\n\n- 偏差：\n  - 浏览器 vs CAD：ΔX=0.07, ΔY=1.99 → 综合 ≈ 1.99mm（压线合格）\n  - Flutter vs CAD：ΔX=0.97, ΔY=1.69 → 综合 ≈ 1.95mm（压线合格）\n  - 浏览器 vs Flutter：ΔX=0.9, ΔY=0.3（两端一致性好）\n- **已知短板**：仅单点校准，Y 方向接近 2mm 上限。若要更稳，需两点/多点校准（未做）。\n- 用户已确认\"接受这个精度，先这样用\"。\n\n**关键事实（避免重复排查）**：\n- 仿射公式：浏览器 `imagePxToWorld` 与 Flutter `CadCoordMapper.screenToWorld` 完全等价：\n  `X = a*px + c；Y = d*py + f`（b=e=0）。详见 8-18 日志根因修复。\n- 校准参数来源：浏览器「复制参数」导出 JSON（嵌套 `m` 字段），Flutter 端 `fromCalibrationMap` 已兼容该格式。\n- B05 示例真实参数：`{\"key\":\"dy04_7_B05\",\"imgW\":4500,\"imgH\":2551,\"paperW\":1489,\"paperH\":844,\"m\":{\"a\":0.3308888888888889,\"b\":0,\"c\":-359.5469524500907,\"d\":-0.3308888888888889,\"e\":0,\"f\":852.7574962071062}}`\n\n### 阶段 2：浏览器校准 JSON 持久化（P0-2 遗留项）\n\n- 把浏览器导出的原始校准 JSON 持久化到本地存储（Web=localStorage，移动端=secure_storage/Hive），换图/重启/刷新后自动恢复，免每次粘贴。\n- 实现：`CadCalibrationStore` 新增 `saveRawJson` / `readRawJson` / `deleteRawJson`，存原始 JSON 文本（与系数存值区分，避免二次转换丢字段）。\n- 弹窗 textarea 预填优先级：内存态 → 持久化原始 JSON → 空占位。\n- 新增「清除校准」按钮（已校准时显示），回到内置演示坐标系并清持久化。\n\n### 阶段 3：校准库（方案 B：多图纸批量自动套用）\n\n- **目标**：已校准过的图纸 key+参数存成\"本地清单\"，App 启动期一次性灌入内存，后续打开任意已校准图纸自动套用，无需手动粘贴或逐张加载。适合多图纸批量场景。\n- **实现**：\n  - `CalibrationLibrary`：固定 key `cad_calib_library_v1` 存清单 `{drawingKey: {raw, map}}`。方法 `upsert`/`remove`/`listCalibrated`/`readRaw`/`buildAll`（纯函数，不依赖 riverpod 以避免循环引用）。\n  - `saveCadCalibration` 自动登记进库（传原始 JSON 时）；内置演示坐标系则从中移除。\n  - `deleteCadCalibration` 同步从库移除。\n  - `applyCalibrationLibrary(ref)`：启动期调用，`buildAll()` 结果灌入 `cadCalibrationMapProvider`。\n  - `main.dart` 的 `AuthBootstrap` 启动期调一次 `applyCalibrationLibrary`（用静态 `_libraryApplied` 防重复）。\n- **用户收益**：每张图纸第一次粘贴校准后，刷新/换图/关App重开/换到其他已校准图纸，坐标都自动准。\n\n---\n\n## 二、文件改动清单\n\n| 文件 | 改动 |\n|------|------|\n| `lib/core/utils/cad_coord.dart` | （前期）`fromCalibrationMap` 兼容浏览器嵌套 `m` 格式 |\n| `lib/core/cad/cad_calibration.dart` | 新增 `saveRawJson`/`readRawJson`/`deleteRawJson`；新增 `CalibrationLibrary` 类（`upsert`/`remove`/`listCalibrated`/`readRaw`/`buildAll`） |\n| `lib/core/di/providers.dart` | 新增 `calibrationLibraryProvider`；`saveCadCalibration`/`deleteCadCalibration` 同步维护校准库；新增 `applyCalibrationLibrary(WidgetRef)` |\n| `lib/features/projects/drawing_viewer_page.dart` | 校准弹窗预填改走校准库；保存时登记进库；`_clearCalibration` 走 `deleteCadCalibration`；新增「清除校准」按钮 |\n| `lib/main.dart` | `AuthBootstrap` 启动期一次性 `applyCalibrationLibrary` |\n| `test/cad_coord_test.dart` | 共 18 个测试：原有 12 + 持久化 3 + 校准库 3 |\n\n---\n\n## 三、测试状态\n\n- `flutter test test/cad_coord_test.dart` → **18/18 通过**（含持久化与校准库）。\n- `flutter analyze`（改动文件）→ 仅 1 个 info 级 `sort_child_properties_last`（既有代码 659 行，非本次引入），无 error/warning。\n- **既有 `test/widget_test.dart` 失败与本改动无关**（登录 UI 集成测试与当前实现脱节），未处理。\n\n---\n\n## 四、运行/调试环境（重要，避免重复踩坑）\n\n- **中文路径乱码**：PowerShell 下 `cd`/命令被拆乱。统一用 junction 规避：\n  `mklink /J c:\\sp \"f:\\建筑验收工具\\site-patrol\"`，之后 `cmd /c \"cd /d c:\\sp \u0026\u0026 flutter ...\"`\n- **端口占用**：Flutter Web 用 8085；静态服务器用 8002。占用时换端口或 `Stop-Process` 对应 python/chrome。\n- **预览地址**：\n  - Flutter Web：`http://localhost:8085`（需 `flutter run -d chrome --web-port=8085` 或 run config）\n  - 浏览器 CAD 查看器：`http://localhost:8002/cad_viewer_hybrid.html`（静态服务器 `_start_static.bat` / `serve_web.ps1`）\n- **校准弹窗两个按钮别混**：「应用」= 灌入粘贴的 JSON；「应用内置B05」= 回退演示坐标系。用户曾误点后者导致显示内置值。\n- `web/cad_viewer_hybrid.html` 已加 `window.onerror` 全局捕获，白屏时显红色错误便于无 F12 排查。\n\n---\n\n## 五、遗留 / 待办\n\n1. **两点/多点校准**：当前单点校准 Y 方向接近 2mm 上限，可上多点标定把误差再压小。\n2. **浏览器端持久化**：`cad_viewer_hybrid.html` 刷新会丢校准（未做 localStorage 自动保存/恢复）。仅 Flutter 端有库。\n3. **方案 A（未做）**：浏览器端校准后自动推给 Flutter（共享 JSON 文件/同源读取），连粘贴都省。当前仅方案 B（Flutter 端库）已落地。\n4. **校准库 UI**：当前无\"校准库管理\"页面（列出已校准图纸、批量导出/导入）。如需要可加。\n\n---\n\n## 六、关键决策记录（供接续）\n\n- 用户确认精度 **\u003c 2mm 接受现状**，不要继续优化单点算法。\n- 用户选择 **方案 B（校准库）** 而非方案 A，因是多图纸批量场景。\n- 校准库与单图纸 `saveCadCalibration` 是**同一入口**，不会重复存储；库清单是索引，系数是按 key 单独存（`cad_calib_v3_\u003ckey\u003e`），两者并存。\n- `cad_calibration.dart` 保持纯净、**不 import providers/riverpod**，循环依赖靠 `buildAll()` 返回 Map、由 providers 层写入解决。\n\n---\n\n## 七、2026-08-20 后续补充（下午：UI 修正 + Web 预览内置校准）\n\n\u003e 承接上半日「坐标验证→持久化→校准库」后，继续处理用户反馈的 3 项问题。\n\n### 1. 拍照验收页（现改名「拍照记录」）图纸串图修复\n- **现象**：从图纸页进入拍照页，`CaptureArgs` 已带 `drawingKey`，但 `capture_page` 没用，而是按楼层名 `floorToDrawingKey(_floor)` 查全局 `nkf_*` 表，7栋B1 找不到 → fallback 到南方医院 `nkf_west_1f`，显示成另一个项目的图纸。\n- **修复**（`lib/features/capture/capture_page.dart`）：\n  - 新增成员变量 `Drawing? _drawing`；`_drawingKey` getter 优先用 `widget.args.drawingKey`。\n  - `build` 中直接查 `dy7Drawings`（常量表，`Map\u003cString,Drawing\u003e`）而非依赖异步 `drawingsProvider`，避免 provider 加载完成前 fallback 串图。\n  - 文案：AppBar「拍照验收」→「拍照记录」，底部按钮「保存验收记录」→「保存记录」。\n- **配套**（`lib/features/projects/drawing_viewer_page.dart`）：`_anchor()`（锚点按钮）进入拍照页时也补上 `drawingKey: widget.d.key`。\n\n### 2. 图钉/坐标标签遮挡图纸\n- **现象**：`_buildAnnotationMarks` 图钉半径 16px、右侧带固定坐标标签，缩放时不变化，遮挡图纸内容。\n- **修复**（`drawing_viewer_page.dart`）：图钉缩到半径 10px，**默认不显示坐标标签**；点击图钉弹窗显示完整 X/Y 坐标。减少遮挡。\n\n### 3. Web 预览「没有校准」→ 内置真实校准种子\n- **根因**：之前校准库只给移动端（secure_storage/Hive）用，Web 的 localStorage 从没被写入过真实参数，启动 `applyCalibrationLibrary` 读到空清单 → 回退演示坐标系（中心=原点近似），即用户看到的\"没校准\"。\n- **修复**（`lib/main.dart` 启动期）：\n  - 用真实 B05 参数（4500×2551 底图，`a=0.3308888888888889, d=-0.3308888888888889, c=-359.3091448275862, f=852.4496763746746`）构造 `CadCoordMapper`，`lib.upsert('dy04_7_B05', ...)` 写入校准库清单（`cad_calib_library_v1`）。\n  - **仅在清单尚未登记该图纸时写入**（`readRaw` 判空），不覆盖用户手动校准。\n  - 启动后 `applyCalibrationLibrary` 将其灌入内存，B05 打开即带真实坐标。\n- **验证**：`flutter build web --release` 产出 `build/web`；用 Python 静态服务 `c:\\sp\\build\\web` 于 **http://localhost:12345/**（8080 被系统 HTTP.sys 占用，serve_web.ps1 因中文路径编码错误需改用 junction 路径 `c:\\sp\\build\\web`）。\n\n### 变更文件清单（下午）\n| 文件 | 改动 |\n| --- | --- |\n| `lib/features/capture/capture_page.dart` | 拍照记录改名；按 drawingKey 查 dy7Drawings 修复串图；图钉缩小/去标签在另一个文件 |\n| `lib/features/projects/drawing_viewer_page.dart` | `_anchor()` 补 drawingKey；`_buildAnnotationMarks` 图钉缩小+去默认标签 |\n| `lib/main.dart` | 启动期注入内置真实 B05 校准种子（仅空清单时写入） |\n\n### 明日待办（用户提醒）\n1. **拍照量尺校对功能**：拍照后量尺尺寸（照片中实测）与图纸坐标/真实尺寸做比对校验。⭐ 重点\n2. 回归验证 capture_page 多图纸串图修复效果。\n3. 验证 Web 预览其他有底图图纸是否需要预置真实校准。\n\n### 环境提示（更新）\n- **Web 预览地址**：`http://localhost:12345/`（Python 静态服务 `c:\\sp\\build\\web`）。\n- 8080 被系统 HTTP.sys（PID 4）占用，勿用。\n- `serve_web.ps1` 的 root 已改 `c:\\sp\\build\\web`（junction）以避中文编码问题。\n\n---\n\n## 八、2026-08-21 上午：拍照量尺校对功能 + 串图回归 + 校准范围确认\n\n### 1. ⭐ 拍照量尺校对功能（核心新增）\n- **需求**：拍照后量尺尺寸（现场实测）与图纸坐标/真实尺寸做比对校验。\n- **模型**（`lib/data/models.dart`）：新增 `ScaleCheck{name, measuredMm, drawingMm}`，含 `deviation`、`deviationPct`、`pass(tolMm, tolPct)`。\n- **UI**（`lib/features/capture/capture_page.dart`）：\n  - 新增「拍照量尺校对」区块（位于视觉识别结果之后、操作区之前）。\n  - 顶部显示**当前图纸标定比例（mm/px）**（`cadCalibrationMapProvider[_drawingKey]` 的仿射 `a` 系数），把\"实测\"和\"图纸坐标/真实尺寸\"关联：B05 ≈ 0.3309 mm/px。\n  - 容差双控：±mm 与 ±%，取\"且\"逻辑。\n  - 逐项卡片：量尺项名称 + 实测 mm + 图纸 mm → 实时算偏差/偏差率，标注「合格/超差」徽标。\n  - 区块头部汇总「合格 N/总数 · 合格率%」。\n  - 支持增/删/改量尺项。\n- **验证**：`flutter analyze` 无 error（仅 info 级 prefer_final/unnecessary_import，非本次引入阻断项）；`flutter build web --release` 成功；18/18 单测通过；12345 服务新产物 200。\n\n### 2. 图纸串图修复回归验证（已完成）\n- `capture_page._resolveDrawing` 优先查 `projectMap[key] ?? dy7Drawings[key] ?? drawings[key]`。\n- 确认 `dy7Drawings` 含 `dy04_7_B05`（真实 B05 PNG），且 `drawing_viewer_page` 两入口（`_anchor`、`_captureAtAnnotation`）均传 `drawingKey: dy04_7_B05`。\n- 结论：7栋 B05 进入拍照页必解析到正确图纸，不再 fallback 到南方医院 `nkf_west_1f`，串图问题已修复。\n\n### 3. Web 其他图纸预置校准确认（无需新增）\n- 全量排查所有 `Drawing`：`dy7Drawings` 中仅 `dy04_7_B05` 有真实 PNG 底图（其余 B02/D01/详图等 `src:''`，走 CAD 占位，无图无需校准）。\n- nkf 系列属南方医院另一项目，不在 7栋 Web 预览流程内。\n- 结论：**仅 B05 需要预置真实校准，已于昨日内置种子**（main.dart 启动期注入，仅空清单时写入）。Todo 3 结案。\n\n### 变更文件（2026-08-21）\n| 文件 | 改动 |\n| --- | --- |\n| `lib/data/models.dart` | 新增 `ScaleCheck` 量尺校对模型 |\n| `lib/features/capture/capture_page.dart` | 拍照量尺校对区块 + 标定比例读数 + 容差/增删逻辑 |\n\n### 明日/后续建议\n- 量尺校对结果当前为页面内状态，未持久化到缺陷记录；若需随「保存记录」一起落库，扩展 `Defect` 模型加 `scaleChecks` 字段即可。\n- 真实拍照（image_picker）仍注释走模拟，量尺为手动录入；如需照片内自动量尺（像素→mm via 标定比例），需图像识别标尺/参照物，超出当前范围。\n\u003c/content\u003e\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-21.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-21.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTIxLm1k","base":"DEVELOPMENT_LOG_2026-08-21.md","title":"开发日志 2026-08-21（周五）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-21","mtime":"2026-08-25","size":4624,"chars":2741,"lines":61,"nhead":9,"lead":"## 一、今日完成","text":"# 开发日志 2026-08-21（周五）\n\n## 一、今日完成\n\n### 拍照记录 / 图纸底图（核心）\n1. **默认图纸设置**\n   - 7 栋项目 (`tencent-dy04-7`) 默认图纸 = `dy04_7_B05`（地下室夹层组合平面图，B05 PDF 底图）\n   - 南科大项目 (`nkf`) 默认图纸 = `nkf_west_1f`（西楼一层平面图，对应 `建施报_06_V1.0_西楼一层平面图.pdf`）\n   - 改动位置：`lib/features/capture/capture_page.dart` 的 `_defaultFloorKey` 映射\n\n2. **图名规范化**\n   - 7 栋 10 张图纸图名统一改成 PDF 原文件名格式：`建筑 AW-7-XXX V1.0 ...`\n   - 改动位置：`lib/data/mock/mock_data.dart`（`dy7Drawings` / `dy7Floors`）\n\n3. **批量转 PNG 并打包**\n   - 用 `pypdfium2` 把 10 张有 PDF 的 7 栋图纸转成本地 PNG：\n     `B01 / D01 / D03 / D04 / K01 / K02 / E01 / F01 / J01 / J04`\n   - 存入 `assets/drawings/`，并在 mock_data 里把对应 Drawing 的 `src` 指向本地 PNG\n   - 顶部锚点栏显示已选图纸全名（PDF 原文件名）\n\n4. **移除无源文件图纸**\n   - 从 7 栋可选列表移除 `dy04_7_B02`（资料目录既无 PDF 也无可用 DWG，OCF 转图必失败），避免用户切到空底图\n\n### OCF 服务修复\n5. 修复 `server/ocf_server.py` 缺失的 `_read_body` 方法（所有 POST 接口 saveAsImage/dwgInfo/dwgToOcf 此前一调用就 500，导致切无 PNG 图纸时前端拉不到远程图）\n6. 修复 `ocf_server.py` 调浩辰 `ocfSaveAsImage` 时**缺失 `imageWidth/imageHeight` 传参**（之前只送了 fileBase64，云图返回 export error）\n7. 把扣次接口 `_guard` 改为**本地预览默认允许** OCF 扣次（不设 `GCAD_ALLOW_CHARGE` 也能用，省去环境变量配置）\n\n### 构建修复\n8. 修复 Flutter web 构建缓存（`.dart_tool/flutter_build` 陈旧）导致 `assets/drawings` 资源**完全没打进产物**，这是之前\"切换图纸看不到底图\"的根因之一。已清缓存重构建并同步到 `C:\\sp\\build\\web`（12345 预览目录）\n\n## 二、积分/额度消耗优化（重要）\n- **本地 PNG 优先**：凡是资料里有 PDF 的图纸，一律预先用 `pypdfium2` 离线转 PNG 存 `assets/drawings/`，运行时不走 OCF 接口，**不消耗浩辰云图额度**。\n- 只有真正没有 PDF 的图纸（如已移除的 B02）才走 `ocfSaveAsImage`（扣次）。当前 7 栋列表里已无此类图纸，所以**正常预览 0 额度消耗**。\n- `ocf_server.py` 的 `ocf_cache/{key}.png` 会缓存生成结果，重复请求同图不重复扣次。\n- 提交信息已记录该策略，后续加图纸时优先离线转 PNG。\n\n## 三、本地服务运行状态\n- 静态预览：`http://localhost:12345/`（python -m http.server，根 `C:\\sp\\build\\web`）\n- OCF 转换：`http://localhost:8800/`（server/ocf_server.py，仅无 PNG 图纸才需要）\n- 重启命令（若服务挂了）：\n  ```\n  cmd /c \"cd /d F:\\建筑验收工具\\site-patrol\\server \u0026\u0026 start /B python ocf_server.py\"\n  cmd /c \"cd /d C:\\sp\\build\\web \u0026\u0026 start /B python -m http.server 12345\"\n  ```\n  \u003e 注意：仓库根目录含中文（建筑验收工具），PowerShell 直接调 git 会 GBK 乱码；一律用 `cmd /c \"cd /d \u003c绝对路径\u003e \u0026\u0026 git ...\"` 方式操作。\n\n## 四、待办项（下周一继续）\n- [ ] **补全剩余图纸 PDF 转 PNG**：当前 7 栋已覆盖 10 张；若后续资料补充 B02 等 DWG/PDF，需重新评估是否离线转图还是走 OCF。\n- [ ] **南科大项目图纸清单核对**：`nkf` 项目目前 `drawings`/`floors` 仍有旧名（西楼·地下一层/一层等），图名是否也要统一为 PDF 原文件名（建施报_XX）待用户确认。\n- [ ] **测量功能模块（measure）**：`lib/features/measure/`、`server/measure_server.py` 等已提交但功能未联调验证，下周需测试测量记录流程。\n- [ ] **拍照记录坐标校准复核**：B05 已验证 \u003c2mm；新增的 B01/D01 等 PNG 的 `w/h` 与真实物理尺寸对应关系需确认（mock 里 w/h 取自 PDF 像素尺寸，定位精度待实测）。\n- [ ] **web 预览跨设备访问**：当前仅 localhost，若需在手机/其他机器预览需改用可访问 IP 或部署。\n- [ ] **OCF 额度监控**：上线前需确认浩辰云图账户额度，并决定生产环境是否关闭本地默认允许扣次（`GCAD_ALLOW_CHARGE` 反向控制）。\n\n## 五、提交记录\n- commit `0ea1e63` → 已推送 `origin/main`\n- 本次含测量模块等既有未跟踪文件一并提交（31 个文件）\n- 提交信息（英文，规避 Windows 中文路径 git 编码问题）：\n  `feat: capture drawings multi-switch, PDF-name normalization, ocf_server fix`\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-24.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-24.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTI0Lm1k","base":"DEVELOPMENT_LOG_2026-08-24.md","title":"开发日志 2026-08-24（周一）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-24","mtime":"2026-08-25","size":3589,"chars":2057,"lines":54,"nhead":9,"lead":"## 一、今日完成","text":"# 开发日志 2026-08-24（周一）\n\n## 一、今日完成\n\n### 1. 南科大(nkf)项目图纸图名统一为 PDF 原文件名\n- 与 7 栋一致，把 `西楼·一层平面图` 等旧名改为 `建施报_XX_V1.0_...` 原文件名\n- 覆盖范围：`floors`（nkf_total/west_b2/west_b1/west_1f/west_2f/west_4f/east_1f/east_4f）、`drawings`（11 张全部）、`blueprintDrawings`（3 张），以及 capture_page/blueprint_viewer_page 注释\n- 图名↔PDF 映射：\n  - nkf_total → 建施报_01 总平面图\n  - nkf_total_v → 建施报_02 首层竖向总平面图\n  - nkf_west_b2 → 建施报_04 西楼地下二层\n  - nkf_west_b1 → 建施报_05 西楼地下一层\n  - nkf_west_1f → 建施报_06 西楼一层 ← 默认图纸\n  - nkf_west_2f → 建施报_07 西楼二层\n  - nkf_west_4f → 建施报_09 西楼四层\n  - nkf_east_1f → 建施报_20 东楼一层\n  - nkf_east_4f → 建施报_23 东楼四层\n  - nkf_inf_1f → 建施报_31 感染楼一层\n  - nkf_cor_1f → 建施报_38 连廊一层\n\n### 2. 测量模块联调修复（核心阻断项）\n- **问题**：测量模块图纸侧量距依赖 `cad_calib` 校准数据，但 web 全新环境 LocalStorage 为空，任何图（含 B05）进测量页点图纸两点都提示\"未校准\"，流程卡死。\n- **修复**：在 app 启动时 seed B05 的演示校准系数（录于 08-20 日志）：\n  - `key=dy04_7_B05, imgW=4500, imgH=2551`\n  - `a=0.3308888888888889, b=0, c=-359.3091448275862, d=-0.3308888888888889, e=0, f=852.4496763746746`\n  - 仅当该图「尚未校准」时写入，不覆盖用户真实校准\n  - 新增 `seedDefaultCalibrations(ref)` + `appInitProvider`，在 `App.build` 触发\n- **已知限制**：B05 系数为演示值（08-18 日志警告含系统性偏移 X偏0.5/Y偏1.6mm），真实精度需现场浏览器校准。南科大(nkf)为假图纸无真实坐标，测量模块仍会提示\"图纸未校准\"——符合预期（示意底图）。\n\n### 3. 坐标校准复核结论\n- 7 栋新增图 B01/D01/D03/D04/K01/K02/E01/F01/J01/J04：**cad_calib 库里均无校准数据**（仅 B05 有），属「能显示底图但无法精确坐标定位」的待校准项，非 bug。w/h 已用真实 PDF 像素尺寸，将来校准时系数基于真实像素定位才准。\n- 南科大 nkf：w/h=1500×944 示意、无 cadOcfKey、无校准，靠 hotspot 跳转，图名统一不影响坐标。\n\n### 4. 本地服务重启（周末停了）\n- 12345 静态预览：`python -m http.server 12345`（根 C:\\sp\\build\\web）\n- 8800 OCF 转换：`server/ocf_server.py`\n- 8820 测量落库：`server/measure_server.py`\n\n## 二、积分/额度消耗（持续保持）\n- 有 PDF 图纸离线转 PNG，运行时不走 OCF → 零额度\n- 仅无 PDF 图才走 OCF 且 ocf_cache 缓存不重复扣次\n- nkf 为假图纸，完全不碰 OCF\n\n## 三、待办（后续）\n- [ ] **现场真实校准 B05**：用浏览器校准弹窗获取精准系数替换演示值（消除系统性偏移）\n- [ ] **7 栋新增图校准**：B01/D01 等需现场/浏览器校准才能精确量距（否则仅能显示底图）\n- [ ] **南科大测量支持**：若需南科大也能图纸量距，需补 nkf 各图的 cad_calib 校准（但 nkf 是示意底图，可能本就不要求精度）\n- [ ] **测量模块端到端实测**：浏览器走查 7栋B05 完整流程（图纸量距→照片→参考物→偏差），验证 save 到 8820 落库\n- [ ] **跨设备预览**：当前仅 localhost\n- [ ] **生产 OCF 扣次开关**：GCAD_ALLOW_CHARGE 反向控制\n\n## 四、提交\n- 待提交（本次会话结束前 commit + push）\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-26.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-26.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTI2Lm1k","base":"DEVELOPMENT_LOG_2026-08-26.md","title":"开发日志 2026-08-26（周三）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-26","mtime":"2026-08-27","size":3510,"chars":1955,"lines":52,"nhead":11,"lead":"## 一、今日更新","text":"# 开发日志 2026-08-26（周三）\n\n## 一、今日更新\n\n### 1. 图纸校准：轴网交点自动套图（核心）\n- 安装 **ODA File Converter**（`C:\\Program Files\\ODA\\ODAFileConverter 27.1.0\\`），固化 `server/dwg_to_dxf.py` 批量转换\n- 用户提供天正 T3 DXF（G 盘），提取轴网交点 JSON：\n  - B01：174 点（块内 `N-GRID建筑轴线` 层，递归展开块变换）\n  - D01：63 点、D03：41 点、D04：37 点（`A-AXIS-GRID` 层，D03/D04 按 Y 拆分）\n- 新增 `lib/core/cad/axis_auto_calibration.dart`：\n  - `detectAxisLines` 识别底图轴线 → 交点\n  - `matchAxisGridDeterministic`：利用轴网行列结构一维投票匹配（间距比值求 scale，差值投票求平移）\n  - RANSAC 回退 + `fitAffineRobust` 最小二乘仿射拟合\n- **修复重要 bug**：`fitAffineLeastSquares` 的 Y 维 d/e 系数顺序与 `CadCoordMapper.screenToWorld` 语义不符（含旋转的完整仿射会出错），已交换修正，手动多点校准与自动套图均受益\n- 6 项算法测试全部通过（理想/噪声/无对应/最小二乘 sanity）\n\n### 2. 默认校准 + 不提示\"未校准\"\n- 修复 `seedDefaultCalibrations` 只写 localStorage 不入内存 map 的 bug：B05 种子写入后 AR量尺等页面读内存 map 仍为 null 导致\"未校准\"\n- 扩展为所有内置图纸（B05/D01/D03/D04/B01）启动期写入 store + 内存 map\n- 提取 `builtinCalibrationFor` 为公共函数（`providers.dart`），`drawing_viewer_page` 委托共用\n\n### 3. 拍照调用相机 BUG 修复\n- **问题**：拍照记录页\"开始拍照\"按钮，选点后点击无法调相机\n- **根因**：`_confirmPointAndCapture` 检查 `_anchorLabel == '待选点'`，用户选点但未吸附到最近锚点（距离 \u003e0.12）时 `_anchorLabel` 仍是\"待选点\"，点按钮被\"请先选部位\"拦截\n- **修复**：选点后一步直接调用相机（`_doCapture`），不再卡中间步骤\n\n### 4. AR量尺 Web 端相机可用\n- **问题**：Web/非 iOS 平台 AR量尺只显示\"仅 iPhone Pro\"文字，无法调相机\n- **修复**：退化为\"拍照+参考物比例估算\"简易量尺（`_buildWebFallback`），可调相机/相册 + 录入参考物实际尺寸\n\n## 二、遗留问题（待办）\n\n### 1. B01 校准精度不足（关键）\n- B01 组合平面图轴网自动匹配在真实底图上**不可靠**：\n  - 轴网线被打断（横线在底图上检测不到足够的强线）\n  - 底图 = A0 图纸渲染（1189×841mm，1:250），但轴网 X/Y 比例与底图显示区域不匹配\n  - 竖线匹配较可靠：`a=24.88, c=291881.8`；Y 方向（f≈1300500）精度有限\n- **G 盘（T3 DXF 源）当前无法访问**（`G:\\` 系统找不到路径，可能是网络盘/外接盘断开），需恢复后继续\n- 已确认：**B01 块内有 2583 个 DIMENSION 尺寸标注**（含精确 defpoint CAD 坐标），G 盘恢复后可做更精确的尺寸标注自动校准\n\n### 2. D01/D03/D04 校准为估算初值\n- 轴网自动套图在合成数据上通过，但**未在真实底图上验证**（`detectAxisLines` 对真实 CAD 渲染底图检测线数不足）\n- 当前种子为 1:150 + A2 图幅估算初值（量级正确，偏移/比例需精修）\n\n### 3. 预览服务器 / 构建\n- 构建产物已同步到 `web/`，预览 `http://127.0.0.1:8080/`\n- 未提交的临时 bat 文件已清理\n\n## 三、积分/额度消耗\n- 安装 ODA File Converter、PyMuPDF、matplotlib（均为本地工具，无 API 额度）\n- 所有图纸离线转换，运行时零额度\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-27.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-27.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTI3Lm1k","base":"DEVELOPMENT_LOG_2026-08-27.md","title":"开发日志 2026-08-27（周四）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-27","mtime":"2026-08-27","size":7574,"chars":4637,"lines":137,"nhead":18,"lead":"## 一、今日完成","text":"# 开发日志 2026-08-27（周四）\n\n## 一、今日完成\n\n### 1. F 盘发现大铲湾 DY04 完整资料\n之前以为数据在 G 盘（断开），实际 `F:\\建筑验收工具\\大铲湾DY04_资料\\` 含完整 7 栋施工图\n（DWG + PDF + DXF）。用 Python 检查所有 PDF 物理页面尺寸 + DXF 实体构成。\n\n### 2. B01 精确校准（核心突破）\n\n**关键发现**：用户提供的 B01 DXF（`建施_AW-7-B01_V1.0_地下一层顶板组合平面图.dxf`）\n虽经 ODA 转换，但**完整几何保留在块定义中**：\n- 布局 `7栋组合图`：标题栏标注 **1:250**\n- 模型空间 INSERT `AD-P-B1D` @ (0, 1240137.5)\n- 块 `AD-P-B1D`：453 个 DIMENSION（真实模型坐标）\n- 块 `AD-Dote-BF`：**轴网层** `A-Axis`（51 竖 + 32 横）+ `A-Axis-GRID`（9 竖 + 29 横）\n  - 轴距 **8400mm**（DIMENSION 测量值 160 次）\n\n**校准推导**（暗列/暗行 + 轴网线匹配）：\n- **scale=66.222 mm/px**（= 1192×250/4500 = PDF 物理宽×1:250 / 底图像素宽）\n- **c=19500**：竖线 7/9 精确命中底图暗列（X 像素 1354/1735/1862/2369/2496/3004/3511）\n- **f=1430000**：横线 21/21 精确命中底图暗行（Y 像素 2867/2740/.../76）\n- 底图右侧未画完整轴网（X\u003e302400 超出打印窗口），属正常\n\n**数据文件更新**：\n- `assets/axis_data/dy04_7_B01.json` 重新生成：**261 个交点**（原 174 个来自错误 DXF，\n  X 坐标偏移严重，导致 B01 校准不准确）\n- `lib/core/di/providers.dart` builtinCalibrationFor B01：\n  a=24.88 → **66.222**, c=291881.8 → **19500**, f=1300500 → **1430000**\n\n### 3. D01 / D03 / D04 精确校准种子（基于 PDF 物理 + 打印比例）\n\n| 图纸 | PDF 物理 | 打印比例 | a mm/px | c | d mm/px | f |\n|---|---|---|---|---|---|---|\n| D01 | 1265.1×596.9 mm | 1:150 | 79.17 | -172 | -79.02 | 89535 |\n| D03 | 843.8×596.9 mm | 1:100 | 35.16 | 0 | -35.15 | 59690 |\n| D04 | 843.8×596.9 mm | 1:100 | 35.16 | 0 | -35.15 | 59690 |\n| B01 | 1192.0×843.8 mm | 1:250 | 66.22 | 19500 | -66.22 | 1430000 |\n| B05 | 1489.1×843.8 mm | (视口真实校准) | 0.331 | -359.3 | -0.331 | 852.4 |\n\n**关键证据**：\n- D01 RANSAC 1D 投票 7/7 inliers 与 axis_data JSON 对齐（a=79.17, c=-172）\n- B01 暗列/暗行精确匹配（见上）\n- 所有图 a = PDF物理宽 × 打印比例 / 底图像素宽\n\n### 4. 单元测试新增/更新\n- `test/builtin_seed_test.dart`：5 个测试全过（4 张图 a/d 精度 + 未知图 null）\n- `test/axis_auto_calibration_test.dart`：8 个测试全过（detectAxisLines v2 + 轴网匹配）\n- 总计 13 个测试全部通过\n\n## 二、未完成 / 遗留事项\n\n1. **detectAxisLines 仍被标高线干扰** — D01 底图 v2 检出 10 横线，其中含标高线/剖面线，\n   需进一步区分\"轴网横线\"与\"标高/剖面线\"（可结合 TEXT 实体分布或水平虚线特征）。\n2. **D01 RANSAC Y 方向** — 被标高线干扰，改用 PDF 物理推算 f=89535（已足够精确）。\n3. **其他图纸**（K01/E01/J01/F01 等详图）尚未检查校准 — 它们可能也是块内几何，\n   可用同样方法（PDF 物理 + 打印比例 + 暗线匹配）精修。\n\n## 三、技术要点\n\n### 1. 天正 DXF 几何在块定义中\n天正图经 ODA 转换后，模型空间实体稀少（B01 只剩 7 HATCH + 8 LWPOLYLINE + 1 INSERT），\n**完整几何都在 INSERT 引用的块定义中**。用 ezdxf 需：\n```python\nmsp = doc.modelspace()\nfor e in msp.query(\"INSERT\"):\n    blk = doc.blocks.get(e.dxf.name)  # 进入块\n```\n块内坐标 + INSERT 偏移 = 模型空间坐标。\n\n### 2. 轴网层识别\n- `AD-Dote-BF$0$A-Axis`：完整轴线（51 竖 + 32 横，间距 8400mm）\n- `AD-Dote-BF$0$A-Axis-GRID`：主轴网（9 竖 + 29 横）\n- `AD-P-B1D$0$N-GRID建筑轴线`：16 条 LINE\n- `AD-P-B1D$0$PUB_DIM`：423 个 DIMENSION（主尺寸标注）\n\n### 3. 校准匹配方法（B01 成功）\n1. 从 DXF 轴网层提取竖线 X / 横线 Y（模型坐标）\n2. 底图降采样（min-pooling）统计暗列/暗行峰值\n3. 用「暗列间距中位数」估算 scale：scale = 轴距(8400) / 暗列间距(128px) = 65.6\n4. 与 PDF 物理推算交叉验证：scale = PDF宽×打印比例/底图宽 = 66.222\n5. 固定 scale，搜索 c/f 使轴网线投影命中暗列/暗行最多\n\n### 4. a/c/d/f 符号约定\n仿射 wx = a*px + c, wy = d*py + f，d 是负的（像素 Y 向下，CAD Y 向上）。\n- a \u003e 0：模型 mm / 像素\n- d \u003c 0：模型 mm / 像素（Y 翻转）\n- c = X_render_min（底图最左像素对应的模型 X）\n- f = Y_render_max（底图最上像素对应的 CAD Y 最大值）\n\n## 四、待完成项评估（2026-08-27 收工时复盘）\n\n### A. detectAxisLines 误检标高/剖面线\n- **现状**：v2 检出的 10 条横线中含 5~6 条是图框外边线 + 标高线/剖面线。\n  图框外边线 y=0/17/1109/1126（100% 宽），标高/剖面线 y=577/591/594/772/776（67% 宽），与轴网横线同长度，无法用长度阈值剔除。\n- **影响面**：仅影响**无内置种子图**的 `_autoCalibrateSilently` 兜底。当前已有 B05/B01/D01/D03/D04 共 5 张内置种子，覆盖项目主要图纸。误检对当前用户体验无影响。\n- **改进方案**（后续）：\n  1. `detectAxisLines` 加**图框边过滤**（y \u003c 5% H 或 y \u003e 95% H）\n  2. `_autoCalibrateByAxisGrid` 用 axis_data JSON 横线 Y 范围做**后置约束**\n  3. 主轴网**模数投票**（已知 D01 轴距 1300mm = 74px @ a=17.51）过滤非模数线\n- **决策**：**非阻塞**，留作架构改进。需新增图时再做。\n\n### B. 详图（K01/E01/F01/J01/K02/J04）精确校准\n- **现状分析**：\n  - K01（墙身详图，2400×3398，PDF 594.1×841mm）— 比例估计 1:20，但未验证\n  - E01（楼梯平面，2401×1696，PDF 841×594.1mm，标题栏显示 1:50）— 验证后 a 应≈17.51\n  - F01（绑定版楼梯，2400×5087，PDF 596.9×1265.1mm）— 比例估计 1:50/100，含多图\n  - J01（门窗详图，2401×1696）— 比例未知\n  - 详图**无轴网交点**（非平面/剖面图），量尺需求低于平面图\n- **核心风险**：详图标题栏比例**未经 OCR 验证**，若猜错比例则种子完全错，**比无种子更危险**\n  （用户会看到\"已校准\"但量尺全错）。\n- **E01 比例验证**（线下分析）：\n  - 底图 22 条水平长线，间距集中在 27~28px\n  - 若 1:50 准确，28px × 17.51 = 490mm（非标准尺寸）→ **1:50 假设不严格匹配**\n  - 标题栏文字太小，PyMuPDF 提不到（PDF 文字转轮廓）\n- **决策**：**本次不写详图种子**。理由：\n  1. 详图无轴网，量尺需求低\n  2. 比例未 OCR 验证，错误种子风险 \u003e 收益\n  3. 用户可在 app 内用\"参照物 mm 输入\"自校准（已支持）\n  4. 当前 5 张内置种子图已覆盖项目主要图纸\n- **后续路径**（需用户介入）：\n  1. 用户提供每张详图标题栏的精确比例（如\"1:25\"、\"1:50\"）\n  2. 或提供已转 DXF（含 DIMENSION）+ 底图渲染范围\n  3. 写入 `builtinCalibrationFor` 近似种子（c/f 边距估算）\n\n### C. 其他\n- `flutter analyze` 仍有 25 个 info lint（`prefer_const`、`withOpacity` deprecated）— 既有代码遗留，非阻塞\n\n## 五、已更新的文件\n- `lib/core/di/providers.dart`：B01 种子精修（a=66.222, c=19500, f=1430000）\n- `assets/axis_data/dy04_7_B01.json`：重新生成（261 交点，正确坐标）\n- `test/builtin_seed_test.dart`：B01 期望值更新\n- `DEVELOPMENT_LOG_2026-08-27.md`：本日志（含待完成项评估）\n\n## 六、积分/额度消耗\n- 全部本地工具改进（无 API 额度）\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-08-28.md","path":"docs/archive/DEVELOPMENT_LOG_2026-08-28.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA4LTI4Lm1k","base":"DEVELOPMENT_LOG_2026-08-28.md","title":"开发日志 2026-08-28（周五）","group":"归档 · 开发日志","scope":"archive","date":"2026-08-28","mtime":"2026-08-28","size":2723,"chars":1663,"lines":40,"nhead":9,"lead":"## 一、今日完成","text":"# 开发日志 2026-08-28（周五）\n\n## 一、今日完成\n\n### 1. AR 量尺 LiDAR 无法调用（两个根因，已彻底修复）\n- **问题**：进入 AR 量尺页面一直停在\"正在检测 LiDAR 支持…\"占位，LiDAR 调用不上。上一版（70e436c）还好，93ecf4f 之后失效。\n- **根因1（死锁）**：`UiKitView` 被 `if(_supported)` 包裹，而 `_supported` 初始 `false` → view 永不创建 → 原生 channel 永不注册 → `isSupported()` 永远查不到 → 永远卡占位图。上一版能工作是因为 `UiKitView` 无条件渲染。\n- **根因2（channel 名错配）**：Dart 端写死 `ar_measure_0`，Swift 端用引擎分配的 platform view id 拼接 `ar_measure_\u003cid\u003e`，仅碰巧首个 view id=0 才匹配。\n- **修复**：\n  - `ar_measure_page.dart`：`UiKitView` 恢复无条件渲染；`_onViewCreated` 恢复主动查 `isSupported()`。\n  - `ArMeasureView.swift` + `ar_measure_service.dart`：channel 统一固定名 `ar_measure_channel`，不再拼接 viewId。\n- **验证**：✅ 真机（iPhone Pro）测试通过，AR 量尺可正常调用 LiDAR 测距。\n\n### 2. 远程同步 + Web 重建\n- `git fetch` + `git checkout main` + `git pull origin main`（更新到 237c0b9，快进 2 提交）。\n- `flutter clean` 后 `flutter build web --release` 重建，`main.dart.js` 3.6MB，无构建报错。\n- `flutter analyze` 无新增 error/warning。\n- 无缓存预览服务器 `serve_web.py` 启动在 `:8765`（本机 `127.0.0.1`、局域网 `172.25.8.76`）。\n\n## 二、对外汇报\n\n### 本周（8/26-8/28）三个增量\n1. **AR 量尺**：上周基础版 + 本周死锁修复，iPhone Pro 实测可恢复使用。\n2. **语音录入**：拍照页\"问题描述\"支持设备离线语音（中文）。\n3. **AI 审图调研**：帮图AI / 万翼AI / 广联达三家价格档位调研完成，结论——**不自己开发**，先小范围试点帮图AI（按张1元/图框，注册即用）。\n\n### 当前卡点\n- 图纸校准（B01/D0x）在真实底图上的自动匹配精度尚未收敛，预计还需 1–2 周。\n\n### 下周计划（保守）\n先把 AR 量尺 + 语音录
