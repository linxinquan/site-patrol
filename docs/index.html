入这条主链路跑稳，再回头推校准精修。不开新方向。\n\n## 三、本次提交\n\n- `98aa118` `fix(ar): 修复 AR 量尺页面 UiKitView 死锁，LiDAR 通道无法建立`（首次修复，未完全解决）\n- `b64d14c` `fix(ar): 彻底修复 AR 量尺 LiDAR 无法调用（UiKitView 死锁 + channel 名错配）`\n  - `ios/Runner/ArMeasureView.swift`：channel 固定名 `ar_measure_channel`\n  - `lib/core/ar/ar_measure_service.dart`：channel 固定名\n  - `lib/features/measure/ar_measure_page.dart`：UiKitView 无条件渲染 + 主动查支持\n  - **真机验证通过** ✅"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-09-01.md","path":"docs/archive/DEVELOPMENT_LOG_2026-09-01.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA5LTAxLm1k","base":"DEVELOPMENT_LOG_2026-09-01.md","title":"开发日志 2026-09-01（周二）","group":"归档 · 开发日志","scope":"archive","date":"2026-09-01","mtime":"2026-09-15","size":9588,"chars":6106,"lines":106,"nhead":19,"lead":"目的：上下文恢复文档（省积分）。新会话先读本文 + F:\\建筑验收工具\\交付说明_蓝图落地APP_现场工作汇报导出.md。","text":"# 开发日志 2026-09-01（周二）\n\n\u003e 目的：上下文恢复文档（省积分）。新会话先读本文 + `F:\\建筑验收工具\\交付说明_蓝图落地APP_现场工作汇报导出.md`。\n\u003e\n\u003e **⚠️ 最新进展见 `DEVELOPMENT_LOG_2026-09-02.md`**（巡场报告单对齐、巡场清单改名、AI 整改建议），新会话优先读 09-02 文档。\n\n## 一、今日完成\n\n### 1. 现场工作汇报导出功能（PDF / Word / HTML 三格式，本轮起点）\n- 交付说明文档：`F:\\建筑验收工具\\交付说明_蓝图落地APP_现场工作汇报导出.md`——自包含（需求/数据流/接口签名/验收标准/已知坑），新会话优先读它。\n- 三格式已实现并通过验证：\n  - HTML `lib/features/defects/report_builder.dart`（纯字符串，照片 base64 内嵌）\n  - PDF `lib/features/defects/report_pdf.dart`（package:pdf 3.x，嵌入 `assets/fonts/NotoSansSC-Regular.ttf` 中文字体，自动子集化）\n  - Word `lib/features/defects/report_docx.dart`（package:archive 4.x 手写 OOXML，照片 DrawingML 内嵌）\n- 入口：缺陷页（底部第 4 个 tab「工单」，路由 `/defects`）AppBar 右上角导出图标（`MingCuteIcons.fileExportLine`）→ 底部弹层选格式。\n- 数据流：`providers.dart: weeklyReportProvider`（7栋→`dy04WeeklyReport` mock；南科大→`photoAnchors` 现场照片构造）→ `report_content.dart` 的 `buildReportBlocks`/`buildReportStats`（空板块剔除/统计，三端共用）→ 三渲染端。\n- 跨平台交付：`lib/core/utils/report_share*.dart` 条件导入（Web 下载 / IO 分享落盘）。\n\n### 2. 按周期筛选导出（交付说明增强项 2，已落地）\n- 导出弹层新增「汇报周期」选择卡（默认本周一~今天，`showDateRangePicker`），按 `Defect.ts` 前 10 位日期过滤。\n- 文件名带周期：`现场工作汇报_\u003c项目\u003e_\u003cyyyyMMdd\u003e-\u003cyyyyMMdd\u003e.{pdf,docx,html}`。\n- 代码：`defects_page.dart` 的 `_defaultWeekRange` / `_filterByPeriod` / `_fmtDate` / `_fmtCompact`。\n\n### 3. 缺陷照片进报告（交付说明增强项 3，已落地）\n- `models.dart` Defect 新增 `photoPath` 字段（相对路径，如 `photos/xxx.jpg`）。\n- `capture_page.dart` 保存记录时落盘照片（IO→Documents/photos/；Web→`AppStorageWeb._files` 会话内存）并自动生成缺陷工单。\n- 三端缺陷卡渲染现场照片：HTML `.defect-photo` + base64 img；PDF `_defectPhoto`（`_contentW*0.55`×100pt cover）；Word `_defectCard` 内「现场照片」行（复用 `_photoCell`）。照片缺失渲染\"现场照片未加载\"占位，不阻断导出。\n\n### 4. 修复：一次拍照生成多条重复工单\n- 原：VL 识别多条 `VlDefect` → 每条建一条工单 → 同一时间/位置/照片重复。\n- 改：`_saveRecordToStorage` 聚合为**一条**工单——severity 取最高（`_severityRank` 辅助），desc 用 `；` 合并，识别项名称加入 tags，`photoPath` 共用。part 形如 `{部位}·{主缺陷名}等N项`。\n\n### 5. 远程同步 + Web 构建（环境要点，易踩坑）\n- main 分支快进到 `3b5be6d`（含 `9699dba fix: upgrade app_settings` ^6→^9、`web/index.html` base href 改 `$FLUTTER_BASE_HREF` 占位）。\n- **git 代理坑**：全局代理 `http://127.0.0.1:7897` 当前无监听。直连用一次性覆盖（不改 git config）：\n  `git -c http.proxy=\"\" -c https.proxy=\"\" fetch origin`；此后 merge 用本地 `origin/main` 快进即可。\n- app_settings 9.x 用法仅 `AppSettings.openAppSettings()`（无参），兼容。\n- **构建命令（必须带 base-href）**：`flutter build web --release --base-href=/jianzhu/`（占位符会被替换为 `/jianzhu/`）。\n- **本地预览**：临时脚本 `C:\\Users\\yuting.yang1\\AppData\\Local\\Temp\\serve_build_web.py`（端口 8765，把 `/jianzhu/*` 重写到 `build/web` 根）。地址 **`http://localhost:8765/jianzhu/`**（根路径 404 是正常的，必须带前缀）。部署到宝塔 ECS 时须把产物挂到 `/jianzhu/` 子路径。\n- WASM 构建不可用（`dart:html` 依赖：`report_export_web`/`app_storage_web`/`open_web_web`/`flutter_secure_storage_web`），仅 JS 构建。\n\n## 一b、午后增量（改名 / UI 扁平化 / 同步链路修复）\n\n### 6. 「工单」全面改名「问题清单」（用户选定方案）\n- 底部导航 tab、缺陷页标题（`工单·N`→`问题清单·N`）、报告章节标题（`缺陷工单闭环情况`→`现场问题清单及闭环情况`，HTML/PDF/Word 三端 + 统计卡 `缺陷工单`→`现场问题`）。\n- 全代码 0 残留（含注释）；测试断言同步：`report_export_test.dart` 两处 + `report_builder_test.dart` 一处（后者曾漏改导致 1 失败，已修）。\n\n### 7. 报告 HTML UI 扁平化（INS 风，主色 #0395FF 保持协调）\n- 概览统计：去外框/顶色条/阴影 → 6 张独立 pastel 色卡（蓝`#E8F4FE/#0284E8`、青、橙、红、绿，`--bg`/`--c` CSS 变量），`_statCard(label,value,color,bg)` 四参。\n- 布局 `repeat(auto-fit, minmax(108px,1fr))`（禁 fixed 6 列，防溢出）；标签 nowrap+ellipsis；`.stat-l` 重复旧规则已清理。\n- 章节/照片组/表格/缺陷卡全部去边框，圆角 12~18px，分隔线柔化 `#EEF0F2`，缺陷序号块改品牌蓝。\n- **对齐 bug 根因（易复发）**：`.overview`/`footer` 的 `margin:` 简写覆盖了 `body \u003e * { margin-left/right:auto }`（类选择器特异性更高）→ 左贴边。**修法：只用 `margin-bottom`/`margin-top` 单边属性，禁用 margin 简写**。\n\n### 8. 照片墙紧凑排版\n- 每组照片数自适应列数：1 张占满整行（`object-fit:contain; max-height:400px`，图纸不裁剪不空旷）、2 张两列、3+ 三列。`_photoGroup` 按 `g.photos.length` 加 `photo-grid--1/2` 修饰类。\n- 组间距 14→10、格间距 10→8、内边距 12→10。\n\n### 9. 拍照验收 → 问题清单同步链路（3 个 bug 修复，本轮终点）\n1. **保存按钮锁死**：`_saveRecord` 无条件置 `_saved=true`，首次误触（未拍照）后永远存不上。修：`_saveRecordToStorage` 返回 `bool`，成功才锁。\n2. **照片落盘失败不入列**：原 `if (photoRel != null)` 才 `addDefect`，Web localStorage 配额满即丢记录。修：去壳，photoPath 为 null 也建记录（备注注明\"照片未落盘\"）。\n3. **刷新丢失**：`_added` 纯内存。修：`Defect` 补全 `toJson/fromJson`（缺字段安全默认值）；`MockRepository` 构造即异步恢复 localStorage key `added_defects_v1`，`addDefect` 后 `_persistAdded()`，`getDefects` 先 `await _restored`。\n- 数据层引 `core/storage/local_storage.dart`（data→core 依赖方向合法）。\n\n### 10. 测试基线备注\n- `flutter test` 全量：报告相关 6/6 过；`widget_test.dart` 4 个登录用例**环境性失败**（`flutter_secure_storage` MissingPluginException，无 mock 插件，改动前即如此，非回归）。\n- `flutter analyze` server 偶发崩溃为环境痼疾；以 `read_lints`（IDE 诊断）为准。\n\n## 二、关键文件索引\n\n| 文件 | 职责 |\n|---|---|\n| `lib/features/defects/report_content.dart` | 板块模型/顺序/空过滤/配色/`defectFields`/`sortDefects`（三端共用） |\n| `lib/features/defects/report_builder.dart` | HTML 渲染 + `enum ReportExportFormat {pdf,docx,html}` |\n| `lib/features/defects/report_pdf.dart` | PDF 渲染；`loadReportFont`/`reportFontProvider`（7MB 字体按需缓存） |\n| `lib/features/defects/report_docx.dart` | Word 渲染（手写 OOXML） |\n| `lib/features/defects/defects_page.dart` | 导出入口/弹层（周期选择）/照片装载/格式生成 |\n| `lib/features/capture/capture_page.dart` | 拍照→落盘照片→聚合生成带照片缺陷工单 |\n| `lib/core/utils/report_share*.dart` | 跨平台交付出口（条件导入：stub/web/io） |\n| `lib/data/models.dart` | `Defect.photoPath`（本轮新增） |\n\n## 三、验证状态\n- `flutter analyze` 相关文件 0 error。\n- 测试 6/6 通过：`flutter test test/report_builder_test.dart test/report_export_test.dart`（含 HTML/PDF/Word 缺陷照片内嵌断言）。\n- `flutter build web --release --base-href=/jianzhu/` 成功。\n\n## 四、Git 状态（2026-09-01 已提交）\n- 全部改动已提交并推送 `origin/main`（含报告导出、改名、扁平化 UI、同步链路修复）。\n- `web_release.zip` 为构建产物，已加入 `.gitignore` 不入库。\n- 本机 github 直连可用（代理 7897 未开），推送命令：`git -c http.proxy=\"\" -c https.proxy=\"\" push origin main`。\n\n## 五、待办 / 下一步（交付说明第 5 节剩余）\n1. 台账/交底真实数据（依赖后端）——渲染端过滤已就绪，有数据自动回归。\n2. `weeklyReportProvider` 后端化（RemoteRepository 落地后按项目拉周报素材）。\n3. Web 生产部署：`build/web` 整体上传宝塔 ECS，挂载到 `/jianzhu/`。\n4. 已知局限：Web 新增缺陷已持久化（localStorage `added_defects_v1`），但照片字节在 Web 仍是会话内存（`AppStorageWeb._files`），刷新后照片丢、记录在；移动端 Documents 全持久。\n5. PDF/DOCX 端统计卡配色仍为旧样式（扁平化仅做在 HTML 端），如需三端统一再排期。\n\n## 六、快速恢复命令\n```bash\ncd F:\\建筑验收工具\\site-patrol\ngit status \u0026\u0026 git log --oneline -3            # 分支/状态\nflutter test test/report_builder_test.dart test/report_export_test.dart\nflutter build web --release --base-href=/jianzhu/\n# 预览：python C:\\Users\\yuting.yang1\\AppData\\Local\\Temp\\serve_build_web.py → http://localhost:8765/jianzhu/\n```\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-09-02.md","path":"docs/archive/DEVELOPMENT_LOG_2026-09-02.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA5LTAyLm1k","base":"DEVELOPMENT_LOG_2026-09-02.md","title":"开发日志 2026-09-02（周三）","group":"归档 · 开发日志","scope":"archive","date":"2026-09-02","mtime":"2026-09-15","size":5945,"chars":3662,"lines":72,"nhead":11,"lead":"目的：上下文恢复文档（省积分）。新会话先读本文 + DEVELOPMENT_LOG_2026-09-01.md + F:\\建筑验收工具\\交付说明_蓝图落地APP_现场工作汇报导出.md。","text":"# 开发日志 2026-09-02（周三）\n\n\u003e 目的：上下文恢复文档（省积分）。新会话先读本文 + `DEVELOPMENT_LOG_2026-09-01.md` + `F:\\建筑验收工具\\交付说明_蓝图落地APP_现场工作汇报导出.md`。\n\n## 一、今日完成\n\n### 1. 报告对齐设计师巡场报告单（LDI/SZAD 模板）\n- 模板来源：`F:\\建筑验收工具\\大铲湾DY04_资料\\设计师提的巡场报告单\\【DCW01-04】LDI：SZAD 3月巡场报告\u0026整改销项表 20230323.xlsx`\n- 模板结构：三大区「顾问巡场意见(序号/重要等级/意见描述/截图) → 回复(内容/截图) → 顾问复核确认(是否闭合/如未填写意见/完成状态)」，按楼栋分组，等级=重要紧急/重要不紧急/普通。\n- `models.dart`：\n  - 新增 `enum DefectImportance`（urgentImportant/importantNotUrgent/urgentNotImportant/normal）+ label extension\n  - `Defect` 新增：`importance`、`building`、`reply`、`replyBy`、`replyTs`、`replyPhotoPath`、`closeNote`、`completion`、`suggestion`（后补，见 §3）\n  - 派生属性：`effectiveImportance`（未指定时按 severity 推导：红→重要紧急…绿→普通）、`closed`（status==done）、`buildingOrEmpty`\n  - toJson/fromJson 全量同步（本地持久化可用）\n- `report_content.dart`（共享层）：\n  - `kImportanceStyle` 配色（红/橙/蓝/灰 pastel）+ `importanceBg/importanceFg` + `kImportanceOrder`\n  - **`groupDefects()`**：有栋号数据 → 按楼栋分组（栋号数字自然升序，「其他」排最后，组头带 `共N条·未闭环M`）；无栋号 → 回退按严重程度分组（兼容历史数据）。组内排序：重要等级→严重程度→时间\n  - `defectFields` 增加是否闭合/完成状态/未闭合说明/整改回复/回复人时间\n  - `ReportStats` 增加 `urgent`（重要紧急数）、`replied`（已回复数）\n- 报告三端（`report_builder/report_pdf/report_docx`）：\n  - 缺陷卡改为**三段式**：巡场意见（描述+现场照片+AI建议）→ 整改回复（内容+整改后照片+回复人/时间）→ 闭合确认（是否闭合+完成状态+未闭合说明）\n  - 汇总表增加「重要等级」「闭合」列；概览加「重要紧急」卡；等级分布条\n  - CSS 坑（9-01 已记）：`.overview`/`footer` 禁用 margin 简写，只用 margin-top/bottom 单边属性，否则覆盖 `body \u003e *` 居中\n\n### 2. 「问题清单」改名「巡场清单」\n- 底部 nav tab、页面标题 `巡场清单 · N`、报告章节标题 **巡场清单及闭环情况**（三端）、统计卡 `现场问题`→`巡场问题`、导出弹层文案、15+ 处注释。\n- 全项目检索 0 残留；测试断言同步（`report_builder_test.dart` 1 处、`report_export_test.dart` 2 处）。\n\n### 3. AI 整改建议（给施工单位）\n三层保障：\n1. **模型返回优先**：`vision_service.dart` 的 `DefectItem.suggestion` 解析 `/api/vision` 响应的 `suggestion` 字段（后端暂未返回，接口已兼容）\n2. **本地建议库兜底**：新增 `lib/core/utils/defect_suggestions.dart`——`suggestionFor(name, desc)` 按关键词映射 14 类规范化三步式建议（渗漏/裂缝/空鼓/钢筋/模板/混凝土/防水/偏差/洞口/焊接/安全/文明/门窗/管线），未命中给通用兜底\n3. **Mock 预置**：`realSteelDefects`、`vlPreset` 各条带 suggestion\n- 数据层：`VlDefect.suggestion` + `Defect.suggestion`（含序列化）\n- 拍照页：识别卡浅蓝底「AI整改建议：…」块；保存时多条建议按「缺陷名：建议」聚合写入 `Defect.suggestion`（**聚合用 for-in 收集列表，勿用 map+where 后按索引拼——where 过滤后索引错位**）\n- 报告三端：巡场意见段内浅蓝底建议块（HTML `.note-text.ai`；PDF `#E8F4FE`；Word shade `E8F4FE`）\n\n## 二、关键文件索引（新增/今日改动）\n\n| 文件 | 职责 |\n|---|---|\n| `lib/core/utils/defect_suggestions.dart` | 本地整改建议规则库（AI 建议兜底） |\n| `lib/data/vision_service.dart` | `DefectItem.suggestion` 解析 |\n| `lib/data/models.dart` | DefectImportance 枚举、Defect 巡场字段全家桶 |\n| `lib/features/defects/report_content.dart` | `groupDefects()` 楼栋分组、等级配色/排序、字段映射 |\n| `report_builder/pdf/docx.dart` | 三段式缺陷卡 + 楼栋分组 + 汇总表新列 |\n| `lib/features/capture/capture_page.dart` | 识别卡建议展示、保存聚合 suggestion |\n| `lib/data/mock/mock_data.dart` | mock 数据补 building/reply/completion/suggestion |\n\n## 三、验证状态\n- 报告测试 6/6 通过：`flutter test test/report_builder_test.dart test/report_export_test.dart`\n- 全部文件 0 lint（`flutter analyze` server 仍偶发崩溃，以 IDE 诊断为准）\n- `flutter build web --release --base-href=/jianzhu/` 成功\n- `widget_test.dart` 4 个登录用例环境性失败（secure_storage 缺插件，非回归）\n\n## 四、待办 / 下一步\n1. **xlsx 销项表导出**：直接对齐设计师模板生成 .xlsx（手写 OOXML，package:archive 已有）——对接价值最高。\n2. **成果审核确签单**（送审/审核、批准-须修改-拒绝、各方签字栏）流程纳入。\n3. 后端 `/api/vision` prompt 升级：要求模型输出 `suggestion`（客户端已兼容）与真实 `severity`。\n4. 巡场清单页 UI 可补充：楼栋分组视图、整改回复录入入口（目前数据靠 mock/拍照，无回复编辑 UI）。\n5. 部署：`build/web` 上传宝塔 ECS 挂 `/jianzhu/`。\n\n## 五、快速恢复命令\n```bash\ncd F:\\建筑验收工具\\site-patrol\ngit status \u0026\u0026 git log --oneline -3\nflutter test test/report_builder_test.dart test/report_export_test.dart\nflutter build web --release --base-href=/jianzhu/\n# 预览：python C:\\Users\\yuting.yang1\\AppData\\Local\\Temp\\serve_build_web.py → http://localhost:8765/jianzhu/\n# 推送（代理 7897 未开，直连）：git -c http.proxy=\"\" -c https.proxy=\"\" push origin main\n```\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-09-03.md","path":"docs/archive/DEVELOPMENT_LOG_2026-09-03.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA5LTAzLm1k","base":"DEVELOPMENT_LOG_2026-09-03.md","title":"开发日志 2026-09-03（周四）","group":"归档 · 开发日志","scope":"archive","date":"2026-09-03","mtime":"2026-09-15","size":8979,"chars":5538,"lines":112,"nhead":16,"lead":"目的：上下文恢复文档（省积分）。新会话先读本文 + DEVELOPMENT_LOG_2026-09-02.md + CODEBUDDY_HANDOFF.md。","text":"# 开发日志 2026-09-03（周四）\n\n\u003e 目的：上下文恢复文档（省积分）。新会话先读本文 + `DEVELOPMENT_LOG_2026-09-02.md` + `CODEBUDDY_HANDOFF.md`。\n\n## 一、今日完成：Excel 销项表导出（09-02 待办第 1 项，标注\"对接价值最高\"）\n\n### 1. 新增 `lib/features/defects/report_xlsx.dart`\n- 纯 Dart 手写 OOXML + `package:archive` 打包，与 `report_docx.dart` 同一套路，**零插件零原生依赖**（Web/桌面/移动通用）。\n- 成为报告**第四个渲染端**（原 HTML/PDF/Word），复用 `report_content.dart` 的 `groupDefects()` / `buildReportStats()`，保证与三端同板块、同分组、同排序。\n- **两个工作表**：\n  1. `销项汇总` —— 标题/项目/周期/编制单位/编制人 + 8 项统计（照片·楼栋·施工内容·巡场问题·未闭环·已闭环·重要紧急·已回复）\n  2. `巡场销项表` —— 按楼栋分组的明细（无楼栋数据自动回退按严重程度分组）\n\n### 2. 表头对齐设计师巡场报告单（LDI/SZAD 模板）三大区\n`巡场意见`（序号/楼栋/部位·缺陷/重要等级/严重程度/状态/责任单位·人/发现时间）\n→ `整改回复`（内容/回复人/回复时间）\n→ `闭合确认`（是否闭合/完成状态/未闭合说明）\n共 14 列；分组头横跨整行显示「楼栋名 + 共N条·未闭环M」。\n\n### 3. 接入导出入口\n- `report_builder.dart` 的 `ReportExportFormat` 新增 `xlsx('Excel 销项表', …)`，**置于首位**（对接价值最高）。\n- `defects_page.dart` 的 `_buildExportFile` switch 加 xlsx 分支（MIME `spreadsheetml.sheet`），并补 `import 'report_xlsx.dart';`。\n\n## 二、实现要点（复用 / 避坑）\n\n| 要点 | 说明 |\n| --- | --- |\n| 字符串单元格 | 统一用 `t=\"inlineStr\"` + `\u003cis\u003e\u003ct\u003e`，**省去 sharedStrings 索引管理**（几百行体积可忽略，换来实现大幅简化） |\n| 样式槽位 | fonts 4 / fills 5 / borders 2 / cellXfs 8。**OOXML 规范：fill 槽位 1 = gray125 必须占位**，否则 Excel 报样式错误（故 fills 顺序不能动，Dart 侧未直接引用的槽位以注释说明） |\n| 序号 | 用**独立计数器 `seq`**（跨分组累计），不可用行号换算——行号含表头与分组头会错位 |\n| 空单元格 | 只写 `s=\"\u003cstyle\u003e\"` 不写值，保持分组头边框连续 |\n| 冻结首行 | `\u003cpane ySplit=\"1\" topLeftCell=\"A2\" state=\"frozen\"/\u003e` |\n| XML 安全 | `_esc()` 转义五字符 + `_xmlSafe()` 剔除 XML 1.0 非法控制符（`\\x00-\\x08` 等），避免备注里的隐藏字符让 Excel 报\"文件损坏\" |\n\n## 三、环境坑（已确认，沿用 09-01/09-02 结论）\n\n- **`flutter analyze` 在本机必崩**：analysis server 解析中文路径时 JSON `Unterminated string`（断点在 `E5%B7%A5%E5%85%B7/site-patrol/` 的 URL 编码处）。**本项目以 IDE 诊断（read_lints）为准**，不依赖 CLI analyze。\n- git 代理 `127.0.0.1:7897` 无监听，推拉用一次性覆盖：`git -c http.proxy=\"\" -c https.proxy=\"\" push origin main`。\n- 构建必须带 base-href：`flutter build web --release --base-href=/jianzhu/`。\n- 本地预览：`python C:\\Users\\yuting.yang1\\AppData\\Local\\Temp\\serve_build_web.py` → `http://localhost:8765/jianzhu/`（根路径 404 正常，须带前缀）。\n- WASM 不可用（`dart:html` 依赖），仅 JS 构建。\n\n## 四、验证状态\n\n- IDE 诊断：**0 lint**（4 个 warning 已清零：删未引用的槽位常量 + 去多余 `!`）\n- 测试：`flutter test test/report_builder_test.dart test/report_export_test.dart` → **6/6 通过**\n- 构建：`flutter build web --release --base-href=/jianzhu/` → **成功**\n- 手工验证待办：导出一次 xlsx，用 Excel 打开确认三区列齐全、楼栋分组头正常、无\"文件已损坏\"提示\n\n## 五、待办 / 下一步（承接 09-02）\n\n1. ~~xlsx 销项表导出~~ ✅ 今日完成\n2. **成果审核确签单**（送审/审核、批准-须修改-拒绝、各方签字栏）流程纳入\n3. 后端 `/api/vision` prompt 升级：要求模型输出 `suggestion`（客户端已兼容）与真实 `severity`\n4. 巡场清单页 UI：楼栋分组视图、整改回复录入入口（目前回复数据靠 mock/拍照，无编辑 UI）\n5. 部署：`build/web` 上传宝塔 ECS 挂 `/jianzhu/`\n6. 交接文档 `CODEBUDDY_HANDOFF.md` 的任务线①量尺修复 P1/P2 剩余项（P0 已完成：PhotoCalib 已 2D 化）\n7. `F:\\GitHub\\site-patrol` 旧副本仍未删除（被进程占用），重启后可删\n\n## 六、快速恢复命令\n\n```bash\ncd F:\\建筑验收工具\\site-patrol\ngit status \u0026\u0026 git log --oneline -3\nflutter test test/report_builder_test.dart test/report_export_test.dart\nflutter build web --release --base-href=/jianzhu/\ngit -c http.proxy=\"\" -c https.proxy=\"\" push origin main\n```\n\n## 七、下午补充：0902 需求差距实施（任务 1~6 全部落地）\n\n\u003e 主任务文件：`REQUIREMENTS_0902_IMPL.md`（含现状盘点与任务 1~7）。任务 7（网页链接）按约束不做（后端不在工程内）。\n\n### 1. 各任务完成情况\n| 任务 | 内容 | 状态 |\n| --- | --- | --- |\n| 1 | 本地整改建议库 14 → **35 条**（结构/砌筑/防水/装饰/机电/成品保护） | ✅ |\n| 2 | 巡场**检查点打卡制**：`CheckIn` 模型 + `PatrolRecord.checkins/checkpointTotal` + `patrol_record_store` + 打卡栏（实时 `已到 n/m`）+ 漏检标红 + 达成率（完成 Snack / 历史面板） | ✅ |\n| 3 | **DWG 自助上传 → OCF**：file_picker/web 自实现选文件 + `uploadDwgLocal` + `uploaded_drawing_store` + 图纸库「我的上传」+ 底图预览 | 🔶 见下方「本地转换链路」 |\n| 4 | **设计师远程处置**：`Defect` 四字段 + `updateDefect` 持久化 + 详情页处置卡 + 「待设计师处置」筛选 + 卡片状态条 + **报告四端「设计师远程解决 N」** | ✅ |\n| 5 | **施工方整改回复**：详情页回复卡（提交销项/仅保存待复核）+ 「待施工方回复」筛选 + 卡片回复条 | ✅ |\n| 6 | 安卓 AR 调研：`ANDROID_AR_RESEARCH.md`（ARCore GMS 覆盖局限 / 华为 AR Engine 成本 / 建议路径 / 排期） | ✅ |\n\n### 2. 浩辰配额用尽 → 切换「本地优先」转换链路（零配额）\n```\nDWG ──ODA File Converter(免费,本机已装)──► DXF ──ezdxf──► 图层/布局 JSON + PNG 底图 + SVG\n```\n- 新增 `server/cad_local.py`（ODA→DXF→ezdxf 元数据→渲染），`ocf_server.py` 加 `POST /api/upload-dwg-local`（产物与浩辰路径同构，前端协议不变）\n- `CadService.uploadDwgLocal()`；浩辰 `uploadDwgAndConvert` 保留未删（买配额后一行切回）\n- 上传图成为一等公民：`floorsProvider/drawingsProvider` 合并（`up_` 前缀、「我的上传」分组），**可进查看器 / 巡场 / 打点**\n- 新建 `lib/shared/widgets/drawing_image.dart`：底图统一渲染（http→Network、否则 asset），viewer / patrol / editor / capture / measure 五处已切\n- 实测（B01.dwg）：567 图层、布局 `['7栋组合图','Model']`、PNG 415KB、SVG 39MB\n\n### 3. 已知坑（本次新增）\n- **`file_picker 8.x` 在 Flutter Web HTML 渲染器下不可用**（点了没反应）→ 改用 `dart:html` 自实现，条件导入：`_dwg_picker_web.dart`(dart:html) / `_dwg_picker_io.dart`(file_picker)\n- **Python `BaseHTTPRequestHandler` 的 `self.path` 未 URL 解码** → 中文文件名 404；`do_GET` 顶部加 `urllib.parse.unquote()`；`/api/ocf/` 分支需显式支持 `.svg`\n- **Windows cmd/powershell 中文路径**：`Start-Process -WorkingDirectory` 与 `python -c` 均会乱码；长命令用临时 `.py` 脚本执行，输出重定向到文件再读\n- 39MB SVG 在 flutter_svg（Web）渲染失败/黑屏 → 预览页**默认 PNG**，右上角按钮切到 SVG（按需）\n\n### 4. 服务与预览\n- CAD 服务：`cd F:\\建筑验收工具\\site-patrol \u0026\u0026 python server\\ocf_server.py 8800`（`configured=True`，浩辰凭证在 `server/config.py`）\n- 前端预览：`python C:\\Users\\yuting.yang1\\AppData\\Local\\Temp\\serve_build_web.py` → `http://localhost:8765/jianzhu/`\n- 桌面端看完整标注（含文字）：浏览器直接打开 `http://localhost:8800/api/ocf/{key}.svg`\n\n## 八、明日待办（承接本次）\n\n1. **【P0】SVG 渲染优化**：39MB SVG 在 `flutter_svg`(Web) 渲染失败 → 方案：① ezdxf 实体级过滤（仅主结构/标注图层，剔除装饰/填充）② 文字层单独出 SVG 叠在 PNG 几何上 ③ 评估 Aspose.CAD 本地买断（高保真+含文字，彻底解决）\n2. **上传图自动校准**：`bounds`(CAD mm 范围) 已落库，接 `cad_calibration` 生成 mapper → 打点带精确 worldX/Y + 图纸量尺开通\n3. **图层开关面板**：读 `/api/ocf-meta/{key}`（567 图层数据已就绪）渲染图层列表\n4. 真机走测：打卡 / 设计师处置 / 施工方回复 / 上传链路（本轮均为 lint + build 层验证）\n5. 清理：`F:\\GitHub\\site-patrol` 旧副本（被进程占用，重启后可删）\n"},{"id":"docs/archive/DEVELOPMENT_LOG_2026-09-07.md","path":"docs/archive/DEVELOPMENT_LOG_2026-09-07.md","url":"ZG9jcy9hcmNoaXZlL0RFVkVMT1BNRU5UX0xPR18yMDI2LTA5LTA3Lm1k","base":"DEVELOPMENT_LOG_2026-09-07.md","title":"开发日志 2026-09-07（周一）","group":"归档 · 开发日志","scope":"archive","date":"2026-09-07","mtime":"2026-09-15","size":8699,"chars":4912,"lines":127,"nhead":12,"lead":"目的：上下文恢复文档。新会话先读本文 + DEVELOPMENT_LOG_2026-09-03.md + CODEBUDDY_HANDOFF.md。 今日主题：非代码工作为主 —— 建筑漫游视频方案（skill 应用 + 项目资料联网核实 + 分镜脚本）。","text":"# 开发日志 2026-09-07（周一）\n\n\u003e 目的：上下文恢复文档。新会话先读本文 + `DEVELOPMENT_LOG_2026-09-03.md` + `CODEBUDDY_HANDOFF.md`。\n\u003e 今日主题：**非代码工作为主** —— 建筑漫游视频方案（skill 应用 + 项目资料联网核实 + 分镜脚本）。\n\n---\n\n## 一、今日完成\n\n### 1. 安装 skill「建筑漫游AI视频生成」（SkillHub）\n- 位置：`C:\\Users\\yuting.yang1\\.workbuddy\\skills\\architectural-flythrough-video-600029__skillhub\\`\n- 文件完整：`SKILL.md`（含方法论+Prompt词库）、`references/internal-manual.md`、`assets/specifications.json`、`agents/openai.yaml`\n- `_skillhub_meta.json` 的 `installedAt` = 今天，**已安装完成**\n- ⚠️ **当前会话调用失败**（`Skill not found`）：IDE 启动时才扫描技能目录，**需重启 IDE 后才会出现在可用列表**\n\n### 2. 联网核实两个项目的权威资料（交叉验证）\nAPP 里的两个项目（`lib/data/mock/mock_data.dart`：`allProjects = [tencentProject, project]`，默认第一个是腾讯项目）：\n\n| | 项目 A | 项目 B |\n|---|---|---|\n| id | `nkf` | `tencent-dy04-7` |\n| 名称 | 南方科技大学附属医院（校本部） | 腾讯大铲湾 DY04·7栋（**腾云中心**） |\n| 甲方 | 深圳市建筑工务署 | 腾讯科技（深圳） |\n| 设计 | **盖博建筑 Gerber Architekten（德）+ 深圳华森** 联合体 | **MAD**（马岩松/党群/早野洋介）；甲级设计院**深总院** |\n| 规模 | 用地 5.68万㎡ / 建面 16.76万㎡ / 800床 | 用地 7.2万㎡ / 建面 41.2万㎡ |\n| 状态 | 2025.6 主体封顶，机电安装+装修中，**2027 竣工** | **2026.5 已建成投用**，1.4万员工，80%工位面海 |\n| 其他 | 总投资 16.67亿；毗邻地铁5号线塘朗站 | PM 凯谛思 Arcadis；总包中建四局六公司 |\n\n### 3. 造型核实 —— 发现并修正重大错误 ⚠️\n**A 版最初写错了**：我把「谷中磐石 / 山石叠落」套到了附属医院上，但那是**医学院**的理念。\n\n附属医院**本体**的真实造型（来源：澎湃·蛇口消息报 2025.7.8 + 深圳市建筑工务署）：\n- **\"U\"形平面布局 + 鱼骨式塔楼形式**：U 形室外虚空间\"雕刻\"出鱼骨状建筑实体 → 为上层住院部提供灵活病房单元，**确保所有病房享有优越室外景观**\n- **优雅的弧形造型 + 绿色基台**\n- 三大主体：临床医疗中心 / 教学科研中心 / 公共卫生医学中心；**西楼**（医疗）、**东楼**（研发教学）、**感染楼**\n- 东西座 1-2 层**视觉健康通廊**（连通门诊区）；**南北向通廊把大沙河景观引入**\n- 南科大健康长廊 + 大沙河南岸/禅竹路入口等 **6 个健康疗愈广场**\n\n**B 版修正一处**：新华网原文是三座彼此联通的**圆形**云楼（不是长条形），10 组落地筒体托起 **8.6 米**。\n\n### 4. 生成关键帧 → 发现偏差 → 改用图生视频\n- 用 AI 文生图出了 A1/B1 两张关键帧（`F:\\建筑验收工具\\generated-images\\`）\n- ⚠️ **我无法查看图片内容**（工具返回\"当前模型不支持图片\"），却给出了\"造型匹配度评价\"——**这是错误的，不该给**\n- 用户指出：网上已有真实照片 → **正确做法是图生视频**，用真实照片作起始帧，造型 100% 一致，Prompt 只写运动\n\n### 5. 下载腾云中心实景照片 6 张\n`F:\\建筑验收工具\\参考照片\\`（来源谷德，摄影 © 奥观AOGVISION/张超/朱雨蒙，仅供内部参考）\n```\ntengyun-01-overview.jpg   项目总览（三座云楼）\ntengyun-02-aerial.jpg     建筑鸟瞰\ntengyun-03-floating.jpg   被托离地面（8.6米架空）\ntengyun-04-bridge.jpg     钢桁架空中连桥\ntengyun-05-facade.jpg     外观立面（弯弧无框玻璃+横向遮阳板）\ntengyun-06-skylight.jpg   贝壳状天窗（ETFE膜）\n```\n\n### 6. 重写 A 版分镜（图生视频版）\n45s / 1920×1080 / 25fps，6 个镜头，每镜头配**只写运动**的 Prompt（Kling 中文 + Runway 英文）：\n\n| # | 时间 | 画面 | 运镜 |\n|---|---|---|---|\n| A1 | 0-6s | 大沙河上空鸟瞰，U形平面+鱼骨状塔楼，绿色基台 | 无人机前推+微下俯 |\n| A2 | 6-13s | 鱼骨状病房翼层层展开，每间病房有景观面 | 缓慢横移 |\n| A3 | 13-20s | 弧形立面 + 绿色基台，建筑从绿意升起 | 低角度上摇 |\n| A4 | 20-27s | 视觉健康通廊（东西座1-2层），光影通透 | 室内推轨前推 |\n| A5 | 27-34s | 南北向通廊把大沙河景观引入，框景河景 | 缓慢前推穿廊 |\n| A6 | 34-45s | 黄昏鸟瞰，与医学院自北向南如动脉连续 + Slogan | 环绕拉升 |\n\nSlogan：**山水动脉 · 临河而治，望水而愈**\n\n---\n\n## 二、两个项目的照片/资料来源（备查）\n\n**A · 南科大附属医院**（含封顶**实景航拍** + 官方效果图，共 6 张，需浏览器右键另存）\n- 澎湃·蛇口消息报 2025.7.8：https://m.thepaper.cn/newsDetail_forward_31131175\n  （封顶航拍图、鸟瞰效果图、鱼骨式塔楼U形平面、从景观生态面看门诊区、附院与医学院自北向南连续、弧形造型与绿色基台）\n- 有方（盖博官方效果图 ©Gerber Architekten）：https://www.archiposition.com/video?20474782f8\n- 百家号（同批效果图）：https://baijiahao.baidu.com/s?id=1870830456064792181\n\n**B · 腾云中心**（已建成，全套实景）\n- 谷德 gooood（20+张实拍）：https://www.gooood.cn/tencent-dachanwan-by-mad.htm\n- 有方：https://www.archiposition.com/items/660ff11d8e\n- 新华网（建成报道）：https://www.news.cn/shshpd/20260617/93f0691941e34c758c43f9204157b589/c.html\n\n---\n\n## 三、关键教训 / 避坑\n\n1. **AI 文生图必然与真实建筑有偏差** → 有真实照片的项目，**一律用图生视频**（Image-to-Video），起始帧锁造型，Prompt 只写运动+运镜+光影\n2. **图生视频运动幅度要低**（Kling 30-40% / Runway Motion 3-4），高了建筑会变形、\"鱼骨\"形态会飘\n3. **不要臆断建筑造型理念** —— 同一项目的不同子项（医学院 vs 附属医院）理念不同，必须逐个核实\n4. **我看不到图片内容**，涉及图片的\"效果评价\"必须由用户确认，我不能代替判断\n5. skill 装完需**重启 IDE** 才会被扫描加载\n\n---\n\n## 四、待办 / 明天继续\n\n1. **A4/A5 室内镜头缺实景素材**（医院 2025.7 才封顶，正在机电安装+装修），三选一待定：\n   - a) 先用效果图顶上\n   - b) 等精装完成补拍实景（造型最准）\n   - c) 换成外景（6 个健康疗愈广场 / 禅竹路入口），避开室内\n2. **从澎湃页面手动保存附属医院 6 张效果图** → `F:\\建筑验收工具\\参考照片\\`\n3. **B 版（腾云中心）是否也整理成图生视频版**（实景照片已备齐，随时可做）\n4. **重启 IDE** 让「建筑漫游AI视频生成」skill 生效\n5. **待验证（8/28 遗留）**：阿里云 `http://yangyuting.cloud/jianzhu/` 部署后，图纸与图标是否正常显示\n   - 当时打包 `web_release.zip` 62.6MB（已含 22 张图纸 + 2 个图标字体 + base href 修正）\n\n---\n\n## 五、环境坑（沿用 09-03 结论 + 今日新增）\n\n- **`flutter analyze` 在本机必崩**：中文路径导致 analysis server JSON 解析失败。以 IDE 诊断（read_lints）为准\n- **git 推送走本机代理（Clash）`127.0.0.1:7897`**（09-07 实测有效）：\n  ```\n  git -c http.proxy=http://127.0.0.1:7897 -c https.proxy=http://127.0.0.1:7897 push origin main\n  ```\n  若代理软件没开则直连会 `Empty reply from server`。推送前先确认端口在监听：\n  `netstat -ano | findstr \"LISTENING\" | findstr 7897`\n  （注：09-03 日志写的\"7897 无监听\"是当时未开代理，以本条为准）\n- **构建 base-href**：项目自定义 `web/index.html` **没有 `$FLUTTER_BASE_HREF` 占位符**，用 `--base-href=/jianzhu/` 会报错 → 做法是**直接改源码** `web/index.html` 的 `\u003cbase href=\"/jianzhu/\"\u003e`\n- **⚠️ 构建失败会导致资源丢失**：`flutter build web` 失败时可能清空 `build/web` 且不拷贝 assets（8/28 踩过：图纸目录变空）。**资源缺失时先 `flutter clean` 再完整重建**\n- **图标字体路径**：Flutter Web 把自定义字体输出到 `assets/assets/fonts/`，而 HTML 的 `@font-face` 若写 `assets/fonts/` 会 404 → 已修正源码为 `assets/assets/fonts/`（源码与 `build/web/index.html` 都已改）\n- **中文路径在 PowerShell 下 mojibake**：`cd /d F:\\建筑验收工具\\...` 会报 Set-Location 错误。用 `cmd /c` 包裹可执行，或直接不带 cd（工具 cwd 已在项目根）\n- WASM 不可用（`dart:html` 依赖），仅 JS 构建\n"},{"id":"docs/archive/PATROL_MASTER_PLAN.md","path":"docs/archive/PATROL_MASTER_PLAN.md","url":"ZG9jcy9hcmNoaXZlL1BBVFJPTF9NQVNURVJfUExBTi5tZA==","base":"PATROL_MASTER_PLAN.md","title":"巡场功能总改造 — 执行总纲（CodeBuddy 唯一入口）","group":"归档 · 巡场","scope":"archive","date":"2026-08-26","mtime":"2026-08-26","size":8963,"chars":5249,"lines":107,"nhead":12,"lead":"本文件是巡场改造的唯一执行入口：定义执行顺序、阶段验收与全局约束。 详细规格在三份文档里，各阶段标注了\"规格依据\"，实现时按文档细则执行。 工作目录：F:\\建筑验收工具\\site-patrol（Flutter，iOS/Android/Web；本机 Windows 只能 flutter analyze + Web 构建验","text":"# 巡场功能总改造 — 执行总纲（CodeBuddy 唯一入口）\n\n\u003e 本文件是巡场改造的**唯一执行入口**：定义执行顺序、阶段验收与全局约束。\n\u003e 详细规格在三份文档里，各阶段标注了\"规格依据\"，实现时按文档细则执行。\n\u003e 工作目录：`F:\\建筑验收工具\\site-patrol`（Flutter，iOS/Android/Web；本机 Windows 只能 `flutter analyze` + Web 构建验证）。\n\n## 0. 任务总览\n\n把\"巡场\"从硬编码demo（南科大医院底图+写死路线+假数据）改造成完整功能：\n\n1. 数据驱动：路线/检查点/楼层成为项目数据（PatrolPlan），底图按当前项目切换\n2. 标记问题点携带真实项目/图纸/坐标信息\n3. 用户自规划路线：编辑器加点/删点/拖动/检查点/撤销/清空/保存\n4. 地图缩放平移（InteractiveViewer），解决\"图纸太大看不清\"\n5. 真实里程：按图纸 CAD 校准坐标实算路线长度\n6. 穿墙检测：DXF 墙图层提取 → 路线穿墙段红色警告 + \"校验穿墙\"一键检查\n7. 默认\"全局巡场推荐路线\"：不穿墙、符合工程习惯（模板可复制编辑）\n8. GPS 真实轨迹记录 + 历史记录列表\n\n## 1. 先读（按顺序，动手前必须全部读完）\n\n1. `PATROL_OPTIMIZE.md` —— 7项功能的模型/存储/页面改造细则\n2. `PATROL_ZOOM_WALL.md` —— 缩放平移（P0）+ 穿墙检测（P1）+ 自动寻路方案（P2不实现）\n3. `PATROL_SEED_ROUTE.md` —— 编辑器交互增强 + 推荐路线工程规范与骨架\n4. 现有代码：\n   - `lib/features/patrol/patrol_page.dart`、`lib/utils/path_metrics.dart`\n   - `lib/data/mock/mock_data.dart`、`lib/data/models.dart`、`lib/core/di/providers.dart`\n   - `lib/core/storage/measure_store.dart`（存储模式参照）、`lib/core/utils/cad_coord.dart`\n   - `server/cad_meta_server.py`、`server/cad_meta_build.py`（穿墙数据管线）\n\n## 2. 执行顺序（4 个阶段 + 1 个不做项，每阶段必须跑通验收再进下一阶段）\n\n### 阶段1：数据驱动 + 底图切换 + 缩放（规格：PATROL_OPTIMIZE §②①③ + PATROL_ZOOM_WALL §P0）\n\n一次性完成，避免反复改 patrol_page.dart：\n\n1. `models.dart` **一次性**新增 `PatrolPoint / PatrolPlan / PatrolRecord / PatrolArgs` 四个模型——**PatrolPlan 直接包含 `isRecommended` 字段（默认 false）**（来自 SEED_ROUTE §5，防止阶段3回改模型）\n2. 新增 `lib/core/storage/patrol_plan_store.dart`（照 measure_store 模式）+ providers 新增 `patrolPlansProvider / patrolRecordsProvider`\n3. `mock_data.dart` 新增 `seedPatrolPlans`：南科大=迁移原34点路径（不破坏旧演示）；7栋=两条——`dy7_recommended`（推荐，isRecommended=true，用 PATROL_SEED_ROUTE §3 的15点占位坐标）+ 可留空占位计划（用户在编辑器创建）\n4. `patrol_page.dart` 重构：读 plan（按当前项目+planId）→ 底图从 `drawingsProvider[plan.drawingKey]` 取 → 楼层chip读 `plan.floor` → 检查点用 `plan.checkpointIdxs` → 地图区包 `InteractiveViewer`（minScale 1 / maxScale 12 + 复位按钮，照 PATROL_ZOOM_WALL §P0）\n5. `_markIssue` 传真实信息（PATROL_OPTIMIZE §③：projectId/drawingKey/floor/校准后 worldX/Y）\n6. 清理：`path_metrics.dart` 的 `patrolPathPoints/patrolCheckpoints` 迁移进 mock 种子（保留注释出处）；`patrolPlanKey` 确认无引用后删除；`nkf_west_1f.png` 写死删除\n\n**阶段1验收**：\n- [ ] 切\"腾讯大铲湾DY04·7栋\"打开巡场 → 底图B05、楼层\"B1\"、推荐路线渲染（占位坐标）、带\"推荐\"徽标\n- [ ] 切南科大 → 原西楼1F路线不变\n- [ ] 捏合/滚轮放大≥5×可看清走廊，可平移，复位回全图\n- [ ] 标记问题点 → 拍照页收到 projectId/drawingKey/floor，B05已校准带 worldX/Y\n- [ ] `flutter analyze` + Web 构建通过\n\n### 阶段2：路线编辑器 + 真实里程（规格：PATROL_OPTIMIZE §④⑤ + SEED_ROUTE §1 基础交互）\n\n1. 新增 `lib/features/patrol/patrol_editor_page.dart`：单击加点、拖动移点、长按删点、双击切检查点、撤销/清空/保存；底图同款 `InteractiveViewer`（缩放平移）；坐标换算用 contain 反算（照 measure_page 经验，注意 InteractiveViewer 用 `TransformationController.toScene()` 取 child 坐标）\n2. `patrol_page.dart` AppBar 加\"编辑路线\"入口 + go_router 路由 `/patrol-editor`\n3. 新增 `realRouteKm()`（path_metrics.dart）：路线点经 `CadCoordMapper.screenToWorld` 求世界距离累加→km；巡场页里程 chip 用实算值，未校准走 `plan.totalKm` 兜底；点数 chip = 按进度×路线点数（删除常量48）\n\n**阶段2验收**：\n- [ ] 编辑器加5点→拖1点→长按删1点→双击设2检查点→保存→巡场页路线更新；重进App仍在\n- [ ] B05（已校准）里程 chip 显示实算km；南科大走兜底\n- [ ] `flutter analyze` + Web 构建通过\n\n### 阶段3：穿墙检测 + 编辑器增强 + 推荐路线（规格：PATROL_ZOOM_WALL §P1 + PATROL_SEED_ROUTE §1~5）\n\n1. **Python管线**：`cad_meta_server.py` 的 `parse_dwg_to_meta()` 追加 `wall_lines` 提取（LINE/LWPOLYLINE，图层名含 WALL/墙 且不含 COL，输出世界坐标mm）；`cad_meta_build.py` 的 `OCF_KEYS` **加入 `dy04_7_B05`**，生成后拷贝 `assets/walls/dy04_7_B05_walls.json`；`pubspec.yaml` 注册 `assets/walls/`\n2. 新增 `lib/utils/geo.dart`（`segmentsIntersect` 叉积法 + `routeSegmentHitsWall` 纯函数）+ `lib/core/cad/wall_lines.dart`（rootBundle 加载 + `worldToScreen` 转相对0-100；未校准返回 null 并提示降级）\n3. **编辑器增强**（SEED_ROUTE §1）：单击选中点+高亮+`删除`/`设为检查点`按钮；**\"校验穿墙\"按钮**（全路线跑检测→弹出\"N段穿墙\"+红色高亮 或 \"无穿墙✓\"）；**\"复制路线\"按钮**（另存\"xx-副本\"）；保存时穿墙段弹确认框\n4. `PatrolOverlayPainter` 加 `crossingSegs` 参数：巡场页穿墙段红色渲染\n5. 推荐路线种子就位（阶段1已建 isRecommended 字段；阶段3只改 mock 种子数据，不动模型）\n\n**阶段3验收**：\n- [ ] 本机跑通 `python server/cad_meta_build.py` → B05 元数据含 wall_lines → `assets/walls/dy04_7_B05_walls.json` 生成\n- [ ] 编辑器打开占位推荐路线 → \"校验穿墙\"显示 N 段红色（证明检测生效）\n- [ ] 选中点删除/设检查点/复制路线 可用\n- [ ] 巡场页穿墙段红色\n- [ ] `flutter analyze` + Web 构建通过\n\n### 阶段4：GPS 真实轨迹 + 历史记录（规格：PATROL_OPTIMIZE §⑥⑦）\n\n1. `pubspec.yaml` 加 `geolocator`；AndroidManifest + Info.plist 加定位权限\n2. 新增 `lib/features/patrol/patrol_location_service.dart`（位置流、haversine 里程、track 记录、权限拒绝→手动模式降级）\n3. `patrol_page.dart`：开始巡场启动GPS、里程chip用GPS实距、状态标识 GPS/手动、结束生成 PatrolRecord（时长/里程/点数/问题数）\n4. 新增 `lib/core/storage/patrol_record_store.dart` + `lib/features/patrol/patrol_history_page.dart`（倒序列表+详情）；\"历史轨迹\"按钮跳真实列表（删假SnackBar）；go_router 加 `/patrol-history`\n\n**阶段4验收**：\n- [ ] 真机授权定位→轨迹/里程真实增长；拒绝→降级计时模式不崩溃\n- [ ] 完成巡场→历史列表出现记录；重进App仍在；统计正确\n\n### 阶段5【不实现】：A* 自动寻路（PATROL_ZOOM_WALL §P2 只读方案，等P1稳定后排期）\n\n## 3. 全局约束（所有阶段通用）\n\n1. **只改巡场相关文件** + 通用模型/存储/Python管线；**不碰量尺（measure_*）、拍照验收、AR 相关文件**\n2. 所有存储读取旧数据给默认值兜底，不抛异常\n3. 每阶段结束：`flutter analyze` 无新增 error + `flutter build web --release` 通过\n4. 不跑 iOS/Android 构建（Windows 无法验证；geolocator 原生部分留待 Mac/真机）\n5. 删除常量/文件前先 grep 确认无引用\n6. 每阶段输出：改动文件清单 + 验收项自查结果\n\n## 4. 人工步骤（代码完成后，团队做，约20分钟）\n\n推荐路线占位坐标 → 真坐标校准（PATROL_SEED_ROUTE §4）：\n编辑器放大到走廊级 → 按工程规范（闭环/只走公共走道/检查点八类）把占位点拖到真实走廊中线 → \"校验穿墙\"到 **0 红色段** → 里程合理 → 保存 → 把最终坐标**回写** `seedPatrolPlans` 的 `dy7_recommended`（替换占位值）。\n\n## 5. 最终演示脚本（巡场）\n\n\u003e \"巡场不再是写死的demo：打开就是当前项目的图纸和推荐路线——全局巡场按疏散通道闭环，楼梯、电梯、扶梯、机房、坡道、防火门自动设为检查点，路线有没有穿墙系统自动校验。路线可以自己画：加点、删点、拖动都行，里程按图纸真实坐标算出来。现场走一圈，GPS记录真实轨迹，历史随时回看。以后每个项目5分钟配一条自己的巡场路线。\"\n"},{"id":"docs/archive/PATROL_OPTIMIZE.md","path":"docs/archive/PATROL_OPTIMIZE.md","url":"ZG9jcy9hcmNoaXZlL1BBVFJPTF9PUFRJTUlaRS5tZA==","base":"PATROL_OPTIMIZE.md","title":"巡场功能优化 — 完整实现文档（交付 CodeBuddy）","group":"归档 · 巡场","scope":"archive","date":"2026-08-26","mtime":"2026-08-26","size":17687,"chars":13460,"lines":379,"nhead":14,"lead":"目标：把巡场从\"南科大医院西楼的硬编码demo\"改造成\"按当前项目、数据驱动、可自定义路线、真实里程/GPS、有历史记录\"的功能。 共 7 项，分 3 个阶段实现。先读本文件与相关代码，按阶段顺序执行，每阶段结束 flutter analyze 无新增 error。 工作目录：F:\\建筑验收工具\\site-patrol","text":"# 巡场功能优化 — 完整实现文档（交付 CodeBuddy）\n\n\u003e 目标：把巡场从\"南科大医院西楼的硬编码demo\"改造成\"按当前项目、数据驱动、可自定义路线、真实里程/GPS、有历史记录\"的功能。\n\u003e 共 7 项，分 3 个阶段实现。先读本文件与相关代码，按阶段顺序执行，每阶段结束 `flutter analyze` 无新增 error。\n\u003e 工作目录：`F:\\建筑验收工具\\site-patrol`（Flutter，iOS/Android/Web；本机 Windows 只能跑 analyze + Web 构建）。\n\n---\n\n## 0. 现状盘点（先读这些文件）\n\n| 文件 | 现状问题 |\n|---|---|\n| `lib/features/patrol/patrol_page.dart` | 底图写死 `assets/drawings/nkf_west_1f.png`；路线/检查点/楼层/里程(0.52km)/时长(16s)/点数(48)全是常量；历史轨迹是假 SnackBar；`_markIssue` 传 `floor:'西楼1F'` 写死 |\n| `lib/utils/path_metrics.dart` | `patrolPathPoints`（34点，0-100相对坐标）、`patrolCheckpoints`、`patrolPlanKey='nkf_west_1f'` 硬编码；`PatrolOverlayPainter` 渲染可复用 |\n| `lib/data/mock/mock_data.dart` | `allProjects=[tencentProject(id:'tencent-dy04-7'), project(id:'nkf')]`；`dy7Drawings`（B05 有 PNG+校准种子，10张真实图纸）；`drawings`（南科大 PNG） |\n| `lib/core/di/providers.dart` | `projectProvider/currentProjectIdProvider/is7DongProjectProvider/drawingsProvider/floorsProvider` 按项目切换已就绪；`cadCalibrationMapProvider/loadCadCalibration` 校准就绪；B05 已有演示校准 seed |\n| `lib/data/models.dart` | `CaptureArgs` 已支持 `projectId/drawingKey/drawPointWorldX/drawPointWorldY`（③直接可用）；`Drawing{key,title,src,w,h,cadOcfKey}` |\n| `lib/core/storage/local_storage.dart` | `readDoc/writeDoc` JSON 存储（照 `measure_store.dart` 模式） |\n| `lib/core/utils/cad_coord.dart` | `CadCoordMapper.screenToWorld`（像素→世界坐标mm，⑤真实里程的算法基础） |\n\n---\n\n## 阶段一：②①③ —— 数据驱动 + 底图换项目 + 标记带真实信息（半天）\n\n### ② PatrolPlan 模型化\n\n**`lib/data/models.dart` 新增三个模型**（放 MeasureArgs 附近）：\n\n```dart\n// ==================== 巡场 ====================\n\n/// 巡场路线点（相对坐标 0~100，绑定图纸）。isCheckpoint=true 为检查点。\nclass PatrolPoint {\n  final double dx; // 0~100（对应整图宽度的百分比）\n  final double dy; // 0~100\n  final bool isCheckpoint;\n  const PatrolPoint({required this.dx, required this.dy, this.isCheckpoint = false});\n\n  PatrolPoint copyWith({double? dx, double? dy, bool? isCheckpoint}) =\u003e\n      PatrolPoint(\n        dx: dx ?? this.dx,\n        dy: dy ?? this.dy,\n        isCheckpoint: isCheckpoint ?? this.isCheckpoint,\n      );\n\n  Map\u003cString, dynamic\u003e toJson() =\u003e\n      {'dx': dx, 'dy': dy, 'isCheckpoint': isCheckpoint};\n\n  factory PatrolPoint.fromJson(Map\u003cString, dynamic\u003e m) =\u003e PatrolPoint(\n        dx: (m['dx'] as num?)?.toDouble() ?? 0,\n        dy: (m['dy'] as num?)?.toDouble() ?? 0,\n        isCheckpoint: m['isCheckpoint'] == true,\n      );\n}\n\n/// 巡场路线（一条路线绑定一张图纸、一个项目）。\nclass PatrolPlan {\n  final String id;\n  final String projectId;\n  final String drawingKey;\n  final String name;      // 如 \"B1 地下车库巡场路线\"\n  final String floor;     // 如 \"B1\"\n  final List\u003cPatrolPoint\u003e points;\n  final double? totalKm;  // 手动填写的兜底里程（图纸未校准时用）；校准后自动算\n  final int updatedAt;\n  const PatrolPlan({\n    required this.id,\n    required this.projectId,\n    required this.drawingKey,\n    required this.name,\n    required this.floor,\n    required this.points,\n    this.totalKm,\n    this.updatedAt = 0,\n  });\n\n  List\u003cint\u003e get checkpointIdxs =\u003e [\n        for (var i = 0; i \u003c points.length; i++)\n          if (points[i].isCheckpoint) i\n      ];\n\n  PatrolPlan copyWith({\n    String? name, String? floor, List\u003cPatrolPoint\u003e? points,\n    double? totalKm, int? updatedAt,\n  }) =\u003e\n      PatrolPlan(\n        id: id, projectId: projectId, drawingKey: drawingKey,\n        name: name ?? this.name, floor: floor ?? this.floor,\n        points: points ?? this.points,\n        totalKm: totalKm ?? this.totalKm,\n        updatedAt: updatedAt ?? this.updatedAt,\n      );\n\n  Map\u003cString, dynamic\u003e toJson() =\u003e {\n        'id': id, 'projectId': projectId, 'drawingKey': drawingKey,\n        'name': name, 'floor': floor,\n        'points': points.map((p) =\u003e p.toJson()).toList(),\n        'totalKm': totalKm, 'updatedAt': updatedAt,\n      };\n\n  factory PatrolPlan.fromJson(Map\u003cString, dynamic\u003e m) =\u003e PatrolPlan(\n        id: m['id'] as String? ?? '',\n        projectId: m['projectId'] as String? ?? '',\n        drawingKey: m['drawingKey'] as String? ?? '',\n        name: m['name'] as String? ?? '',\n        floor: m['floor'] as String? ?? '',\n        points: (m['points'] as List? ?? [])\n            .map((e) =\u003e PatrolPoint.fromJson(e as Map\u003cString, dynamic\u003e))\n            .toList(),\n        totalKm: (m['totalKm'] as num?)?.toDouble(),\n        updatedAt: (m['updatedAt'] as num? ?? 0).toInt(),\n      );\n}\n\n/// 一次巡场记录（⑦历史用）。\nclass PatrolRecord {\n  final String id;\n  final String planId;\n  final String projectId;\n  final String drawingKey;\n  final String name;\n  final int startedAt;   // ms\n  final int finishedAt;  // ms\n  final double distKm;   // 实际里程（GPS 或按进度估算）\n  final int pointCount;  // 采样点数\n  final int issueCount;  // 标记问题数\n  final List\u003cMap\u003cString, double\u003e\u003e track; // GPS 轨迹 [{lat,lng,ts}]\n  const PatrolRecord({\n    required this.id, required this.planId, required this.projectId,\n    required this.drawingKey, required this.name,\n    required this.startedAt, required this.finishedAt,\n    required this.distKm, required this.pointCount, required this.issueCount,\n    this.track = const [],\n  });\n  // toJson/fromJson 同上模式（track 直接透传 List\u003cMap\u003e）\n}\n\n/// 巡场页路由参数（照 MeasureArgs 模式）。\nclass PatrolArgs {\n  final String? planId;\n  const PatrolArgs({this.planId});\n}\n```\n\n**`lib/core/storage/patrol_plan_store.dart` 新增**（照 `measure_store.dart` 模式）：\n\n```dart\n/// 巡场路线持久化。key：patrol_plans_v1_\u003cprojectId\u003e → JSON List\u003cPatrolPlan\u003e。\nclass PatrolPlanStore {\n  const PatrolPlanStore._();\n  static Future\u003cList\u003cPatrolPlan\u003e\u003e list(String projectId) async { ... }\n  static Future\u003cvoid\u003e save(String projectId, List\u003cPatrolPlan\u003e plans) async { ... }\n  // 内部用 LocalStorage.instance.readDoc/writeDoc('patrol_plans_v1_$projectId')\n}\n```\n\n**`lib/core/di/providers.dart` 新增**：\n\n```dart\nfinal patrolPlansProvider = FutureProvider.family\u003cList\u003cPatrolPlan\u003e, String\u003e(\n    (ref, projectId) =\u003e PatrolPlanStore.list(projectId));\nfinal patrolRecordsProvider = FutureProvider.family\u003cList\u003cPatrolRecord\u003e, String\u003e(\n    (ref, projectId) =\u003e PatrolRecordStore.list(projectId));\n```\n\n**`lib/data/mock/mock_data.dart` 新增默认路线种子**（两项目各一条，保证首次打开有内容）：\n\n```dart\n/// 默认巡场路线种子。南科大 = 原有 34 点路径（迁移自 path_metrics）；\n/// 7栋 = B05 地下室夹层平面图上的演示路线（10 点，含 3 个检查点，\n/// 具体点位为演示值，上线前用路线编辑器按真实走廊调整）。\nconst List\u003cPatrolPlan\u003e seedPatrolPlans = [\n  PatrolPlan(\n    id: 'nkf_default', projectId: 'nkf', drawingKey: 'nkf_west_1f',\n    name: '西楼1F 门诊-病房翼巡场', floor: '西楼 1F',\n    points: [ /* 把 path_metrics.dart 的 patrolPathPoints 34点搬进来，\n               patrolCheckpoints 对应下标 isCheckpoint=true */ ],\n  ),\n  PatrolPlan(\n    id: 'dy7_default', projectId: 'tencent-dy04-7', drawingKey: 'dy04_7_B05',\n    name: 'B1 地下室夹层巡场路线', floor: 'B1',\n    points: [\n      PatrolPoint(dx: 20, dy: 20), PatrolPoint(dx: 20, dy: 50, isCheckpoint: true),\n      PatrolPoint(dx: 35, dy: 50), PatrolPoint(dx: 35, dy: 75, isCheckpoint: true),\n      PatrolPoint(dx: 55, dy: 75), PatrolPoint(dx: 55, dy: 50),\n      PatrolPoint(dx: 70, dy: 50, isCheckpoint: true), PatrolPoint(dx: 70, dy: 20),\n      PatrolPoint(dx: 40, dy: 20),\n    ],\n  ),\n];\n```\n\n\u003e 首次读取逻辑：`PatrolPlanStore.list(projectId)` 为空时，取 seed 中该项目的计划返回（不强制写库；用户保存编辑后才写库）。\n\n### ① 底图换成当前项目图纸 + 绑定 drawingKey\n\n**`lib/features/patrol/patrol_page.dart` 改造**：\n1. 构造改为 `PatrolPage({required this.args})`（`PatrolArgs`，go_router extra 传入；tab 入口处 extra 传 `const PatrolArgs()`）\n2. initState 里解析计划：\n   ```dart\n   // 读当前项目 id（ref.watch(projectProvider)）→ patrolPlansProvider(projectId)\n   // → 有 planId 用指定计划，否则取该计划列表第一条；没有则提示\"请先创建巡场路线\"并给跳编辑页按钮\n   ```\n3. 底图：`final drawing = drawingsAsync.valueOrNull?[plan.drawingKey];` → `Image.asset(drawing.src)`；删除 `nkf_west_1f.png` 写死\n4. 渲染比例：用 `drawing.w / drawing.h` 替代写死的 `1500/944`\n5. 顶部\"楼层\"chip：`plan.floor`（删除\"西楼 1F\"写死）\n6. 检查点下标：`plan.checkpointIdxs` 替代 `patrolCheckpoints`\n\n### ③ _markIssue 传真实项目信息\n\n`patrol_page.dart` 的 `_markIssue()` 改为：\n\n```dart\nvoid _markIssue() {\n  final rel = _currentRel(); // 0~1\n  final mapper = ref.read(cadCalibrationMapProvider)[plan.drawingKey];\n  double? wx, wy;\n  if (mapper != null) {\n    // 0~1 → 整图像素（drawing.w/h）→ 世界坐标 mm\n    final px = rel.dx * drawingW;\n    final py = rel.dy * drawingH;\n    final w = mapper.screenToWorld(px, py);\n    wx = w.dx; wy = w.dy;\n  }\n  context.push('/capture', extra: CaptureArgs(\n    projectId: plan.projectId,\n    floor: plan.floor,\n    anchorLabel: '巡场中·当前位置',\n    x: rel.dx, y: rel.dy,\n    drawingKey: plan.drawingKey,\n    drawPointWorldX: wx, drawPointWorldY: wy,\n  ));\n}\n```\n\n\u003e `CaptureArgs` 无需改（字段已存在）。唯一改动：`drawingW/H` 从当前 Drawing 取。\n\n**阶段一验收**：\n- [ ] 切到\"腾讯大铲湾DY04·7栋\"打开巡场 → 底图是 B05，楼层 chip 显示 \"B1\"，路线/检查点按 seed 渲染\n- [ ] 切回南科大项目 → 底图/路线还是原西楼1F（旧演示不破坏）\n- [ ] 巡场中\"标记问题点\" → 拍照页收到 projectId/drawingKey/floor，B05 已校准时带 worldX/Y\n\n---\n\n## 阶段二：④⑤ —— 路线编辑器 + 真实里程（1 天）\n\n### ④ 路线编辑模式\n\n**新增 `lib/features/patrol/patrol_editor_page.dart`**（交互规格照量尺页的经验实现）：\n\n| 操作 | 行为 |\n|---|---|\n| 单击图纸空白处 | 追加一个路点（显示坐标→0~100相对坐标） |\n| 拖动已有点 | 移动（GestureDetector onPanUpdate，拖后保存新坐标） |\n| 长按点 | 删除该点 |\n| 双击点 | 切换检查点标记（蓝色实心=检查点，空心=普通点） |\n| 撤销 | 移除最后一个点 |\n| 清空 | 清空全部 |\n| 保存 | 校验 points≥2 → 写入 PatrolPlanStore（新计划：id=时间戳，projectId/drawingKey/name/floor 从页面表单取） |\n\n技术要点：\n- 底图 `Image.asset(drawing.src)` + `LayoutBuilder`；**坐标换算用与 measure_page 相同的 contain 反算**（显示坐标→整图坐标→`/w*100` 相对坐标；绘制时反向映射）\n- 覆盖层 `CustomPaint`：折线（照 `roundPolyline` 风格）+ 点（检查点蓝/普通白）+ 序号\n- 入口：巡场页 AppBar 右侧\"编辑路线\"icon（或底部面板加\"路线管理\"），go_router 加 `/patrol-editor` 路由（extra: `PatrolArgs(planId)`；编辑已有计划则预填）\n- 编辑后可改 name/floor 两个文本框\n\n### ⑤ 按图纸校准算真实里程\n\n**`lib/utils/path_metrics.dart` 新增纯函数**：\n\n```dart\n/// 按校准后的 CAD 坐标计算路线真实里程（km）。\n/// [points] 相对坐标 0~100；[mapper] 图纸校准映射；[imgW]/[imgH] 整图像素尺寸。\n/// 图纸未校准返回 null（调用方用 plan.totalKm 兜底）。\ndouble? realRouteKm(List\u003cPatrolPoint\u003e points, CadCoordMapper mapper,\n    double imgW, double imgH) {\n  if (points.length \u003c 2) return null;\n  var total = 0.0;\n  for (var i = 1; i \u003c points.length; i++) {\n    final a = mapper.screenToWorld(\n        points[i-1].dx / 100 * imgW, points[i-1].dy / 100 * imgH);\n    final b = mapper.screenToWorld(\n        points[i].dx / 100 * imgW, points[i].dy / 100 * imgH);\n    total += (a - b).distance; // mm\n  }\n  return total / 1e6; // → km\n}\n```\n\n`patrol_page.dart` 的 `_totalKm` 改为动态：\n```dart\n// initState/校准加载后计算一次：\n_totalKm = realRouteKm(plan.points, mapper, drawing.w, drawing.h)\n    ?? plan.totalKm ?? 0.0;\n```\n里程 chip 显示实算值；统计说明文字改为\"里程（按图纸实算）\"（未校准则\"里程（估算）\"）。\n\n\u003e 注意：B05 的 seed 校准是演示值（含系统偏移，见 providers.dart 注释），演示里程有偏差属正常；真实校准后自动变准——这本身就是给院长讲的亮点。\n\n**阶段二验收**：\n- [ ] 编辑器：加5个点→拖动1个→长按删1个→双击设2个检查点→保存→巡场页路线更新\n- [ ] 保存后重进 App 路线仍在（LocalStorage）\n- [ ] B05（已校准）巡场页里程 chip 显示实算 km（≈路线长度），南科大（未校准）走 totalKm 兜底\n- [ ] 点数 chip = 按进度 × 路线点数（不再用常量 48）\n\n---\n\n## 阶段三：⑥⑦ —— GPS 真实轨迹 + 历史记录（1 天）\n\n### ⑥ GPS 真实轨迹\n\n1. **依赖**：`pubspec.yaml` 加 `geolocator: ^13.0.1`（pub.dev 标准包，Web 走浏览器定位；添加后需 `flutter pub get`）\n2. **权限**：\n   - `android/app/src/main/AndroidManifest.xml` 加 `\u003cuses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/\u003e` + `\u003cuses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/\u003e`\n   - `ios/Runner/Info.plist` 加 `NSLocationWhenInUseUsageDescription`（\"巡场需要定位以记录真实轨迹\"）\n   - 运行时：`Geolocator.requestPermission()`；拒绝 → 退化为现有计时模式（UI 提示\"手动模式\"）\n3. **新增 `lib/features/patrol/patrol_location_service.dart`**：\n\n```dart\nclass PatrolLocationService {\n  StreamSubscription\u003cPosition\u003e? _sub;\n  final List\u003cMap\u003cString, double\u003e\u003e track = [];\n  double distKm = 0;\n  Position? _last;\n\n  Future\u003cbool\u003e start() async {\n    final ok = await Geolocator.isLocationServiceEnabled();\n    final perm = await Geolocator.checkPermission();\n    if (!ok || perm == LocationPermission.deniedForever) return false;\n    var p = perm;\n    if (p == LocationPermission.denied) p = await Geolocator.requestPermission();\n    if (p == LocationPermission.denied || p == LocationPermission.deniedForever) return false;\n    _sub = Geolocator.getPositionStream(\n      locationSettings: const LocationSettings(accuracy: LocationAccuracy.best, distanceFilter: 2),\n    ).listen((pos) {\n      if (_last != null) {\n        distKm += Geolocator.distanceBetween(\n            _last!.latitude, _last!.longitude, pos.latitude, pos.longitude) / 1000;\n      }\n      _last = pos;\n      track.add({'lat': pos.latitude, 'lng': pos.longitude,\n                 'ts': pos.timestamp.millisecondsSinceEpoch.toDouble()});\n    });\n    return true;\n  }\n  void stop() { _sub?.cancel(); _sub = null; }\n}\n```\n\n4. `patrol_page.dart`：`_start()` 时启动 GPS（异步）；运行中里程 chip 显示 `gps.distKm`（GPS 可用）否则沿用进度估算；顶部状态 chip 增加\"GPS/手动\"标识；`_finish()` 停止 GPS 并生成 PatrolRecord（`track=gps.track`、`issueCount`=本次巡场期间标记问题数——`_markIssue` 成功跳转时计数 +1）\n5. **注意**：GPS 不需要网络（卫星信号），\"离线 · GPS 仍记录\"文案保持正确\n\n### ⑦ 历史记录列表\n\n1. **新增 `lib/core/storage/patrol_record_store.dart`**（key `patrol_records_v1_\u003cprojectId\u003e`，保存/追加/列表，照 measure_store 模式）\n2. **新增 `lib/features/patrol/patrol_history_page.dart`**：按时间倒序列表，每条显示：名称/日期/时长/里程/点数/问题数；点击进详情（统计 + 轨迹点数 + 起点终点），MVP 不做回放动画\n3. `patrol_page.dart` 的 `_showHistory()` 改为 `context.push('/patrol-history')`（删除假 SnackBar）\n4. go_router 加 `/patrol-history` 路由\n\n**阶段三验收**：\n- [ ] 真机上授权定位 → 巡场记录真实 track、里程随走动增长\n- [ ] 拒绝定位 → 正常降级计时模式，不崩溃\n- [ ] 完成巡场 → 历史列表出现记录；重进 App 记录仍在\n- [ ] 每条记录统计正确（时长/里程/点数/问题数）\n\n---\n\n## 全局约束\n\n1. 只改巡场相关文件 + 通用模型/存储；**不要动量尺（measure_*）、拍照验收、AR 相关文件**\n2. 所有存储读取给默认值兜底，旧数据不抛异常\n3. 每阶段结束：`flutter analyze` 无新增 error + `flutter build web --release` 通过\n4. 不要跑 iOS/Android 构建（Windows 无法验证；geolocator 的原生部分留待 Mac/真机验证，Dart 侧先静态通过）\n5. 删除被替代的常量时：`path_metrics.dart` 的 `patrolPathPoints/patrolCheckpoints` 迁移进 mock 种子后**保留原注释说明出处**，`patrolPlanKey` 一并移除（检查全项目无引用后再删）\n\n## 完成后的演示脚本（巡场）\n\n\u003e \"巡场不再是写死的demo：打开就是当前项目的图纸和路线——B1地下室的巡场路线是我们自己在图纸上画的，里程按图纸真实坐标算出来；现场走一圈，GPS记录真实轨迹，历史记录随时回看。以后每个项目，设计院5分钟就能配一条自己的巡场路线。\"\n"},{"id":"docs/archive/PATROL_SEED_ROUTE.md","path":"docs/archive/PATROL_SEED_ROUTE.md","url":"ZG9jcy9hcmNoaXZlL1BBVFJPTF9TRUVEX1JPVVRFLm1k","base":"PATROL_SEED_ROUTE.md","title":"巡场：用户自规划路线 + 全局推荐路线（交付 CodeBuddy）","group":"归档 · 巡场","scope":"archive","date":"2026-08-26","mtime":"2026-08-26","size":6385,"chars":3138,"lines":108,"nhead":8,"lead":"在 PATROL_OPTIMIZE.md（④路线编辑器）与 PATROL_ZOOM_WALL.md（缩放+穿墙检测）基础上叠加。 三件事：①编辑器增删点交互补全 ②默认\"全局巡场推荐路线\"（不穿墙、符合工程习惯）③推荐路线作为模板可复制编辑。","text":"# 巡场：用户自规划路线 + 全局推荐路线（交付 CodeBuddy）\n\n\u003e 在 `PATROL_OPTIMIZE.md`（④路线编辑器）与 `PATROL_ZOOM_WALL.md`（缩放+穿墙检测）基础上叠加。\n\u003e 三件事：①编辑器增删点交互补全 ②默认\"全局巡场推荐路线\"（不穿墙、符合工程习惯）③推荐路线作为模板可复制编辑。\n\n---\n\n## 1. 编辑器交互补全（在 ④ 基础上增强）\n\n| 操作 | 行为 | 状态 |\n|---|---|---|\n| 单击图纸空白处 | 追加路点 | 已有 |\n| 拖动点 | 移动 | 已有 |\n| **单击已有点** | **选中高亮**，点旁浮现小操作钮：`删除` / `设为检查点` / `取消检查点` | 新增（比长按更易发现） |\n| 长按点 | 删除 | 已有（保留） |\n| 双击点 | 切换检查点 | 已有（保留） |\n| 撤销 / 清空 | 移除最后点 / 清空 | 已有 |\n| **校验穿墙** | 一键对整条路线跑墙线检测（`PATROL_ZOOM_WALL.md` P1-2 的 `routeSegmentHitsWall`），弹出结果：\"无穿墙 ✓\" 或 \"N 段穿墙\"，穿墙段红色高亮 | 新增 |\n| **复制路线** | 把当前路线另存为新计划（\"xx-副本\"），推荐路线模板复制后可自由增删点 | 新增 |\n| 保存 | points≥2 才可保存；有穿墙段时弹确认框（允许保存） | 已有 |\n\n选点小操作钮实现提示：选中点在 `_selectedIdx` 状态，绘制时给该点描边高亮；按钮用 Positioned 浮层或底部工具条（选中时显示\"删除所选点/设为检查点\"两个按钮即可，最省）。\n\n## 2. 推荐路线（全局巡场）设计规范\n\n**工程习惯原则（写进产品，作为检查点配置指引，也用于演示话术）**：\n\n| 原则 | 说明 |\n|---|---|\n| 闭环 | 起点=终点（主入口出发、回主入口），一条路线覆盖全层 |\n| 只走公共走道 | 沿走廊/疏散通道走，不穿房间；机房/设备房作为检查点**进入后原路返回** |\n| 顺疏散方向 | 路线方向优先沿疏散指示（与消防巡检习惯一致） |\n| 检查点八类 | ①主入口 ②楼梯间（每部）③电梯厅 ④扶梯 ⑤坡道口 ⑥设备机房/水泵房/变配电（本层如有）⑦防火分区门 ⑧消火栓/管井集中处 |\n| 点密度 | 走廊拐角必须有路点；直线段每 15~25m 一个点（保持视线连续） |\n| 不穿墙硬约束 | 保存推荐路线前必须跑\"校验穿墙\"通过（0 穿墙段） |\n\n## 3. B05 全局巡场推荐路线骨架\n\n\u003e 基于图纸文件信息（A座 LT01~LT03 楼梯、B座 QLT2-4/LT04/LT05 楼梯、自动扶梯 FT-4EC3-01、电梯、夹层、坡道）设计。**坐标为占位值**，必须按 §4 流程在编辑器里校准后才可标记为推荐路线（本模型无法读取图片，不能直接给出走廊精确坐标——工具自校验兜底）。\n\n路线骨架（15 点，★=检查点）：\n\n```\n主入口（★①）→ 沿 A 座主走廊 → A 座核心筒：LT01 楼梯间（★②）\n→ 电梯厅（★③）→ LT02/LT03 楼梯（★④）→ 自动扶梯 FT-4EC3-01（★⑤）\n→ A/B 座连廊 → B 座核心筒：B 座楼梯（★⑥）→ B 座电梯厅（★⑦）\n→ B 座走廊环绕 → 坡道口（★⑧）→ 设备机房区（★⑨）\n→ 防火分区门（★⑩）→ 沿主走廊回主入口（闭环）\n```\n\n占位坐标表（相对 0-100，dy04_7_B05，4500×2551）：\n\n```\n点01 主入口          (50, 90) ★\n点02 走廊拐角        (40, 90)\n点03 A座LT01楼梯间   (40, 70) ★\n点04 A座电梯厅       (45, 70) ★\n点05 A座LT02/LT03    (50, 70) ★\n点06 扶梯FT-4EC3-01  (58, 70) ★\n点07 A/B连廊         (62, 65)\n点08 B座楼梯         (68, 65) ★\n点09 B座电梯厅       (72, 65) ★\n点10 B座走廊拐角     (75, 55)\n点11 坡道口          (75, 40) ★\n点12 设备机房区      (68, 40) ★\n点13 走廊拐角        (60, 35)\n点14 防火分区门      (50, 35) ★\n点15 回主入口        (50, 90)（与点01闭环）\n```\n\n\u003e ⚠️ 这些坐标是**演示占位**，不是真实走廊位置。真实推荐路线的产生流程见 §4——这是有意的设计：**\"推荐路线=模板骨架+工具校准+穿墙自校验\"**，保证交付的路线真实不穿墙。\n\n## 4. 推荐路线验收流程（必须走完才算\"推荐路线合格\"）\n\n1. 跑通 `PATROL_ZOOM_WALL.md` P1（墙线导出 + 检测）\n2. 编辑器打开推荐路线 → **放大到走廊级** → 按 §2 原则把占位点逐个拖到真实走廊中线（拐角加点、楼梯/电梯厅/机房门口设检查点）\n3. 点\"**校验穿墙**\" → 目标 **0 穿墙段**；有红色段就补点/移点消除\n4. 检查里程：巡场页里程 chip 显示图纸实算 km（B05 已校准），与常识核对（整层闭环几百米量级合理）\n5. 保存 → 路线带\"推荐\"徽标置顶\n\n## 5. 数据模型小改\n\n`lib/data/models.dart` 的 `PatrolPlan` 加字段：\n\n```dart\nfinal bool isRecommended; // 默认 false；推荐路线模板 true\n// copyWith / toJson / fromJson 同步（fromJson: m['isRecommended'] == true）\n```\n\n`seedPatrolPlans` 的 7栋计划改为两条：\n- `id:'dy7_recommended'`，`isRecommended:true`，points 用 §3 占位坐标（名字\"B1 全局巡场（推荐）\"）\n- 用户通过\"复制路线\"生成自己的计划后编辑保存\n\n列表/选择页：推荐计划置顶 + \"推荐\"徽标（badge，用现有 status_badge 风格）。\n\n## 6. 验收清单\n\n- [ ] 编辑器：单击加点/拖动/单击选中→删除按钮/双击切检查点/撤销/清空/保存 全部可用\n- [ ] 编辑器：点\"校验穿墙\"→ 占位路线显示 N 段红色（证明检测生效）→ 按 §4 调整后 → 0 段绿色通过\n- [ ] 复制路线 → 新计划出现\"副本\"，增删点自由\n- [ ] 巡场页：默认打开推荐路线（带徽标），路线沿走廊，里程为图纸实算值\n- [ ] 占位路线调整后的最终推荐路线坐标**回写**进 `seedPatrolPlans`（替换占位值），作为正式默认\n- [ ] `flutter analyze` + Web 构建通过\n\n## 7. 演示话术\n\n\u003e \"系统默认给一条全局巡场推荐路线：沿疏散通道闭环走一圈，楼梯、电梯、扶梯、机房、坡道、防火门这些关键部位自动设为检查点。路线是可以自己改的——加点、删点、拖动都行，改完点'校验穿墙'，系统告诉你路线有没有穿墙。**推荐路线是我们按工程习惯做的模板，你复制一份就能改成自己项目的。**\"\n"},{"id":"docs/archive/PATROL_ZOOM_WALL.md","path":"docs/archive/PATROL_ZOOM_WALL.md","url":"ZG9jcy9hcmNoaXZlL1BBVFJPTF9aT09NX1dBTEwubWQ=","base":"PATROL_ZOOM_WALL.md","title":"巡场地图优化 — 缩放平移 + 防穿墙（交付 CodeBuddy）","group":"归档 · 巡场","scope":"archive","date":"2026-08-26","mtime":"2026-08-26","size":8766,"chars":5886,"lines":189,"nhead":11,"lead":"背景：巡场地图存在两个体验问题： ① 图纸比例大（B05 为 4500×2551），手机上缩成一团看不清，无法放大 ② 模拟轨迹沿点间直线走，会穿墙——人应沿走廊/通道走 本文件是 PATROL_OPTIMIZE.md 的增强补丁：在已实现的巡场改造基础上叠加。 分 P0（缩放，今天可交付）/ P1（穿墙检测与警告）/","text":"# 巡场地图优化 — 缩放平移 + 防穿墙（交付 CodeBuddy）\n\n\u003e 背景：巡场地图存在两个体验问题：\n\u003e ① 图纸比例大（B05 为 4500×2551），手机上缩成一团看不清，无法放大\n\u003e ② 模拟轨迹沿点间直线走，会穿墙——人应沿走廊/通道走\n\u003e 本文件是 `PATROL_OPTIMIZE.md` 的**增强补丁**：在已实现的巡场改造基础上叠加。\n\u003e 分 P0（缩放，今天可交付）/ P1（穿墙检测与警告）/ P2（自动寻路，二期简述，暂不实现）。\n\n---\n\n## P0：地图缩放与平移（巡场页 + 路线编辑器都要）\n\n**方案**：Flutter 内置 `InteractiveViewer`，不用第三方包。\n\n**`lib/features/patrol/patrol_page.dart`** 地图区（现在约 245~292 行的 LayoutBuilder 部分）改为：\n\n```dart\nfinal _transformController = TransformationController(); // State 字段\n\n// 地图区：\nExpanded(\n  child: LayoutBuilder(\n    builder: (context, constraints) {\n      // …原有 contain-fit 计算 pw/ph 不变…\n      return InteractiveViewer(\n        transformationController: _transformController,\n        minScale: 1.0,\n        maxScale: 12.0,\n        boundaryMargin: const EdgeInsets.all(160),\n        clipBehavior: Clip.hardEdge,\n        child: SizedBox(\n          width: pw,\n          height: ph,\n          child: Stack(\n            fit: StackFit.expand,\n            children: [\n              Image.asset(drawing.src, fit: BoxFit.fill),\n              CustomPaint(painter: PatrolOverlayPainter(...)),\n            ],\n          ),\n        ),\n      );\n    },\n  ),\n)\n```\n\n**要点**：\n1. `InteractiveViewer` 放在 `Expanded` 内、包住 `SizedBox(pw,ph)`——初始 scale=1 即现在的适配全图状态；双指捏合 / 触控板 / 鼠标滚轮放大到 12×，拖动平移\n2. 移动端默认支持双指捏合与单指平移（InteractiveViewer 内置）\n3. 加\"复位\"按钮（AppBar 或地图角落悬浮）：`_transformController.value = Matrix4.identity()`\n4. **注意**：放大时路径、检查点、当前位置标记随图一起缩放（MVP 可接受；标记反缩放为固定像素是后续优化，不做）\n5. 路线编辑器 `patrol_editor_page.dart` 同样包一层 InteractiveViewer（编辑器里用户需要放大到房间级别布点，这是\"沿走廊画点\"的前提）\n\n**P0 验收**：\n- [ ] 巡场页：双指捏合/滚轮可放大到看清房间与走廊（≥5×），可平移，复位按钮回全图\n- [ ] 编辑器：同样可缩放平移，放大状态下加点/拖点坐标正确（缩放矩阵换算用 `localToViewPixel` 思路：显示坐标→child坐标，注意 InteractiveViewer 的变换由 `TransformationController.toScene(localPosition)` 直接给出 child 坐标，用它替代手算）\n\n---\n\n## P1：穿墙检测与警告（编辑器红色高亮 + 巡场页红色渲染）\n\n### P1-1 数据管线：导出墙线段（Python，ezdxf 现成）\n\n**`server/cad_meta_server.py`** 的 `parse_dwg_to_meta()` 增加墙线段提取，输出字段：\n\n```python\n# 在返回 meta 的 dict 里追加：\n\"wall_lines\": [\n    {\"layer\": \"AD-WALL-B1M$0$WALL\", \"pts\": [[x1,y1],[x2,y2], ...]},\n    ...\n]\n```\n\n实现要点：\n1. 遍历 `msp.query('LINE LWPOLYLINE')`\n2. 图层过滤：`layer_name.upper()` 含 `'WALL'` 或 含 `'墙'`；**排除**含 `'COL'` 的图层（柱，不是墙线）——`'COL' not in name.upper()`\n3. LINE → pts=[[start.x,start.y],[end.x,end.y]]（世界坐标 mm）；LWPOLYLINE → 取各顶点（闭合多段线去掉最后一个重复点）\n4. 数量可能数千段，JSON 直接存；体积大也没关系（本地资产）\n\n**`server/cad_meta_build.py`**：\n- `OCF_KEYS` 加入 `'dy04_7_B05'`（B05 目前在列表外，必须加，否则生成不了墙线数据；find_dwg 从 `大铲湾DY04_资料` 根递归找，能找到第一轮测试CAD里的B05）\n- 生成后**额外拷贝**一份到 Flutter 资产目录：`site-patrol/assets/walls/\u003ckey\u003e_walls.json`（新建 assets/walls 目录），并同步 `pubspec.yaml` 注册该 assets 目录：\n\n```yaml\nflutter:\n  assets:\n    - assets/walls/\n```\n\n\u003e 说明：App 端用 rootBundle 读本地资产（演示最稳）；后续接网络时再从 cad_meta_server 拉取。\n\n### P1-2 Flutter 侧：墙线加载与相交检测\n\n**新增 `lib/utils/geo.dart`**（纯函数，可单测）：\n\n```dart\n/// 线段相交检测（不含端点相接）。返回 true = 两线段严格相交。\nbool segmentsIntersect(\n    double ax, double ay, double bx, double by,\n    double cx, double cy, double dx, double dy) {\n  // 标准叉积法：\n  double cross(ox, oy, px, py, qx, qy) =\u003e\n      (px - ox) * (qy - oy) - (py - oy) * (qx - ox);\n  final d1 = cross(cx, cy, dx, dy, ax, ay);\n  final d2 = cross(cx, cy, dx, dy, bx, by);\n  final d3 = cross(ax, ay, bx, by, cx, cy);\n  final d4 = cross(ax, ay, bx, by, dx, dy);\n  return ((d1 \u003e 0 \u0026\u0026 d2 \u003c 0) || (d1 \u003c 0 \u0026\u0026 d2 \u003e 0)) \u0026\u0026\n         ((d3 \u003e 0 \u0026\u0026 d4 \u003c 0) || (d3 \u003c 0 \u0026\u0026 d4 \u003e 0));\n}\n\n/// 一段路线折线（相对坐标0-100）是否穿墙。\n/// [walls] 为同一相对坐标系下的墙线段 [[ax,ay,bx,by], ...]。\nbool routeSegmentHitsWall(double ax, double ay, double bx, double by,\n    List\u003cList\u003cdouble\u003e\u003e walls) {\n  for (final w in walls) {\n    if (segmentsIntersect(ax, ay, bx, by, w[0], w[1], w[2], w[3])) return true;\n  }\n  return false;\n}\n```\n\n**新增 `lib/core/cad/wall_lines.dart`**：\n\n```dart\n/// 从本地资产加载某图纸的墙线段，并把世界坐标(mm) 转为相对坐标(0-100)。\n/// [mapper] 该图纸校准映射（worldToScreen 逆变换）；未校准返回 null。\nFuture\u003cList\u003cList\u003cdouble\u003e\u003e?\u003e loadWallLinesRel(\n    String drawingKey, CadCoordMapper mapper) async {\n  final raw = await rootBundle.loadString('assets/walls/${drawingKey}_walls.json');\n  final j = jsonDecode(raw) as Map\u003cString, dynamic\u003e;\n  final rel = \u003cList\u003cdouble\u003e\u003e[];\n  for (final wl in (j['wall_lines'] as List)) {\n    final pts = (wl['pts'] as List);\n    for (var i = 1; i \u003c pts.length; i++) {\n      final a = mapper.worldToScreen(\n          (pts[i-1][0] as num).toDouble(), (pts[i-1][1] as num).toDouble());\n      final b = mapper.worldToScreen(\n          (pts[i][0] as num).toDouble(), (pts[i][1] as num).toDouble());\n      rel.add([a.dx / mapper.viewWidth * 100, a.dy / mapper.viewHeight * 100,\n               b.dx / mapper.viewWidth * 100, b.dy / mapper.viewHeight * 100]);\n    }\n  }\n  return rel;\n}\n```\n\n\u003e 注意：`CadCoordMapper.worldToScreen` 在仿射模式下已实现（b=e=0 假设，B05 满足）。图纸未校准时墙线检测不可用——编辑器提示\"该图纸未校准，无法检测穿墙\"。\n\n### P1-3 编辑器集成（穿墙警告）\n\n`patrol_editor_page.dart`：\n1. initState 加载墙线（校准存在时）；维护 `crossingSegs = \u003cint\u003e[]`（穿墙的路线段下标）\n2. **每次加点/拖点后**重算：对每段路线调用 `routeSegmentHitsWall` → 穿墙段下标集合\n3. 绘制：穿墙段画**红色粗线**，正常段绿色/蓝色；顶部横幅：\"⚠ 有 N 段路线穿墙，请沿走廊补点\"（红色）/ \"路线无穿墙\"（绿色）\n4. 保存时：存在穿墙段 → 弹确认对话框\"路线存在穿墙段，仍要保存吗？\"（允许保存，因为墙线数据可能有门窗洞口等误差）\n\n### P1-4 巡场页渲染\n\n`PatrolOverlayPainter` 加可选参数 `crossingSegs: Set\u003cint\u003e`：穿墙段画红色；正常段维持现状。巡场页加载墙线后计算传入（路线不变时只算一次）。\n\n### P1 验收\n\n- [ ] 运行 `python cad_meta_build.py` → B05 生成 `dy04_7_B05.json` 含 `wall_lines`，并拷贝出 `assets/walls/dy04_7_B05_walls.json`\n- [ ] 编辑器放大到房间级，在房间内点两点（直线横穿墙）→ 该段红色 + 顶部\"N 段穿墙\"警告\n- [ ] 沿走廊在拐角补点 → 警告消除\n- [ ] 保存时弹确认框\n- [ ] 巡场页穿墙段红色渲染\n- [ ] `flutter analyze` + `flutter build web --release` 通过\n\n---\n\n## P2（二期，本次不实现，只记录方案）：A* 自动寻路\n\n目标：用户只点起点/终点/检查点，系统沿可走区域自动生成折线（彻底不穿墙）。\n\n方案：\n1. 用 P1 的墙线段在世界坐标下**网格化**（如 500mm 格网）：与墙相交的格子标为障碍，墙体两侧各膨胀一格\n2. 检查点吸附到最近可走格 → **A\\*** 求最短路径 → 折线简化（Douglas-Peucker）→ 存入 PatrolPlan\n3. 依赖 P1 数据；工作量约 1~2 天，等 P1 验证稳定后再排\n\n## 全局约束（与 PATROL_OPTIMIZE.md 一致）\n\n1. 只改巡场相关 + `geo.dart`/墙线加载/Python 管线；不碰量尺、拍照验收、AR\n2. 未校准图纸要优雅降级（提示，不崩溃）\n3. 每阶段 `flutter analyze` 无新增 error + Web 构建通过；Python 侧在本机跑通 `cad_meta_build.py`\n4. 不跑 iOS/Android 构建\n"},{"id":"docs/archive/AR_CAPTURE_BUGFIX.md","path":"docs/archive/AR_CAPTURE_BUGFIX.md","url":"ZG9jcy9hcmNoaXZlL0FSX0NBUFRVUkVfQlVHRklYLm1k","base":"AR_CAPTURE_BUGFIX.md","title":"AR量尺补全 + 三处BUG修复（交付 CodeBuddy）","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-08-27","mtime":"2026-08-27","size":9948,"chars":7456,"lines":212,"nhead":12,"lead":"背景：读代码后诊断确认——AR页每次测量覆盖上次（无多点/无批量保存）、非iOS走\"假估算\"页面（永远合格，必须删）、AR无权限/无错误处理导致黑屏、拍照记录选点无视觉反馈且label恒为\"待选点\"（旧构建可能还有拦截）、拍照量尺无权限引导与相册兜底。另：P0-2标记错位修复尚未合入，本次一并做。 工作目录：F:\\建筑","text":"# AR量尺补全 + 三处BUG修复（交付 CodeBuddy）\n\n\u003e 背景：读代码后诊断确认——AR页每次测量覆盖上次（无多点/无批量保存）、非iOS走\"假估算\"页面（永远合格，必须删）、AR无权限/无错误处理导致黑屏、拍照记录选点无视觉反馈且label恒为\"待选点\"（旧构建可能还有拦截）、拍照量尺无权限引导与相册兜底。另：P0-2标记错位修复尚未合入，本次一并做。\n\u003e 工作目录：`F:\\建筑验收工具\\site-patrol`。先读相关文件再改，只动本文涉及的三个功能。\n\n---\n\n## 任务1：AR 多点测量 + 批量保存（lib/features/measure/ar_measure_page.dart）\n\n原生侧不用改（连续测量已就绪）。Flutter 侧：\n\n1. 新增状态 `final List\u003cdouble\u003e _measurements = [];`（单位mm，按测量顺序）\n2. `_onNative` 的 `onMeasure` 分支改为**追加**：\n   ```dart\n   setState(() {\n     _lastMm = mm;\n     _measurements.add(mm);\n     _hint = '已测 ${_measurements.length} 组，可继续测或保存';\n   });\n   ```\n3. `onCleared` 时清空 `_measurements`\n4. 结果区改为列表：距离卡片下方加 `SizedBox(height:180)` 的 ListView，每行 `实测 ${m.toStringAsFixed(1)} mm` + 序号 + 删除按钮（删除单条）\n5. **\"保存\"按钮（替换原\"加入校对\"）**：把 `_measurements` **全部**写入 MeasureSession：\n   ```dart\n   Future\u003cvoid\u003e _saveAll() async {\n     if (_measurements.isEmpty) {\n       AppSnack.show(context, '暂无测量结果', kind: AppSnackKind.danger);\n       return;\n     }\n     final drawingMm = double.tryParse(_drawingCtl.text);\n     var s = await MeasureStore.load(widget.args.projectKey, widget.args.drawingKey);\n     s ??= MeasureSession(id: '${widget.args.projectKey}_${widget.args.drawingKey}_ar',\n         projectKey: widget.args.projectKey, drawingKey: widget.args.drawingKey,\n         floor: widget.args.floor);\n     final items = [\n       for (var i = 0; i \u003c _measurements.length; i++)\n         MeasureItem(\n           name: 'AR-${i + 1}',\n           drawingMm: (drawingMm ?? 0),\n           photoMm: _measurements[i],\n           source: 'ar_lidar',\n         ),\n     ];\n     await MeasureStore.save(s.copyWith(items: [...s.items, ...items]));\n     if (mounted) {\n       AppSnack.show(context, '已保存 ${items.length} 条测量');\n       Navigator.of(context).pop();\n     }\n   }\n   ```\n6. 若 `_drawingCtl` 为空：允许保存（drawingMm=0），清单页后续手填——保存按钮校验改为\"仅要求有测量结果\"\n\n## 任务2：AR 黑屏修复（ios/Runner/ArMeasureView.swift + ar_measure_page.dart）\n\n### 2.1 原生（ArMeasureView.swift）\n\n`startSession()` 改为带权限检查与错误捕获：\n\n```swift\nimport AVFoundation // 文件顶部\n\nprivate func startSession() {\n    switch AVCaptureDevice.authorizationStatus(for: .video) {\n    case .notDetermined:\n        AVCaptureDevice.requestAccess(for: .video) { [weak self] granted in\n            DispatchQueue.main.async {\n                granted ? self?.runSession() : self?.denyCamera()\n            }\n        }\n    case .denied, .restricted:\n        denyCamera()\n    case .authorized:\n        runSession()\n    @unknown default:\n        runSession()\n    }\n}\n\nprivate func denyCamera() {\n    channel.invokeMethod(\"onCameraDenied\", arguments: \"相机权限被拒绝，请在系统设置中开启\")\n}\n\nprivate func runSession() {\n    let cfg = ARWorldTrackingConfiguration()\n    if ARWorldTrackingConfiguration.supportsFrameSemantics([.sceneDepth, .smoothedSceneDepth]) {\n        cfg.frameSemantics = [.sceneDepth, .smoothedSceneDepth]\n    }\n    cfg.planeDetection = [.horizontal, .vertical]\n    do {\n        sceneView.session.run(cfg, options: [.resetTracking, .removeExistingAnchors])\n        mode = .continuous\n    } catch {\n        channel.invokeMethod(\"onError\", arguments: \"AR会话启动失败：\\(error.localizedDescription)\")\n    }\n}\n```\n\n### 2.2 Flutter（ar_measure_page.dart）\n\n1. `_onNative` 加 `onCameraDenied` 处理：弹权限引导对话框（照 capture_page 的 `_showPermissionGuide`：提示 + `AppSettings.openAppSettings()`）\n2. `_onViewCreated`：`isSupported==false` 时**不渲染 UiKitView**（`_supported=false` 状态下 build 里用占位视图替换 UiKitView：居中提示\"需 iPhone 12 Pro+，请使用照片量尺\"+\"去照片量尺\"按钮 `Navigator.pop` 后由调用方处理或直接 push MeasurePage）\n3. 暂停/继续/清除/保存按钮在 `_supported==false` 时禁用\n4. **删除 `_buildWebFallback()` 的假估算逻辑**：非iOS/Web 平台 build 直接返回提示页（\"AR量尺仅支持iPhone Pro，请使用照片量尺\" + 关闭按钮），不要再提供\"计算并加入校对\"假结果（当前 `estMm=drw` 会导致永远判定合格，是错误功能）\n\n## 任务3：拍照记录\"选点无反馈/显示待选点\"（lib/features/capture/capture_page.dart）\n\n1. **选点图钉反馈**：`_onTapDrawing` 的 setState 里除 `_x/_y` 外，加 `_pinX/_pinY`（或直接复用 `_x/_y`）→ 图纸 Stack 里 `_step != selectFloor` 时在 `(_x, _y)` 处渲染固定图钉（照 `_buildPin` 风格，但位置用 `_x*width, _y*height`，颜色用 accent）\n2. **label 不再出现\"待选点\"**：`_snapToNearestAnchor` 吸附失败时（当前直接不更新，label 停在'待选点'）改为：\n   ```dart\n   if (bestDist \u003c 0.12 || force) {\n     _anchorLabel = best.label;\n   } else {\n     _anchorLabel = '已选点 (${(_x * 100).toStringAsFixed(0)}%, ${(_y * 100).toStringAsFixed(0)}%)';\n   }\n   ```\n   注：`_onTapDrawing` 里 `_anchorLabel = '待选点'` 改为 `_anchorLabel = '已选点'` 占位（随后 _snapToNearestAnchor 覆盖为具体值）\n3. **确认无拦截**：全文件 grep `待选点`——除注释与显示文案外，不得存在\"拦截拍照/保存\"的校验（当前源码已无；如果用户仍遇到\"未选点\"提示，是**旧构建**，`flutter clean` 后重建即可）\n4. `_confirmPointAndCapture` 保持现状（不做锚点校验）\n\n## 任务4：拍照量尺 + 拍照记录相机稳定性\n\n### 4.1 通用相机兜底工具（新增 lib/core/utils/camera_pick.dart，两处复用）\n\n```dart\nimport 'package:flutter/material.dart';\nimport 'package:image_picker/image_picker.dart';\n\n/// 移动端拍照：权限预检 → 后置 → 失败自动重试 → 失败弹\"改用相册\"兜底。\n/// [onDenied] 权限拒绝回调（页面弹权限引导）。\nFuture\u003cXFile?\u003e pickPhotoRobust(\n  BuildContext context, {\n  required VoidCallback onDenied,\n  double maxWidth = 1920,\n  int imageQuality = 85,\n}) async {\n  final picker = ImagePicker();\n  try {\n    // 先尝试后置相机\n    return await picker.pickImage(\n      source: ImageSource.camera,\n      maxWidth: maxWidth,\n      imageQuality: imageQuality,\n      preferredCameraDevice: CameraDevice.rear,\n    );\n  } on PlatformException catch (e) {\n    final msg = e.message ?? e.code;\n    // 权限类错误 → 引导\n    if (msg.toLowerCase().contains('permission') || e.code.contains('denied')) {\n      onDenied();\n      return null;\n    }\n    // 相机不可用（后置失败/模拟器等）→ 弹兜底对话框：重试 / 改用相册\n    final useGallery = await _showCameraFallbackDialog(context, msg);\n    if (useGallery == null) return null;\n    if (useGallery) {\n      return picker.pickImage(\n          source: ImageSource.gallery, maxWidth: maxWidth, imageQuality: imageQuality);\n    }\n    return pickPhotoRobust(context, onDenied: onDenied,\n        maxWidth: maxWidth, imageQuality: imageQuality);\n  } catch (_) {\n    final useGallery = await _showCameraFallbackDialog(context, '相机不可用');\n    if (useGallery == true) {\n      return picker.pickImage(\n          source: ImageSource.gallery, maxWidth: maxWidth, imageQuality: imageQuality);\n    }\n    return null;\n  }\n}\n\nFuture\u003cbool?\u003e _showCameraFallbackDialog(BuildContext context, String reason) async {\n  return showDialog\u003cbool\u003e(\n    context: context,\n    builder: (ctx) =\u003e AlertDialog(\n      title: const Text('相机不可用'),\n      content: Text('原因：$reason\\n是否改用相册选图？'),\n      actions: [\n        TextButton(onPressed: () =\u003e Navigator.pop(ctx, null), child: const Text('取消')),\n        TextButton(onPressed: () =\u003e Navigator.pop(ctx, false), child: const Text('重试')),\n        FilledButton(onPressed: () =\u003e Navigator.pop(ctx, true), child: const Text('改用相册')),\n      ],\n    ),\n  );\n}\n```\n\n### 4.2 接入两处\n\n- **measure_page.dart `_pickPhoto`**：移动端调用 `pickPhotoRobust(context, onDenied: _showPermissionGuide 同款弹窗)`；Web 保持 gallery\n- **capture_page.dart `_pickImage`**：替换为 `pickPhotoRobust`（保留其现有 `_showPermissionGuide` 作为 onDenied 回调）\n\n### 4.3 顺手合入 P0-2（标记错位，MEASURE_FIX_PLAN.md §P0-2）\n\n`measure_page.dart` 新增 `imageToDisplay`（BoxFit.contain 逆变换），三处标记（图纸蓝点/照片橙点/红点）渲染前换算——此修复此前未合入，本次一并完成。\n\n---\n\n## 验收清单\n\n- [ ] AR（真机iPhone Pro）：连续测3组 → 列表显示3条 → 删除1条 → 保存 → 清单页出现2条 `AR-1/AR-2`\n- [ ] AR：拒绝相机权限 → 弹权限引导；isSupported=false → 无黑屏（占位提示+引导照片量尺）\n- [ ] 非iOS/Web：无\"假估算\"页面，直接提示使用照片量尺\n- [ ] 拍照记录：点图纸 → 出现图钉 + label 显示\"已选点(x%, y%)\"（无锚点时）→ 开始拍照正常调相机\n- [ ] 拍照量尺：后置相机失败 → 弹\"重试/改用相册\"；相册兜底可用；权限拒绝 → 引导设置\n- [ ] 标记错位修复：点击处与标记重合\n- [ ] `flutter analyze` 无新增 error + Web 构建通过；真机验证需 Mac/iOS 设备\n\n## 红线\n\n1. 删除假估算页面后，确保没有任何路径再把 `estMm=drw` 式\"永远合格\"的数据写入会话\n2. 相机兜底对话框不能无限递归重试（重试最多一次后只给相册选项）\n"},{"id":"docs/archive/AR_LIDAR_IMPL_DETAIL.md","path":"docs/archive/AR_LIDAR_IMPL_DETAIL.md","url":"ZG9jcy9hcmNoaXZlL0FSX0xJREFSX0lNUExfREVUQUlMLm1k","base":"AR_LIDAR_IMPL_DETAIL.md","title":"AR量尺（LiDAR + ARKit sceneDepth）完整实现指南 — CodeBuddy 执行版","group":"归档 · 量尺与 AR","scope":"archive","date":"2026-08-25","mtime":"2026-08-25","size":26573,"chars":23161,"lines":678,"nhead":20,"lead":"任务：为 site-patrol（Flutter iOS/Android/Web）实现 iPhone Pro 高精度 AR 量尺： 相机取景 → 点两点 → 实时显示距离(mm) → 结果汇入现有量尺会话（MeasureSession）。 精度目标：1m 误差 ≤2cm，3m 误差 ≤5cm（与卷尺对比）。仅 iOS，","text":"# AR量尺（LiDAR + ARKit sceneDepth）完整实现指南 — CodeBuddy 执行版\n\n\u003e 任务：为 site-patrol（Flutter iOS/Android/Web）实现 iPhone Pro 高精度 AR 量尺：\n\u003e 相机取景 → 点两点 → 实时显示距离(mm) → 结果汇入现有量尺会话（MeasureSession）。\n\u003e 精度目标：1m 误差 ≤2cm，3m 误差 ≤5cm（与卷尺对比）。仅 iOS，LiDAR 机型（iPhone 12 Pro 及以上）。\n\u003e 本指南给出**可直接落地**的文件清单与代码；实现时先读现有代码，保持风格一致。\n\n---\n\n## ⚠️ 0. 前置条件（动手前先确认）\n\n1. **iOS 无法在 Windows 上编译**：需要一台 Mac（macOS 13+，Xcode 15+）+ 一根数据线 + **实体 iPhone 12 Pro 或更新 Pro 机型**。Apple 免费开发者账号即可真机调试（7 天签名）。\n2. **模拟器不支持 ARKit/LiDAR**：`ARSession` 在模拟器上不可用，必须真机测试。\n3. 如果暂时没有 Mac/iPhone Pro：本指南的代码照写（iOS 代码在 Mac 上编译验证），测试排在拿到设备后。\n4. 相关公开资料（CodeBuddy 可查）：[WWDC20 ARKit4 深度](https://developer.apple.com/jp/videos/play/wwdc2020/10611/?time=418#2)、[Apple 论坛 LiDAR 距离](https://developer.apple.com/forums/thread/709872#1)、[LiDAR 深度感知开发指南](https://blog.csdn.net/outlejackson/article/details/159500499#1)、[arkit_plugin（参考但不用）](https://pub.dev/packages/arkit_plugin/versions/1.1.2/changelog#1)。\n\n---\n\n## 1. 架构总览\n\n```\n[Flutter: ArMeasurePage]                         [Flutter 侧]\n  ├─ UiKitView(viewType:'ar_measure_view')        全屏 AR 相机预览（原生 ARSCNView）\n  ├─ 按钮：点A / 点B / 清除 / 加入校对\n  ├─ 结果卡：AR实测 mm + 名称 + 图纸尺寸(手填) → 加入 MeasureSession\n  └─ MethodChannel('ar_measure_\u003cviewId\u003e')\n        ▲ invokeMethod: isSupported / startSession / setMode(0|1|2) / clear / stopSession\n        ▼ callback: onMeasure({mm,x,y,z...}) / onError(msg)\n[IOS: ArMeasureView (FlutterPlatformView)]        [原生侧]\n  ├─ ARSCNView + ARWorldTrackingConfiguration + frameSemantics=[.sceneDepth,.smoothedSceneDepth]\n  ├─ UITapGestureRecognizer（原生捕获点击：UiKitView 会拦截 Flutter 手势）\n  ├─ 命中策略：raycast(.estimatedPlane) 优先 → 深度图 5×5 中位数兜底\n  └─ 两点确定 → 3D 距离×1000 = mm → 回调 Flutter；场景中画球+连线\n```\n\n---\n\n## 2. iOS 原生实现（完整代码）\n\n### 2.1 `ios/Runner/AppDelegate.swift` — 注册平台视图\n\n在现有 AppDelegate 的 `application(_:didFinishLaunchingWithOptions:)` 中、`GeneratedPluginRegistrant.register` 之后加：\n\n```swift\nlet registrar = self.registrar(forPlugin: \"ArMeasureViewPlugin\")\nif let registrar = registrar {\n    registrar.register(ArMeasureViewFactory(messenger: registrar.messenger()),\n                       withId: \"ar_measure_view\")\n}\n```\n\n### 2.2 新增 `ios/Runner/ArMeasureViewFactory.swift`\n\n```swift\nimport Flutter\nimport UIKit\n\nclass ArMeasureViewFactory: NSObject, FlutterPlatformViewFactory {\n    private let messenger: FlutterBinaryMessenger\n    init(messenger: FlutterBinaryMessenger) {\n        self.messenger = messenger\n        super.init()\n    }\n\n    func create(withFrame frame: CGRect,\n                viewIdentifier viewId: Int64,\n                arguments args: Any?) -\u003e FlutterPlatformView {\n        return ArMeasureView(frame: frame, viewId: viewId, messenger: messenger)\n    }\n\n    func createArgsCodec() -\u003e FlutterMessageCodec \u0026 NSObjectProtocol {\n        return FlutterStandardMessageCodec.sharedInstance()\n    }\n}\n```\n\n### 2.3 新增 `ios/Runner/ArMeasureView.swift`（核心，约 260 行，完整实现）\n\n```swift\nimport ARKit\nimport Flutter\nimport UIKit\n\n/// 采集模式：0=空闲 1=采集点A 2=采集点B\nenum CaptureMode: Int { case idle = 0, captureA = 1, captureB = 2 }\n\nclass ArMeasureView: NSObject, FlutterPlatformView {\n    private let sceneView: ARSCNView\n    private let channel: FlutterMethodChannel\n    private var mode: CaptureMode = .idle\n    private var pointA: simd_float3?\n    private var pointB: simd_float3?\n    private var nodeA: SCNNode?\n    private var nodeB: SCNNode?\n    private var lineNode: SCNNode?\n\n    init(frame: CGRect, viewId: Int64, messenger: FlutterBinaryMessenger) {\n        sceneView = ARSCNView(frame: frame)\n        channel = FlutterMethodChannel(name: \"ar_measure_\\(viewId)\",\n                                       binaryMessenger: messenger)\n        super.init()\n        setup()\n    }\n\n    func view() -\u003e UIView { sceneView }\n\n    // MARK: - 初始化\n    private func setup() {\n        sceneView.session.delegate = self\n        sceneView.automaticallyUpdatesLighting = true\n\n        // 原生捕获点击（UiKitView 会拦截 Flutter 手势，Flutter 侧只放按钮）\n        let tap = UITapGestureRecognizer(target: self, action: #selector(handleTap(_:)))\n        sceneView.addGestureRecognizer(tap)\n\n        channel.setMethodCallHandler { [weak self] call, result in\n            self?.handle(call, result: result)\n        }\n    }\n\n    // MARK: - Flutter 方法通道\n    private func handle(_ call: FlutterMethodCall, result: @escaping FlutterResult) {\n        switch call.method {\n        case \"isSupported\":\n            // 仅 LiDAR 机型支持 sceneDepth\n            result(ARWorldTrackingConfiguration.supportsFrameSemantics(.sceneDepth))\n        case \"startSession\":\n            startSession(); result(true)\n        case \"setMode\":\n            mode = CaptureMode(rawValue: (call.arguments as? Int) ?? 0) ?? .idle\n            if mode == .idle { clearPicks() }\n            result(true)\n        case \"clear\":\n            clearPicks(); result(true)\n        case \"stopSession\":\n            sceneView.session.pause(); result(true)\n        default:\n            result(FlutterMethodNotImplemented)\n        }\n    }\n\n    private func startSession() {\n        let cfg = ARWorldTrackingConfiguration()\n        if ARWorldTrackingConfiguration.supportsFrameSemantics([.sceneDepth, .smoothedSceneDepth]) {\n            cfg.frameSemantics = [.sceneDepth, .smoothedSceneDepth]\n        }\n        cfg.planeDetection = [.horizontal, .vertical]\n        sceneView.session.run(cfg, options: [.resetTracking, .removeExistingAnchors])\n    }\n\n    private func clearPicks() {\n        pointA = nil; pointB = nil\n        nodeA?.removeFromParentNode(); nodeA = nil\n        nodeB?.removeFromParentNode(); nodeB = nil\n        lineNode?.removeFromParentNode(); lineNode = nil\n    }\n\n    // MARK: - 点击处理\n    @objc private func handleTap(_ g: UITapGestureRecognizer) {\n        guard mode != .idle else { return }\n        let p = g.location(in: sceneView)\n        guard let world = worldPosition(at: p) else {\n            channel.invokeMethod(\"onError\", arguments: \"未能命中有效深度，请靠近目标/调整角度后重试\")\n            return\n        }\n        if mode == .captureA {\n            pointA = world\n            placeSphere(world, color: UIColor.systemBlue, slot: 0)\n        } else {\n            pointB = world\n            placeSphere(world, color: UIColor.systemRed, slot: 1)\n        }\n        if let a = pointA, let b = pointB {\n            drawLine(a, b)\n            let mm = simd_distance(a, b) * 1000.0\n            channel.invokeMethod(\"onMeasure\", arguments: [\n                \"mm\": mm,\n                \"ax\": a.x, \"ay\": a.y, \"az\": a.z,\n                \"bx\": b.x, \"by\": b.y, \"bz\": b.z,\n            ])\n        }\n        mode = .idle\n    }\n\n    // MARK: - 命中：raycast 优先，深度图兜底\n    private func worldPosition(at point: CGPoint) -\u003e simd_float3? {\n        // ① raycast（LiDAR 增强下纯色墙面也可命中）\n        if let q = sceneView.raycastQuery(from: point,\n                                          allowing: .estimatedPlane,\n                                          alignment: .any),\n           let r = sceneView.session.raycast(q).first {\n            return simd_make_float3(r.worldTransform.columns.3)\n        }\n        // ② 深度图采样兜底\n        guard let frame = sceneView.session.currentFrame else { return nil }\n        guard let depthData = frame.smoothedSceneDepth ?? frame.sceneDepth else { return nil }\n        let viewport = sceneView.bounds.size\n        let orientation: UIInterfaceOrientation = .portrait\n\n        // 视图坐标 → 相机图像坐标（Apple 官方 displayTransform 做法）\n        let display = frame.displayTransform(for: orientation, viewportSize: viewport)\n        let ip = CGPoint(x: point.x, y: point.y).applying(display.inverted())\n        let imgRes = frame.camera.imageResolution\n        let ix = ip.x * imgRes.width\n        let iy = ip.y * imgRes.height\n        guard ix \u003e= 0, iy \u003e= 0, ix \u003c imgRes.width, iy \u003c imgRes.height else { return nil }\n\n        let depthMap = depthData.depthMap\n        let confMap = depthData.confidenceMap\n        CVPixelBufferLockBaseAddress(depthMap, .readOnly)\n        CVPixelBufferLockBaseAddress(confMap, .readOnly)\n        defer {\n            CVPixelBufferUnlockBaseAddress(depthMap, .readOnly)\n            CVPixelBufferUnlockBaseAddress(confMap, .readOnly)\n        }\n\n        let dW = CVPixelBufferGetWidth(depthMap)\n        let dH = CVPixelBufferGetHeight(depthMap)\n        let sx = CGFloat(dW) / imgRes.width\n        let sy = CGFloat(dH) / imgRes.height\n        let baseD = CVPixelBufferGetBaseAddress(depthMap)!\n            .assumingMemoryBound(to: Float32.self)\n        let baseC = CVPixelBufferGetBaseAddress(confMap)!\n            .assumingMemoryBound(to: UInt8.self)\n        let cx = Int(ix * sx), cy = Int(iy * sy)\n\n        // 5×5 邻域中位数；仅保留高置信度(high=2)像素\n        var vals: [Float] = []\n        for dy in -2...2 {\n            for dx in -2...2 {\n                let xx = cx + dx, yy = cy + dy\n                guard xx \u003e= 0, yy \u003e= 0, xx \u003c dW, yy \u003c dH else { continue }\n                guard baseC[yy * dW + xx] == ARConfidenceLevel.high.rawValue else { continue }\n                let d = baseD[yy * dW + xx]\n                if d.isFinite \u0026\u0026 d \u003e 0 { vals.append(d) }\n            }\n        }\n        guard !vals.isEmpty else { return nil }\n        vals.sort()\n        let depth = vals[vals.count / 2]\n\n        // 内参反投影：像素 → 相机系（ARSCNView 渲染即相机系，无需再用 viewMatrix）\n        let intr = frame.camera.intrinsics // 3x3，基于 imageResolution（横版）\n        let fx = intr.columns.0.x\n        let fy = intr.columns.1.y\n        let cx0 = intr.columns.2.x\n        let cy0 = intr.columns.2.y\n        let local = simd_float3((Float(ix) - cx0) / fx * depth,\n                                (Float(iy) - cy0) / fy * depth,\n                                depth)\n        let world = frame.camera.transform * simd_float4(local, 1)\n        return simd_float3(world.x, world.y, world.z)\n    }\n\n    // MARK: - 场景可视化\n    private func placeSphere(_ world: simd_float3, color: UIColor, slot: Int) {\n        if slot == 0 { nodeA?.removeFromParentNode() }\n        else { nodeB?.removeFromParentNode() }\n        let sphere = SCNSphere(radius: 0.008)\n        sphere.firstMaterial?.diffuse.contents = color\n        let node = SCNNode(geometry: sphere)\n        node.position = SCNVector3(world)\n        sceneView.scene.rootNode.addChildNode(node)\n        if slot == 0 { nodeA = node } else { nodeB = node }\n    }\n\n    private func drawLine(_ a: simd_float3, _ b: simd_float3) {\n        lineNode?.removeFromParentNode()\n        let v = b - a\n        let len = simd_length(v)\n        guard len \u003e 1e-4 else { return }\n        let mid = (a + b) / 2\n        let cyl = SCNCylinder(radius: 0.003, height: CGFloat(len))\n        cyl.firstMaterial?.diffuse.contents = UIColor.systemGreen\n        let node = SCNNode(geometry: cyl)\n        node.position = SCNVector3(mid)\n        // 圆柱默认沿 Y 轴 → 旋转到 AB 方向\n        node.simdOrientation = simd_quatf(from: simd_float3(0, 1, 0),\n                                          to: simd_normalize(v))\n        sceneView.scene.rootNode.addChildNode(node)\n        lineNode = node\n    }\n}\n\nextension ArMeasureView: ARSessionDelegate {\n    // 预留：如需多帧平均抑制抖动，可在此按锚点累积采样（MVP 可先不做）\n}\n```\n\n### 2.4 `ios/Runner/Info.plist` — 相机权限（必须）\n\n在 `\u003cdict\u003e` 内加：\n\n```xml\n\u003ckey\u003eNSCameraUsageDescription\u003c/key\u003e\n\u003cstring\u003e需要使用相机进行AR量尺测量\u003c/string\u003e\n```\n\n### 2.5 无需新增 Pod 依赖\n\nARKit 是系统框架，不用改 Podfile。\n\n---\n\n## 3. Flutter 侧实现\n\n### 3.1 `lib/data/models.dart` — MeasureItem 增加 source 字段（无破坏性）\n\n找到 `class MeasureItem`（约 537~561 行），替换为：\n\n```dart\n/// 校对清单中的一项：图纸侧量得值 vs 照片侧量得值。\nclass MeasureItem {\n  final String name; // 量尺项，如「梁宽」「墙厚」\n  final double drawingMm; // 图纸侧量得（CAD 校准后，mm）\n  final double photoMm; // 照片侧量得（参考物标定后，mm）\n  final String source; // 来源：'photo' 默认 | 'ar_lidar' AR量尺 | 'manual'\n  const MeasureItem({\n    required this.name,\n    required this.drawingMm,\n    required this.photoMm,\n    this.source = 'photo',\n  });\n\n  double get deviation =\u003e photoMm - drawingMm;\n  double get deviationPct =\u003e drawingMm == 0 ? 0 : deviation / drawingMm * 100;\n  bool pass(double tolMm, double tolPct) =\u003e\n      deviation.abs() \u003c= tolMm \u0026\u0026 deviationPct.abs() \u003c= tolPct;\n\n  MeasureItem copyWith({String? name, double? drawingMm, double? photoMm, String? source}) =\u003e\n      MeasureItem(\n        name: name ?? this.name,\n        drawingMm: drawingMm ?? this.drawingMm,\n        photoMm: photoMm ?? this.photoMm,\n        source: source ?? this.source,\n      );\n}\n```\n\n同文件 `MeasureSession.toJson`（约 627~633 行）items 段加字段：\n\n```dart\n        'items': items\n            .map((e) =\u003e {\n                  'name': e.name,\n                  'drawingMm': e.drawingMm,\n                  'photoMm': e.photoMm,\n                  'source': e.source,\n                })\n            .toList(),\n```\n\n`MeasureSession.fromJson`（约 654~661 行）items 段：\n\n```dart\n      items: (m['items'] as List? ?? [])\n          .map((e) =\u003e (e as Map\u003cString, dynamic\u003e))\n          .map((e) =\u003e MeasureItem(\n                name: e['name'] as String? ?? '',\n                drawingMm: (e['drawingMm'] as num? ?? 0).toDouble(),\n                photoMm: (e['photoMm'] as num? ?? 0).toDouble(),\n                source: e['source'] as String? ?? 'photo', // 旧数据兼容\n              ))\n          .toList(),\n```\n\n### 3.2 `lib/core/storage/measure_store.dart` — 序列化同步\n\n`_toJson`（约 51~57 行）items 段加 `'source': e.source,`；\n`_fromJson`（约 78~85 行）`MeasureItem(...)` 加 `source: e['source'] as String? ?? 'photo',`。\n\n### 3.3 新增 `lib/core/ar/ar_measure_service.dart`\n\n```dart\nimport 'package:flutter/services.dart';\n\n/// AR 量尺 MethodChannel 封装（照 vision_service.dart 模式）。\n/// viewId 对应原生 ArMeasureView 的 channel 后缀。\nclass ArMeasureService {\n  final MethodChannel channel;\n\n  ArMeasureService({required int viewId})\n      : channel = MethodChannel('ar_measure_$viewId');\n\n  Future\u003cbool\u003e isSupported() async =\u003e\n      (await channel.invokeMethod\u003cbool\u003e('isSupported')) ?? false;\n\n  Future\u003cvoid\u003e startSession() async =\u003e channel.invokeMethod('startSession');\n\n  Future\u003cvoid\u003e setMode(int mode) async =\u003e channel.invokeMethod('setMode', mode);\n\n  Future\u003cvoid\u003e clear() async =\u003e channel.invokeMethod('clear');\n\n  Future\u003cvoid\u003e stopSession() async =\u003e channel.invokeMethod('stopSession');\n}\n```\n\n### 3.4 新增 `lib/features/measure/ar_measure_page.dart`（页面，照 measure_page 风格）\n\n结构代码（UI 细节照 AppTokens/AppCard/AppSnack 现有规范补齐）：\n\n```dart\nimport 'dart:io' show Platform;\nimport 'package:flutter/foundation.dart' show kIsWeb;\nimport 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n\nimport '../../core/ar/ar_measure_service.dart';\nimport '../../core/storage/measure_store.dart';\nimport '../../core/theme/design_tokens.dart';\nimport '../../data/models.dart';\nimport '../../shared/widgets/app_snack.dart';\n\n/// AR 量尺（LiDAR，iPhone 12 Pro+）。\n/// 流程：进入 → 校验支持 → 开始会话 → [点A][点B]（原生侧出距离）→ 加入校对（写入 MeasureSession）。\nclass ArMeasurePage extends StatefulWidget {\n  final MeasureArgs args;\n  const ArMeasurePage({super.key, required this.args});\n\n  @override\n  State\u003cArMeasurePage\u003e createState() =\u003e _ArMeasurePageState();\n}\n\nclass _ArMeasurePageState extends State\u003cArMeasurePage\u003e {\n  static const _viewType = 'ar_measure_view';\n  static const _viewId = 0;\n\n  late final ArMeasureService _svc;\n  double? _lastMm;\n  bool _supported = false;\n  final _nameCtl = TextEditingController(text: 'AR实测');\n  final _drawingCtl = TextEditingController();\n\n  @override\n  void initState() {\n    super.initState();\n    _svc = ArMeasureService(viewId: _viewId);\n    _svc.channel.setMethodCallHandler(_onNative);\n  }\n\n  Future\u003cdynamic\u003e _onNative(MethodCall call) async {\n    if (call.method == 'onMeasure') {\n      final mm = ((call.arguments as Map)['mm'] as num).toDouble();\n      if (mounted) setState(() =\u003e _lastMm = mm);\n    } else if (call.method == 'onError') {\n      if (mounted) {\n        AppSnack.show(context, call.arguments?.toString() ?? '测量失败',\n            kind: AppSnackKind.danger);\n
