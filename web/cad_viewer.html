<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>蓝图落地 · CAD 专业看图</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F2F2F7;
    }

    .toolbar {
      height: 52px;
      background: #ffffff;
      border-bottom: 1px solid #E5E5EA;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .toolbar button {
      padding: 7px 12px;
      border: 1px solid #E5E5EA;
      border-radius: 999px;
      background: white;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar button.primary {
      background: #0A5AFF;
      color: white;
      border-color: #0A5AFF;
    }

    .toolbar .title {
      font-size: 14px;
      font-weight: 700;
      color: #1A1A1A;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #webcad {
      width: 100%;
      height: calc(100% - 52px);
      background: #ffffff;
    }

    #coord-bar {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      padding: 8px 14px;
      background: rgba(0, 0, 0, .72);
      color: white;
      font-size: 12px;
      border-radius: 999px;
      text-align: center;
      display: none;
      pointer-events: none;
      z-index: 9;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <script src="./GStarSDK.js"></script>

  <div class="toolbar">
    <button id="back-btn" onclick="goBack()">← 返回</button>
    <span class="title" id="title">图纸</span>
    <button id="clean-btn" onclick="toggleCleanView()" title="隐藏标注/文字，只看建筑主体">清爽视图</button>
    <button id="pick-btn" onclick="togglePick()">定位</button>
    <button onclick="dumpLayers()" title="查看 OCF 全部图层">图层列表</button>
    <button onclick="forceAllOn()" title="把所有图层强制 setLayer(true)，验证 OCF 是否能恢复显示" style="background:#FBBF24;border-color:#FBBF24;color:#000">全开验证</button>
    <button onclick="zoomToFit()" title="缩放到全图">全图</button>
    <button class="primary" onclick="loadCad()">重新加载</button>
  </div>

  <div id="webcad"></div>
  <div id="coord-bar"></div>

    // ---- 初始化 GStarSDK ----
    var gstarSDK = new GStarSDK({
      wrapId: 'webcad',
      language: 'zh',
      // ★ 布局切换回调：切换完成后更新状态栏
      switchLayoutCB: function(layoutObj) {
        console.log('[CAD] 布局已切换:', JSON.stringify(layoutObj));
        setCoord('布局: ' + (layoutObj.nickName || layoutObj.globalName || '未知'), true);
      },
    });
    gstarSDK.enableZoom(5);
    gstarSDK.enablePan();
    gstarSDK.disableMap();
    gstarSDK.measures.accuracy = 3;
    gstarSDK.apiHost = OCF_BASE;

    var titleEl = document.getElementById('title');
    var coordEl = document.getElementById('coord-bar');
    var pickBtn = document.getElementById('pick-btn');

    function goBack() {
      // 若是 Flutter Web 内嵌/独立页，返回上一页
      if (history.length > 1) { history.back(); }
      else { location.href = '/'; }
    }

    function setCoord(text, show) {
      coordEl.style.display = (show && text) ? 'block' : 'none';
      coordEl.textContent = text;
    }

    function togglePick() {
      PICK_MODE = !PICK_MODE;
      pickBtn.textContent = PICK_MODE ? '退出定位' : '定位';
      pickBtn.style.background = PICK_MODE ? '#EA580C' : '';
      pickBtn.style.color = PICK_MODE ? '#fff' : '';
      pickBtn.style.borderColor = PICK_MODE ? '#EA580C' : '';
      setCoord(PICK_MODE ? '定位模式：点击图纸获取真实坐标' : '', PICK_MODE);
    }

    // ★ 浩辰官方机制：一个CAD图纸有多个布局，每个布局对应一个独立OCF文件
    // 布局名 → OCF 文件名（不含 .ocf 后缀）
    // dy04_7_B05 (模型空间) → dy04_7_B05.ocf
    // dy04_7_B05__PaperSpace (*Paper_Space / "7栋组合图") → dy04_7_B05__PaperSpace.ocf
    var LAYOUT_OCF_MAP = {
      '*Model_Space': DRAWING_KEY,                          // 模型空间用原始 OCF
      '*Paper_Space': DRAWING_KEY + '__PaperSpace',         // 图纸空间(7栋组合图)
      '7栋组合图': DRAWING_KEY + '__PaperSpace',
    };

    function ocKeyForLayout(globalName) {
      return LAYOUT_OCF_MAP[globalName] || DRAWING_KEY;
    }

    function loadCad() {
      var url = OCF_BASE + '/api/ocf/' + DRAWING_KEY;
      setCoord('正在加载 ' + DRAWING_KEY + '...', true);
      showCad(url);
    }

    function showCad(ocfurl) {
      // 密钥为空时尝试从本地 /cad_secret.txt 读取（该文件被 .gitignore 排除，不入库）
      var doRender = function () {
        gstarSDK.setDynamicPW(CAD_SECRET);

        // ★ 监听布局切换事件（浩辰官方机制）
        // 用户点击工具栏「布局」按钮 → SDK 触发 changeLayout → 按 globalName 加载对应 OCF
        gstarSDK.on('changeLayout', function (eventName, obj) {
          console.log('[CAD] 切换布局事件:', eventName, JSON.stringify(obj));
          var gname = (obj && obj.globalName) || '';
          var nextKey = ocKeyForLayout(gname);
          var nextUrl = OCF_BASE + '/api/ocf/' + nextKey;
          console.log('[CAD] 加载布局 OCF:', nextKey);
          setCoord('切换布局: ' + gname + ' ...', true);
          if (nextUrl === ocfurl) {
            setCoord('已是当前布局: ' + gname, true);
            return;
          }
          // 加载新布局 OCF 并重新渲染
          getDrawSheet(nextUrl, function (buff) {
            var sizeMb = (buff && buff.byteLength ? buff.byteLength / 1024 / 1024 : 0).toFixed(1);
            // ★ 图纸空间用 defaultViewport=true（使用 OCF 保存的默认视口/裁剪）
            var useDefaultView = (gname && gname.indexOf('Paper') >= 0);
            gstarSDK.render('ocf', buff, '111', useDefaultView).then(function () {
              setCoord('布局: ' + gname + ' (' + sizeMb + ' MB)', true);
              // ★ 渲染后关闭用户指定的冻结图层（模型/布局空间都生效）
              setTimeout(function () {
                saveLayerStatus();
                applyFrozenLayers();
                setTimeout(zoomToFit, 300);
              }, 200);
            }).catch(function (err) {
              console.error('[CAD] 布局渲染失败:', err);
              setCoord('布局渲染失败: ' + (err && err.message ? err.message : err), true);
            });
          });
        });

        getDrawSheet(ocfurl, function (arraybuffer) {
        // 第4参 defaultViewport：false=全图自适应（模型空间），true=图纸保存时的默认视口
        gstarSDK.render('ocf', arraybuffer, '111', false).then(function () {
          var sizeKb = (arraybuffer.byteLength / 1024).toFixed(1);
          setCoord('渲染完成 ' + sizeKb + ' KB · 点击右侧「布局」按钮切换图纸空间', true);

          // 打印布局列表供调试
          try {
            var allLayouts = gstarSDK.layouts;
            console.log('[CAD] 所有布局:', JSON.stringify(allLayouts));
          } catch(e) {
            console.warn('[CAD] 读取布局失败:', e);
          }

          bindPick();
          // 渲染完成后：保存原始图层状态 → 关闭用户指定的冻结图层
          setTimeout(function () {
            saveLayerStatus();
            applyFrozenLayers();
            setTimeout(zoomToFit, 400);
          }, 150);
        }).catch(function (err) {
          console.error('渲染失败:', err);
          setCoord('渲染失败：' + (err && err.message ? err.message : err), true);
        });
      });
      };
      // 密钥为空 → 尝试从本地 cad_secret.txt 读取
      if (CAD_SECRET) {
        doRender();
      } else {
        fetch('/cad_secret.txt', { cache: 'no-store' }).then(function (r) {
          if (!r.ok) throw new Error('no secret file');
          return r.text();
        }).then(function (txt) {
          CAD_SECRET = txt.trim();
          doRender();
        }).catch(function () {
          setCoord('未配置 CAD 动态密钥（?cadSecret= 或 web/cad_secret.txt）', true);
        });
      }
    }

    // ---- 视图：缩放到全图（多次重试，等图层切换完成后再 fit） ----
    function zoomToFit() {
      try {
        if (gstarSDK && gstarSDK.func && gstarSDK.func.viewport && gstarSDK.func.viewport.zoomE) {
          gstarSDK.func.viewport.zoomE.main();
        }
      } catch (err) {}
      try {
        if (gstarSDK && gstarSDK.zoom) {
          gstarSDK.zoom('all');
        }
      } catch (err) {}
      // 二次 fit：图层切换后几何范围变化，需重新计算
      setTimeout(function () {
        try {
          if (gstarSDK && gstarSDK.func && gstarSDK.func.viewport && gstarSDK.func.viewport.zoomE) {
            gstarSDK.func.viewport.zoomE.main();
          }
        } catch (err) {}
      }, 400);
    }

    // ---- 图层：精确还原 DWG 原始状态（AutoCAD 中的 isoff/isfrozen）----
    // 加载 DWG 时用 getDwgInfo API 提取 { name, isoff, isfrozen }
    // 存为 ocf_cache/{key}_meta.json，前端拉取后按状态 setLayer
    var LAYER_META = null;  // 缓存当前图的元数据 {name: {isoff, isfrozen}}

    function loadLayerMeta(callback) {
      if (LAYER_META) { callback(LAYER_META); return; }
      var url = OCF_BASE + '/api/ocf-meta/' + DRAWING_KEY;
      fetch(url).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (bizData) {
        LAYER_META = {};
        var layers = (bizData && bizData.layers) || [];
        layers.forEach(function (l) {
          LAYER_META[l.name] = { isoff: !!l.isoff, isfrozen: !!l.isfrozen };
        });
        console.log('[CAD] 已加载图层元数据，共 ' + layers.length + ' 个');
        callback(LAYER_META);
      }).catch(function (e) {
        console.warn('[CAD] 加载图层元数据失败:', e);
        callback(null);
      });
    }

    // ---- 归一化图层名：全角->半角、去空格，消除 OCF 与 DXF 命名的细微差异 ----
    function normalizeLayerName(s) {
      s = String(s || '');
      // 全角转半角（主要处理：－ -> -, （ -> (, ） -> ), ＿ -> _）
      s = s.replace(/[\uFF01-\uFF5E]/g, function (ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
      });
      s = s.replace(/\u3000/g, ' '); // 全角空格 -> 半角
      s = s.replace(/\s+/g, '');     // 去所有空白
      return s;
    }

    // ---- 应用用户指定的冻结图层（不依赖任何外部服务，无条件隐藏）----
    function applyFrozenLayers() {
      if (!gstarSDK || !gstarSDK.layers) return;
      try {
        var arr = Array.isArray(gstarSDK.layers) ? gstarSDK.layers : (gstarSDK.layers.list || gstarSDK.layers.data || []);
        // 预构建归一化查找表（O(1) 查询）
        var frozenNorm = {};
        FROZEN_LAYERS.forEach(function (n) { frozenNorm[normalizeLayerName(n)] = true; });
        var hidden = 0, hiddenByExact = 0;
        arr.forEach(function (ly) {
          var id = ly && ly.id;
          var name = (ly && ly.name) || '';
          if (id == null) return;
          var isNoise = false;
          // 1) 精确匹配 FROZEN_LAYERS（归一化后比较，兼容全角/半角差异）
          if (FROZEN_LAYERS.indexOf(String(name)) >= 0 || frozenNorm[normalizeLayerName(name)]) {
            isNoise = true;
            hiddenByExact++;
          } else if (HIDE_EXACT.indexOf(String(name)) >= 0) {
            // 2) 系统层精确匹配
            isNoise = true;
            hiddenByExact++;
          }
          // ★ 不再使用关键词兜底（hatch/填充/修改等关键词会误杀正常建筑师图层）
          // DXF 解析出的 310 个真实冻结层 + 归一化匹配已经 100% 覆盖了 CAD 关闭的图层
          if (isNoise) {
            try {
              gstarSDK.setLayer(id, false);
              hidden++;
            } catch (e) {}
          }
        });
        console.log('[CAD] 按 Isfrozen/IsOff 关闭 ' + hidden + ' 个图层（精确匹配，含归一化）');
        setCoord('已关闭 ' + hidden + ' 个冻结/关闭图层（与 CAD 一致）', true);
      } catch (err) {
        console.error('applyFrozenLayers 失败:', err);
      }
    }

    function applyCleanView() {
      if (!gstarSDK || !gstarSDK.layers) return;
      loadLayerMeta(function (meta) {
        var hidden = 0, kept = 0;
        var allNames = [];
        try {
          var arr = Array.isArray(gstarSDK.layers) ? gstarSDK.layers : (gstarSDK.layers.list || gstarSDK.layers.data || []);
          arr.forEach(function (ly) {
            var id = ly && ly.id;
            var name = (ly && ly.name) || '';
            if (id == null) return;
            allNames.push(name || String(id));
            var isNoise = false;
            // ★ 优先匹配用户指定的冻结图层（精确匹配）
            if (FROZEN_LAYERS.indexOf(String(name)) >= 0) {
              isNoise = true;
            } else if (meta && meta[name]) {
              // 按 DWG 原始状态：isoff/isfrozen=true → 隐藏
              isNoise = meta[name].isoff || meta[name].isfrozen;
            } else {
              // 没有元数据时退回黑名单
              var low = String(name).toLowerCase();
              isNoise = CLEAN_KEYWORDS.some(function (kw) {
                return low.indexOf(kw.toLowerCase()) >= 0;
              });
              if (!isNoise && HIDE_EXACT.indexOf(String(name)) >= 0) isNoise = true;
            }
            try {
              gstarSDK.setLayer(id, !isNoise);
              isNoise ? hidden++ : kept++;
            } catch (e) {}
          });
        } catch (err) {
          console.error('applyCleanView 失败:', err);
        }
        var src = meta ? 'DWG原始状态' : '黑名单';
        console.log('[CAD] 全部图层:', allNames.length, '个');
        console.log('[CAD] 隐藏', hidden, '个，保留', kept, '个（依据:' + src + '）');
        setCoord('按' + src + '过滤: 显示 ' + kept + ' / 隐藏 ' + hidden, true);
        setTimeout(function () {
          try { if (gstarSDK.zoom) gstarSDK.zoom('all'); } catch(e) {}
        }, 200);
      });
    }

    // ---- 列出全部图层（按钮：调试用）----
    function dumpLayers() {
      if (!gstarSDK || !gstarSDK.layers) {
        setCoord('layers 不可用', true); return;
      }
      var arr = Array.isArray(gstarSDK.layers) ? gstarSDK.layers : (gstarSDK.layers.list || gstarSDK.layers.data || []);
      var text = arr.map(function (ly) {
        return (ly.name || ('id=' + ly.id)) + (ly.status === false ? '(关)' : '');
      }).join('\n');
      console.log('[CAD] ALL LAYERS:\n' + text);
      // 也尝试导出到屏幕上
      var win = window.open('', '_blank');
      if (win) { win.document.write('<pre>' + text + '</pre>'); }
      setCoord('共 ' + arr.length + ' 个图层，已在新窗口打开', true);
    }

    // ---- 验证：把所有图层强制 setLayer(true)，看 OCF 是否能恢复显示 ----
    function forceAllOn() {
      if (!gstarSDK || !gstarSDK.layers) {
        setCoord('layers 不可用', true); return;
      }
      var arr = Array.isArray(gstarSDK.layers) ? gstarSDK.layers : (gstarSDK.layers.list || gstarSDK.layers.data || []);
      // 统计调用前
      var before = arr.filter(function (ly) { return ly.status !== false; }).length;
      // 全部强制打开
      var ok = 0, fail = 0;
      arr.forEach(function (ly) {
        try {
          gstarSDK.setLayer(ly.id, true);
          ok++;
        } catch (e) {
          fail++;
        }
      });
      // 等 SDK 重绘
      setTimeout(function () {
        var arr2 = Array.isArray(gstarSDK.layers) ? gstarSDK.layers : (gstarSDK.layers.list || gstarSDK.layers.data || []);
        var after = arr2.filter(function (ly) { return ly.status !== false; }).length;
        var changed = after - before;
        var msg = '全开验证：调用前 ' + before + ' 个开 / 调用后 ' + after + ' 个开';
        if (changed > 0) {
          msg += ' ✓ 增加 ' + changed + ' 个！OCF 数据是全的，只是 SDK 默认隐藏';
        } else if (changed === 0) {
          msg += ' ✗ 数量未变：setLayer(true) 对 OCF 无效（OCF 转换时就剥离了图元数据）';
        } else {
          msg += ' ? 减少了';
        }
        msg += ' | setLayer 成功 ' + ok + ' 失败 ' + fail;
        setCoord(msg, true);
        console.log('[CAD] ' + msg);
        // 重新 fit 一次让画面更新
        setTimeout(zoomToFit, 200);
      }, 300);
    }

    // ---- fetch DWG 元数据（ezdxf 离线解析结果），按 JSON 显隐图层 ----
    function fetchMetaThenApply() {
      var url = CAD_META_BASE + '/api/cad-meta/' + DRAWING_KEY + '.json';
      setCoord('正在加载 DWG 元数据（AutoCAD 原始图层状态）...', true);
      fetch(url, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) {
          setCoord('DWG 元数据未生成（HTTP ' + r.status + '），回退 OCF 原始状态。后端：python server\\cad_meta_server.py', true);
          return null;
        }
        return r.json();
      }).then(function (meta) {
        if (!meta || !meta.ok) return;
        CAD_META = meta;
        applyMetaView(meta);
      }).catch(function (e) {
        setCoord('元数据 fetch 失败：' + e + '（请确认 8810 服务已启动）', true);
      });
    }

    // ---- 应用元数据：先强制全开，再按 JSON 把 on=false 关掉 ----
    function applyMetaView(meta) {
      if (!gstarSDK || !gstarSDK.layers) return;
      var sdkLayers = Array.isArray(gstarSDK.layers) ? gstarSDK.layers
                       : (gstarSDK.layers.list || gstarSDK.layers.data || []);
      var idByName = {};
      sdkLayers.forEach(function (ly) {
        if (ly && ly.name) idByName[String(ly.name).toLowerCase()] = ly.id;
      });
      var opened = 0, hidden = 0, noData = 0;
      meta.layers.forEach(function (ly) {
        var id = idByName[String(ly.name).toLowerCase()];
        if (id == null) { noData++; return; }
        try {
          gstarSDK.setLayer(id, true);
          if (ly.on && !ly.frozen) { opened++; }
          else { gstarSDK.setLayer(id, false); hidden++; }
        } catch (e) { noData++; }
      });
      var total = meta.layers.length;
      var sdkTotal = sdkLayers.length;
      setCoord(
        '元数据已应用：JSON 共 ' + total + ' 图层（开 ' + opened + ' / 关 ' + hidden + '），SDK 可见 ' + sdkTotal + ' / 未匹配 ' + noData + ' | ' +
        (hidden + noData === 0 ? '✅ 全图层恢复' : '⚠ 部分图层在 OCF 中无数据（转换时已剥离）'),
        true
      );
      console.log('[CAD] 元数据应用完成', meta);
      setTimeout(zoomToFit, 300);
    }

    // ---- 清爽视图开关 ----
    // ---- 清爽视图开关 ----
    // 保存"清爽视图"开启前的图层显隐状态，"显示全部"时精确恢复
    var SAVED_LAYER_STATUS = null;
    function saveLayerStatus() {
      if (!gstarSDK || !gstarSDK.layers) return;
      try {
        var arr = Array.isArray(gstarSDK.layers) ? gstarSDK.layers : (gstarSDK.layers.list || gstarSDK.layers.data || []);
        SAVED_LAYER_STATUS = arr.map(function (ly) {
          return { id: ly.id, status: ly.status !== false };
        });
      } catch (e) { SAVED_LAYER_STATUS = null; }
    }
    function restoreLayerStatus() {
      if (!SAVED_LAYER_STATUS) { loadCad(); return; }
      SAVED_LAYER_STATUS.forEach(function (s) {
        try { gstarSDK.setLayer(s.id, s.status); } catch (e) {}
      });
      setCoord('已恢复原始图层状态', true);
    }
    function applyAllLayersVisible() {
      // 强制打开所有图层（最彻底的"显示全部"）
      if (!gstarSDK || !gstarSDK.layers) return;
      try {
        var arr = Array.isArray(gstarSDK.layers) ? gstarSDK.layers : (gstarSDK.layers.list || gstarSDK.layers.data || []);
        arr.forEach(function (ly) {
          try { gstarSDK.setLayer(ly.id, true); } catch (e) {}
        });
        setCoord('全部图层已打开（共 ' + arr.length + ' 个）', true);
      } catch (e) {}
    }

    function toggleCleanView() {
      CLEAN_MODE = !CLEAN_MODE;
      var btn = document.getElementById('clean-btn');
      if (CLEAN_MODE) {
        // 切回清爽视图前先存原始状态（让再切回去能恢复）
        if (!SAVED_LAYER_STATUS) saveLayerStatus();
        applyCleanView();
        btn.textContent = '清爽视图';
        btn.style.background = '#0A5AFF';
        btn.style.color = '#fff';
        btn.style.borderColor = '#0A5AFF';
      } else {
        // 全部图层打开：优先精确恢复，状态不可用时强制全开
        if (SAVED_LAYER_STATUS) { restoreLayerStatus(); }
        else { applyAllLayersVisible(); }
        btn.textContent = '显示全部';
        btn.style.background = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      }
      setTimeout(zoomToFit, 200);
    }

    function getDrawSheet(url, cb) {
      var req = new XMLHttpRequest();
      req.open('GET', url, true);
      req.responseType = 'arraybuffer';
      req.send(null);
      req.onload = function () {
        if ((req.status >= 200 && req.status < 300) || req.status === 304) {
          cb(req.response);
        } else {
          setCoord('下载失败 HTTP ' + req.status, true);
        }
      };
      req.onerror = function () {
        setCoord('请求失败 (可能是 CORS 或未启动本地服务)', true);
      };
    }

    // ---- 坐标拾取：点击图纸 -> screenToWorld 真图纸坐标 ----
    function bindPick() {
      var wrap = document.getElementById('webcad');
      // GStarSDK 渲染后在其容器监听点击
      wrap.onclick = function (e) {
        if (!PICK_MODE) return;
        var rect = wrap.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        // 尝试用 SDK 的 screenToWorld 拿真图纸坐标（部分版本走 canvas 坐标系）
        var world = null;
        try { world = gstarSDK.screenToWorld({ x: x, y: y }); } catch (err) { world = null; }
        var text;
        if (world) {
          text = '图纸坐标 X=' + world.x.toFixed(1) + '  Y=' + world.y.toFixed(1) + ' (mm)';
        } else {
          text = '屏幕坐标 X=' + Math.round(x) + '  Y=' + Math.round(y) + ' px';
        }
        setCoord(text, true);
        // 回传 Flutter：window.parent.postMessage
        try {
          window.parent.postMessage({
            type: 'cad-pick',
            key: DRAWING_KEY,
            screenX: x, screenY: y,
            worldX: world ? world.x : null,
            worldY: world ? world.y : null,
            text: text
          }, '*');
        } catch (err) { /* 独立页时忽略 */ }
      };
    }

    // 自动加载
    window.addEventListener('load', function () {
      titleEl.textContent = '7栋 · ' + DRAWING_KEY + ' (v3-clean)';
      setCoord('页面已加载 v3-clean (CLEAN_MODE=false · defaultViewport=false)', true);
      setTimeout(loadCad, 200);
    });
  </script>
</body>
</html>
