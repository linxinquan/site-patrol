<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
  <title>工地巡检 · CAD 图纸测试</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F2F2F7;
    }

    .toolbar {
      height: 56px;
      background: #ffffff;
      border-bottom: 1px solid #E5E5EA;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .toolbar select,
    .toolbar button {
      padding: 8px 14px;
      border: 1px solid #E5E5EA;
      border-radius: 999px;
      background: white;
      font-size: 13px;
      cursor: pointer;
    }

    .toolbar .title {
      font-size: 15px;
      font-weight: 700;
      color: #1A1A1A;
      flex: 1;
    }

    .toolbar .badge {
      font-size: 11px;
      padding: 3px 10px;
      background: #FFF0E6;
      color: #EA580C;
      border-radius: 999px;
      font-weight: 700;
    }

    #webcad {
      width: 100%;
      height: calc(100% - 56px);
      background: #ffffff;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      padding: 8px 14px;
      background: rgba(0, 0, 0, .7);
      color: white;
      font-size: 12px;
      border-radius: 999px;
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>
  <script src="./GStarSDK.js"></script>

  <div class="toolbar">
    <span class="title">工地巡检 · CAD 渲染测试</span>
    <span class="badge" id="badge">测试中</span>
    <select id="drawing-select">
      <option value="dy04_7_B01">7栋 B01 顶板图</option>
      <option value="dy04_7_B02">7栋 B02</option>
      <option value="dy04_7_D01">7栋 D01</option>
      <option value="dy04_7_D03">7栋 D03/D04</option>
      <option value="dy04_7_E01">7栋 E01</option>
      <option value="dy04_7_F01">7栋 F01/F08</option>
      <option value="dy04_7_J01">7栋 J01</option>
      <option value="dy04_7_J04">7栋 J04/J05</option>
      <option value="dy04_7_K01">7栋 K01</option>
      <option value="dy04_7_K02">7栋 K02</option>
    </select>
    <button onclick="loadCad()">重新加载</button>
  </div>

  <div id="webcad"></div>

  <div id="status"></div>

  <script>
    // 初始化 GStarSDK
    var gstarSDK = new GStarSDK({
      wrapId: 'webcad',
      language: 'zh',
    });

    gstarSDK.enableZoom(5);
    gstarSDK.enablePan();
    gstarSDK.disableMap();
    gstarSDK.measures.accuracy = 3;

    // 自定义转PDF/另存请求的host
    gstarSDK.apiHost = 'http://localhost:8800';

    function setStatus(text, ok) {
      var el = document.getElementById('status');
      el.style.display = text ? 'block' : 'none';
      el.textContent = text;
      el.style.background = ok ? 'rgba(22, 163, 74, .85)' : 'rgba(220, 38, 38, .85)';
    }

    function setBadge(text, ok) {
      var b = document.getElementById('badge');
      b.textContent = text;
      b.style.background = ok ? '#DCFCE7' : '#FFF0E6';
      b.style.color = ok ? '#16A34A' : '#EA580C';
    }

    function loadCad() {
      var key = document.getElementById('drawing-select').value;
      var url = 'http://localhost:8800/api/ocf/' + key;
      setStatus('正在加载 ' + key + '...', null);
      setBadge('加载中', null);
      showCad(url);
    }

    function showCad(ocfurl) {
      var secret = 'fldXImCGIwhP8ZQO4qecFY4ir2JxCc8bQUQ1ORrusA70H26qenVFScQPm3tMVFJ5';
      gstarSDK.setDynamicPW(secret);
      console.time('解析ocf共计用时:');
      getDrawSheet(ocfurl, function (arraybuffer) {
        console.log('OCF 二进制长度:', arraybuffer.byteLength);
        gstarSDK.render('ocf', arraybuffer, '111', true).then(function () {
          console.log('图纸渲染显示完成');
          console.timeEnd('解析ocf共计用时:');
          setStatus('渲染成功：' + (arraybuffer.byteLength / 1024).toFixed(1) + ' KB', true);
          setBadge('已加载', true);
        }).catch(function (err) {
          console.error('渲染失败:', err);
          setStatus('渲染失败：' + (err && err.message ? err.message : err), false);
          setBadge('失败', false);
        });
      });
    }

    function getDrawSheet(url, cb) {
      var req = new XMLHttpRequest();
      req.open('GET', url, true);
      req.responseType = 'arraybuffer';
      req.send(null);

      req.addEventListener('progress', function (evt) {
        if (evt.lengthComputable) {
          gstarSDK.Tips.showProgress(0,
            '下载中  ' + (evt.loaded / 1048576).toFixed(1) + 'M/' +
            (evt.total / 1048576).toFixed(1) + 'M');
        }
      }, false);

      req.onload = function () {
        if ((req.status >= 200 && req.status < 300) || req.status === 304) {
          cb(req.response);
        } else {
          gstarSDK.Tips.showProgress(0, url + ' 图纸下载失败 status=' + req.status);
          setStatus('下载失败 HTTP ' + req.status, false);
          setBadge('失败', false);
        }
      };
      req.onerror = function () {
        setStatus('请求失败 (可能是 CORS 或网络问题)', false);
        setBadge('失败', false);
      };
    }

    // 页面加载后自动加载第一张图纸
    window.addEventListener('load', function () {
      setTimeout(loadCad, 300);
    });
  </script>
</body>

</html>
