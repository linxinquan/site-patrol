<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="蓝图落地 · 设计院视角的现场数据闭环">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="蓝图落地">
  <meta name="theme-color" content="#F2F2F7">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>蓝图落地 · 现场数据闭环</title>
  <link rel="manifest" href="manifest.json">

  <!-- Web 使用 HTML 渲染器：Flutter 文字即为真实 DOM 文字，下方 CSS 字体栈才会生效。
       这样 Windows 显示微软雅黑、macOS 显示苹方，使用系统默认字体，无需打包字体文件。 -->
  <script>
    window.flutterWebRenderer = 'html';
  </script>

  <style>
    /* 各平台系统字体栈：Windows 微软雅黑 / macOS 苹方 / 其它回退无衬线 */
    html, body {
      margin: 0;
      padding: 0;
      background: #F2F2F7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-family: 'Microsoft YaHei', 'PingFang SC',
                   'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    /* 首屏加载动画：Flutter JS 下载/解析期间显示，避免白屏误以为卡死 */
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #F2F2F7;
      z-index: 9999;
    }
    #app-loader .ring {
      width: 36px;
      height: 36px;
      border: 3px solid #D9D9DE;
      border-top-color: #428BF7;
      border-radius: 50%;
      animation: app-spin 0.8s linear infinite;
    }
    #app-loader .tip {
      font-size: 14px;
      color: #999999;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loader">
    <div class="ring"></div>
    <div class="tip">加载中…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 首帧渲染后（HTML 渲染器根节点 flt-glass-pane 出现）移除加载动画
    (function () {
      var t = setInterval(function () {
        var root = document.querySelector('flt-glass-pane') || document.querySelector('canvas');
        if (root) {
          clearInterval(t);
          var el = document.getElementById('app-loader');
          if (el) el.remove();
        }
      }, 150);
      // 兜底：最多 30s 后强制移除，避免异常时永久遮挡
      setTimeout(function () {
        clearInterval(t);
        var el = document.getElementById('app-loader');
        if (el) el.remove();
      }, 30000);
    })();
  </script>
</body>
</html>
