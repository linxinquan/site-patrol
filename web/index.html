<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="工地巡检智能化管理 · 真实 CAD 图纸深度集成">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="工地验收">
  <meta name="theme-color" content="#F2F2F7">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>工地验收 · 智能化巡检</title>
  <link rel="manifest" href="manifest.json">

  <!-- iOS 风格字体：Inter 接近 SF Pro Text/Display，零扣分加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* iOS 风格全局字体与渲染优化 */
    html, body {
      margin: 0;
      padding: 0;
      background: #F2F2F7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont,
                   'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-feature-settings: 'cv11', 'ss01', 'tnum';
      letter-spacing: -0.01em;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    /* 数字优雅排版（等宽数字、小尺寸大数字可选 tabular） */
    .nums {
      font-family: 'Inter', -apple-system, sans-serif;
      font-feature-settings: 'tnum', 'lnum';
      font-variant-numeric: tabular-nums lining-nums;
    }
    /* 标题更紧的字距与圆润数字 */
    .display {
      font-family: 'Inter', -apple-system, sans-serif;
      letter-spacing: -0.025em;
    }
    .display-num {
      font-family: 'Nunito', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums lining-nums;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
