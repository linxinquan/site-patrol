# iOS 云端构建（GitHub Actions）
#
# 产出**无签名** IPA：AltStore / Sideloadly 在安装时会用你的 Apple ID 重新签名，
# 所以这里不需要证书与描述文件，仓库里也不必保存任何签名机密。
#
# 触发方式：
#   1) 打 tag（如 v0.1.0）→ 构建 + 自动创建 Release 并附上 IPA
#   2) 在 Actions 页面手动 Run workflow → 只在 Artifacts 里给 IPA（不建 Release）
name: iOS Release (unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release 需要

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload Runner.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          # -y 保留 .app 内的符号链接：丢掉符号链接装到手机上会直接闪退
          zip -q -r -y Runner.ipa Payload
          ls -lh Runner.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/iphoneos/Runner.ipa
          if-no-files-found: error

      - name: Publish Release
        # 只有 tag 触发时才建 Release；手动触发只留 Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/iphoneos/Runner.ipa
          generate_release_notes: true
