# Codemagic 云端构建配置
#
# 用途：在**没有 Mac** 的 Windows 开发机上产出 iOS 安装包（IPA）。
#
# 为什么产**无签名** IPA：
#   本地没有 Apple 开发者证书，也没有 Mac。侧载工具（AltStore / Sideloadly）会用
#   你自己的 Apple ID 在**安装时**重新签名，因此云端只需要把 .app 打成一个标准的
#   Payload/*.ipa 即可 —— 不需要在 CI 里暴露证书与描述文件。
#
# 之后还有 GitHub Actions 版本（.github/workflows/ios-release.yml），
# 打 tag 即自动构建并发布 Release。
workflows:
  # 手动/推送触发的常规出包
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
    triggering:
      # 默认不自动跑，避免每次推送都消耗构建额度；需要时在控制台点 Start new build
      events: []
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build iOS (release, no codesign)
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload Runner.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          # -y 保留 .app 内的符号链接，丢掉符号链接装到手机上会直接闪退
          zip -q -r -y Runner.ipa Payload
          echo "IPA 大小：$(du -h Runner.ipa | cut -f1)"
    artifacts:
      - build/ios/iphoneos/Runner.ipa
